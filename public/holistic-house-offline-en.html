<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#163d38">
  <title>No internet connection · Holistic House</title>
  <style>
    :root { color-scheme: light; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0;min-height:100dvh;display:grid;place-items:center;background:#f4faf7;color:#163d38;padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom)); }
    main { width:min(100%,420px);text-align:center; }
    .mark { display:grid;place-items:center;width:76px;height:76px;border-radius:25px;margin:0 auto 25px;background:#163d38;color:white;font-weight:750;font-size:34px;letter-spacing:-.05em; }
    h1 { font-size:clamp(26px,6vw,34px);line-height:1.18;letter-spacing:-.03em;margin:0 0 16px; }
    p { font-size:17px;line-height:1.5;margin:0 0 26px;color:#42635d; }
    a { display:block;min-height:52px;padding:14px 18px;background:#163d38;color:white;border-radius:17px;text-decoration:none;font-weight:700; }
    a:focus-visible { outline:3px solid #e09b56;outline-offset:4px; }
    small { display:block;font-size:13px;line-height:1.5;color:#5f7772;margin-top:22px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">H</div>
    <h1>No internet connection</h1>
    <p>Holistic House is still on your phone. Reconnect to continue using your private messages, videos and reports.</p>
    <a href="/en">Try again</a>
    <small>Private data is not stored for offline reading.</small>
  </main>
</body>
</html>
