<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Tantra Reiki — harmony of yin and yang</title>
<desc id="desc">A luminous turquoise and golden yin-yang symbol against a serene sunrise-inspired teal background. No Mayan disk, glyphs or calendar.</desc>
<defs>
  <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#103846"/><stop offset=".56" stop-color="#23757c"/><stop offset="1" stop-color="#5eaaa6"/></linearGradient>
  <radialGradient id="glow" cx=".51" cy=".46" r=".62"><stop stop-color="#ffe8b3" stop-opacity=".66"/><stop offset=".5" stop-color="#edca8b" stop-opacity=".13"/><stop offset="1" stop-color="#d4ecdf" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9e7"/><stop offset="1" stop-color="#efd19c"/></linearGradient>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#265a60"/><stop offset="1" stop-color="#113d4b"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0a2634" flood-opacity=".34"/></filter>
</defs>
