<head>

<title>Вход в Agent Commander · Holistic House</title>
<style>
:root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f8;color:#172033;padding:24px}
main{width:min(100%,520px);background:#fff;border:1px solid #dce2eb;border-radius:22px;padding:28px;box-shadow:0 14px 50px #17203312}
.mark{font-size:12px;letter-spacing:.13em;color:#63718a;font-weight:700}h1{font-size:26px;line-height:1.2;margin:12px 0}p{color:#56647a;line-height:1.55}#status{padding:14px;border-radius:12px;background:#f3f6fa;font-size:14px}
button{width:100%;border:0;border-radius:12px;padding:14px 18px;background:#18243a;color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px}button:disabled{opacity:.55;cursor:wait}
</style>
<script src="/commander-connect.js" defer></script>

<body><main>
<div class="mark">HOLISTIC HOUSE · AGENT COMMANDER</div>
<h1>Безопасный вход владельца</h1>
<p>Используется тот же Google-вход и тот же личный кабинет Holistic House. Доступ к рабочим чатам открывается только для подтверждённого владельца.</p>
<p id="status" role="status" aria-live="polite">Проверяю защищённую сессию…</p>
<button id="continue" type="button" hidden>Продолжить через Google</button>
</main></body></html>
