name: HH Personal Coaching Session
on:
  pull_request:
    branches: [codex/public-book-library]
    paths:
      - '.github/workflows/hh-personal-coaching-session.yml'
      - 'lib/personal-coaching/**'
      - 'lib/app/personal-coaching.js'
      - 'lib/app/personal-coaching-catalog.js'
      - 'lib/app/business-coaching.js'
      - 'lib/business-coaching/program.js'
      - 'components/app/personal-coaching*'
      - 'components/app/tradition-coaching*'
      - 'components/app/coaching-question-voice.jsx'
      - 'components/app/business-coaching.jsx'
      - 'components/app/app-workspace.jsx'
      - 'components/app/my-courses-dashboard.jsx'
      - 'components/app/development-program.jsx'
      - 'components/direction-offers.tsx'
      - 'components/academy-hub.tsx'
      - 'app/api/app/**'
      - 'app/[locale]/app/**'
      - 'tests/personal-coaching-session.test.mjs'
      - 'tests/personal-coaching-model-selection.test.mjs'
      - 'supabase/migrations/*coaching_model_fit_comments*'
      - 'supabase/migrations/*coaching_request_signals*'
      - 'supabase/migrations/*coaching_topic_fit_weights*'
      - 'tests/tradition-coaching-courses.test.mjs'
      - 'tests/business-coaching-90-days.test.mjs'
      - 'tests/academy-discovery-hero.test.mjs'
      - 'supabase/migrations/*personal_coaching*'
      - 'supabase/migrations/*coaching_tradition*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-coaching-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify private GROW model, old programme pause and course discovery
        run: |
          node --check lib/personal-coaching/questions.js
          node --check lib/personal-coaching/model-matcher.js
          node --check lib/app/personal-coaching-catalog.js
          node --check lib/app/personal-coaching.js
          node --check lib/personal-coaching/traditions.js
          node --test tests/personal-coaching-session.test.mjs tests/personal-coaching-model-selection.test.mjs tests/tradition-coaching-courses.test.mjs tests/business-coaching-90-days.test.mjs tests/academy-discovery-hero.test.mjs tests/reports-development-program.test.mjs
      - name: Scoped eslint
        run: npx --no-install eslint components/app/personal-coaching.jsx components/app/personal-coaching-picker.jsx components/app/tradition-coaching.jsx components/app/coaching-question-voice.jsx components/app/app-workspace.jsx components/app/business-coaching.jsx components/app/my-courses-dashboard.jsx components/app/development-program.jsx components/direction-offers.tsx components/academy-hub.tsx lib/personal-coaching/questions.js lib/personal-coaching/model-matcher.js lib/personal-coaching/traditions.js lib/app/personal-coaching.js lib/app/personal-coaching-catalog.js lib/app/business-coaching.js app/api/app/\[...path\]/route.js
      - name: TypeScript noEmit
        run: npx --no-install tsc --noEmit
      - name: Build production Next.js
        run: npm run build
