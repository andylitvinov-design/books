name: Psychometric research catalogue safety
on:
  pull_request:
    paths:
      - 'data/assessments/research-directory-2026/**'
      - 'lib/assessments/research-directory-2026.js'
      - 'lib/assessments/psychometric-validity-2026.js'
      - 'components/app/research-directory.*'
      - 'components/app/test-explorer.jsx'
      - 'tests/psychometric-validity-directory.test.mjs'
      - '.github/workflows/psychometric-research-catalogue.yml'
  push:
    branches:
      - codex/public-book-library
    paths:
      - 'data/assessments/research-directory-2026/**'
      - 'lib/assessments/research-directory-2026.js'
      - 'lib/assessments/psychometric-validity-2026.js'
      - 'components/app/research-directory.*'
      - 'components/app/test-explorer.jsx'
      - 'tests/psychometric-validity-directory.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psychometric-catalogue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify research-only references, multilingual lookup and permissions
        run: |
          node --conditions=react-server --test \
            tests/psychometric-validity-directory.test.mjs \
            tests/public-test-match-paging.test.mjs \
            tests/assessment-methodology.test.mjs \
            tests/test-kinds-catalog-audit.test.mjs
      - name: Generate non-clinical source-quality audit without patient data
        run: |
          node --conditions=react-server scripts/audit-psychometric-quality-2026.mjs > /tmp/psychometric-quality.json
          node --input-type=module -e '
            import fs from "node:fs";
            const x=JSON.parse(fs.readFileSync("/tmp/psychometric-quality.json","utf8"));
            if (x.researchEditionReferences !== 3092) process.exit(1);
            if (x.nonOverlappingResearchReferences < 2800) process.exit(1);
            console.log("Research catalogue count",x.researchEditionReferences,
              "discovery entries",x.nonOverlappingResearchReferences);
          '
