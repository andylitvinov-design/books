name: Library public feed focused verification
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'components/library-feed.tsx'
      - 'components/library-feed.module.css'
      - 'components/library-hub.tsx'
      - 'components/practitioner-materials-cabinet.jsx'
      - 'components/practitioner-materials-cabinet.module.css'
      - 'app/[locale]/library/page.tsx'
      - 'app/[locale]/books/page.tsx'
      - 'app/es/books/page.tsx'
      - 'components/ideas-news-feed.tsx'
      - 'components/ideas-discovery.tsx'
      - 'components/ideas-discovery.module.css'
      - 'lib/public-library-feed.ts'
      - 'tests/ideas-news-feed.test.mjs'
      - 'tests/ideas-guidance.test.mjs'
      - 'tests/ideas-mobile-ui.test.mjs'
      - 'app/api/admin/materials/[id]/route.js'
      - 'app/ia-v2.css'
      - 'lib/clients/material-library.js'
      - 'tests/library-news-feed.test.mjs'
      - 'tests/library-compact-design.test.mjs'
      - 'tests/library-block-design.test.mjs'
      - 'tests/flat-book-catalog.test.mjs'
      - '.github/workflows/library-public-feed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test Library feed, existing book reference, and owner materials isolation
        run: node --conditions=react-server --test tests/library-news-feed.test.mjs tests/ideas-news-feed.test.mjs tests/ideas-guidance.test.mjs tests/ideas-mobile-ui.test.mjs tests/library-compact-design.test.mjs tests/library-block-design.test.mjs tests/flat-book-catalog.test.mjs tests/practitioner-material-library.test.mjs
      - name: Lint changed TypeScript and JavaScript sources
        run: npx --no-install eslint 'app/[locale]/library/page.tsx' 'app/[locale]/books/page.tsx' 'app/es/books/page.tsx' 'app/api/admin/materials/[id]/route.js' components/library-feed.tsx components/library-hub.tsx components/ideas-news-feed.tsx components/ideas-discovery.tsx components/practitioner-materials-cabinet.jsx lib/public-library-feed.ts lib/clients/material-library.js
      - name: Production-mode Next build (no Vercel Preview created)
        run: npm run build
      - name: TypeScript type verification
        run: npx --no-install tsc --noEmit
