name: Library public feed focused verification
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'components/library-feed.tsx'
      - 'components/library-feed.module.css'
      - 'components/library-hub.tsx'
      - 'components/practitioner-materials-cabinet.jsx'
      - 'components/practitioner-materials-cabinet.module.css'
      - 'app/[locale]/library/page.tsx'
      - 'app/[locale]/books/page.tsx'
      - 'app/es/books/page.tsx'
      - 'components/ideas-news-feed.tsx'
      - 'components/ideas-discovery.tsx'
      - 'components/ideas-discovery.module.css'
      - 'lib/ideas-guidance.mjs'
      - 'lib/ideas-guidance.d.mts'
      - 'data/ideas-aphorisms.json'
      - 'tests/ideas-aphorisms-catalog.test.mjs'
      - 'lib/public-library-feed.ts'
      - 'tests/ideas-news-feed.test.mjs'
      - 'tests/ideas-guidance.test.mjs'
      - 'tests/ideas-mobile-ui.test.mjs'
      - 'scripts/verify-ideas-mobile-browser.mjs'
      - 'app/api/admin/materials/[id]/route.js'
      - 'app/ia-v2.css'
      - 'lib/clients/material-library.js'
      - 'tests/library-news-feed.test.mjs'
      - 'tests/library-compact-design.test.mjs'
      - 'tests/library-block-design.test.mjs'
      - 'tests/flat-book-catalog.test.mjs'
      - '.github/workflows/library-public-feed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test Library feed, existing book reference, and owner materials isolation
        run: node --conditions=react-server --test tests/library-news-feed.test.mjs tests/ideas-news-feed.test.mjs tests/ideas-guidance.test.mjs tests/ideas-aphorisms-catalog.test.mjs tests/ideas-mobile-ui.test.mjs tests/library-compact-design.test.mjs tests/library-block-design.test.mjs tests/flat-book-catalog.test.mjs tests/practitioner-material-library.test.mjs
      - name: Lint changed TypeScript and JavaScript sources
        run: npx --no-install eslint 'app/[locale]/library/page.tsx' 'app/[locale]/books/page.tsx' 'app/es/books/page.tsx' 'app/api/admin/materials/[id]/route.js' components/library-feed.tsx components/library-hub.tsx components/ideas-news-feed.tsx components/ideas-discovery.tsx lib/ideas-guidance.mjs tests/ideas-aphorisms-catalog.test.mjs tests/ideas-guidance.test.mjs components/practitioner-materials-cabinet.jsx lib/public-library-feed.ts lib/clients/material-library.js
      - name: Production-mode Next build (no Vercel Preview created)
        run: npm run build
      - name: TypeScript type verification
        run: npx --no-install tsc --noEmit
      - name: Install isolated browser engines (no service data or production network)
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          npm install --prefix /tmp/hh-ideas-playwright --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.63.0
          ln -s /tmp/hh-ideas-playwright/node_modules/@playwright node_modules/@playwright
          /tmp/hh-ideas-playwright/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Real public Ideas mobile journeys, EN/RU/ES and 320–430px
        env:
          HH_PLAYWRIGHT_PACKAGE: '@playwright/test'
          HH_PUBLIC_QA_ORIGIN: 'http://127.0.0.1:3100'
        run: |
          npx --no-install next start --hostname 127.0.0.1 --port 3100 > /tmp/hh-ideas-server.log 2>&1 & APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 65); do
            if curl --silent --fail http://127.0.0.1:3100/en/books >/dev/null; then break; fi
            sleep 2
          done
          node scripts/verify-ideas-mobile-browser.mjs || { tail -80 /tmp/hh-ideas-server.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hh-ideas-mobile-acceptance
          path: artifacts/ideas-mobile/
          retention-days: 7
