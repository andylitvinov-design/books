name: HH closed PR Actions cleanup

# pull_request_target lives on GitHub default; never run PR HEAD code.
# Include merged closed PRs: their old PR-scoped checks are obsolete too.
# The trusted controller independently checks closed state, unique branch,
# source ancestry, exact run association and fresh state before cancellation.
on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Closed production PR number to inspect or clean'
        type: string
        required: true
      dry_run:
        description: 'Preview only (the safe default)'
        type: boolean
        default: true

permissions: {}
concurrency:
  group: hh-closed-pr-cleanup-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request_target' &&
        github.event.action == 'closed' &&
        github.event.pull_request.base.ref == 'codex/public-book-library'))
    runs-on: ubuntu-slim
    timeout-minutes: 7
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Checkout trusted control-plane code (never PR HEAD)
        uses: actions/checkout@v4
        with:
          ref: codex/bootstrap-books
          persist-credentials: false
          fetch-depth: 1
      - name: Test fail-closed PR/run association policy
        run: |
          node --check scripts/ci-pr-closed-run-cleanup.cjs
          node --test tests/ci-pr-closed-run-cleanup.test.cjs
      - name: Cancel only verified orphaned PR Actions
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {cleanup} = require(process.env.GITHUB_WORKSPACE + '/scripts/ci-pr-closed-run-cleanup.cjs');
            const result = await cleanup({github, context, core});
            await core.summary.addHeading('Closed production PR - isolated Actions cleanup')
              .addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
            if (result.partial) core.warning('Closed PR scan partial; no ambiguous run was cancelled.');
            if (result.errors.length) core.setFailed('GitHub cancellation errors: ' + result.errors.length);
