name: Practitioner presentations and materials verification
on:
  push:
    branches: ['feature/practitioner-video-presentations-20261017']
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'lib/practitioners/**'
      - 'components/app/practice-video-field.jsx'
      - 'components/app/practice-workspace.jsx'
      - 'components/practitioner-presentation-video.*'
      - 'components/practitioner-video-gallery.*'
      - 'components/app/practice-materials.*'
      - 'components/app/practitioner-articles.jsx'
      - 'components/app/practitioner-articles.module.css'
      - 'tests/practitioner-articles-folders.test.mjs'
      - 'app/\[locale\]/masters/**'
      - 'app/\[locale\]/services/\[practitionerSlug\]/**'
      - 'app/api/app/\[...path\]/route.js'
      - 'supabase/migrations/*practitioner_presentation*'
      - 'tests/practitioner-presentation-video.test.mjs'
      - 'tests/practitioner-video-materials.test.mjs'
      - '.github/workflows/practitioner-presentations.yml'
permissions:
  contents: read
jobs:
  presentation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/practitioner-presentation-video.test.mjs tests/practitioner-video-materials.test.mjs tests/practitioner-articles-v4.test.mjs tests/master-network-r2.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
