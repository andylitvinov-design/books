      - 'tests/portrait-one-screen-mobile.test.mjs'
      - 'scripts/verify-app-r1.mjs'
      - '.github/workflows/hh-portrait-sectors.yml'
permissions:
  contents: read
concurrency:
  group: profile-axis-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  writer-practical-focused:
    if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'codex/holistic-intelligence-core-20261029' || github.event.pull_request.base.ref == 'codex/public-book-library') && github.head_ref == 'feat/meditation-writer-device-voice-v1-20261030' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Practical director and prior writer regressions
        run: node --test tests/meditation-writer-brief.test.mjs tests/meditation-writer-literary.test.mjs tests/meditation-writer-free-gemini.test.mjs tests/meditation-writer-preview-source.test.mjs tests/meditation-writer-device-voice-source.test.mjs tests/meditation-writer-practical-director.test.mjs tests/meditation-writer-small-model-skill.test.mjs tests/meditation-writer-free-providers.test.mjs tests/hypno-private-signals.test.mjs
      - name: Install locked dependencies for writer-only lint and types
        run: npm ci --no-audit --no-fund
      - name: Lint writer API, UI and contracts
        run: npx --no-install eslint --max-warnings 0 'app/[locale]/holistic-support/mandala/page.tsx' app/api/holistic-support/meditation-writer/brief/route.js app/api/holistic-support/meditation-writer/affirmations/route.js components/mandala-hypno-compact.tsx components/meditation-writer-preview.tsx components/meditation-writer-device-voice.tsx lib/holistic-support/meditation-writer/*.mjs lib/mandala/hypno-private-signals.mjs tests/meditation-writer-*.test.mjs tests/hypno-private-signals.test.mjs
      - name: TypeScript contract check
        run: npx --no-install tsc --noEmit --pretty false
  axis-unit-types-build:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || github.head_ref != 'feat/meditation-writer-device-voice-v1-20261030' || github.event.pull_request.base.ref == 'codex/public-book-library') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rank accuracy and no health/goal score invention
        run: node --test tests/axis-offer-matcher.test.mjs tests/meditation-catalog-candidates.test.mjs tests/my-tests-compact-finder.test.mjs tests/axis-offer-ranker.test.mjs tests/client-reasoning-core.test.mjs tests/client-reasoning-bridge.test.mjs tests/intelligence-request.test.mjs tests/intelligence-meditation-bridge.test.mjs tests/intelligence-risk.test.mjs tests/client-request-relevance-v2.test.mjs tests/conversation-context.test.mjs tests/holistic-guide-adapter.test.mjs tests/holistic-intelligence.test.mjs tests/natural-dialogue.test.mjs tests/owned-agent-gateway.test.mjs tests/psychologist-mind.test.mjs tests/psychologist-practice-engine.test.mjs tests/holistic-agent-consented-profile.test.mjs tests/holistic-agent-program-preview.test.mjs
      - name: Real private account picker disclosure, original draft retention and negative controls
        run: node --test tests/account-picker-disclosure-verifier.test.mjs
      - name: Portrait four-sector, missing-value, responsive and privacy contracts
        run: node --test tests/portrait-sectors.test.mjs tests/portrait-rays-responsive.test.mjs tests/portrait-ray-labels.test.mjs tests/psych-portrait.test.mjs tests/portrait-report-actions.test.mjs tests/portrait-sector-take-test.test.mjs tests/portrait-one-screen-mobile.test.mjs
      - name: Scoped ESLint
        run: npx --no-install eslint lib/holistic-support/axis-offer-matcher.mjs lib/holistic-support/client-intent-model.mjs lib/holistic-support/meditation-catalog-ranker.mjs lib/profile/portrait-recommendations.js components/holistic-meditation-finder.tsx components/app/personal-axis-matches.jsx components/app/my-tests-dashboard.jsx components/app/portrait-recommendations.jsx tests/axis-offer-matcher.test.mjs lib/holistic-support/client-reasoning-core.mjs lib/holistic-support/client-reasoning-bridge.mjs lib/holistic-support/intelligence-request.mjs lib/holistic-support/intelligence-risk.mjs tests/intelligence-request.test.mjs tests/intelligence-meditation-bridge.test.mjs tests/intelligence-risk.test.mjs tests/client-reasoning-core.test.mjs tests/client-reasoning-bridge.test.mjs app/[locale]/holistic-support/agent/page.tsx components/holistic-agent-chat.tsx lib/holistic-support/conversation-context.mjs lib/holistic-support/holistic-guide-adapter.mjs lib/holistic-support/holistic-intelligence.mjs lib/holistic-support/kip-symbol-registry.mjs lib/holistic-support/natural-dialogue.mjs lib/holistic-support/owned-ollama.mjs lib/holistic-support/psychologist-meditation-composer.mjs lib/holistic-support/psychologist-mind.mjs lib/holistic-support/psychologist-video-curricula.mjs scripts/owned-agent-gateway.mjs scripts/verify-site-video-browser.mjs tests/client-request-relevance-v2.test.mjs tests/conversation-context.test.mjs tests/holistic-guide-adapter.test.mjs tests/holistic-intelligence.test.mjs tests/natural-dialogue.test.mjs tests/owned-agent-gateway.test.mjs tests/psychologist-mind.test.mjs tests/psychologist-practice-engine.test.mjs tests/holistic-agent-consented-profile.test.mjs tests/holistic-agent-program-preview.test.mjs app/api/holistic-agent/program/route.js
      - name: TypeScript check
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npx --no-install tsc --noEmit --pretty false
      - name: Build site
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npm run build
