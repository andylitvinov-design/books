name: Holistic House axis-to-offer matching
on:
  push:
    branches: ['codex/hh-intelligence-link-safety-20261029', 'codex/hh-intelligence-current-focus-20261029', 'codex/hh-intelligence-ranker-ci-20261029', 'codex/hh-intelligence-request-boundary-20261029', 'codex/hh-intelligence-meditation-bridge-20261029', 'codex/hh-intelligence-private-api-20261029', 'codex/hh-intelligence-client-card-20261029', 'codex/hh-intelligence-coaching-context-20261029', 'codex/hh-intelligence-session-checkins-20261029']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ['codex/public-book-library', 'codex/hh-intelligence-*']
    paths:
      - 'lib/holistic-support/axis-offer-matcher.mjs'
      - 'lib/holistic-support/axis-offer-matcher.d.mts'
      - 'lib/holistic-support/client-intent-model.mjs'
      - 'lib/holistic-support/client-intent-model.d.mts'
      - 'lib/holistic-support/meditation-catalog-ranker.mjs'
      - 'lib/holistic-support/meditation-catalog-types.ts'
      - 'components/holistic-meditation-finder.tsx'
      - 'components/holistic-meditation-finder.module.css'
      - 'lib/profile/portrait-recommendations.js'
      - 'components/app/personal-axis-matches.jsx'
      - 'components/app/personal-axis-matches.module.css'
      - 'components/app/my-tests-dashboard.jsx'
      - 'components/app/portrait-recommendations.jsx'
      - 'tests/axis-offer-matcher.test.mjs'
      - 'docs/myspace/PROFILE_AXIS_OFFER_MATCHING_V1_20261028.md'
      - 'lib/holistic-support/client-reasoning-core.mjs'
      - 'lib/holistic-support/client-reasoning-bridge.mjs'
      - 'lib/holistic-support/intelligence-request.mjs'
      - 'tests/intelligence-request.test.mjs'
      - 'tests/intelligence-meditation-bridge.test.mjs'
      - 'lib/holistic-support/intelligence-risk.mjs'
      - 'tests/intelligence-risk.test.mjs'
      - 'lib/holistic-support/intelligence-plan.mjs'
      - 'tests/intelligence-plan.test.mjs'
      - 'tests/app-auth-pkce.integration.mjs'
      - 'tests/holistic-intelligence-card.test.mjs'
      - 'components/holistic-intelligence-card.jsx'
      - 'components/holistic-intelligence-card.module.css'
      - 'scripts/verify-intelligence-browser.mjs'
      - 'components/app/app-workspace.jsx'
      - 'lib/holistic-support/meditation-discovery-server.ts'
      - 'app/api/app/**/route.js'
      - 'lib/home-conversation.mjs'
      - 'lib/ideas-guidance.mjs'
      - 'data/ideas-aphorisms.json'
      - 'tests/client-reasoning-core.test.mjs'
      - 'tests/client-reasoning-bridge.test.mjs'
      - 'lib/holistic-support/axis-offer-ranker.mjs'
      - 'tests/axis-offer-ranker.test.mjs'
      - 'tests/meditation-catalog-candidates.test.mjs'
      - 'data/holistic-support/axis-offer-crosswalk-v1.csv'
      - 'data/academy/meditation-catalog-candidates-20261028.json'
      - 'data/academy/meditation-filter-facets-20261028.json'
      - '.github/workflows/hh-profile-axis-matching.yml'
      - 'components/app/test-explorer-visual.jsx'
      - 'components/app/app-workspace.jsx'
      - 'components/app/portrait-test-quick-actions.jsx'
      - 'components/app/portrait-test-quick-actions.module.css'
      - 'lib/profile/portrait-test-suggestions.js'
      - 'tests/portrait-report-actions.test.mjs'
      - 'tests/portrait-sector-take-test.test.mjs'
      - 'components/app/test-explorer.module.css'
      - 'lib/assessments/portrait-sectors.js'
      - 'tests/portrait-sectors.test.mjs'
      - 'tests/portrait-rays-responsive.test.mjs'
      - 'tests/portrait-one-screen-mobile.test.mjs'
      - 'scripts/verify-app-r1.mjs'
      - '.github/workflows/hh-portrait-sectors.yml'
permissions:
  contents: read
concurrency:
  group: profile-axis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  axis-unit-types-build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rank accuracy and no health/goal score invention
        run: node --test tests/axis-offer-matcher.test.mjs tests/axis-offer-ranker.test.mjs tests/meditation-catalog-candidates.test.mjs tests/my-tests-compact-finder.test.mjs tests/client-reasoning-core.test.mjs tests/client-reasoning-bridge.test.mjs tests/intelligence-request.test.mjs tests/intelligence-meditation-bridge.test.mjs tests/intelligence-risk.test.mjs tests/intelligence-plan.test.mjs tests/holistic-intelligence-card.test.mjs
      - name: Portrait four-sector, missing-value, responsive and privacy contracts
        run: node --test tests/portrait-sectors.test.mjs tests/portrait-rays-responsive.test.mjs tests/portrait-ray-labels.test.mjs tests/psych-portrait.test.mjs tests/portrait-report-actions.test.mjs tests/portrait-sector-take-test.test.mjs tests/portrait-one-screen-mobile.test.mjs
      - name: Scoped ESLint
        run: npx --no-install eslint lib/holistic-support/client-reasoning-core.mjs lib/holistic-support/client-reasoning-bridge.mjs lib/holistic-support/intelligence-request.mjs lib/holistic-support/intelligence-risk.mjs lib/holistic-support/intelligence-plan.mjs 'app/api/app/[...path]/route.js' tests/intelligence-request.test.mjs tests/intelligence-meditation-bridge.test.mjs tests/intelligence-risk.test.mjs tests/intelligence-plan.test.mjs tests/holistic-intelligence-card.test.mjs tests/client-reasoning-core.test.mjs tests/client-reasoning-bridge.test.mjs lib/holistic-support/axis-offer-matcher.mjs lib/holistic-support/client-intent-model.mjs lib/holistic-support/meditation-catalog-ranker.mjs lib/profile/portrait-recommendations.js components/holistic-intelligence-card.jsx components/holistic-meditation-finder.tsx components/app/personal-axis-matches.jsx components/app/my-tests-dashboard.jsx components/app/portrait-recommendations.jsx tests/axis-offer-matcher.test.mjs
      - name: Authenticated intelligence route and OAuth regression
        run: node --conditions=react-server --test tests/app-auth-pkce.integration.mjs
      - name: TypeScript check
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npx --no-install tsc --noEmit --pretty false
      - name: Build site
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npm run build
      # `next start` requires a local build even when core CI builds separately.
      - name: Build application for Intelligence browser acceptance
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'codex/public-book-library' }}
        run: npm run build
      - name: Install isolated browser tools
        run: |
          npm install --prefix /tmp/hh-intelligence-browser --no-save --no-audit --no-fund playwright@1.63.0
          /tmp/hh-intelligence-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Public intelligence journey in Chromium and WebKit
        env:
          HH_INTELLIGENCE_BROWSER_TOOLS: /tmp/hh-intelligence-browser
        run: |
          npm run start -- --port 3187 > /tmp/hh-intelligence-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          HH_TEST_BROWSER=chromium node scripts/verify-intelligence-browser.mjs
          HH_TEST_BROWSER=webkit node scripts/verify-intelligence-browser.mjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-browser-screenshots
          path: /tmp/hh-intelligence-evidence
          if-no-files-found: ignore
