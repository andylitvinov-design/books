name: Holistic House axis-to-offer matching
on:
  pull_request:
    branches: ['codex/public-book-library', 'feat/holistic-intelligence-core-20261029']
    paths:
      - 'lib/holistic-support/axis-offer-matcher.mjs'
      - 'lib/holistic-support/client-reasoning-core.mjs'
      - 'lib/holistic-support/client-reasoning-bridge.mjs'
      - 'tests/client-reasoning-core.test.mjs'
      - 'tests/client-reasoning-bridge.test.mjs'
      - 'lib/holistic-support/holistic-guide-adapter.mjs'
      - 'lib/holistic-support/holistic-guide-adapter.d.mts'
      - 'tests/holistic-guide-adapter.test.mjs'
      - 'lib/holistic-support/holistic-intelligence.mjs'
      - 'lib/holistic-support/psychologist-mind.mjs'
      - 'lib/holistic-support/psychologist-mind.d.mts'
      - 'tests/psychologist-mind.test.mjs'
      - 'tests/psychologist-practice-engine.test.mjs'
      - 'lib/holistic-support/kip-symbol-registry.mjs'
      - 'lib/holistic-support/psychologist-video-curricula.mjs'
      - 'lib/holistic-support/psychologist-meditation-composer.mjs'
      - 'docs/holistic-support/PSYCHOLOGIST_PRACTICE_ENGINE_V1_20261029.md'
      - 'docs/holistic-support/PSYCHOLOGIST_MIND_V1_20261029.md'
      - 'lib/holistic-support/holistic-intelligence.d.mts'
      - 'lib/holistic-support/axis-offer-matcher.d.mts'
      - 'lib/holistic-support/client-intent-model.mjs'
      - 'lib/holistic-support/client-intent-model.d.mts'
      - 'lib/holistic-support/meditation-catalog-ranker.mjs'
      - 'lib/holistic-support/meditation-catalog-types.ts'
      - 'components/holistic-meditation-finder.tsx'
      - 'components/holistic-meditation-finder.module.css'
      - 'lib/profile/portrait-recommendations.js'
      - 'components/app/personal-axis-matches.jsx'
      - 'components/app/personal-axis-matches.module.css'
      - 'components/app/my-tests-dashboard.jsx'
      - 'components/app/portrait-recommendations.jsx'
      - 'tests/axis-offer-matcher.test.mjs'
      - 'lib/holistic-support/conversation-context.mjs'
      - 'tests/conversation-context.test.mjs'
      - 'tests/natural-dialogue.test.mjs'
      - 'lib/holistic-support/natural-dialogue.mjs'
      - 'lib/holistic-support/natural-dialogue.d.mts'
      - 'app/api/holistic-agent/turn/route.js'
      - 'components/holistic-agent-chat.tsx'
      - 'components/holistic-agent-chat.module.css'
      - 'app/[locale]/holistic-support/agent/page.tsx'
      - 'lib/holistic-support/owned-ollama.mjs'
      - 'docs/holistic-support/HOLISTIC_INTELLIGENCE_CONVERSATIONAL_AGENT_V3_20261029.md'
      - 'tests/holistic-intelligence.test.mjs'
      - 'docs/myspace/PROFILE_AXIS_OFFER_MATCHING_V1_20261028.md'
      - '.github/workflows/hh-profile-axis-matching.yml'
permissions:
  contents: read
concurrency:
  group: profile-axis-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  axis-unit-types-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rank accuracy and no health/goal score invention
        run: node --test tests/axis-offer-matcher.test.mjs tests/client-reasoning-core.test.mjs tests/client-reasoning-bridge.test.mjs tests/holistic-guide-adapter.test.mjs tests/holistic-intelligence.test.mjs tests/conversation-context.test.mjs tests/natural-dialogue.test.mjs tests/psychologist-mind.test.mjs tests/psychologist-practice-engine.test.mjs tests/client-request-relevance-v2.test.mjs tests/meditation-catalog-candidates.test.mjs tests/my-tests-compact-finder.test.mjs
      - name: Scoped ESLint
        run: npx --no-install eslint lib/holistic-support/client-reasoning-core.mjs lib/holistic-support/client-reasoning-bridge.mjs tests/client-reasoning-core.test.mjs tests/client-reasoning-bridge.test.mjs lib/holistic-support/holistic-intelligence.mjs lib/holistic-support/natural-dialogue.mjs lib/holistic-support/conversation-context.mjs tests/conversation-context.test.mjs lib/holistic-support/owned-ollama.mjs tests/natural-dialogue.test.mjs app/api/holistic-agent/turn/route.js components/holistic-agent-chat.tsx app/[locale]/holistic-support/agent/page.tsx lib/holistic-support/holistic-guide-adapter.mjs tests/holistic-guide-adapter.test.mjs tests/holistic-intelligence.test.mjs lib/holistic-support/psychologist-mind.mjs lib/holistic-support/kip-symbol-registry.mjs lib/holistic-support/psychologist-video-curricula.mjs lib/holistic-support/psychologist-meditation-composer.mjs tests/psychologist-mind.test.mjs tests/psychologist-practice-engine.test.mjs lib/holistic-support/axis-offer-matcher.mjs lib/holistic-support/client-intent-model.mjs lib/holistic-support/meditation-catalog-ranker.mjs lib/profile/portrait-recommendations.js components/holistic-meditation-finder.tsx components/app/personal-axis-matches.jsx components/app/my-tests-dashboard.jsx components/app/portrait-recommendations.jsx tests/axis-offer-matcher.test.mjs
      - name: TypeScript check
        run: npx --no-install tsc --noEmit --pretty false
      - name: Build site
        run: npm run build
