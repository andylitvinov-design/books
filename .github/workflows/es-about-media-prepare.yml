name: Prepare Spanish About media
on:
  push:
    branches: ['chatgpt/es-about-video-2026-10-01']
    paths: ['.github/workflows/es-about-media-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package source snapshot for review
        run: |
          mkdir -p /tmp/es-about-media
          git archive --format=tar.gz HEAD > /tmp/es-about-media/source.tar.gz
      - name: Download the single approved-public Spanish render
        env:
          VIDEO_URL: 'https://files2.heygen.ai/aws_pacific/avatar_tmp/29b72be65e0e493f9570e7a40a904b91/2c251709aba74fd96ae8be43257a080b.mp4?Expires=1791463054&Signature=KH5jCmCmufoJFdD6uTA1r-YPKxf1Js3dNNlj1hn4mKfgj5FN4eqqny9Vd2ZA5ng9liIZi36dgMajiomlEduRGn4N74f2A19hmbd72ZQ3KIIT2svLjI2HTLtllGWiTY7vHRnZRDmAthybgBBAUz60AFCIAAKr0sCNSEXUgXruDPXgn64V5hHeWkghIUFk1QJcA-aMo7rM3HM-YLHsMfbouwuKiHYOXISEYhBrrqoVW~mT98rJI~vHCSUZTMYy8txAfezpVYWmm~3Ae7Su-mhanZ1WvwccJL~8xrKhH92jJwsp3DyD1qvwqJzGSTRZ1GvqIxKshbS8bBcmWbWSnSW91Q__&Key-Pair-Id=K38HBHX5LX3X2H'
          SRT_URL: 'https://files2.heygen.ai/aws_pacific/avatar_tmp/29b72be65e0e493f9570e7a40a904b91/subtitles_2c251709aba74fd96ae8be43257a080b.srt?Expires=1791463075&Signature=h6pZb2mgfi89GEs3Jwj6e11CaUMpSCUVjSGHvKMRpXXXJwXpdQ25tdoHua7SFlA6jSS1VUahMSRA0wJ4e969It-LDnvWWCQbvWYHbrwaRk1bO3PG9J3460AfEPzhRMtVyVZsbRLQu9mzr07oVLHjCAzfLEYsOmqk2UHVGicwPgidvlNUj3h0PA44oKNJYBALqOyrU-Rbbj~RmCRLVIf0J59R8gVXT3dYT8DwjATJTQzN-Vue9G7ly4oRzo-GSnkjI0rFKJiZALoHHgwF82fscEcPyisV8v8wMHLyFjRX5HivQJVIgjONV~SO1Jnfn5om506w5h42XcIppKPmjeoueA__&Key-Pair-Id=K38HBHX5LX3X2H'
        run: |
          python - <<'PY'
          import os, urllib.request
          from pathlib import Path
          root=Path('/tmp/es-about-media')
          for key,name in [('VIDEO_URL','master.mp4'),('SRT_URL','captions.srt')]:
            url=os.environ[key]
            assert url.startswith('https://files2.heygen.ai/')
            with urllib.request.urlopen(url, timeout=120) as r:
              (root/name).write_bytes(r.read())
          assert (root/'master.mp4').stat().st_size > 1000000
          PY
      - name: Inspect media and extract genuine preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -show_format -show_streams -of json /tmp/es-about-media/master.mp4 > /tmp/es-about-media/probe.json
          ffmpeg -v error -ss 1.5 -i /tmp/es-about-media/master.mp4 -frames:v 1 -vf scale=1280:720 -c:v libwebp -quality 85 /tmp/es-about-media/poster.webp
          ffmpeg -v error -i /tmp/es-about-media/master.mp4 -vn -ac 1 -ar 16000 /tmp/es-about-media/audio.wav
          ffmpeg -v error -i /tmp/es-about-media/master.mp4 -vf 'fps=1/3,scale=640:-1,tile=4x3' -frames:v 1 /tmp/es-about-media/contact-sheet.jpg
          cd /tmp/es-about-media && sha256sum master.mp4 poster.webp captions.srt > SHA256SUMS
      - name: Independently check spoken language and script
        run: |
          python -m pip install --disable-pip-version-check faster-whisper==1.2.1
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel
          root=Path('/tmp/es-about-media')
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          segments,info=model.transcribe(str(root/'audio.wav'),beam_size=5,word_timestamps=True)
          data={'language':info.language,'probability':info.language_probability,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word} for w in s.words]} for s in segments]}
          (root/'speech-qa.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          assert info.language=='es', 'Unexpected speech language'
          print('Spoken Spanish detected; transcript saved for review.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: es-about-media-and-source
          path: /tmp/es-about-media/
          retention-days: 3
