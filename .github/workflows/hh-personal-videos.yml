name: Personal Video Cloud — owner privacy and delivery checks
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'app/api/app/personal-videos/**'
      - 'app/[locale]/app/[[...path]]/page.jsx'
      - 'components/app/app-workspace.jsx'
      - 'components/app/my-personal-videos.jsx'
      - 'lib/app/personal-videos.js'
      - 'supabase/migrations/*personal_videos*'
      - 'tests/personal-video-cloud.test.mjs'
      - '.github/workflows/hh-personal-videos.yml'
permissions:
  contents: read
concurrency:
  group: hh-personal-videos-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  owner-only-save:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22',cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: My Videos privacy and storage contracts
        run: node --test tests/personal-video-cloud.test.mjs
      - name: Scoped ESLint
        run: npx --no-install eslint components/app/my-personal-videos.jsx lib/app/personal-videos.js 'app/api/app/personal-videos/**/*.js' tests/personal-video-cloud.test.mjs
      - name: TypeScript
        run: npx --no-install tsc --noEmit
      - name: Next production build
        run: npm run build
