name: HH Personal Video Privacy
'on':
  pull_request:
    branches:
      - codex/public-book-library
    paths:
      - 'app/api/app/personal-videos/**'
      - 'app/**/app/**/page.jsx'
      - 'components/app/app-workspace.jsx'
      - 'components/app/my-personal-videos.jsx'
      - 'lib/app/personal-videos.js'
      - 'supabase/migrations/*personal_videos*'
      - 'supabase/migrations/*personal_video_consent*'
      - 'tests/personal-video-cloud.test.mjs'
      - '.github/workflows/hh-personal-videos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Owner consent, quota and storage safety contracts
        run: node --test tests/personal-video-cloud.test.mjs
      - name: Scoped ESLint
        run: npx --no-install eslint lib/app/personal-videos.js app/api/app/personal-videos/route.js 'app/api/app/personal-videos/[id]/route.js' tests/personal-video-cloud.test.mjs
      - name: TypeScript
        run: npx --no-install tsc --noEmit
      - name: Production build
        run: npm run build
