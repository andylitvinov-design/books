name: IA v2 reconciliation evidence
on:
  push:
    branches: ['chatgpt/issue-222-library-cabinet-2026-10-02']
    paths: ['.github/workflows/ia-v2-reconcile.yml']
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source trees and comparison, no runtime credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ia222-source
          python3 - <<'PY'
          import json, pathlib, subprocess
          out = pathlib.Path('/tmp/ia222-source')
          refs = {
            'common': '92fc2f175f500d6db5596e12eb4130aac404fa4f',
            'pr74': '3df66cf3abb1f7024c78a9ae38cb5e481adec85c',
            'pr75': 'b048c5e3c72e1046d137330dd7eebc9538d0e187',
            'base': '5ac4e18f4673e2793644fd6ca41544b4605818d0',
          }
          def git(*args):
            return subprocess.check_output(['git', *args])
          for name, ref in refs.items():
            tree = git('ls-tree', '-r', '--full-tree', ref).decode()
            (out / (name + '-tree.txt')).write_text(tree)
            names = git('ls-tree', '-r', '--name-only', ref).decode().splitlines()
            paths = [p for p in names if p.startswith(('app/', 'components/', 'lib/', 'scripts/', 'tests/', '.github/', 'docs/', 'data/')) and p.endswith(('.js', '.jsx', '.ts', '.tsx', '.mjs', '.css', '.json', '.yml', '.yaml', '.md'))]
            paths += [p for p in names if p in ['package.json', 'package-lock.json', 'middleware.ts', 'next.config.ts', 'tsconfig.json', 'WORKFLOW.md', 'AGENTS.md', 'CLAUDE.md', 'eslint.config.mjs', 'tailwind.config.ts', 'postcss.config.mjs']]
            paths += [p for p in names if p.endswith(('/AGENTS.md', '/CLAUDE.md')) and p not in paths]
            with (out / (name + '.tar')).open('wb') as f:
              subprocess.run(['git', 'archive', '--format=tar', ref, '--', *paths], check=True, stdout=f)
          (out / 'pr75-vs-pr74.diff').write_bytes(git('diff', refs['pr74'], refs['pr75']))
          (out / 'base-since-common.diff').write_bytes(git('diff', refs['common'], refs['base']))
          merged = subprocess.run(['git', 'merge-tree', '--write-tree', refs['pr74'], refs['base']], capture_output=True)
          (out / 'merge-tree.txt').write_bytes(merged.stdout + merged.stderr)
          (out / 'manifest.json').write_text(json.dumps({'refs': refs, 'workflowCheckout': git('rev-parse', 'HEAD').decode().strip(), 'mergeTreeExit': merged.returncode}, indent=2))
          print((out / 'manifest.json').read_text())
          print(git('diff', '--stat', refs['pr74'], refs['pr75']).decode())
          print(merged.stdout.decode())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ia222-exact-source-evidence
          path: /tmp/ia222-source/
          retention-days: 3
