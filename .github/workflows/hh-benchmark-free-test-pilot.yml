name: Holistic House benchmark free-test pilot

on:
  pull_request:
    branches: [codex/public-book-library]
    paths:
      - ".github/workflows/hh-benchmark-free-test-pilot.yml"
      - "components/free-entry-landing.tsx"
      - "components/free-entry-landing.module.css"
      - "tests/benchmark-free-tests-first-pilot.test.mjs"
  push:
    branches: [codex/public-book-library]
    paths:
      - ".github/workflows/hh-benchmark-free-test-pilot.yml"
      - "components/free-entry-landing.tsx"
      - "components/free-entry-landing.module.css"
      - "tests/benchmark-free-tests-first-pilot.test.mjs"

permissions:
  contents: read

jobs:
  guest-first-contract:
    name: EN/RU/ES direct guest test without contact requirement
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify guest-first and existing free review contracts
        run: node --test tests/benchmark-free-tests-first-pilot.test.mjs tests/free-review-conversion.test.mjs
