name: Prepare approved RU About poster
on:
  push:
    branches: [chatgpt/ru-about-video-polish-2026-09-30]
    paths: [.github/workflows/prepare-ru-about-poster.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify work branch and repository instructions
        run: |
          test "$GITHUB_REF_NAME" = 'chatgpt/ru-about-video-polish-2026-09-30'
          find . -name AGENTS.md -o -name CLAUDE.md
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Retrieve approved public media and extract a lightweight still
        env:
          SOURCE_URL: 'https://files2.heygen.ai/aws_pacific/avatar_tmp/29b72be65e0e493f9570e7a40a904b91/d4e55c984e54b40fbeb8a21f81d27694.mp4?Expires=1791401018&Signature=fF8JevUUwXIXrPQNWg1xF8WoUa26ydYSRb5UQ8-Bzllb1hY1xHAfmhGTlvsPNpctMajK5RDaolDg~tIqK-rPfaQSzCU-daxvNps3WAk-J5hTb3IfwzzmWPo1s0s7TKLKZ1iwVNzwk2~gHs8jG~B~nQ2ID6JofGj8XUK2PgfnjDHrAzWGWBP4a0Olh4Tw7UQpYjG6JqpXAgMyl1~k5kKpc-Pbw0j6q7E0Dze9mOPruudqobXo2gLGBmGUIoWYpNCvwZuxAoMe-6RLB2hufw5ebO62~PR4~S~ieDhdJiGpugY5wl68bEbs3eWuhSKm6q3CskbOhGt7zyUANuuZQ6slJQ__&Key-Pair-Id=K38HBHX5LX3X2H'
        run: |
          mkdir -p /tmp/about-media public/images/holistic-house/video-posters
          python3 - <<'PY'
          import os, pathlib, urllib.request, urllib.parse
          url = os.environ['SOURCE_URL']
          assert urllib.parse.urlsplit(url).hostname == 'files2.heygen.ai'
          target = pathlib.Path('/tmp/about-media/2026-09-30_holistic-house_psychic-alchemy_ru_avatarV_16x9_v01.mp4')
          with urllib.request.urlopen(url, timeout=60) as response:
              assert response.status == 200
              content = response.read(64 * 1024 * 1024 + 1)
              assert 100000 < len(content) < 64 * 1024 * 1024
              target.write_bytes(content)
          PY
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height -of json /tmp/about-media/*.mp4 > /tmp/about-media/media-info.json
          ffmpeg -v error -ss 1.5 -i /tmp/about-media/*.mp4 -frames:v 1 -vf scale=1280:720 -c:v libwebp -quality 83 -y public/images/holistic-house/video-posters/psychic-alchemy-ru-v1.webp
          cp public/images/holistic-house/video-posters/psychic-alchemy-ru-v1.webp /tmp/about-media/
          sha256sum /tmp/about-media/*.mp4 /tmp/about-media/*.webp
          cat /tmp/about-media/media-info.json
      - name: Commit the small poster only to this work branch
        run: |
          test $(stat -c%s public/images/holistic-house/video-posters/psychic-alchemy-ru-v1.webp) -lt 250000
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/holistic-house/video-posters/psychic-alchemy-ru-v1.webp
          git commit -m 'Add real RU About video still; keep master MP4 outside Git'
          git push origin HEAD:chatgpt/ru-about-video-polish-2026-09-30
      - uses: actions/upload-artifact@v4
        with:
          name: approved-ru-about-media
          path: /tmp/about-media/
          retention-days: 7
          if-no-files-found: error
