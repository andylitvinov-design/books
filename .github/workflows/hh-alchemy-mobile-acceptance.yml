name: HH Alchemy independent mobile acceptance

# Dedicated gate: unrelated Holistic Support and CRM tests must not mask
# the ten-stage landing's own real layout and browser behaviour.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ['codex/public-book-library']
    paths:
      - '.github/workflows/hh-alchemy-mobile-acceptance.yml'
      - 'components/alchemy-soul-landing.tsx'
      - 'components/personal-testimonials.tsx'
      - 'components/alchemy-soul-landing.module.css'
      - 'components/alchemy-soul-lead-form.tsx'
      - 'components/alchemy-example-report.tsx'
      - 'components/alchemy-example-report.module.css'
      - 'app/[locale]/services/alchemy-of-soul/**'
      - 'app/es/services/alchemy-of-soul/**'
      - 'scripts/verify-alchemy-one-screen.mjs'
      - 'scripts/ci-alchemy-build.mjs'
      - 'scripts/cache-ancient-coaching-photos.mjs'
      - 'scripts/ensure-owner-video-renderer.mjs'
      - 'scripts/generate-soft-ocean-melody.mjs'
      - 'scripts/build-public-card-artwork.mjs'
      - 'scripts/build-report-pdf-art.mjs'
      - 'lib/personal-coaching/tradition-visuals.js'
      - 'lib/coaching/public-session-art.js'
      - 'tests/alchemy-*.test.mjs'
      - 'tests/service-alchemy-one-screen-story.test.mjs'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  # Only superseded commits of this PR cancel; manual acceptance is independent.
  group: hh-alchemy-mobile-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  alchemy-mobile:
    # Draft updates do not need a 16-viewport real browser run; Ready re-enables it.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CI: 'true'
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      HH_PUBLIC_QA_ORIGIN: http://127.0.0.1:3100
      HH_PLAYWRIGHT_PACKAGE: /tmp/hh-alchemy-qa/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies (including test tools)
        run: npm ci --include=dev --no-audit --no-fund
      - name: Isolated Alchemy contracts
        run: |
          node --test \
            tests/practitioner-homeopathy-canonical-route.test.mjs \
            tests/alchemy-soul-mobile-landing.test.mjs \
            tests/personal-testimonials-prefetch.test.mjs \
            tests/alchemy-soul-spanish-parity.test.mjs \
            tests/alchemy-panel-overflow-diagnostics.test.mjs \
            tests/service-alchemy-one-screen-story.test.mjs \
            tests/alchemy-of-soul-method.test.mjs
          # Core verifies this same production PR SHA with full TypeScript.
          # Manual verification remains standalone and runs the full typecheck.
          if [[ "$GITHUB_EVENT_NAME" != pull_request || "$GITHUB_BASE_REF" != codex/public-book-library ]]; then
            npx --no-install tsc --noEmit
          fi
          npx eslint \
            components/alchemy-soul-landing.tsx \
            components/alchemy-example-report.tsx \
            'app/[locale]/services/alchemy-of-soul/example-report/page.tsx' \
            app/es/services/alchemy-of-soul/example-report/page.tsx
      # Per-PR exact-version binaries; no untrusted cross-PR/browser-version restore.
      - name: Cache exact Playwright Chromium and WebKit browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: hh-qa-playwright-${{ runner.os }}-${{ runner.arch }}-1.63.0-pr-${{ github.event.pull_request.number || github.run_id }}
      # Per-PR immutable compiler and public-photo cache; never trust another PR's assets.
      - name: Cache Alchemy compiler and 18 approved public coaching photos
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            public/images/holistic-house/coaching-ancient
          key: hh-alchemy-next-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'scripts/cache-ancient-coaching-photos.mjs', 'lib/personal-coaching/tradition-visuals.js', 'lib/coaching/public-session-art.js', 'next.config.*') }}-pr-${{ github.event.pull_request.number || github.run_id }}-${{ github.sha }}
          restore-keys: |
            hh-alchemy-next-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'scripts/cache-ancient-coaching-photos.mjs', 'lib/personal-coaching/tradition-visuals.js', 'lib/coaching/public-session-art.js', 'next.config.*') }}-pr-${{ github.event.pull_request.number || github.run_id }}-
      - name: Install browser once for real responsive check
        run: npm install --prefix /tmp/hh-alchemy-qa --no-audit --no-fund playwright@1.63.0
      - name: Build production-mode Next and measure 16 viewports in Chromium and WebKit
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-services-production
          started=$(date +%s)
          # Install real Chromium/WebKit with system dependencies concurrently
          # with the exact production asset generation and Next compilation.
          /tmp/hh-alchemy-qa/node_modules/.bin/playwright install --with-deps chromium webkit > /tmp/hh-alchemy-browser-install.log 2>&1 &
          PW_PID=$!
          SERVER_PID=
          # Inline exit trap avoids shellcheck SC2317 on a trap-only function.
          trap 'if [[ -n "$SERVER_PID" ]]; then kill "$SERVER_PID" 2>/dev/null || true; fi; if [[ -n "$PW_PID" ]]; then kill "$PW_PID" 2>/dev/null || true; fi' EXIT
          node scripts/ci-alchemy-build.mjs > artifacts/public-services-production/alchemy-assets.log 2>&1 || {
            tail -n 90 artifacts/public-services-production/alchemy-assets.log
            exit 1
          }
          assets_done=$(date +%s)
          # Explicit npm run build still runs Next; only redundant *prebuild*
          # lifecycle is skipped after its guarded production assets were made.
          npm_config_ignore_scripts=true npm run build > artifacts/public-services-production/alchemy-build.log 2>&1 || {
            tail -n 90 artifacts/public-services-production/alchemy-build.log
            exit 1
          }
          build_done=$(date +%s)
          if ! wait "$PW_PID"; then
            echo "::error::Playwright browsers or apt dependencies failed" >&2
            tail -n 100 /tmp/hh-alchemy-browser-install.log || true
            exit 1
          fi
          browsers_done=$(date +%s)
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/hh-alchemy-qa-next.log 2>&1 &
          SERVER_PID=$!
          ready=0
          for ((i=1; i<=30; i++)); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Alchemy server exited before readiness" >&2
              break
            fi
            if curl --silent --fail --max-time 3 --output /dev/null http://127.0.0.1:3100/en/services/alchemy-of-soul; then ready=1; break; fi
            echo "Alchemy readiness attempt ${i}/30" >&2
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "::error::Alchemy server not ready; no browser suites were run" >&2
            tail -n 100 /tmp/hh-alchemy-qa-next.log || true
            exit 1
          fi
          browser_start=$(date +%s)
          browser_status=0
          node scripts/verify-alchemy-one-screen.mjs || browser_status=$?
          HH_ALCHEMY_BROWSER=webkit node scripts/verify-alchemy-one-screen.mjs || browser_status=$?
          finished=$(date +%s)
          {
            echo '### Alchemy CI timing: exact-head production build and real browser QA'
            echo '| Stage | Seconds |'
            echo '| --- | ---: |'
            echo "| Required asset preparation and Alchemy source test | $((assets_done - started)) |"
            echo "| Full Next.js production compilation | $((build_done - assets_done)) |"
            echo "| Chromium and WebKit install (overlapped; since start) | $((browsers_done - started)) |"
            echo "| Real 32 browser/viewport checks | $((finished - browser_start)) |"
            echo "| Critical path | $((finished - started)) |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$browser_status"
      - name: Upload non-private mobile geometry summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alchemy-mobile-geometry
          path: artifacts/public-services-production/alchemy-one-screen-geometry*.json
          if-no-files-found: warn
          retention-days: 7
