name: HH Alchemy independent mobile acceptance

# Dedicated gate: unrelated Holistic Support and CRM tests must not mask
# the ten-stage landing's own real layout and browser behaviour.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ['codex/public-book-library']
    paths:
      - '.github/workflows/hh-alchemy-mobile-acceptance.yml'
      - 'scripts/ci-alchemy-impact.mjs'
      - 'tests/ci-alchemy-impact.test.mjs'
      - 'components/alchemy-soul-landing.tsx'
      - 'components/personal-testimonials.tsx'
      - 'components/alchemy-soul-landing.module.css'
      - 'components/alchemy-soul-lead-form.tsx'
      - 'components/alchemy-example-report.tsx'
      - 'components/alchemy-example-report.module.css'
      - 'app/[locale]/services/alchemy-of-soul/**'
      - 'app/es/services/alchemy-of-soul/**'
      - 'scripts/verify-alchemy-one-screen.mjs'
      - 'tests/alchemy-*.test.mjs'
      - 'tests/service-alchemy-one-screen-story.test.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
concurrency:
  group: hh-alchemy-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alchemy-mobile:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CI: 'true'
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      HH_PUBLIC_QA_ORIGIN: http://127.0.0.1:3100
      HH_PLAYWRIGHT_PACKAGE: /tmp/hh-alchemy-qa/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Route exact-head CI-only Alchemy changes to focused source tests
        id: impact
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HH_PR_NUMBER: ${{ github.event.pull_request.number }}
          HH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --test tests/ci-alchemy-impact.test.mjs
          node scripts/ci-alchemy-impact.mjs
      - name: Install project dependencies (including test tools)
        run: npm ci --include=dev --no-audit --no-fund
      - name: Isolated Alchemy contracts
        run: |
          node --test \
            tests/practitioner-homeopathy-canonical-route.test.mjs \
            tests/alchemy-soul-mobile-landing.test.mjs \
            tests/personal-testimonials-prefetch.test.mjs \
            tests/alchemy-soul-spanish-parity.test.mjs \
            tests/alchemy-panel-overflow-diagnostics.test.mjs \
            tests/service-alchemy-one-screen-story.test.mjs \
            tests/alchemy-of-soul-method.test.mjs
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" || "${GITHUB_BASE_REF:-}" != "codex/public-book-library" ]]; then
            npx --no-install tsc --noEmit
          else
            echo 'Full TypeScript delegated to required Core release-ready'
          fi
          npx eslint \
            components/alchemy-soul-landing.tsx \
            components/alchemy-example-report.tsx \
            'app/[locale]/services/alchemy-of-soul/example-report/page.tsx' \
            app/es/services/alchemy-of-soul/example-report/page.tsx
      - name: Install browser once for real responsive check
        if: github.event_name != 'pull_request' || steps.impact.outputs.browser == 'true'
        run: |
          npm install --prefix /tmp/hh-alchemy-qa --no-audit --no-fund playwright@1.63.0
          /tmp/hh-alchemy-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Build production-mode Next and measure current Chromium viewports; WebKit manual QA
        if: github.event_name != 'pull_request' || steps.impact.outputs.browser == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-services-production
          npm run build > artifacts/public-services-production/alchemy-build.log 2>&1 || {
            tail -n 90 artifacts/public-services-production/alchemy-build.log
            exit 1
          }
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/hh-alchemy-qa-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:3100/en/services/alchemy-of-soul >/dev/null; then echo "Alchemy server ready on attempt $i"; ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then tail -n 80 /tmp/hh-alchemy-qa-next.log; exit 1; fi
          browser_status=0
          node scripts/verify-alchemy-one-screen.mjs || browser_status=$?
          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then
            HH_ALCHEMY_BROWSER=webkit node scripts/verify-alchemy-one-screen.mjs || browser_status=$?
          fi
          exit "$browser_status"
      - name: Upload non-private mobile geometry summary
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || steps.impact.outputs.browser == 'true')
        with:
          name: alchemy-mobile-geometry
          path: artifacts/public-services-production/alchemy-one-screen-geometry*.json
          if-no-files-found: warn
          retention-days: 7
