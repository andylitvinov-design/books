name: Prepare Spanish public remedy copy
on:
  push:
    branches: ['chatgpt/spanish-public-site-2026-09-30']
    paths:
      - 'scripts/prepare-spanish-remedies.py'
      - '.github/workflows/prepare-spanish-public-copy.yml'
permissions:
  contents: write
jobs:
  translate-public-copy:
    if: github.ref == 'refs/heads/chatgpt/spanish-public-site-2026-09-30'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/spanish-public-site-2026-09-30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install ctranslate2==4.6.0 sentencepiece==0.2.0 transformers==4.53.3 huggingface_hub==0.34.4 sacremoses==0.1.1
      - name: Translate existing public English remedy fields offline
        run: python scripts/prepare-spanish-remedies.py
      - name: Save only public Spanish translation data on the work branch
        run: |
          test "$(git branch --show-current)" = 'chatgpt/spanish-public-site-2026-09-30'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/spanish-remedies.json
          git diff --cached --quiet || git commit -m 'Prepare source-traceable Spanish remedy translations for review'
          git push origin HEAD:chatgpt/spanish-public-site-2026-09-30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spanish-public-copy-review
          path: |
            data/spanish-remedies.json
            spanish-translation-report.json
          retention-days: 7
