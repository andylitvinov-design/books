name: HH hourly Vercel production batch
on:
  schedule:
    - cron: '13,43 * * * *' # two off-peak chances/hour for GitHub scheduler; still one Vercel build/60m
    - cron: '11 05 * * *' # one daily safe storage prune; NEVER run a production build
  # GitHub can drop schedule ticks under load. Reuse this SAME publisher after a
  # trusted closed-PR cleanup completes; this is NOT another deploy workflow.
  # The existing rolling-60-minute, UTC-hour and exact-SHA guards apply equally.
  workflow_run:
    workflows: ['HH closed PR Actions cleanup']
    types: [completed]
  # Trusted default-branch release; PR source code is never checked out here.
  workflow_dispatch:
    inputs:
      emergency:
        description: 'Emergency Deploy Now (may rebuild the same SHA)'
        type: boolean
        required: false
        default: false
      cleanup_mode:
        description: 'Old Vercel deployments: off, dry-run, or safely delete'
        type: choice
        options: ['off', 'dry-run', 'apply']
        default: 'off'
permissions:
  contents: read
concurrency:
  group: hh-hourly-vercel-production
  cancel-in-progress: false
jobs:
  publish:
    # Off-peak schedule plus a trusted merged-PR completion event tolerate missed
    # GitHub cron ticks; the same Vercel history, rolling-60-minute and UTC-hour
    # guards allow at most one normal paid build.
    # An explicit emergency=true manual action is the sole off-schedule exception.
    # Manual dry-run/apply cleanup remains separate and never starts a build.
    # Exact HEAD, last-60-minutes and UTC-hour guards remain unchanged.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '13,43 * * * *' &&
       vars.HH_VERCEL_HOURLY_ENABLED == 'true') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'HH closed PR Actions cleanup' &&
       github.event.workflow_run.event == 'pull_request_target' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       vars.HH_VERCEL_HOURLY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.emergency == true && inputs.cleanup_mode == 'off')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check prerequisites and last production SHA
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.HH_VERCEL_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EMERGENCY: ${{ inputs.emergency }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo 'Hourly batch not armed: HH_VERCEL_RELEASE_TOKEN secret is required.'
            exit 1
          fi
          head_sha="$(git ls-remote https://github.com/andylitvinov-design/books.git refs/heads/codex/public-book-library | cut -f1)"
          [[ "$head_sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          # Vercel v6 can expose state rather than readyState; both must dedupe.
          # Keep one bounded GET for the latest 100 production deployments.
          if [[ "$EMERGENCY" != "true" ]]; then
            response="$(curl -fsS --retry 2 --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" 'https://api.vercel.com/v6/deployments?teamId=team_OSf690d0nxRHWVMXCElA8i95&projectId=prj_4jAwcx6lrKyUKZ3R9vgC5xwwyC0b&target=production&limit=100')"
            if ! printf '%s' "$response" | jq -e '.deployments | type == "array"' >/dev/null; then
              echo 'Unable to verify current Vercel production deployments; refusing speculative build.'
              exit 1
            fi
            # Never schedule a second production build in a rolling 60-minute window.
            # This is defense-in-depth against manual non-emergency dispatches,
            # GitHub cron delays, and already-existing Vercel production builds.
            # Emergency Deploy Now deliberately remains outside this limit.
            cutoff_ms="$(( $(date -u +%s) * 1000 - 3600000 ))"
            if printf '%s' "$response" | jq -e --argjson cutoff "$cutoff_ms" \
              '[.deployments[] | select((.created // .createdAt // 0) >= $cutoff and .target == "production" and ((.readyState // .state) != "BLOCKED"))] | length > 0' >/dev/null; then
              echo 'Production deployment created within the last 60 minutes; skip routine build.'
              exit 0
            fi
            if printf '%s' "$response" | jq -e --arg sha "$head_sha" '[.deployments[] | (.readyState // .state) as $status | select(.meta.githubCommitSha == $sha and ($status == "READY" or $status == "BUILDING" or $status == "QUEUED" or $status == "INITIALIZING"))] | length > 0' >/dev/null; then
              echo "Already deployed or in progress: $head_sha"
              exit 0
            fi
            # One NORMAL production request per UTC hour, across changing SHAs.
            # Fail closed on missing Vercel timestamps; emergency bypass is separate.
            if ! printf '%s' "$response" | jq -e '[.deployments[] | ((.created // .createdAt) | type == "number")] | all' >/dev/null; then
              echo 'Vercel production timestamps unverified; refusing speculative hourly release.'
              exit 1
            fi
            hour_start_ms="$(( ($(date -u +%s) / 3600) * 3600000 ))"
            if printf '%s' "$response" | jq -e --argjson hour_start_ms "$hour_start_ms" '[.deployments[] | select(.target == "production" and ((.created // .createdAt) >= $hour_start_ms))] | length > 0' >/dev/null; then
              echo 'Production already requested this UTC hour; defer pending changes to next hourly run.'
              exit 0
            fi
          # Prove that the whole LIVE-to-HEAD delta is CI-only before skipping.
          # Never use the last READY build alone: a rollback may serve an older SHA.
          if alias_json="$(curl -fsS --max-time 8 -H "Authorization: Bearer $VERCEL_TOKEN" 'https://api.vercel.com/v13/deployments/holistichouse.vercel.app?teamId=team_OSf690d0nxRHWVMXCElA8i95')" &&
             live_record="$(jq -ce 'select(.readyState == "READY" and .target == "production" and (.alias | type == "array" and index("holistichouse.vercel.app") != null)) | {id, sha: .meta.githubCommitSha} | select((.id | test("^dpl_[A-Za-z0-9]+$")) and (.sha | test("^[a-f0-9]{40}$")))' <<< "$alias_json" 2>/dev/null)" &&
             jq -e --argjson live "$live_record" '.deployments | any((.uid // .id) == $live.id and .target == "production" and (.readyState // .state) == "READY" and .meta.githubCommitSha == $live.sha)' <<< "$response" >/dev/null &&
             live_sha="$(jq -er '.sha' <<< "$live_record")" &&
             compare_json="$(curl -fsS --max-time 8 -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/andylitvinov-design/books/compare/$live_sha...$head_sha?per_page=100&page=1")" &&
             jq -e --arg live "$live_sha" --arg head "$head_sha" '
               .status == "ahead" and .behind_by == 0 and
               .base_commit.sha == $live and .merge_base_commit.sha == $live and
               (.ahead_by | type == "number" and floor == . and . >= 1 and . <= 100) and
               .total_commits == .ahead_by and (.commits | type == "array") and
               (.commits | length) == .ahead_by and .commits[-1].sha == $head and
               (.files | type == "array" and length > 0 and length < 300 and all(
                 (.status == "modified" or .status == "added" or .status == "removed") and
                 .previous_filename == null and
                 (.filename | type == "string" and test("^\\.github/workflows/[A-Za-z0-9_.-]+\\.ya?ml$"))))
             ' <<< "$compare_json" >/dev/null 2>&1; then
            echo 'Skip routine Vercel build: only GitHub workflow YAML changed from current LIVE.'
            exit 0
          fi
          # Unavailable, ambiguous or mixed delta: fall through to existing release.
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo 'run=true' >> "$GITHUB_OUTPUT"
      - name: Deploy exact production SHA via existing Vercel Git connection
        if: steps.gate.outputs.run == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.HH_VERCEL_RELEASE_TOKEN }}
          EXPECTED_SHA: ${{ steps.gate.outputs.sha }}
          EMERGENCY: ${{ inputs.emergency }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote https://github.com/andylitvinov-design/books.git refs/heads/codex/public-book-library | cut -f1)"
          [[ "$latest" == "$EXPECTED_SHA" ]] || { echo 'Production advanced; next hourly run will publish latest SHA.'; exit 0; }
          # Restore the GitSource payload from the last successful hourly run.
          # Custom metadata preceded repeated HTTP 400 responses; keep its
          # diagnostic context in the GitHub Actions run rather than the POST.
          payload="$(jq -cn --arg sha "$EXPECTED_SHA" '{name:"codex-public-book-library",project:"prj_4jAwcx6lrKyUKZ3R9vgC5xwwyC0b",target:"production",gitSource:{type:"github",repoId:1229814825,ref:"codex/public-book-library",sha:$sha}}')"
          url='https://api.vercel.com/v13/deployments?teamId=team_OSf690d0nxRHWVMXCElA8i95'
          if [[ "$EMERGENCY" == "true" ]]; then url="$url&forceNew=1"; fi
          # POST is NOT retried: timeout may mean Vercel accepted it.
          # Store the response privately and log only bounded error code/status.
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl -sS --max-time 30 -o "$response_file" -w '%{http_code}' -X POST "$url" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' --data "$payload")" || {
              echo 'Vercel transport failure; outcome unknown. No automatic retry.'
              exit 1
            }
          if [[ "$http_status" != "200" && "$http_status" != "201" ]]; then
            error_code="$(jq -r '.error.code // "unavailable"' "$response_file" 2>/dev/null || true)"
            [[ "$error_code" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,63}$ ]] || error_code="unavailable"
            # HTTP 400 from Vercel is not actionable when its exact schema
            # field is hidden. Emit ONLY a strict field allowlist, never raw
            # provider messages, response JSON, tokens, or arbitrary strings.
            error_field="$(jq -r '(.error.errors // .error.details // .error.validationErrors // []) | if type == "array" then (.[0].path // .[0].field // "unavailable") else "unavailable" end | if type == "array" then join(".") else . end' "$response_file" 2>/dev/null || true)"
            [[ "$error_field" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,79}$ ]] || error_field="unavailable"
            case "$error_field" in gitSource|gitSource.*|name|project|target) ;; *) error_field="unavailable" ;; esac
            echo "Vercel rejected hourly release: HTTP $http_status, code=$error_code, field=$error_field."
            # Even a 400 could accompany a concurrent Git-backed deployment.
            # Fail closed without a second POST: routine next-hour gating uses
            # authoritative Vercel production history before any new build.
            exit 1
          fi
          jq -e '.id | strings | startswith("dpl_")' "$response_file" >/dev/null ||
            { echo 'Vercel did not return a deployment ID'; exit 1; }
          echo 'One exact-SHA production build requested; READY/LIVE must be checked separately.'
  cleanup:
    # Daily bounded cleanup uses the already validated owner cleanup code.
    # Dedicated daily cron NEVER activates the publish job or a paid Vercel build.
    # Preserve LIVE, active aliases, ten READY rollbacks, and ten newest deployments.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.cleanup_mode != 'off') ||
      (github.event_name == 'schedule' && github.event.schedule == '11 05 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/bootstrap-books
          persist-credentials: false
      - name: Inspect and optionally prune old unaliased deployments
        env:
          HH_VERCEL_RELEASE_TOKEN: ${{ secrets.HH_VERCEL_RELEASE_TOKEN }}
          CLEANUP_MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.cleanup_mode }}
        run: node scripts/ci-vercel-deployment-prune.mjs "$CLEANUP_MODE"
