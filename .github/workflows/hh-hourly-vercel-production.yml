name: HH hourly Vercel production batch
on:
  schedule:
    - cron: '13,43 * * * *' # off-peak wakeups only; Toronto release window and rolling 90m cap
    - cron: '11 05 * * *' # one daily safe storage prune; NEVER run a production build
  # GitHub can drop schedule ticks under load. Reuse this SAME publisher after a
  # trusted closed-PR cleanup completes; this is NOT another deploy workflow.
  # The existing rolling-90-minute, Toronto window and UTC-hour and exact-SHA guards apply equally.
  workflow_run:
    workflows: ['HH closed PR Actions cleanup']
    types: [completed]
  # Trusted default-branch release; PR source code is never checked out here.
  workflow_dispatch:
    inputs:
      prebuilt_test:
        description: 'Build-only pilot on protected production HEAD (no Vercel deployment)'
        type: boolean
        required: false
        default: false
      emergency:
        description: 'Emergency Deploy Now (may rebuild the same SHA)'
        type: boolean
        required: false
        default: false
      cleanup_mode:
        description: 'Old Vercel deployments: off, dry-run, or safely delete'
        type: choice
        options: ['off', 'dry-run', 'apply']
        default: 'off'
permissions:
  contents: read
concurrency:
  group: hh-hourly-vercel-production
  cancel-in-progress: false
jobs:
  publish:
    # Off-peak schedule plus a trusted merged-PR completion event tolerate missed
    # GitHub cron ticks; the same Vercel history, rolling-90-minute, Toronto window and UTC-hour
    # guards allow at most one normal paid build.
    # Explicit emergency=true bypasses cadence only, NEVER the Toronto night window.
    # Manual dry-run/apply cleanup remains separate and never starts a build.
    # Exact HEAD, last-90-minutes and UTC-hour guards apply.
    if: >-
      github.ref == 'refs/heads/codex/bootstrap-books' && (
      (github.event_name == 'schedule' && github.event.schedule == '13,43 * * * *' &&
       vars.HH_VERCEL_HOURLY_ENABLED == 'true') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'HH closed PR Actions cleanup' &&
       github.event.workflow_run.event == 'pull_request_target' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       vars.HH_VERCEL_HOURLY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.emergency == true && inputs.prebuilt_test != true && inputs.cleanup_mode == 'off') ||
      (github.event_name == 'workflow_dispatch' && inputs.prebuilt_test == true &&
       inputs.emergency != true && inputs.cleanup_mode == 'off'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check prerequisites and last production SHA
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.HH_VERCEL_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EMERGENCY: ${{ inputs.emergency }}
          PREBUILT_TEST: ${{ inputs.prebuilt_test }}
        shell: bash
        run: |
          set -euo pipefail
          # Toronto local wall clock (DST-aware), checked for EVERY event and emergency.
          local_hhmm="$(TZ=America/Toronto date +%H%M)"
          [[ "$local_hhmm" =~ ^[0-9]{4}$ ]] || exit 1
          if (( 10#$local_hhmm >= 100 && 10#$local_hhmm < 700 )); then
            echo 'Toronto night publication freeze 01:00-07:00; keep queued changes for daylight.'
            exit 0
          fi
          # No new builds in the preceding hour either: Vercel auto-assigns READY builds.
          # This buffer reduces (but cannot eliminate) the risk of a build finishing after 01:00.
          if (( 10#$local_hhmm < 100 )); then
            echo 'Toronto pre-night safety buffer 00:00-01:00; defer new build.'
            exit 0
          fi
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo 'Hourly batch not armed: HH_VERCEL_RELEASE_TOKEN secret is required.'
            exit 1
          fi
          head_sha="$(git ls-remote https://github.com/andylitvinov-design/books.git refs/heads/codex/public-book-library | cut -f1)"
          [[ "$head_sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          # Vercel v6 can expose state rather than readyState; both must dedupe.
          # Keep one bounded GET for the latest 100 production deployments.
          if [[ "$EMERGENCY" != "true" && "$PREBUILT_TEST" != "true" ]]; then
            response="$(curl -fsS --retry 2 --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" 'https://api.vercel.com/v6/deployments?teamId=team_OSf690d0nxRHWVMXCElA8i95&projectId=prj_4jAwcx6lrKyUKZ3R9vgC5xwwyC0b&target=production&limit=100')"
            if ! printf '%s' "$response" | jq -e '.deployments | type == "array"' >/dev/null; then
              echo 'Unable to verify current Vercel production deployments; refusing speculative build.'
              exit 1
            fi
            if ! printf '%s' "$response" | jq -e '[.deployments[] | ((.created // .createdAt) | type == "number")] | all' >/dev/null; then
              echo 'Vercel production timestamps unverified; refusing speculative hourly release.'
              exit 1
            fi
            # Never schedule a second production build in a rolling 90-minute window.
            # This is defense-in-depth against manual non-emergency dispatches,
            # GitHub cron delays, and already-existing Vercel production builds.
            # Emergency Deploy Now deliberately remains outside this limit.
            cutoff_ms="$(( $(date -u +%s) * 1000 - 5400000 ))"
            if printf '%s' "$response" | jq -e --argjson cutoff "$cutoff_ms" \
              '[.deployments[] | select((.created // .createdAt // 0) >= $cutoff and .target == "production")] | length > 0' >/dev/null; then
              echo 'Production deployment created within the last 90 minutes; skip routine build.'
              exit 0
            fi
            if printf '%s' "$response" | jq -e '[.deployments[] | select(.target == "production" and ((.readyState // .state) == "BUILDING" or (.readyState // .state) == "QUEUED" or (.readyState // .state) == "INITIALIZING"))] | length > 0' >/dev/null; then
              echo 'Production build still in progress; do not overlap builds.'
              exit 0
            fi
            if printf '%s' "$response" | jq -e --arg sha "$head_sha" '[.deployments[] | (.readyState // .state) as $status | select(.meta.githubCommitSha == $sha and ($status == "READY" or $status == "BUILDING" or $status == "QUEUED" or $status == "INITIALIZING"))] | length > 0' >/dev/null; then
              echo "Already deployed or in progress: $head_sha"
              exit 0
            fi
            # One NORMAL production request per UTC hour, across changing SHAs.
            # Fail closed on missing Vercel timestamps; emergency bypass is separate.
            hour_start_ms="$(( ($(date -u +%s) / 3600) * 3600000 ))"
            if printf '%s' "$response" | jq -e --argjson hour_start_ms "$hour_start_ms" '[.deployments[] | select(.target == "production" and ((.created // .createdAt) >= $hour_start_ms))] | length > 0' >/dev/null; then
              echo 'Production already requested this UTC hour; defer pending changes to next eligible run.'
              exit 0
            fi
          # Prove that the whole LIVE-to-HEAD delta is CI-only before skipping.
          # Never use the last READY build alone: a rollback may serve an older SHA.
          if alias_json="$(curl -fsS --max-time 8 -H "Authorization: Bearer $VERCEL_TOKEN" 'https://api.vercel.com/v13/deployments/holistichouse.vercel.app?teamId=team_OSf690d0nxRHWVMXCElA8i95')" &&
             live_record="$(jq -ce 'select(.readyState == "READY" and .target == "production" and (.alias | type == "array" and index("holistichouse.vercel.app") != null)) | {id, sha: .meta.githubCommitSha} | select((.id | test("^dpl_[A-Za-z0-9]+$")) and (.sha | test("^[a-f0-9]{40}$")))' <<< "$alias_json" 2>/dev/null)" &&
             jq -e --argjson live "$live_record" '.deployments | any((.uid // .id) == $live.id and .target == "production" and (.readyState // .state) == "READY" and .meta.githubCommitSha == $live.sha)' <<< "$response" >/dev/null &&
             live_sha="$(jq -er '.sha' <<< "$live_record")" &&
             compare_json="$(curl -fsS --max-time 8 -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/andylitvinov-design/books/compare/$live_sha...$head_sha?per_page=100&page=1")" &&
             jq -e --arg live "$live_sha" --arg head "$head_sha" '
               .status == "ahead" and .behind_by == 0 and
               .base_commit.sha == $live and .merge_base_commit.sha == $live and
               (.ahead_by | type == "number" and floor == . and . >= 1 and . <= 100) and
               .total_commits == .ahead_by and (.commits | type == "array") and
               (.commits | length) == .ahead_by and .commits[-1].sha == $head and
               (.files | type == "array" and length > 0 and length < 300 and all(
                 (.status == "modified" or .status == "added" or .status == "removed") and
                 .previous_filename == null and
                 (.filename | type == "string") and
                 ((.filename | test("^\\.github/workflows/[A-Za-z0-9_.-]+\\.ya?ml$")) or
                  (.status == "modified" and (.filename == "tests/ci-workflow-globs.test.mjs" or
                    .filename == "tests/ci-heavy-impact.test.mjs" or
                    .filename == "tests/pr-fast-lane.test.mjs" or
                    .filename == "scripts/ci-specialist-aggregate.mjs" or
                    .filename == "tests/ci-specialist-wait.test.mjs")))))
             ' <<< "$compare_json" >/dev/null 2>&1; then
            echo 'Skip routine Vercel build: only GitHub workflow YAML and explicitly reviewed CI control/test files changed from current LIVE.'
            exit 0
          fi
          # Unavailable, ambiguous or mixed delta: fall through to existing release.
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo 'run=true' >> "$GITHUB_OUTPUT"
      # The pilot performs no Vercel upload or artifact storage. Enable routine
      # prebuilt only after the protected pilot succeeds and LIVE identity/status
      # compatibility has been verified. The emergency Git-backed path stays intact.
      - name: Checkout protected production snapshot
        if: steps.gate.outputs.run == 'true' && (inputs.prebuilt_test == true || (vars.HH_VERCEL_PREBUILT_ENABLED == 'true' && inputs.emergency != true))
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.gate.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Configure Node.js matching Vercel
        if: steps.gate.outputs.run == 'true' && (inputs.prebuilt_test == true || (vars.HH_VERCEL_PREBUILT_ENABLED == 'true' && inputs.emergency != true))
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned Vercel CLI
        if: steps.gate.outputs.run == 'true' && (inputs.prebuilt_test == true || (vars.HH_VERCEL_PREBUILT_ENABLED == 'true' && inputs.emergency != true))
        run: npm install --global vercel@66.6.0
      - name: Pull existing production settings (no new project)
        if: steps.gate.outputs.run == 'true' && (inputs.prebuilt_test == true || (vars.HH_VERCEL_PREBUILT_ENABLED == 'true' && inputs.emergency != true))
        env:
          VERCEL_TOKEN: ${{ secrets.HH_VERCEL_RELEASE_TOKEN }}
          VERCEL_ORG_ID: team_OSf690d0nxRHWVMXCElA8i95
          VERCEL_PROJECT_ID: prj_4jAwcx6lrKyUKZ3R9vgC5xwwyC0b
          EXPECTED_SHA: ${{ steps.gate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          # Verify this exact snapshot is still on the protected production branch
          # before downloading any production credentials onto a public-repo runner.
          gh api 'repos/andylitvinov-design/books/branches/codex%2Fpublic-book-library' --jq '.protected' | grep -Fx true
          gh api "repos/andylitvinov-design/books/compare/$EXPECTED_SHA...codex%2Fpublic-book-library" --jq '.status' | grep -Ex 'identical|ahead'
          vercel pull --yes --environment=production
          jq -e --arg p "$VERCEL_PROJECT_ID" --arg o "$VERCEL_ORG_ID" '.projectId == $p and .orgId == $o' .vercel/project.json >/dev/null
      - name: Build production locally on GitHub (no Vercel remote build)
        if: steps.gate.outputs.run == 'true' && (inputs.prebuilt_test == true || (vars.HH_VERCEL_PREBUILT_ENABLED == 'true' && inputs.emergency != true))
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ steps.gate.outputs.sha }}
          VERCEL_GIT_COMMIT_REF: codex/public-book-library
          VERCEL_GIT_REPO_OWNER: andylitvinov-design
          VERCEL_GIT_REPO_SLUG: books
          VERCEL_PROJECT_PRODUCTION_URL: holistichouse.vercel.app
        run: |
          set -euo pipefail
          vercel build --prod
          test -s .vercel/output/config.json
          jq -e '.version == 3' .vercel/output/config.json >/dev/null
          echo 'Production build output created locally; no artifact was uploaded.'
      - name: Stage prebuilt production and smoke test before promotion
        if: steps.gate.outputs.run == 'true' && vars.HH_VERCEL_PREBUILT_ENABLED == 'true' && inputs.prebuilt_test != true && inputs.emergency != true
        env:
          VERCEL_TOKEN: ${{ secrets.HH_VERCEL_RELEASE_TOKEN }}
          EXPECTED_SHA: ${{ steps.gate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # No remote-build fallback, no automatic second deployment, and no
          # upload of pulled env files. Stage the same prebuilt production output.
          # Toronto local wall clock (DST-aware), checked for EVERY event and emergency.
          local_hhmm="$(TZ=America/Toronto date +%H%M)"
          [[ "$local_hhmm" =~ ^[0-9]{4}$ ]] || exit 1
          if (( 10#$local_hhmm >= 100 && 10#$local_hhmm < 700 )); then
            echo 'Toronto night publication freeze 01:00-07:00; keep queued changes for daylight.'
            exit 1
          fi
          # No new builds in the preceding hour either: Vercel auto-assigns READY builds.
          # This buffer reduces (but cannot eliminate) the risk of a build finishing after 01:00.
          if (( 10#$local_hhmm < 100 )); then
            echo 'Toronto pre-night safety buffer 00:00-01:00; defer new build.'
            exit 1
          fi
          # Recheck protected HEAD and the rolling limit after the local build, before any upload.
          latest="$(git ls-remote https://github.com/andylitvinov-design/books.git refs/heads/codex/public-book-library | cut -f1)"
          [[ "$latest" == "$EXPECTED_SHA" ]] || { echo 'Protected production advanced during build; defer.'; exit 0; }
          response="$(curl -fsS --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" 'https://api.vercel.com/v6/deployments?teamId=team_OSf690d0nxRHWVMXCElA8i95&projectId=prj_4jAwcx6lrKyUKZ3R9vgC5xwwyC0b&target=production&limit=100')"
          jq -e '.deployments | type == "array" and all((.created // .createdAt) | type == "number")' <<< "$response" >/dev/null
          cutoff_ms="$(( $(date -u +%s) * 1000 - 5400000 ))"
          if jq -e --argjson cutoff "$cutoff_ms" '[.deployments[] | select(.target == "production" and (((.created // .createdAt) >= $cutoff) or ((.readyState // .state) == "BUILDING" or (.readyState // .state) == "QUEUED" or (.readyState // .state) == "INITIALIZING")))] | length > 0' <<< "$response" >/dev/null; then
            echo 'Another production request occurred during local build; defer.'
            exit 0
          fi
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain --yes --meta "githubCommitSha=$EXPECTED_SHA" --meta githubCommitRef=codex/public-book-library --meta githubOrg=andylitvinov-design --meta githubRepo=books)"
          [[ "$deployment_url" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]
          deployment_host="${deployment_url#https://}"
          suffix='?teamId=team_OSf690d0nxRHWVMXCElA8i95'
          deployment="$(curl -fsS --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$deployment_host$suffix")"
          deployment_id="$(jq -er --arg sha "$EXPECTED_SHA" 'select(.projectId == "prj_4jAwcx6lrKyUKZ3R9vgC5xwwyC0b" and .target == "production" and .readyState == "READY" and .meta.githubCommitSha == $sha) | .id | select(test("^dpl_[A-Za-z0-9]+$"))' <<< "$deployment")"
          # Protected deployment smoke: verify HTML and the application-specific
          # release identity without publishing response bodies in public logs.
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          vercel curl / --deployment "$deployment_url" --fail --silent --show-error --max-time 30 -o "$tmp/home"
          grep -Eiq '<html([[:space:]>])' "$tmp/home"
          vercel curl /api/public/release-evidence --deployment "$deployment_url" --fail --silent --show-error --max-time 30 -o "$tmp/evidence"
          jq -e --arg sha "$EXPECTED_SHA" --arg id "$deployment_id" '.available == true and .sha == $sha and .deployment_id == $id and .project_id == "prj_4jAwcx6lrKyUKZ3R9vgC5xwwyC0b" and .environment == "production" and .branch == "codex/public-book-library" and .repo == "andylitvinov-design/books"' "$tmp/evidence" >/dev/null
          # Existing independent verifier requires a real provider GitHub status.
          # Never manufacture that status. If prebuilt is incompatible, stop before LIVE.
          gh api "repos/andylitvinov-design/books/commits/$EXPECTED_SHA/status?per_page=100" | jq -e --arg url "https://vercel.com/super10/codex-public-book-library/${deployment_id#dpl_}" '.statuses | any((.context == "Vercel" or .context == "Vercel – codex-public-book-library") and .state == "success" and .target_url == $url)' >/dev/null
          # Toronto local wall clock (DST-aware), checked for EVERY event and emergency.
          local_hhmm="$(TZ=America/Toronto date +%H%M)"
          [[ "$local_hhmm" =~ ^[0-9]{4}$ ]] || exit 1
          if (( 10#$local_hhmm >= 100 && 10#$local_hhmm < 700 )); then
            echo 'Toronto night publication freeze 01:00-07:00; keep queued changes for daylight.'
            exit 1
          fi
          # No new builds in the preceding hour either: Vercel auto-assigns READY builds.
          # This buffer reduces (but cannot eliminate) the risk of a build finishing after 01:00.
          if (( 10#$local_hhmm < 100 )); then
            echo 'Toronto pre-night safety buffer 00:00-01:00; defer new build.'
            exit 1
          fi
          latest="$(git ls-remote https://github.com/andylitvinov-design/books.git refs/heads/codex/public-book-library | cut -f1)"
          [[ "$latest" == "$EXPECTED_SHA" ]] || { echo 'Protected production advanced; leave staged deployment unassigned.'; exit 1; }
          vercel promote "$deployment_url" --yes
          live="$(curl -fsS --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v4/aliases/holistichouse.vercel.app$suffix")"
          jq -e --arg id "$deployment_id" '(.deploymentId // .deployment.id) == $id and .projectId == "prj_4jAwcx6lrKyUKZ3R9vgC5xwwyC0b"' <<< "$live" >/dev/null
          curl -fsS --max-time 20 https://holistichouse.vercel.app/api/public/release-evidence | jq -e --arg sha "$EXPECTED_SHA" --arg id "$deployment_id" '.available == true and .sha == $sha and .deployment_id == $id' >/dev/null
          echo "Prebuilt production verified: $deployment_id $EXPECTED_SHA"
      - name: Remove pulled production settings
        if: always() && steps.gate.outputs.run == 'true' && (inputs.prebuilt_test == true || (vars.HH_VERCEL_PREBUILT_ENABLED == 'true' && inputs.emergency != true))
        run: rm -rf .vercel
      - name: Deploy exact production SHA via existing Vercel Git connection
        if: steps.gate.outputs.run == 'true' && inputs.prebuilt_test != true && (vars.HH_VERCEL_PREBUILT_ENABLED != 'true' || inputs.emergency == true)
        env:
          VERCEL_TOKEN: ${{ secrets.HH_VERCEL_RELEASE_TOKEN }}
          EXPECTED_SHA: ${{ steps.gate.outputs.sha }}
          EMERGENCY: ${{ inputs.emergency }}
        shell: bash
        run: |
          set -euo pipefail
          # Toronto local wall clock (DST-aware), checked for EVERY event and emergency.
          local_hhmm="$(TZ=America/Toronto date +%H%M)"
          [[ "$local_hhmm" =~ ^[0-9]{4}$ ]] || exit 1
          if (( 10#$local_hhmm >= 100 && 10#$local_hhmm < 700 )); then
            echo 'Toronto night publication freeze 01:00-07:00; keep queued changes for daylight.'
            exit 0
          fi
          # No new builds in the preceding hour either: Vercel auto-assigns READY builds.
          # This buffer reduces (but cannot eliminate) the risk of a build finishing after 01:00.
          if (( 10#$local_hhmm < 100 )); then
            echo 'Toronto pre-night safety buffer 00:00-01:00; defer new build.'
            exit 0
          fi
          latest="$(git ls-remote https://github.com/andylitvinov-design/books.git refs/heads/codex/public-book-library | cut -f1)"
          [[ "$latest" == "$EXPECTED_SHA" ]] || { echo 'Production advanced; next eligible run will publish latest SHA.'; exit 0; }
          # Restore the GitSource payload from the last successful hourly run.
          # Custom metadata preceded repeated HTTP 400 responses; keep its
          # diagnostic context in the GitHub Actions run rather than the POST.
          payload="$(jq -cn --arg sha "$EXPECTED_SHA" '{name:"codex-public-book-library",project:"prj_4jAwcx6lrKyUKZ3R9vgC5xwwyC0b",target:"production",gitSource:{type:"github",repoId:1229814825,ref:"codex/public-book-library",sha:$sha}}')"
          url='https://api.vercel.com/v13/deployments?teamId=team_OSf690d0nxRHWVMXCElA8i95'
          if [[ "$EMERGENCY" == "true" ]]; then url="$url&forceNew=1"; fi
          # POST is NOT retried: timeout may mean Vercel accepted it.
          # Store the response privately and log only bounded error code/status.
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl -sS --max-time 30 -o "$response_file" -w '%{http_code}' -X POST "$url" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' --data "$payload")" || {
              echo 'Vercel transport failure; outcome unknown. No automatic retry.'
              exit 1
            }
          if [[ "$http_status" != "200" && "$http_status" != "201" ]]; then
            error_code="$(jq -r '.error.code // "unavailable"' "$response_file" 2>/dev/null || true)"
            [[ "$error_code" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,63}$ ]] || error_code="unavailable"
            # HTTP 400 from Vercel is not actionable when its exact schema
            # field is hidden. Emit ONLY a strict field allowlist, never raw
            # provider messages, response JSON, tokens, or arbitrary strings.
            error_field="$(jq -r '(.error.errors // .error.details // .error.validationErrors // []) | if type == "array" then (.[0].path // .[0].field // "unavailable") else "unavailable" end | if type == "array" then join(".") else . end' "$response_file" 2>/dev/null || true)"
            [[ "$error_field" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,79}$ ]] || error_field="unavailable"
            case "$error_field" in gitSource|gitSource.*|name|project|target) ;; *) error_field="unavailable" ;; esac
            echo "Vercel rejected hourly release: HTTP $http_status, code=$error_code, field=$error_field."
            # Even a 400 could accompany a concurrent Git-backed deployment.
            # Fail closed without a second POST: routine next-hour gating uses
            # authoritative Vercel production history before any new build.
            exit 1
          fi
          jq -e '.id | strings | startswith("dpl_")' "$response_file" >/dev/null ||
            { echo 'Vercel did not return a deployment ID'; exit 1; }
          echo 'One exact-SHA production build requested; READY/LIVE must be checked separately.'
  cleanup:
    # Daily bounded cleanup uses the already validated owner cleanup code.
    # Dedicated daily cron NEVER activates the publish job or a paid Vercel build.
    # Preserve LIVE, active aliases, six newest READY versions (LIVE + five rollbacks), and six newest deployments.
    if: >-
      github.ref == 'refs/heads/codex/bootstrap-books' && ((github.event_name == 'workflow_dispatch' && inputs.cleanup_mode != 'off' && inputs.prebuilt_test != true && inputs.emergency != true) ||
      (github.event_name == 'schedule' && github.event.schedule == '11 05 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/bootstrap-books
          persist-credentials: false
      - name: Inspect and optionally prune old unaliased deployments
        env:
          HH_VERCEL_RELEASE_TOKEN: ${{ secrets.HH_VERCEL_RELEASE_TOKEN }}
          CLEANUP_MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.cleanup_mode }}
        run: node scripts/ci-vercel-deployment-prune.mjs "$CLEANUP_MODE"
