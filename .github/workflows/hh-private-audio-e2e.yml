name: Holistic House private audio synthetic end-to-end
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ['codex/public-book-library']
    paths:
      - 'components/session-audio-recorder.jsx'
      - 'components/session-photo-uploader.jsx'
      - 'components/report-video-materials-editor.jsx'
      - 'lib/clients/phone-audio-file.js'
      - 'lib/clients/recording-upload.js'
      - 'components/session-recording-review.jsx'
      - 'tests/client-session-take-selection.test.mjs'
      - 'lib/clients/owner-audio-upload.js'
      - 'lib/clients/owner-photo-upload.js'
      - 'lib/clients/session-delivery-*.js'
      - 'app/api/admin/clients/**/media/**'
      - 'app/api/client-session-viewer/**'
      - 'tests/client-session-audio-synthetic-e2e.test.mjs'
      - 'tests/client-session-photos.test.mjs'
      - 'tests/client-session-owner-photo-upload.test.mjs'
      - 'tests/client-session-owner-audio-upload.test.mjs'
      - 'tests/client-session-external-video.test.mjs'
      - 'tests/session-delivery-security.test.mjs'
      - 'tests/session-media-sdk.test.mjs'
      - 'tests/fixture-module-body.test.mjs'
      - 'tests/helpers/fixture-module-body.mjs'
      - 'tests/fixtures/synthetic-440hz-voice.m4a.base64'
      - 'lib/prescriptions/admin*.js'
      - 'lib/prescriptions/store.js'
      - 'lib/app/admin-auth-refresh.js'
      - 'lib/app/session.js'
      - 'lib/app/config.js'
      - 'lib/app/repository.js'
      - 'middleware.ts'
      - 'app/api/app/**'
      - 'app/admin/api/recorder-auth/**'
      - 'tests/admin-*.test.mjs'
      - 'tests/practitioner-bridge.test.mjs'
      - 'tests/client-session-recorder-auth.test.mjs'
      - 'tests/cabinet-v2-ux.test.mjs'
      - 'tests/prescription-access.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/hh-private-audio-e2e.yml'
  push:
    branches: ['codex/public-book-library']
    paths:
      - 'components/session-audio-recorder.jsx'
      - 'components/session-photo-uploader.jsx'
      - 'components/report-video-materials-editor.jsx'
      - 'lib/clients/phone-audio-file.js'
      - 'lib/clients/recording-upload.js'
      - 'components/session-recording-review.jsx'
      - 'tests/client-session-take-selection.test.mjs'
      - 'lib/clients/owner-audio-upload.js'
      - 'lib/clients/owner-photo-upload.js'
      - 'lib/clients/session-delivery-*.js'
      - 'app/api/admin/clients/**/media/**'
      - 'app/api/client-session-viewer/**'
      - 'tests/client-session-audio-synthetic-e2e.test.mjs'
      - 'tests/client-session-photos.test.mjs'
      - 'tests/client-session-owner-photo-upload.test.mjs'
      - 'tests/client-session-owner-audio-upload.test.mjs'
      - 'tests/client-session-external-video.test.mjs'
      - 'tests/session-delivery-security.test.mjs'
      - 'tests/session-media-sdk.test.mjs'
      - 'tests/fixture-module-body.test.mjs'
      - 'tests/helpers/fixture-module-body.mjs'
      - 'tests/fixtures/synthetic-440hz-voice.m4a.base64'
      - 'lib/prescriptions/admin*.js'
      - 'lib/prescriptions/store.js'
      - 'lib/app/admin-auth-refresh.js'
      - 'lib/app/session.js'
      - 'lib/app/config.js'
      - 'lib/app/repository.js'
      - 'middleware.ts'
      - 'app/api/app/**'
      - 'app/admin/api/recorder-auth/**'
      - 'tests/admin-*.test.mjs'
      - 'tests/practitioner-bridge.test.mjs'
      - 'tests/client-session-recorder-auth.test.mjs'
      - 'tests/cabinet-v2-ux.test.mjs'
      - 'tests/prescription-access.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/hh-private-audio-e2e.yml'
concurrency:
  group: hh-private-audio-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  private-audio:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Expiring admin sessions and pinned SDK refresh regressions
        run: node --conditions=react-server --test tests/admin-session-lifecycle.test.mjs tests/admin-auth-refresh.test.mjs tests/admin-login-security.test.mjs tests/practitioner-bridge.test.mjs tests/client-session-recorder-auth.test.mjs tests/cabinet-v2-ux.test.mjs tests/prescription-access.test.mjs
      - name: Lint admin authorization and refresh boundaries
        run: npx --no-install eslint middleware.ts lib/app/admin-auth-refresh.js lib/prescriptions/admin.js lib/prescriptions/admin-session.js 'app/api/app/[...path]/route.js' app/admin/api/recorder-auth/route.js tests/admin-session-lifecycle.test.mjs tests/admin-auth-refresh.test.mjs tests/admin-login-security.test.mjs tests/client-session-recorder-auth.test.mjs
      - name: Actual synthetic AAC bytes through owner intent/upload/finalization/guest Range playback and privacy
        run: |
          node --test tests/client-session-take-selection.test.mjs \
            tests/client-session-audio-synthetic-e2e.test.mjs \
            tests/client-session-owner-photo-upload.test.mjs \
            tests/client-session-photos.test.mjs \
            tests/client-session-owner-audio-upload.test.mjs \
            tests/client-session-recorder-auth.test.mjs \
            tests/recording-upload.test.mjs \
            tests/session-delivery-security.test.mjs \
            tests/session-recorder-wiring.test.mjs \
            tests/client-session-mov-iphone.test.mjs
      - name: Check new test syntax
        run: |
          node --check tests/client-session-audio-synthetic-e2e.test.mjs
          node --check tests/client-session-owner-photo-upload.test.mjs

      - name: ESM fixture boundaries and private media provider regressions
        run: node --test tests/fixture-module-body.test.mjs tests/session-media-sdk.test.mjs tests/client-session-external-video.test.mjs
      - name: Fixture lint and private media tests
        run: npx --no-install eslint tests/helpers/fixture-module-body.mjs tests/fixture-module-body.test.mjs tests/session-delivery-security.test.mjs tests/client-session-external-video.test.mjs tests/client-session-owner-photo-upload.test.mjs tests/session-media-sdk.test.mjs tests/client-session-owner-audio-upload.test.mjs
      # The unconditional Core release-ready checks these exact global validations
      # on production-targeted PRs. Retain them for real production pushes and
      # non-PR runs; never skip owner/guest media tests or privacy assertions.
      - name: Full TypeScript (core owns production PR typing)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npx --no-install tsc --noEmit --incremental false
      - name: Production build with app flags absent
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
