name: HH PR3383 stage existing four portrait HD clips - once
on:
  push:
    branches: [codex/hd-footage-quality-wave-20261104]
    paths:
      - .github/workflows/hh-pr3383-stage-hd-once.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: hh-pr3383-stage-existing-artifact-once
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/codex/hd-footage-quality-wave-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use existing source archive 13300344783 - never redownload Dareful footage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hh-pr3383-source"
          gh run download 41783128782 --repo andylitvinov-design/books --name hh-licensed-hd-editorial-drafts-20261104 --dir "$RUNNER_TEMP/hh-pr3383-source"
          test -f "$RUNNER_TEMP/hh-pr3383-source/report.json"
      - name: Check FFmpeg, original file digests, full video decode, rights and aspect
        run: |
          ffprobe -version | head -1
          node scripts/stage-pr3383-reviewed-hd.mjs --check "$RUNNER_TEMP/hh-pr3383-source"
          node scripts/stage-pr3383-reviewed-hd.mjs --stage "$RUNNER_TEMP/hh-pr3383-source"
      - name: Commit only selected physical portrait MP4 and JPG into NON-PUBLIC draft staging
        run: |
          set -euo pipefail
          test ! -e public/videos/holistic-house/film-collection-v3/sun-trees-forest.mp4
          git add assets/video-editorial-pr3383-pending-approval/
          if git diff --cached --quiet; then
            echo 'Already staged; no duplicate commit.'
            exit 0
          fi
          test "$(find assets/video-editorial-pr3383-pending-approval -maxdepth 1 -type f -name '*.mp4' | wc -l | tr -d ' ')" = 4
          test "$(find assets/video-editorial-pr3383-pending-approval -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')" = 4
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(video): stage four SHA-verified portrait MP4 for owner review [skip ci]'
          git push origin HEAD:codex/hd-footage-quality-wave-20261104
      - name: Stop short of production
        run: |
          echo 'STAGED_ONLY; 4 portrait MP4; 0 owner approved; 0 production released'
          test -f assets/video-editorial-pr3383-pending-approval/inventory.json
