name: Holistic House Cabinet journey
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'lib/app/learning-journey*'
      - 'components/app/cabinet-journey.*'
      - 'components/app/profile-domains.jsx'
      - 'app/api/app/[...path]/route.js'
      - 'tests/cabinet-learning-journey.test.mjs'
      - 'components/app/app-workspace.jsx'
      - 'supabase/migrations/20261023154000_hh_journey_free_intro_availability.sql'
      - '.github/workflows/hh-cabinet-journey.yml'
permissions:
  contents: read
concurrency:
  group: hh-cabinet-journey-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22, cache: npm}
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Verified participation and permissions regressions
        run: node --test tests/cabinet-learning-journey.test.mjs
      - name: Scoped ESLint
        run: npx --no-install eslint components/app/cabinet-journey.jsx components/app/profile-domains.jsx components/app/app-workspace.jsx lib/app/learning-journey.mjs lib/app/learning-journey-repository.js app/api/app/'[...path]'/route.js tests/cabinet-learning-journey.test.mjs
      - name: TypeScript
        run: npx --no-install tsc --noEmit
