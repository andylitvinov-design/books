name: HH CI prune superseded PR HEADs
# Protected production-only source; no untrusted PR checkout with write credentials.
on:
  pull_request_target:
    types: [synchronize]
    branches: ['codex/public-book-library']

permissions: {}
concurrency:
  group: hh-ci-prune-head-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prune-head:
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.base.ref == 'codex/public-book-library' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Checkout trusted production only
        uses: actions/checkout@v4
        with:
          ref: codex/public-book-library
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test protected CI prune before Actions cancellation
        run: node --test tests/ci-prune-stale-runs.test.mjs
      - name: Cancel only ancestor-proven superseded PR HEADs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HH_CI_PRUNE_LIMIT: '60'
        run: node scripts/ci-prune-stale-runs.mjs
