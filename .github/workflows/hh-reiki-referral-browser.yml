name: Reiki free-course referral conversion — browser QA

on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'components/reiki-referral-landing.tsx'
      - 'components/reiki-referral-landing.module.css'
      - 'components/tantra-free-initiation.tsx'
      - 'components/tantra-free-initiation.module.css'
      - 'components/academy-record-page.tsx'
      - 'components/energywork-ai-learner.tsx'
      - 'app/[locale]/academy/[[...slug]]/page.tsx'
      - 'scripts/verify-reiki-referral-browser.mjs'
      - 'tests/reiki-referral-landing.test.mjs'
      - '.github/workflows/hh-reiki-referral-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  referral:
    name: Conversion funnel — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      HH_TEST_BROWSER: ${{ matrix.browser }}
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      HH_APP_ENABLED: 'true'
      HH_APP_GUEST_ENABLED: 'true'
      HH_TEST_APP_ORIGIN: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Landing content, CTA and privacy contracts
        run: node --test tests/reiki-referral-landing.test.mjs
      - name: Lint changed components and direct-entry route
        run: >-
          npx --no-install eslint
          components/reiki-referral-landing.tsx
          components/tantra-free-initiation.tsx
          components/academy-record-page.tsx
          components/energywork-ai-learner.tsx
          'app/[locale]/academy/[[...slug]]/page.tsx'
      - name: Types and real production build
        run: |
          npx --no-install tsc --noEmit
          npm run build
      - name: Install isolated real browser
        run: |
          mkdir -p /tmp/hh-referral-playwright
          npm install --prefix /tmp/hh-referral-playwright --no-audit --no-fund @playwright/test@1.63.0
          ln -s /tmp/hh-referral-playwright/node_modules/@playwright node_modules/@playwright
          /tmp/hh-referral-playwright/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - name: Test EN/RU/ES first-screen CTA to actual Reiki course, with screenshots
        run: |
          mkdir -p artifacts/reiki-referral
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/hh-referral-next.log 2>&1 & APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl --silent --fail http://127.0.0.1:3100/en/academy/reiki/free-practitioner-course >/dev/null; then break; fi
            sleep 2
          done
          node scripts/verify-reiki-referral-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reiki-referral-${{ matrix.browser }}
          path: artifacts/reiki-referral/
          retention-days: 7
