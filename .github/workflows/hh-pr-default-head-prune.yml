name: HH default-branch PR HEAD prune
# GitHub sources pull_request_target workflows from the DEFAULT branch.
# Never check out a candidate PR HEAD with an actions:write token.
on:
  pull_request:
    branches: ['codex/bootstrap-books']
    paths:
      - '.github/workflows/hh-pr-default-head-prune.yml'
      - 'scripts/ci-pr-default-head-prune.cjs'
      - 'tests/ci-pr-default-head-prune.test.cjs'
  pull_request_target:
    types: [synchronize]
    branches: ['codex/public-book-library']
permissions: {}
concurrency:
  group: hh-default-head-prune-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  test-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/ci-pr-default-head-prune.cjs
      - run: node --test tests/ci-pr-default-head-prune.test.cjs
  prune-head:
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.base.ref == 'codex/public-book-library' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: codex/bootstrap-books
          persist-credentials: false
      - name: Validate trusted coordinator before any GitHub mutation
        run: node --test tests/ci-pr-default-head-prune.test.cjs
      - name: Cancel only proven older HEAD runs of this one production PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {prune}=require('./scripts/ci-pr-default-head-prune.cjs');
            const result=await prune({github,event:context.payload,
              repository:context.repo.owner+'/'+context.repo.repo,log:core.info});
            core.info('CI_PRUNE_SUMMARY '+JSON.stringify(result));
            if(result.errors?.length) core.warning('PARTIAL: '+result.errors.join(','));
            if(result.partial) core.warning('PARTIAL queue coverage');
