name: GA4 isolated rewrite root hypothesis
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'tests/fixtures/ga4-rewrite-root/**'
      - 'scripts/verify-ga4-rewrite-root.mjs'
      - 'tests/ga4-rewrite-root-harness.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ga4-rewrite-root-proof.yml'
permissions:
  contents: read
jobs:
  isolated-rewrite-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      HH_GA4_PLAYWRIGHT_MODULE: /tmp/hh-ga4-proof-tools/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/ga4-rewrite-root-harness.test.mjs tests/ga4-safety-hold.test.mjs
      - name: Install official isolated browser
        run: |
          npm install --prefix /tmp/hh-ga4-proof-tools --no-audit --no-fund playwright@1.57.0
          /tmp/hh-ga4-proof-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Read frozen official SDK without executing analytics
        run: |
          mkdir -p artifacts/ga4-rewrite-proof
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            'https://www.googletagmanager.com/gtag/js?id=G-3WX7PDD52N' \
            -o artifacts/ga4-rewrite-proof/google-tag-readonly.js
          sha256sum artifacts/ga4-rewrite-proof/google-tag-readonly.js > artifacts/ga4-rewrite-proof/google-tag.sha256
      - name: Isolated build, HTTP and pre-send intercepted browser matrix
        run: node scripts/verify-ga4-rewrite-root.mjs
      - name: Confirm exact source stayed unchanged and analytics stays off
        if: always()
        run: |
          git diff --exit-code
          STATUS=$(git status --porcelain --untracked-files=all -- . ':(exclude)artifacts/**')
          test -z "$STATUS" || { printf '%s\n' "$STATUS"; exit 1; }
          node --test tests/ga4-safety-hold.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga4-rewrite-synthetic-evidence
          path: artifacts/ga4-rewrite-proof/
          retention-days: 7
