name: R1 prepare pinned dependency lock (no ref writes)
on:
  push:
    branches: ['codex/holistic-house-app-r1']
    paths: ['package.json', '.github/workflows/hh-app-lock-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'andylitvinov-design/books' && github.ref == 'refs/heads/codex/holistic-house-app-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve the explicitly pinned app additions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Store immutable lock blob for reviewer to commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('package-lock.json', 'utf8');
            const result = await github.rest.git.createBlob({...context.repo, content, encoding: 'utf-8'});
            core.info('R1_LOCK_BLOB_SHA=' + result.data.sha);
            await core.summary.addHeading('Generated lockfile; no branch or production ref changed').addCodeBlock(result.data.sha).write();
      - uses: actions/upload-artifact@v4
        with:
          name: app-lockfile
          path: package-lock.json
          retention-days: 3
