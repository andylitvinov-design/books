name: HH HD licensed footage quality contact-sheet review - once
on:
  push:
    branches: [codex/hd-footage-quality-wave-20261104]
    paths:
      - scripts/review-dareful-hd-footage-20261104.mjs
      - .github/workflows/hh-hd-footage-one-time-review-20261104.yml
permissions:
  contents: read
concurrency:
  group: hh-licensed-hd-one-time-source-review
  cancel-in-progress: false
jobs:
  media-review:
    if: github.ref == 'refs/heads/codex/hd-footage-quality-wave-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free FFmpeg and FFprobe only when missing
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -1
      - name: Validate actual HD motion, decoded images, contrast, near-duplicates and CC BY source IDs
        run: node scripts/review-dareful-hd-footage-20261104.mjs
      - name: Publish private editorial review bundle, never to production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hh-licensed-hd-editorial-drafts-20261104
          path: |
            artifacts/hd-dareful-review-20261104/*.mp4
            artifacts/hd-dareful-review-20261104/*.jpg
            artifacts/hd-dareful-review-20261104/report.json
            artifacts/hd-dareful-review-20261104/README.md
          retention-days: 5
          if-no-files-found: error
          compression-level: 6
