name: Holistic House Play AAB (manual signed candidate, no upload)

# NEVER run on pull_request: private signing keys must not be available to PR code.
# Trigger only from the reviewed production branch, after owner provisions a
# protected google-play-release environment and stable Android upload keystore.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Monotonically increasing Google Play versionCode (integer >= 2)"
        type: number
        required: true
      version_name:
        description: "Version name (e.g. 1.0.0; no spaces)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: hh-play-aab-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  signed-candidate:
    name: Holistic House Android signed candidate (NOT published)
    if: github.repository == 'andylitvinov-design/books' && github.ref == 'refs/heads/codex/public-book-library'
    runs-on: ubuntu-latest
    environment: google-play-release
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed production branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify trusted repo, app and source commit
        run: |
          test "$GITHUB_REF" = "refs/heads/codex/public-book-library"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p "require('./capacitor.holistic-house.config.json').appId")" = "com.holistichouse.app"
          echo "Source SHA: $GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Play-target Android 16 SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - run: npm ci --no-audit --no-fund
      - name: Stage pinned Capacitor native push plugin (HH-only)
        run: npm install --no-save --package-lock=false @capacitor/push-notifications@7.0.1
      - name: Source-level Android release gates
        run: node --test tests/holistic-house-native-build.test.mjs tests/holistic-house-play-release.test.mjs
      - name: Native push privacy/consent contract
        run: node --conditions=react-server --test tests/native-private-message-push.test.mjs tests/native-push-release.test.mjs
      - name: Fail closed unless approved Play credentials are present
        env:
          HH_ANDROID_KEYSTORE_B64: ${{ secrets.HH_ANDROID_KEYSTORE_B64 }}
          HH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HH_ANDROID_KEYSTORE_PASSWORD }}
          HH_ANDROID_KEY_ALIAS: ${{ secrets.HH_ANDROID_KEY_ALIAS }}
          HH_ANDROID_KEY_PASSWORD: ${{ secrets.HH_ANDROID_KEY_PASSWORD }}
          HH_FIREBASE_CONFIG_B64: ${{ secrets.HH_FIREBASE_CONFIG_B64 }}
        run: |
          for name in HH_ANDROID_KEYSTORE_B64 HH_ANDROID_KEYSTORE_PASSWORD HH_ANDROID_KEY_ALIAS HH_ANDROID_KEY_PASSWORD HH_FIREBASE_CONFIG_B64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required protected release secret is missing: $name"
              exit 1
            fi
          done
          umask 077
          printf %s "$HH_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/hh-upload.jks"
          test -s "$RUNNER_TEMP/hh-upload.jks"
          printf %s "$HH_FIREBASE_CONFIG_B64" | base64 --decode > android/app/google-services.json
          node -e "const c=require('./android/app/google-services.json');if(!c.client?.some(x=>x.client_info?.android_client_info?.package_name==='com.holistichouse.app'))process.exit(1)"
          echo "HH_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/hh-upload.jks" >> "$GITHUB_ENV"
      - name: Prepare Holistic House (leave PsiAlchemy source branding untouched)
        run: |
          node scripts/prepare-holistic-house-native.mjs before-sync
          npx cap sync android
          node scripts/prepare-holistic-house-native.mjs after-android-sync
          node scripts/brand-hh-native-artwork.mjs android
      - name: Set Play SDK 36, version and protected signing configuration
        env:
          HH_PLAY_VERSION_CODE: ${{ inputs.version_code }}
          HH_PLAY_VERSION_NAME: ${{ inputs.version_name }}
          HH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HH_ANDROID_KEYSTORE_PASSWORD }}
          HH_ANDROID_KEY_ALIAS: ${{ secrets.HH_ANDROID_KEY_ALIAS }}
          HH_ANDROID_KEY_PASSWORD: ${{ secrets.HH_ANDROID_KEY_PASSWORD }}
        run: node scripts/prepare-holistic-house-play-release.mjs
      - name: Build release-signed AAB and website APK (no distribution)
        env:
          HH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HH_ANDROID_KEYSTORE_PASSWORD }}
          HH_ANDROID_KEY_ALIAS: ${{ secrets.HH_ANDROID_KEY_ALIAS }}
          HH_ANDROID_KEY_PASSWORD: ${{ secrets.HH_ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Verify AAB integrity, signature and manifest staging
        run: |
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          unzip -t "$bundle" >/dev/null
          jarsigner -verify "$bundle"
          test "$(grep -c 'targetSdkVersion = 36' android/variables.gradle)" = 1
          test "$(grep -c 'applicationId "com.holistichouse.app"' android/app/build.gradle)" = 1
          sha256sum "$bundle" > hh-play-release-sha256.txt
          cat hh-play-release-sha256.txt
          echo "Signed candidate only. No upload, release or user delivery."
      - name: Verify website APK identity, signature, version and checksum
        env:
          HH_PLAY_VERSION_CODE: ${{ inputs.version_code }}
          HH_PLAY_VERSION_NAME: ${{ inputs.version_name }}
          HH_EXPECTED_WEBSITE_CERT_SHA256: ${{ vars.HH_EXPECTED_WEBSITE_CERT_SHA256 }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > hh-website-apk-signature.txt
          grep -E '^Verified using v[23] scheme .*: true$' hh-website-apk-signature.txt
          grep -E '^Signer #1 certificate SHA-256 digest: [a-f0-9]{64}$' hh-website-apk-signature.txt
          # An ephemeral or unintended key must never become a public update chain.
          # The approved public signing fingerprint is non-secret but explicitly
          # configured in the protected release Environment by the owner.
          expected="$(printf %s "$HH_EXPECTED_WEBSITE_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Approved website signing certificate not configured"; exit 1; }
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' hh-website-apk-signature.txt | head -1)"
          test "$actual" = "$expected" || { echo "::error::APK signing fingerprint differs from approved release certificate"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > hh-website-apk-badging.txt
          grep -F "package: name='com.holistichouse.app' versionCode='$HH_PLAY_VERSION_CODE' versionName='$HH_PLAY_VERSION_NAME'" hh-website-apk-badging.txt
          grep -F "targetSdkVersion:'36'" hh-website-apk-badging.txt
          cp "$apk" "Holistic-House-Android-v$HH_PLAY_VERSION_NAME.apk"
          sha256sum "Holistic-House-Android-v$HH_PLAY_VERSION_NAME.apk" > hh-website-apk-sha256.txt
          echo "PRIVATE release candidate only; public distribution requires device QA, owner approval and GitHub Release"
      - name: Retain private website APK candidate (NOT publicly downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: HH-Website-APK-${{ inputs.version_code }}-NOT-PUBLISHED
          retention-days: 7
          if-no-files-found: error
          path: |
            Holistic-House-Android-v*.apk
            hh-website-apk-sha256.txt
            hh-website-apk-signature.txt
            hh-website-apk-badging.txt
      - name: Retain approved signed candidate for manual Play Console review
        uses: actions/upload-artifact@v4
        with:
          name: HH-Play-AAB-${{ inputs.version_code }}-NOT-PUBLISHED
          retention-days: 7
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            hh-play-release-sha256.txt
      - name: Remove ephemeral signing key and Firebase config
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/hh-upload.jks"
          rm -f android/app/google-services.json android/app/hh-play-signing.gradle
