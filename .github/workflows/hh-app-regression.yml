name: Holistic House R1 full unit regression versus canonical base
on:
  push:
    branches: ['codex/holistic-house-app-r1']
permissions:
  contents: read
concurrency:
  group: app-r1-full-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Test current feature with its own lockfile
        run: |
          npm ci --no-audit --no-fund
          mkdir -p artifacts/app-regression
          set +e
          npm run test:unit > artifacts/app-regression/head.tap 2>&1
          echo $? > artifacts/app-regression/head.exit
          exit 0
      - name: Test untouched canonical base with its own lockfile
        run: |
          git worktree add --detach /tmp/hh-r1-regression-base 5ac4e18f4673e2793644fd6ca41544b4605818d0
          cd /tmp/hh-r1-regression-base
          npm ci --no-audit --no-fund
          set +e
          npm run test:unit > "$GITHUB_WORKSPACE/artifacts/app-regression/base.tap" 2>&1
          echo $? > "$GITHUB_WORKSPACE/artifacts/app-regression/base.exit"
          exit 0
      - name: Fail on new failures, keep existing failures explicit
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const dir='artifacts/app-regression/';
          const read=name=>{const log=readFileSync(dir+name+'.tap','utf8');return {exit:Number(readFileSync(dir+name+'.exit','utf8')),tests:Number(log.match(/^# tests (\d+)/m)?.[1]||0),pass:Number(log.match(/^# pass (\d+)/m)?.[1]||0),fail:Number(log.match(/^# fail (\d+)/m)?.[1]||0),failures:[...log.matchAll(/^not ok \d+ - (.+)$/gm)].map(m=>m[1])}};
          const base=read('base'),head=read('head');
          const newFailures=head.failures.filter(name=>!base.failures.includes(name));
          const summary={baseCommit:'5ac4e18f4673e2793644fd6ca41544b4605818d0',headCommit:process.env.GITHUB_SHA,base,head,newFailures};
          writeFileSync(dir+'summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          if(newFailures.length || !head.tests || !base.tests || (head.exit && !head.failures.length))process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-r1-full-unit-regression
          path: artifacts/app-regression/
          retention-days: 7
