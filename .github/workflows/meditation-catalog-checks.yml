name: Meditation catalogue targeted checks

on:
  push:
    branches: [codex/public-book-library]
    paths:
      - "data/academy/meditation-*"
      - "lib/holistic-support/meditation-*"
      - "lib/holistic-support/client-intent-model.*"
      - "lib/practitioners/discovery-intent.js"
      - "data/core-service-offers.ts"
      - "components/holistic-meditation-*"
      - "app/[locale]/meditations/page.tsx"
      - "components/meditation-practice-app*"
      - "tests/meditation-immersive-app.test.mjs"
      - "scripts/verify-meditation-immersive-browser.mjs"
      - "app/[locale]/holistic-support/page.tsx"
      - "tests/meditation-catalog-candidates.test.mjs"
      - "tests/client-request-relevance-v2.test.mjs"
      - "tests/services-smart-discovery.test.mjs"
      - "tests/holistic-support-recommendation-engine.test.mjs"
      - "tests/holistic-support-meditations.test.mjs"
      - "scripts/verify-meditation-live-journey.mjs"
      - "supabase/migrations/*hh_meditation*"
      - ".github/workflows/meditation-catalog-checks.yml"
  pull_request:
    branches: [codex/public-book-library]
    paths:
      - "data/academy/meditation-*"
      - "lib/holistic-support/meditation-*"
      - "lib/holistic-support/client-intent-model.*"
      - "lib/practitioners/discovery-intent.js"
      - "data/core-service-offers.ts"
      - "components/holistic-meditation-*"
      - "app/[locale]/meditations/page.tsx"
      - "components/meditation-practice-app*"
      - "tests/meditation-immersive-app.test.mjs"
      - "scripts/verify-meditation-immersive-browser.mjs"
      - "app/[locale]/holistic-support/page.tsx"
      - "tests/meditation-catalog-candidates.test.mjs"
      - "tests/client-request-relevance-v2.test.mjs"
      - "tests/services-smart-discovery.test.mjs"
      - "tests/holistic-support-recommendation-engine.test.mjs"
      - "tests/holistic-support-meditations.test.mjs"
      - "scripts/verify-meditation-live-journey.mjs"
      - "supabase/migrations/*hh_meditation*"
      - ".github/workflows/meditation-catalog-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Meditation selection and existing gallery regression
        run: node --test tests/client-request-relevance-v2.test.mjs tests/meditation-catalog-candidates.test.mjs tests/services-smart-discovery.test.mjs tests/holistic-support-meditations.test.mjs tests/meditation-immersive-app.test.mjs tests/holistic-support-goal-filter.test.mjs tests/holistic-support-recommendation-engine.test.mjs
      - name: Lint changed UI, server loader and model
        run: npx eslint components/holistic-meditation-finder.tsx components/holistic-meditation-gallery.tsx components/meditation-practice-app.tsx app/'[locale]'/meditations/page.tsx lib/holistic-support/meditation-discovery-server.ts app/'[locale]'/holistic-support/page.tsx lib/holistic-support/meditation-catalog-ranker.mjs lib/holistic-support/client-intent-model.mjs lib/practitioners/discovery-intent.js
      - name: Typecheck (Core owns production PR typing)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npx tsc --noEmit --pretty false

  browser-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'pull_request' && '["source"]' || '["chromium","webkit"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Syntax check on every PR, including source-only fast route
        run: node --check scripts/verify-meditation-live-journey.mjs && node --check scripts/verify-meditation-immersive-browser.mjs
      - name: Install dependencies for full manual / production browser acceptance
        if: matrix.browser != 'source'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright only for real browsers
        if: matrix.browser != 'source'
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Install browser and Linux dependencies
        if: matrix.browser != 'source'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify actual canonical production route in 320/375/390/430 mobile
        if: matrix.browser != 'source'
        run: node scripts/verify-meditation-live-journey.mjs
        env:
          BROWSER: ${{ matrix.browser }}

  # #2308 is merged: keep syntax coverage for all relevant PRs rather than
  # emitting a skipped job that strict Core correctly refuses to call green.
  # Expensive exact-head full-screen E2E stays available on manual dispatch.
  # Other unrelated PRs do not pay for the extra Next build/browser install.
  fullscreen-candidate-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Check full-screen browser script syntax on every relevant PR
        run: node --check scripts/verify-meditation-immersive-browser.mjs
      - name: Install reviewed exact-PR dependencies
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx --no-install playwright install --with-deps chromium webkit
      - name: Build exact candidate, no user/provider secrets
        if: github.event_name == 'workflow_dispatch'
        run: npm run build
      - name: Chromium and WebKit full-screen 320/390/430 EN/RU/ES real interactions
        if: github.event_name == 'workflow_dispatch'
        env:
          HH_PUBLIC_QA_ORIGIN: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          node --check scripts/verify-meditation-immersive-browser.mjs
          npm run start -- --hostname 127.0.0.1 --port 3100 >/tmp/hh-meditation-app.log 2>&1 &
          NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 70); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3100/ru/meditations >/dev/null; then
              ready=1
              break
            fi
            echo "Meditation candidate startup retry ${i}/70" >&2
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            echo 'Full-screen meditation candidate not ready' >&2
            exit 1
          fi
          node scripts/verify-meditation-immersive-browser.mjs

