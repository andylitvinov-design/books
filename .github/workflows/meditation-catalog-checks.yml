name: Meditation catalogue targeted checks

on:
  push:
    branches: [codex/public-book-library]
    paths:
      - 'supabase/migrations/*hh_meditation*'
      - 'scripts/verify-meditation-live-journey.mjs'
      - '.github/workflows/meditation-catalog-checks.yml'
  pull_request:
    branches: [codex/public-book-library]
    paths:
      - "data/academy/meditation-*"
      - "lib/holistic-support/meditation-*"
      - "lib/holistic-support/client-intent-model.*"
      - "lib/practitioners/discovery-intent.js"
      - "data/core-service-offers.ts"
      - "components/holistic-meditation-*"
      - "app/[locale]/holistic-support/page.tsx"
      - "tests/meditation-catalog-candidates.test.mjs"
      - "tests/client-request-relevance-v2.test.mjs"
      - "tests/services-smart-discovery.test.mjs"
      - "tests/holistic-support-recommendation-engine.test.mjs"
      - "tests/holistic-support-meditations.test.mjs"
      - "scripts/verify-meditation-live-journey.mjs"
      - "supabase/migrations/*hh_meditation*"
      - ".github/workflows/meditation-catalog-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Meditation selection and existing gallery regression
        run: node --test tests/client-request-relevance-v2.test.mjs tests/meditation-catalog-candidates.test.mjs tests/services-smart-discovery.test.mjs tests/holistic-support-meditations.test.mjs tests/holistic-support-goal-filter.test.mjs tests/holistic-support-recommendation-engine.test.mjs
      - name: Lint changed UI, server loader and model
        run: npx eslint components/holistic-meditation-finder.tsx components/holistic-meditation-gallery.tsx lib/holistic-support/meditation-discovery-server.ts app/'[locale]'/holistic-support/page.tsx lib/holistic-support/meditation-catalog-ranker.mjs lib/holistic-support/client-intent-model.mjs lib/practitioners/discovery-intent.js
      - name: Typecheck
        run: npx tsc --noEmit --pretty false

  browser-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Install browser and Linux dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify actual canonical production route in 320/375/390/430 mobile
        run: node scripts/verify-meditation-live-journey.mjs
        env:
          BROWSER: ${{ matrix.browser }}
