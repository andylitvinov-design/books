name: Holistic House assessment evidence and authored-content QA

on:
  pull_request:
    paths:
      - '.github/workflows/hh-assessment-quality.yml'
      - 'data/assessments/research-directory-2026/**'
      - 'lib/assessments/research-directory-2026.js'
      - 'lib/assessments/psychometric-validity-2026.js'
      - 'components/app/research-directory.*'
      - 'components/app/test-explorer.jsx'
      - 'tests/psychometric-validity-directory.test.mjs'
      - '.github/workflows/psychometric-research-catalogue.yml'
      - 'data/assessments/**'
      - 'lib/assessments/**'
      - 'components/app/test-explorer.*'
      - 'components/app/test-result-discussion.*'
      - 'tests/test-result-discussion.test.mjs'
      - 'tests/guest-scale-verifier.test.mjs'
      - 'scripts/helpers/guest-scale-verifier.mjs'
      - 'scripts/audit-hh-author-items-2026.mjs'
      - 'scripts/audit-psychometric-quality-2026.mjs'
      - 'tests/*assessment*.test.mjs'
      - 'tests/checkin-scoring-analysis-quality.test.mjs'
      - 'tests/hh-author-content-audit.test.mjs'
      - 'tests/psychometric-validity-directory.test.mjs'
      - 'docs/assessments/**'
  push:
    branches: ['codex/public-book-library']
    paths:
      - 'data/assessments/research-directory-2026/**'
      - 'lib/assessments/research-directory-2026.js'
      - 'lib/assessments/psychometric-validity-2026.js'
      - 'components/app/research-directory.*'
      - 'components/app/test-explorer.jsx'
      - 'tests/psychometric-validity-directory.test.mjs'
      - '.github/workflows/psychometric-research-catalogue.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hh-assessment-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authored-content-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Private result conversation — original measures, crisis gating, EN/RU/ES routes
        run: node --conditions=react-server --test tests/test-result-discussion.test.mjs
      - name: Verify source-bound guest ranges and account explanations without client data
        run: node --conditions=react-server --test tests/guest-scale-verifier.test.mjs
      - name: Exact source evidence, 73 authored families, 150 groups and safe reports
        run: >-
          node --conditions=react-server --test
          tests/psychometric-validity-directory.test.mjs
          tests/hh-original-review-ledger.test.mjs
          tests/hh-author-content-audit.test.mjs
          tests/checkin-scoring-analysis-quality.test.mjs
          tests/checkin-course-result-integrity.test.mjs
          tests/full-assessment-library-quality.test.mjs
          tests/professional-test-expansion-2026.test.mjs
          tests/public-test-match-paging.test.mjs
      - name: Export static editorial review queue — no users or client data
        run: |
          mkdir -p artifacts/assessment-quality
          node --conditions=react-server scripts/audit-hh-author-items-2026.mjs > artifacts/assessment-quality/summary.json
          node --conditions=react-server scripts/audit-hh-author-items-2026.mjs --csv > artifacts/assessment-quality/reviewer-items-en-ru.csv
          node --conditions=react-server scripts/audit-psychometric-quality-2026.mjs > artifacts/assessment-quality/evidence-groups.json
      - name: Verify research-only catalogue, multilingual lookup and permissions
        run: >-
          node --conditions=react-server --test
          tests/psychometric-validity-directory.test.mjs
          tests/public-test-match-paging.test.mjs
          tests/assessment-methodology.test.mjs
          tests/test-kinds-catalog-audit.test.mjs
      - name: Verify reviewed research-only source totals without client data
        run: |
          node --conditions=react-server scripts/audit-psychometric-quality-2026.mjs > /tmp/psychometric-quality.json
          node --input-type=module -e '
            import fs from "node:fs";
            const x=JSON.parse(fs.readFileSync("/tmp/psychometric-quality.json","utf8"));
            if (x.researchEditionReferences !== 3092) process.exit(1);
            if (x.nonOverlappingResearchReferences < 2800) process.exit(1);
            console.log("Research catalogue count",x.researchEditionReferences,
              "discovery entries",x.nonOverlappingResearchReferences);
          '
      - uses: actions/upload-artifact@v4
        with:
          name: assessment-evidence-and-author-review
          path: artifacts/assessment-quality/
          retention-days: 14
          if-no-files-found: error
