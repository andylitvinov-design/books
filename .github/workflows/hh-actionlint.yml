name: HH workflow syntax — actionlint
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hh-workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate-workflows:
    name: actionlint-changed
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified actionlint v1.7.12
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate all exact changed workflow definitions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          files=()
          if [[ "$EVENT_NAME" == pull_request && -n "$BASE_SHA" ]]; then
            while IFS= read -r -d '' file; do
              [[ -f "$file" ]] && files+=("$file")
            done < <(git diff --name-only -z "$BASE_SHA" HEAD -- '.github/workflows/')
          else
            while IFS= read -r -d '' file; do
              files+=("$file")
            done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          fi
          if (( ${#files[@]} == 0 )); then
            echo 'Workflow filter triggered but no workflow file remains; check deleted paths or run manually.' >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
          actionlint -color "${files[@]}"
