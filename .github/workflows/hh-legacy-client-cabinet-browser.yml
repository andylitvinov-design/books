name: Legacy private Client Cabinet visual browser
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ['codex/public-book-library']
    paths:
      - 'components/client-cabinet.jsx'
      - 'app/[locale]/client/[selector]/**'
      - 'app/globals.css'
      - 'scripts/verify-legacy-client-cabinet-browser.mjs'
      - 'tests/legacy-client-cabinet-design.test.mjs'
      - '.github/workflows/hh-legacy-client-cabinet-browser.yml'
permissions:
  contents: read
concurrency:
  group: hh-legacy-client-cabinet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-visual:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      CI: 'true'
      HH_TEST_BROWSER: ${{ matrix.browser }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Source, original selector gate, privacy and PDF regression
        run: node --test tests/legacy-client-cabinet-design.test.mjs tests/client-cabinet-pages.test.mjs tests/prescription-access.test.mjs
      - name: Install isolated browser binary
        run: |
          mkdir -p /tmp/hh-legacy-cabinet-browser
          npm install --prefix /tmp/hh-legacy-cabinet-browser --no-audit --no-fund @playwright/test@1.63.0
          ln -s /tmp/hh-legacy-cabinet-browser/node_modules/@playwright node_modules/@playwright
          /tmp/hh-legacy-cabinet-browser/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - name: Actual ClientCabinet JSX SSR and production CSS synthetic mobile geometry
        run: node scripts/verify-legacy-client-cabinet-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-cabinet-synthetic-${{ matrix.browser }}
          path: artifacts/legacy-client-cabinet/${{ matrix.browser }}/
          retention-days: 7
