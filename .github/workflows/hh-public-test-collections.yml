name: Holistic House public test collections acceptance

on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'components/app/simple-test-picker.jsx'
      - 'components/app/simple-test-picker.module.css'
      - 'components/app/test-explorer.jsx'
      - 'lib/assessments/test-collection-membership.js'
      - 'lib/assessments/test-collections.js'
      - 'lib/assessments/test-explorer.js'
      - 'tests/public-test-topic-collections.test.mjs'
      - 'tests/tantra-themed-collection-cards.test.mjs'
      - 'tests/spanish-test-topic-collections.test.mjs'
      - 'tests/public-test-match-paging.test.mjs'
      - 'tests/tantric-reflections.test.mjs'
      - 'lib/profile/unified-profile.js'
      - 'components/app/unified-profile-layers.jsx'
      - 'components/app/unified-profile-layers.module.css'
      - 'components/app/app-workspace.jsx'
      - 'app/[locale]/personality-profiles/page.tsx'
      - 'tests/unified-profile-layers.test.mjs'
      - 'components/personality-profiles-builder.tsx'
      - 'lib/profile/profile-scale-selection.js'
      - 'tests/profile-test-taxonomy.test.mjs'
      - 'tests/profile-construct-axes.test.mjs'
      - 'tests/goal-profile-journey.test.mjs'
      - 'lib/profile/goal-profile.js'
      - 'scripts/audit-profile-construct-links.mjs'
      - 'tests/profile-scale-hierarchy.test.mjs'
      - 'tests/personality-profiles-focus-filter.test.mjs'
      - 'components/personality-profiles-builder.module.css'
      - 'components/app/cabinet-landing.jsx'
      - 'components/app/guest-test-journey-progress.jsx'
      - 'components/app/guest-test-journey-progress.module.css'
      - 'lib/app/guest-test-journey.js'
      - 'tests/personality-profiles-builder.test.mjs'
      - 'tests/profile-test-course-journey.test.mjs'
      - 'tests/guest-test-journey-progress.test.mjs'
      - '.github/workflows/hh-public-test-collections.yml'

permissions:
  contents: read

concurrency:
  group: hh-public-test-collections-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collections-unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - name: Source-only taxonomy / scorer identity coverage for every registered test
        run: node scripts/audit-profile-construct-links.mjs --verify
      - name: Real collection membership, matching, standard cards and EN/RU/ES tests
        run: >-
          node --conditions=react-server --test
          tests/public-test-topic-collections.test.mjs
          tests/tantra-themed-collection-cards.test.mjs
          tests/public-test-match-paging.test.mjs
          tests/spanish-test-topic-collections.test.mjs
          tests/public-love-search.test.mjs
          tests/tantric-reflections.test.mjs
          tests/personality-profiles-builder.test.mjs
          tests/personality-profiles-focus-filter.test.mjs
          tests/profile-scale-hierarchy.test.mjs
          tests/profile-test-taxonomy.test.mjs
          tests/profile-construct-axes.test.mjs
          tests/goal-profile-journey.test.mjs
          tests/unified-profile-layers.test.mjs
          tests/profile-test-course-journey.test.mjs
          tests/guest-test-journey-progress.test.mjs
      - name: Lint modified application code
        run: >-
          npx --no-install eslint
          components/app/simple-test-picker.jsx
          components/app/test-explorer.jsx
          lib/assessments/test-collection-membership.js
          lib/assessments/test-collections.js
          lib/assessments/test-explorer.js
          lib/app/guest-test-journey.js
          components/personality-profiles-builder.tsx
          lib/profile/profile-scale-selection.js
          lib/profile/goal-profile.js
          tests/goal-profile-journey.test.mjs
          tests/personality-profiles-focus-filter.test.mjs
          tests/profile-scale-hierarchy.test.mjs
          tests/profile-test-taxonomy.test.mjs
          tests/profile-construct-axes.test.mjs
          scripts/audit-profile-construct-links.mjs
          components/app/unified-profile-layers.jsx
          lib/profile/unified-profile.js
          tests/unified-profile-layers.test.mjs
          components/app/guest-test-journey-progress.jsx
          components/app/cabinet-landing.jsx
          tests/profile-test-course-journey.test.mjs
          tests/guest-test-journey-progress.test.mjs
      - name: Verify Next.js production build
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
