name: HH zero-cost PR CI worker
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  # No workflow_run fanout: Watchdog dispatches only an actionable queue.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect only; no PR metadata, commit, or ref changes'
        type: boolean
        default: false
        required: false
      pr_number:
        type: string
        default: '0'
      expected_sha:
        type: string
        default: ''
      task_key:
        type: string
        default: ''
      token_probe:
        description: 'Read-only diagnostic of HH_AUTOMERGE_TOKEN; no refs, commits, or labels'
        type: boolean
        default: false
        required: false
      reservation_run_id:
        description: 'Authenticated dispatcher reservation run ID; exact HEAD, bot identity and task key required'
        type: string
        default: ''
  push:
    branches: ['codex/bootstrap-books']
    paths:
      - '.github/workflows/hh-pr-ci-worker.yml'
      - 'scripts/ci-pr-ci-worker.cjs'
      - 'scripts/ci-pr-core-metadata-wake.cjs'
      - 'tests/ci-pr-core-metadata-wake.test.cjs'
      - 'scripts/ci-pr-owner-token-probe.cjs'
      - 'scripts/ci-pr-schedule-fallback.cjs'
      - 'scripts/ci-pr-priority.cjs'
      - '.github/hh-pr-directions.json'
      - 'tests/ci-pr-direction-watcher.test.cjs'
      - 'tests/ci-pr-priority.test.cjs'
      - 'tests/ci-pr-ci-worker.test.cjs'
permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write
concurrency:
  # Signed metadata tasks use a per-PR lease; scheduled probes stay read-only.
  # Unaddressed manual fallback stays separately serialized.
  group: hh-pr-ci-worker-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '0' && format('pr-{0}', inputs.pr_number) || github.event_name == 'workflow_dispatch' && 'unaddressed' || 'background' }}
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'andylitvinov-design/books' && github.ref == 'refs/heads/codex/bootstrap-books'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout trusted worker only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      # Deterministic worker tests run in the separate code-change contract job.
      - name: Check trusted CI worker syntax
        run: |
          node --check scripts/ci-pr-ci-worker.cjs
          node --check scripts/ci-pr-core-metadata-wake.cjs
          node --check scripts/ci-pr-priority.cjs
          node --check scripts/ci-pr-schedule-fallback.cjs
      - name: Request one exact-HEAD PR Core CI after authenticated claim
        uses: actions/github-script@v7
        env:
          HH_AUTOMERGE_TOKEN: ${{ secrets.HH_AUTOMERGE_TOKEN }}
        with:
          # Only this repo-scoped GITHUB_TOKEN reads the queue and places leases.
          github-token: ${{ github.token }}
          script: |
            const {run}=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-core-metadata-wake.cjs');
            const token=process.env.HH_AUTOMERGE_TOKEN;
            // Cron is a backstop only. Actual CI actions require the Control Tower's
            // signed exact-HEAD reservation; no unaddressed metadata edits.
            if(context.eventName==='schedule'){
              const {run:scheduledBackstop}=require(process.env.GITHUB_WORKSPACE+
                '/scripts/ci-pr-schedule-fallback.cjs');
              const result=await scheduledBackstop({
                github,context,hasToken:Boolean(token),
                log:message=>core.warning(message)
              });
              core.info('HH_CI_SCHEDULE_FALLBACK '+JSON.stringify(result));
              await core.summary.addHeading('HH CI schedule: guarded Control Tower backstop')
                .addCodeBlock(JSON.stringify(result,null,2)).write();
              return;
            }
            // Prior PR #3108 proved object write. Subsequent push/manual probes
            // remain READ-ONLY and never mutate source or required checks.
            const tokenProbeRequested=context.eventName==='push' ||
              String(context.payload.inputs?.token_probe ?? 'false')==='true';
            if(tokenProbeRequested){
              const {probeOwnerToken}=require(process.env.GITHUB_WORKSPACE+
                '/scripts/ci-pr-owner-token-probe.cjs');
              const result=await probeOwnerToken({
                github,ownerToken:token,
                prNumber:Number(context.payload.inputs?.pr_number||2169),
                writeProbe:false,
                report:observation=>core.info('HH_OWNER_TOKEN_PROBE_STAGE '+JSON.stringify(observation))
              });
              core.info('HH_OWNER_TOKEN_PROBE '+JSON.stringify(result));
              await core.summary.addHeading('HH owner token read-only preflight')
                .addCodeBlock(JSON.stringify(result,null,2)).write();
              if(!['READ_OK_WRITE_UNVERIFIED','GIT_OBJECT_WRITE_OK_REF_UNVERIFIED'].includes(result.status))
                core.setFailed('HH_OWNER_TOKEN_PROBE_FAILED: '+result.status);
              return;
            }
            // Metadata-only CI wake, never a source commit or ref update.
            // Only an addressed dispatch with authenticated exact-head
            // reservation may edit PR body via the owner token.
            const result=await run({
              github,core,context,token,
              number:Number(context.payload.inputs?.pr_number || 0),
              expectedSha:String(context.payload.inputs?.expected_sha || ''),
              taskKey:String(context.payload.inputs?.task_key || ''),
              reservationRunId:String(context.payload.inputs?.reservation_run_id || ''),
              dryRun:context.eventName!=='workflow_dispatch' ||
                String(context.payload.inputs?.dry_run ?? 'false')==='true'
            });
            core.info('HH_CI_METADATA_WAKE '+JSON.stringify(result));
            await core.summary.addHeading('HH CI Worker: metadata event is not a Core result')
              .addCodeBlock(JSON.stringify(result,null,2)).write();
            const {wakeAfterWorker}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-control-tower-wakeup.cjs');
            core.info('HH_CI_COMPLETION_WAKE '+await wakeAfterWorker({
              github,context,kind:'ci',
              status:result.metadataEditAccepted?'requested':'skipped',
              dryRun:result.dryRun,log:core.warning
            }));
            if(result.terminalFailure)
              core.setFailed('HH_CI_METADATA_OWNER_TOKEN_PERMISSION_DENIED: request not verified');
            if(!result.dryRun && result.status!=='CI_WAKE_REQUESTED' && !result.terminalFailure)
              core.setFailed('HH_CI_METADATA_WAKE_BLOCKED: '+result.reason);
