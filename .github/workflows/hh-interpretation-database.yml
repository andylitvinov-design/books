name: Holistic House interpretation registry database verification
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ['codex/public-book-library']
    paths:
      - 'tests/helpers/interpretation-db-isolation.mjs'
      - 'tests/helpers/trauma-context-fixtures.mjs'
      - 'tests/helpers/legacy-source-fingerprint.mjs'
      - 'tests/helpers/historical-interpretation-coverage.mjs'
      - 'scripts/compact-interpretation-sql.mjs'
      - 'docs/assessments/interpretation-registry-readback.sql'
      - 'app/api/app/assessments/**'
      - 'app/api/app/\[...path\]/route.js'
      # The exact dispatcher is cross-domain. Node's BASE-trusted glob reader
      # does not match GitHub's escaped Next route, so also use this narrowly
      # bounded one-segment route with explicit Messenger exclusions.
      - 'app/api/app/*/route.js'
      - '!app/api/app/direct-messages/**'
      - '!app/api/app/practitioner-client-messages/**'
      - '!app/api/app/notification-channels/**'
      - 'app/api/app/interpretations/**'
      - 'app/api/app/reports/**'
      - 'app/api/assessments/**'
      - 'lib/assessments/**'
      - 'lib/app/assessment-*'
      - 'lib/app/interpretation-*'
      - 'lib/app/report-*'
      - 'lib/app/repository.js'
      - 'lib/interpretation/**'
      - 'data/assessments/**'
      - 'tests/interpretation-*.mjs'
      - 'tests/ci-expensive-draft-ready-policy.test.mjs'
      - 'tests/assessment-interpretation*.mjs'
      - 'scripts/verify-interpretation*.mjs'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: hh-interpretation-database-${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.before != github.event.after && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.before != github.event.after }}
jobs:
  interpretation-database:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Dedicated fresh service. Never point this job at the application database.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hh_app_test
          POSTGRES_PASSWORD: synthetic-ci-admin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hh_app_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
      NODE_ENV: test
      HH_APP_TEST_RUNTIME: isolated
      HH_INTERPRETATION_DB_TEST: synthetic-only
      HH_TEST_ADMIN_DATABASE_URL: postgres://postgres:synthetic-ci-admin@127.0.0.1:5432/hh_app_test
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - name: Verify isolated transport and strict C1/C2 release gates
        run: node --test tests/interpretation-db-isolation.test.mjs tests/ci-expensive-draft-ready-policy.test.mjs
      - name: Native PostgreSQL schema, approved seed, readback and server loader
        run: node --conditions=react-server --test --test-concurrency=1 tests/interpretation-database.integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interpretation-native-db-proof
          path: artifacts/interpretation-db-proof.json
          if-no-files-found: ignore
