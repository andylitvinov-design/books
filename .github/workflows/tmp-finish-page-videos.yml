name: Prepare six page video release
on:
  push:
    branches: ['chatgpt/finish-six-page-videos-2026-10-01']
    paths: ['.github/workflows/tmp-finish-page-videos.yml']
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11175858341'
          repository: andylitvinov-design/books
          run-id: '36890376262'
          github-token: ${{ github.token }}
          path: /tmp/approved-en
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11177452279'
          repository: andylitvinov-design/books
          run-id: '36893260283'
          github-token: ${{ github.token }}
          path: /tmp/approved-ru
          merge-multiple: true
      - name: Make narrow presentation and readiness fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          entries = [
            ('home', 'en', '02', 'ed202847a43a96b918308aa972177b34', 'home-en-v2', '8f1ae79ad0764324cbf6023db4761a8ff4e9c55c0a085259beccd671cae4da04'),
            ('services', 'en', '02', '48105a2f2228e7cb3a67391e97acaf8b', 'services-en-v2', 'eba5a152b8fba5293b6046f8569205cafb641c852709f284893308b6846fdad6'),
            ('homeopathy', 'en', '02', '34df311e461509433b45929908a9097a', 'homeopathy-en-v2', '9b2386a700b110249f285ff14d01c692e315a312083b46eab59b99930b0c6261'),
            ('home', 'ru', '01', '388a04b39ebf215ae656bcd22d0d0847', 'home-ru-v1', '2d17a8df9b325272d4c1049cb7757733a00fbafed652b49ffdd0bdf68bc8b794'),
            ('services', 'ru', '01', '79c2845577865979cd95ac40a08fc01a', 'services-ru-v1', 'b0c25264bd03966fea4a07e2b654a5d12dc2066dd4fe91845facc06352257819'),
            ('homeopathy', 'ru', '01', '0f984780d06948b1e78166e6e553e4e9', 'homeopathy-ru-v1', '9c186803e5bfed18f3eecac5c4be3cf8fb90c24a1821b1315ab6adf67f31f335'),
          ]
          p = Path('components/site-video-player.tsx')
          text = p.read_text()
          assert hashlib.sha1(('blob ' + str(len(p.read_bytes())) + '\0').encode() + p.read_bytes()).hexdigest() == '84c8c69be594b94dfa7689bb1c97c0e1652acc69'
          for topic, locale, version, video_id, poster, digest in entries:
            src = Path('/tmp/approved-' + locale) / f'2026-10-01_holistic-house_{topic}_{locale}_avatarV_16x9_v{version}_poster.webp'
            data = src.read_bytes()
            assert hashlib.sha256(data).hexdigest() == digest
            dest = '/images/holistic-house/video-posters/' + poster + '.webp'
            Path('public' + dest).write_bytes(data)
            key = video_id if video_id[0].isalpha() else '"' + video_id + '"'
            old = '/images/holistic-house/andy-about.png' if locale == 'en' else '/images/holistic-house/video-posters/psychic-alchemy-ru-v1.webp'
            marker = f'  {key}: "{old}",'
            assert text.count(marker) == 1, marker
            text = text.replace(marker, f'  {key}: "{dest}",')
          marker = '\nfunction videoDuration(seconds?: number) {'
          assert text.count(marker) == 1
          ids = '\n'.join('  "' + item[3] + '",' for item in entries)
          text = text.replace(marker, '\n// Exact published page renders only; About and future editor replacements are unchanged.\nconst minimalPageVideoIds = new Set([\n' + ids + '\n]);\n' + marker)
          old = 'minimal={minimal} posterPriority={posterPriority} className={className}'
          assert text.count(old) == 1
          text = text.replace(old, 'minimal={minimal || minimalPageVideoIds.has(source.heygenId ?? "")} posterPriority={posterPriority} className={className}')
          old = '  const [playing, setPlaying] = useState(false);'
          assert text.count(old) == 1
          text = text.replace(old, old + '\n  // SSR may appear before React attaches handlers on a slow connection.\n  const [interactive, setInteractive] = useState(false);\n  useEffect(() => { setInteractive(true); }, []);')
          old = '<button className="site-video-play" type="button"'
          assert text.count(old) == 1
          text = text.replace(old, '<button className="site-video-play" type="button" disabled={!interactive} aria-busy={!interactive}')
          p.write_text(text)
          w = Path('.github/workflows/site-video-browser.yml')
          text = w.read_text()
          marker = "      - 'scripts/verify-site-video-browser.mjs'"
          assert text.count(marker) == 2
          text = text.replace(marker, marker + "\n      - 'scripts/verify-page-video-release.mjs'\n      - 'tests/page-video-release.test.mjs'")
          marker = '      - name: Check production read-only after release'
          assert text.count(marker) == 1
          text = text.replace(marker, '      - name: Check six page previews and hydration-safe first clicks\n        run: |\n          node --test tests/page-video-release.test.mjs\n          node scripts/verify-page-video-release.mjs\n' + marker)
          marker = '      - uses: actions/upload-artifact@v4'
          assert text.count(marker) == 1
          text = text.replace(marker, "      - name: Verify all six released EN/RU videos with full natural playback\n        if: github.event_name == 'push'\n        run: node scripts/verify-page-video-release.mjs --live\n" + marker)
          w.write_text(text)
          # Remove this one-off importer from the final squash diff.
          Path('.github/workflows/tmp-finish-page-videos.yml').unlink()
          PY
      - name: Verify immutable IDs and poster bytes
        run: |
          node --test tests/page-video-release.test.mjs tests/ru-about-video-presentation.test.mjs tests/psychic-alchemy-intro-video.test.mjs tests/site-videos.test.mjs tests/site-video-defaults.test.mjs
          node --check scripts/verify-page-video-release.mjs
          git diff --check
      - name: Commit scoped release changes without touching production
        run: |
          git config user.name 'andylitvinov-design'
          git config user.email 'andy.litvinov@gmail.com'
          git add components/site-video-player.tsx .github/workflows/site-video-browser.yml .github/workflows/tmp-finish-page-videos.yml public/images/holistic-house/video-posters/
          git commit -m 'Use real six-video previews and prevent pre-hydration dead clicks'
          git push origin HEAD:refs/heads/chatgpt/finish-six-page-videos-2026-10-01
