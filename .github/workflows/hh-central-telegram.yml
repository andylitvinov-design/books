name: HH Central Telegram single-secret hub
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'vercel.json'
      - 'lib/practitioners/telegram-hub.mjs'
      - 'lib/practitioners/council-telegram-archive.mjs'
      - 'lib/practitioners/council-telegram-delivery.js'
      - 'lib/practitioners/council-free-models.mjs'
      - 'tests/practitioner-council-free-models.test.mjs'
      - 'supabase/migrations/*free_ai_council_cached_daily*.sql'
      - 'app/api/internal/telegram-hub/route.js'
      - 'app/api/internal/council-archive-telegram/route.js'
      - 'tests/practitioner-telegram-hub.test.mjs'
      - 'tests/practitioner-telegram-owner-ui.test.mjs'
      - 'app/admin/telegram-setup/**'
      - 'components/prescription-admin-header.jsx'
      - 'lib/practitioners/telegram-owner-setup.js'
      - 'supabase/migrations/*owner_telegram_test_receipt*.sql'
      - 'tests/telegram-owner-discovery.test.mjs'
      - 'tests/telegram-owner-pairing-contract.test.mjs'
      - 'lib/practitioners/telegram-owner-pairing.js'
      - 'supabase/migrations/*telegram_owner_verified_private_pairing*.sql'
      - 'lib/practitioners/telegram-owner-discovery.mjs'
      - 'app/api/internal/telegram-owner-discovery/route.js'
      - 'tests/app-housekeeping-cron.test.mjs'
      - 'tests/practitioner-daily-telegram.test.mjs'
      - '.github/workflows/hh-central-telegram.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and existing cron regressions
        run: |
          node --check lib/practitioners/telegram-owner-pairing.js
          node --check lib/practitioners/telegram-owner-setup.js
          node --check app/admin/telegram-setup/actions.js
          node --check lib/practitioners/telegram-owner-discovery.mjs
          node --check app/api/internal/telegram-owner-discovery/route.js
          node --check lib/practitioners/telegram-hub.mjs
          node --check lib/practitioners/council-telegram-archive.mjs
          node --check lib/practitioners/council-telegram-delivery.js
          node --check lib/practitioners/council-free-models.mjs
          node --check app/api/internal/telegram-hub/route.js
          node --check app/api/internal/council-archive-telegram/route.js
          node --test tests/practitioner-council-free-models.test.mjs tests/practitioner-telegram-owner-ui.test.mjs tests/telegram-owner-pairing-contract.test.mjs tests/telegram-owner-discovery.test.mjs tests/practitioner-telegram-hub.test.mjs tests/practitioner-daily-telegram.test.mjs tests/app-housekeeping-cron.test.mjs
