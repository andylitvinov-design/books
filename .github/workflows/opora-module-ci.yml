name: OPORA module recommendation unit checks
on:
  push:
    branches:
      - codex/opora-module-router-20261014
  pull_request:
    branches:
      - codex/public-book-library
permissions:
  contents: read
concurrency:
  group: opora-modules-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Verify pinned rating polarity, legacy 0–10 charts and clear question labels
        run: node --test tests/my-course-moment-trends.test.mjs tests/opora-baseline-presence-background.test.mjs tests/opora-as57-calm-morning.test.mjs
      - name: Verify all 70 lessons × 15 screens, practical interactions and baseline routing
        run: node --test tests/opora-all-slides-matrix.test.mjs tests/antistress-module-routing.test.mjs tests/my-course-programs.test.mjs tests/course-test-sequence.test.mjs tests/course-entry-selector.test.mjs tests/course-baseline-explainer.test.mjs tests/course-compact-owner-ui.test.mjs tests/opora-post-assessment-screen.test.mjs
      - name: Verify AS2 day-one state-first practice and lesson receipt
        run: node --test tests/opora-day-one-inner-state.test.mjs tests/opora-day-one-interactive.test.mjs tests/opora-antistress-outcomes-v3.test.mjs tests/opora-practice-first-session.test.mjs tests/opora-antistress-jsx-parse.test.mjs
      - name: Verify all remaining OPORA state-to-support screens and receipts
        run: node --test tests/opora-all-days-state-journey.test.mjs tests/opora-day-one-inner-state.test.mjs tests/opora-day-one-interactive.test.mjs tests/opora-practice-first-session.test.mjs tests/opora-antistress-jsx-parse.test.mjs
      - name: Verify Anti-Stress AS5 curriculum, seven compact screens and public blueprints
        run: node --test tests/opora-seven-skills-v5.test.mjs tests/opora-course-blueprint-methods.test.mjs tests/opora-antistress-course-landing.test.mjs tests/opora-antistress-complete-course.test.mjs tests/opora-15-stage1.test.mjs
      - name: Verify online learning methodology and no-Skip answers
        run: node --test tests/opora-as5-2-methodology-contract.test.mjs tests/opora-as53-210-guided-feedback-contract.test.mjs tests/opora-as54-online-learning-no-skip-contract.test.mjs
      - name: Verify versioned V6 fifteen-screen lessons, safe mobile player, strict evidence and V3/V5 compatibility
        run: node --test tests/opora-as54-live-v6.test.mjs tests/opora-as54-live-player-journey.test.mjs tests/opora-scenic-lesson-all-steps.test.mjs
      - name: Verify AS5.5 distinct scenarios, if-then plans, truthful attempts and pinned previous cycles
        run: node --test tests/opora-as55-methodology-live.test.mjs
      - name: Verify AS-5.5 keyboard focus trap, process honesty, no-plan and individual exercise cases
        run: node --test tests/opora-as55-safe-learning-live.test.mjs
      - name: Verify experience-first AS-5.6 practices, real bilingual feedback and safe V7-only save
        run: node --test tests/opora-as56-experience-first.test.mjs tests/opora-as56-authenticated-pipeline.test.mjs tests/opora-support-second-screen.test.mjs tests/opora-as56-brief-practice.test.mjs tests/opora-as56-browser-fixture.test.mjs tests/opora-as57-calm-morning.test.mjs tests/opora-post-save-course-program.test.mjs tests/opora-owl-guidance-across-slides.test.mjs
      - name: Verify 28 full AS-5.5 bilingual lesson sessions and trilingual public course promises
        run: node --test tests/opora-as55-28-day-end-to-end-acceptance.test.mjs tests/opora-as55-active-passport.test.mjs
      - name: Verify photo-first calm Day 1, optional check-ins and compact iPhone UI
        run: node --test tests/opora-calm-day-one-mobile.test.mjs

  as56-mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      CI: 'true'
      HH_APP_TEST_RUNTIME: isolated
      HH_TEST_BROWSER: ${{ matrix.browser }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate the isolated AS5.6 fixture and safety regressions
        run: node --test tests/opora-as56-brief-practice.test.mjs tests/opora-as56-browser-fixture.test.mjs tests/opora-as57-calm-morning.test.mjs
      - name: Install isolated browser tools
        run: |
          npm install --prefix /tmp/hh-opora-browser --no-audit --no-fund @playwright/test@1.63.0
          ln -s /tmp/hh-opora-browser/node_modules/@playwright node_modules/@playwright
          /tmp/hh-opora-browser/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - name: Verify hydrated Calm Morning RU/EN/ES at 320, 360 and 390 pixels
        run: node scripts/verify-opora-as56-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opora-as56-mobile-${{ matrix.browser }}-${{ github.run_id }}
          path: artifacts/opora-as56-mobile/${{ matrix.browser }}/
          retention-days: 7
