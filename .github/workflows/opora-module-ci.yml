name: OPORA module recommendation unit checks
on:
  push:
    branches:
      - codex/opora-module-router-20261014
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - codex/public-book-library
    paths:
      - 'app/**/courses/**'
      - 'app/**/academy/**'
      - 'app/**/my-course/**'
      - 'components/opora-*'
      - 'components/antistress-*'
      - 'components/anti-stress-*'
      - 'components/my-course*'
      - 'lib/opora/**'
      - 'lib/antistress/**'
      - 'lib/course/**'
      - 'data/academy/*antistress*'
      - 'tests/opora-*.mjs'
      - 'tests/antistress-*.mjs'
      - 'tests/my-course-moment-trends.test.mjs'
      - 'tests/my-course-programs.test.mjs'
      - 'tests/course-baseline-explainer.test.mjs'
      - 'tests/course-compact-owner-ui.test.mjs'
      - 'tests/course-entry-selector.test.mjs'
      - 'tests/course-test-sequence.test.mjs'
      - '.github/workflows/opora-module-ci.yml'
      - 'scripts/verify-opora-*.mjs'
      - 'scripts/ci-opora-lock-scope.mjs'
      - 'tests/ci-opora-lock-scope.test.mjs'
      - 'middleware.ts'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: opora-modules-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.action == 'synchronize' }}
jobs:
  module-routing:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify live PR readiness before costly CI
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-pr-readiness.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Stage checksum-verified FFmpeg before npm lifecycle
        uses: ./.github/actions/ci-ffmpeg-static
      - run: npm ci --no-audit --no-fund
      - name: Materialize checksum-verified FFmpeg for package runtime
        uses: ./.github/actions/ci-ffmpeg-static
        with:
          stage: materialize
      - name: Verify isolated server dependency scope policy
        run: node --test tests/ci-opora-lock-scope.test.mjs
      - name: Verify all 14 × EN/RU/ES second-screen skill explanations and unchanged save flow
        run: node --test tests/opora-support-second-screen.test.mjs
      - name: Verify AS-6.0 five channels per day, 14 practical lessons, music and historical sessions
        run: node --test tests/opora-as59-seven-practical-skills.test.mjs tests/opora-as60-integrated-journey.test.mjs tests/opora-as60-meditation-audio-programme.test.mjs tests/opora-midlesson-music.test.mjs
      - name: Verify pinned rating polarity, legacy 0–10 charts and clear question labels
        run: node --test tests/my-course-moment-trends.test.mjs tests/opora-baseline-presence-background.test.mjs tests/opora-as57-calm-morning.test.mjs
      - name: Verify all 70 lessons × 15 screens, practical interactions and baseline routing
        run: node --test tests/opora-all-slides-matrix.test.mjs tests/antistress-module-routing.test.mjs tests/my-course-programs.test.mjs tests/course-test-sequence.test.mjs tests/course-entry-selector.test.mjs tests/course-baseline-explainer.test.mjs tests/course-compact-owner-ui.test.mjs tests/opora-post-assessment-screen.test.mjs
      - name: Verify AS2 day-one state-first practice and lesson receipt
        run: node --test tests/opora-day-one-inner-state.test.mjs tests/opora-day-one-interactive.test.mjs tests/opora-antistress-outcomes-v3.test.mjs tests/opora-practice-first-session.test.mjs tests/opora-antistress-jsx-parse.test.mjs
      - name: Verify all remaining OPORA state-to-support screens and receipts
        run: node --test tests/opora-all-days-state-journey.test.mjs
      - name: Verify Anti-Stress AS5 curriculum, seven compact screens and public blueprints
        run: node --test tests/opora-seven-skills-v5.test.mjs tests/opora-course-blueprint-methods.test.mjs tests/opora-antistress-course-landing.test.mjs tests/opora-antistress-complete-course.test.mjs tests/opora-15-stage1.test.mjs
      - name: Verify first-week course preview and explicit enrolment before OAuth or server start
        run: node --test tests/opora-first-week-enrolment-consent.test.mjs
      - name: Verify online learning methodology and no-Skip answers
        run: node --test tests/opora-as5-2-methodology-contract.test.mjs tests/opora-as53-210-guided-feedback-contract.test.mjs tests/opora-as54-online-learning-no-skip-contract.test.mjs
      - name: Verify versioned V6 fifteen-screen lessons, safe mobile player, strict evidence and V3/V5 compatibility
        run: node --test tests/opora-as54-live-v6.test.mjs tests/opora-as54-live-player-journey.test.mjs tests/opora-scenic-lesson-all-steps.test.mjs
      - name: Verify AS5.5 distinct scenarios, if-then plans, truthful attempts and pinned previous cycles
        run: node --test tests/opora-as55-methodology-live.test.mjs
      - name: Verify AS-5.5 keyboard focus trap, process honesty, no-plan and individual exercise cases
        run: node --test tests/opora-as55-safe-learning-live.test.mjs
      - name: Verify experience-first AS-5.6 practices, real bilingual feedback and safe V7-only save
        run: node --test tests/opora-gentle-immersion.test.mjs tests/opora-as56-authenticated-pipeline.test.mjs tests/opora-ocean-outro.test.mjs tests/opora-as56-experience-first.test.mjs tests/opora-as56-brief-practice.test.mjs tests/opora-as56-browser-fixture.test.mjs tests/opora-post-save-course-program.test.mjs tests/opora-owl-guidance-across-slides.test.mjs
      - name: Verify 28 full AS-5.5 bilingual lesson sessions and trilingual public course promises
        run: node --test tests/opora-as55-28-day-end-to-end-acceptance.test.mjs tests/opora-as55-active-passport.test.mjs
      - name: Verify photo-first calm Day 1, optional check-ins and compact iPhone UI
        run: node --test tests/opora-calm-day-one-mobile.test.mjs

  as56-mobile-browser:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium"]' || '["chromium","webkit"]') }}
    env:
      CI: 'true'
      HH_APP_TEST_RUNTIME: isolated
      HH_TEST_BROWSER: ${{ matrix.browser }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify live PR readiness before costly CI
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-pr-readiness.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prove isolated server dependency scope from immutable tested BASE
        id: lock_scope
        shell: bash
        env:
          HH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HH_EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          full=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] &&
             git show HEAD^1:scripts/ci-opora-lock-scope.mjs > "$RUNNER_TEMP/opora-lock-scope.mjs" 2>/dev/null; then
            result="$(node "$RUNNER_TEMP/opora-lock-scope.mjs")" || result=true
            if [[ "$result" == false ]]; then full=false; fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [[ "$full" == false ]]; then
            echo 'OPORA browser not impacted: isolated reviewed server dependency addition; mandatory module-routing and Core still required. No browser run claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage checksum-verified FFmpeg before npm lifecycle
        if: steps.lock_scope.outputs.full != 'false'
        uses: ./.github/actions/ci-ffmpeg-static
      - run: npm ci --no-audit --no-fund
        if: steps.lock_scope.outputs.full != 'false'
      - name: Materialize checksum-verified FFmpeg for package runtime
        if: steps.lock_scope.outputs.full != 'false'
        uses: ./.github/actions/ci-ffmpeg-static
        with:
          stage: materialize
      - name: Validate the isolated AS5.6 fixture and safety regressions
        # On ready PRs module-routing already executes these exact three tests.
        # The required aggregate still waits for module-routing AND real browser evidence.
        if: github.event_name != 'pull_request'
        run: node --test tests/opora-as56-brief-practice.test.mjs tests/opora-as56-browser-fixture.test.mjs tests/opora-as57-calm-morning.test.mjs
      - name: Restore trusted production-owned Playwright browsers (read-only)
        if: steps.lock_scope.outputs.full != 'false'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: hh-public-browser-blobs-${{ runner.os }}-${{ runner.arch }}-pw1.63.0-v1
      - name: Install isolated browser tools
        if: steps.lock_scope.outputs.full != 'false'
        run: |
          npm install --prefix /tmp/hh-opora-browser --no-audit --no-fund @playwright/test@1.63.0
          ln -s /tmp/hh-opora-browser/node_modules/@playwright node_modules/@playwright
          # PR runs only Chromium; production push retains WebKit and its OS dependency gate.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            /tmp/hh-opora-browser/node_modules/.bin/playwright install "$HH_TEST_BROWSER"
          else
            /tmp/hh-opora-browser/node_modules/.bin/playwright install --with-deps "$HH_TEST_BROWSER"
          fi
          node scripts/ci-playwright-launch-proof.cjs "$HH_TEST_BROWSER"
      - name: Verify hydrated Calm Morning RU/EN/ES at 320, 360, 390 and 430 pixels
        if: steps.lock_scope.outputs.full != 'false'
        run: node scripts/verify-opora-as56-browser.mjs
      - name: Verify OPORA course-ready mobile viewport and visible Start CTA
        if: steps.lock_scope.outputs.full != 'false'
        run: node scripts/verify-opora-course-ready-viewport.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.lock_scope.outputs.full != 'false'
        with:
          name: opora-as56-mobile-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            artifacts/opora-as56-mobile/${{ matrix.browser }}/
            artifacts/opora-ready-mobile/${{ matrix.browser }}/
          retention-days: 7
