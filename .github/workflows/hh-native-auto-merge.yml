name: HH native auto-merge
on:
  pull_request_target:
    # Synchronize only wakes the separate stale-HEAD janitor job. Native
    # auto-merge itself still waits for a successful Core CI completion.
    types: [opened, reopened, ready_for_review, synchronize]
    branches: ['codex/public-book-library']
  # A completed *interrupted* core run can be retried once. Workflow-run hooks
  # require this trusted workflow to also be present on the GitHub default branch.
  # Core must verify its own gate and specialist CI before the merge review. Listening
  # to every specialist produced redundant callbacks and exhausted the shared
  # owner PAT's GitHub API rate budget (real 403 on 2026-11-01).
  workflow_run:
    workflows:
      - 'HH PR core release gate'
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: read
jobs:
  enable:
    name: event-driven exact-head auto-merge reevaluation
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.action != 'synchronize' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # This privileged workflow executes trusted base/default-branch code only.
      # Never checkout or execute code from the PR head with this token.
      - name: Checkout trusted default-branch merge policy
        uses: actions/checkout@v4
        with:
          ref: codex/bootstrap-books
          persist-credentials: false
      - name: Checkout protected production classifier
        uses: actions/checkout@v4
        with:
          ref: codex/public-book-library
          path: .hh-merge-policy-production
          persist-credentials: false
      - name: Verify live PR and completed exact-head CI
        id: ready
        uses: actions/github-script@v7
        with:
          # Read-only preflight uses per-repository Actions token; reserve
          # the scarce owner PAT for actual protected merge.
          github-token: ${{ github.token }}
          script: |
            const {owner, repo} = context.repo;
            const fullRepo = owner + "/" + repo;
            let number = null;
            let expectedHead = null;
            let completedRunId = null;
            const log = message => core.info("CI_AUTO_MERGE: " + message);
            if (context.eventName === "pull_request_target") {
              const source = context.payload.pull_request;
              if (!source || source.head?.repo?.full_name !== fullRepo ||
                  source.base?.ref !== "codex/public-book-library") return;
              number = source.number;
              expectedHead = source.head.sha;
            } else if (context.eventName === "workflow_run") {
              const run = context.payload.workflow_run;
              if (!run || run.event !== "pull_request" || run.conclusion !== "success" ||
                  run.repository?.full_name !== fullRepo ||
                  (run.head_repository?.full_name && run.head_repository.full_name !== fullRepo)) return;
              completedRunId = run.id;
              const references = [...new Set((run.pull_requests || [])
                .filter(item => item.base?.ref === "codex/public-book-library")
                .map(item => item.number).filter(Number.isInteger))];
              if (references.length === 1) {
                number = references[0];
              } else {
                if (!run.head_branch) return;
                const matches = await github.rest.pulls.list({
                  owner, repo, head: owner + ":" + run.head_branch, state: "open", per_page: 100
                });
                const candidates = matches.data.filter(pr =>
                  pr.base?.ref === "codex/public-book-library" &&
                  pr.head?.repo?.full_name === fullRepo);
                if (candidates.length !== 1) {
                  log("SKIP ambiguous current PR for completed workflow " + run.id);
                  return;
                }
                number = candidates[0].number;
              }
            } else return;
            if (!Number.isInteger(number)) return;
            let pr = (await github.rest.pulls.get({owner, repo, pull_number: number})).data;
            // Mergeability may be temporarily unknown immediately after Core CI.
            // Recover inside the successful event, not in the next hourly Sweep.
            for (const delayMs of [1500, 3000, 5000, 8000]) {
              if (pr.mergeable !== null) break;
              log("WAIT GitHub mergeability computation for PR #" + number);
              await new Promise(resolve => setTimeout(resolve, delayMs));
              pr = (await github.rest.pulls.get({owner, repo, pull_number: number})).data;
            }
            if (pr.state !== "open" || pr.draft || pr.base.ref !== "codex/public-book-library" ||
                pr.head.repo?.full_name !== fullRepo || !/^[0-9a-f]{40}$/.test(pr.head.sha) ||
                pr.mergeable !== true || pr.mergeable_state === "dirty" ||
                (expectedHead && expectedHead !== pr.head.sha)) {
              log("SKIP Draft, conflict, changed HEAD, changed base or non-mergeable PR #" + number);
              return;
            }
            // GitHub's temporarily empty hosted required-check list can merge immediately.
            // Therefore ARM only after actual trusted PR CI has completed successfully.
            // A pull_request workflow can report a synthetic test-merge head_sha.
            // Its immutable PR association, not run.head_sha, identifies the actual
            // source HEAD and the production base against which CI ran.
            // Core's hh-specialist job validates relevant specialist CI. The
            // base SHA is checked independently by the trusted freshness
            // classifier below, allowing proven non-sensitive base advancement.
            const matchesCurrentSource = run => run.event === "pull_request" &&
              run.head_branch === pr.head.ref && (run.pull_requests || []).some(item =>
                item.number === number &&
                item.head?.sha === pr.head.sha && item.head?.ref === pr.head.ref &&
                item.base?.ref === "codex/public-book-library");
            // Search ONLY trusted Core runs, never every optional PR workflow.
            // The current HEAD's Core gate covers all mandatory Specialist jobs;
            // GitHub still enforces the production branch's required contexts.
            // Keep bounded pagination, and fail closed if the newest Core
            // evidence for this exact source cannot be established.
            const pageSize = 100, maxPages = 3;
            const currentRuns = [];
            let complete = false;
            for (let pageNumber = 1; pageNumber <= maxPages; pageNumber++) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: "hh-pr-core-release.yml",
                event: "pull_request", branch: pr.head.ref,
                per_page: pageSize, page: pageNumber
              });
              const batch = response.data.workflow_runs;
              const count = response.data.total_count;
              if (!Array.isArray(batch) || batch.length === 0 ||
                  !Number.isSafeInteger(count) || count < currentRuns.length + batch.length) {
                log("SKIP incomplete branch-scoped CI pagination for PR #" + number);
                return;
              }
              currentRuns.push(...batch);
              // GitHub returns runs newest first; old HEAD forms the boundary.
              // If it cannot be established within the bounded budget, fail closed.
              if (currentRuns.length >= count || batch.length < pageSize ||
                  !matchesCurrentSource(batch[batch.length - 1])) {
                complete = true;
                break;
              }
            }
            if (!complete) {
              log("SKIP current source HEAD extends beyond bounded CI pages for PR #" + number);
              return;
            }
            const latest = new Map();
            for (const run of currentRuns) {
              if (!matchesCurrentSource(run)) continue;
              const key = String(run.workflow_id || run.path || run.name);
              const old = latest.get(key);
              const newer = !old || (Date.parse(run.created_at) > Date.parse(old.created_at)) ||
                (run.created_at === old.created_at && run.id > old.id);
              if (newer) latest.set(key, run);
            }
            const observed = [...latest.values()];
            if (completedRunId && !observed.some(run => run.id === completedRunId)) {
              log("SKIP stale or misassociated CI completion " + completedRunId + " for PR #" + number);
              return;
            }
            const coreRun = observed.find(run =>
              run.name === "HH PR core release gate" &&
              String(run.path || "").split("@")[0] === ".github/workflows/hh-pr-core-release.yml");
            if (!coreRun || coreRun.status !== "completed" || coreRun.conclusion !== "success") {
              log("SKIP core CI not green on current HEAD of PR #" + number);
              return;
            }
            // Require the real Core job on the current PR's verified workflow.
            // A successful workflow without this job is not source QA.
            const jobPage = (await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: coreRun.id, per_page: 100, filter: "latest"
            })).data;
            // Use the real exact-run named jobs. No absent/skipped/duplicate job
            // can satisfy required evidence, including during the transition.
            const jobs = jobPage.jobs;
            if (!Array.isArray(jobs) || !Number.isSafeInteger(jobPage.total_count) ||
                jobPage.total_count > 100 || jobPage.total_count !== jobs.length) {
              log("SKIP incomplete Core job evidence for PR #" + number);
              return;
            }
            const passed = name => {
              const matching = jobs.filter(job => job.name === name);
              return matching.length === 1 && matching[0].status === "completed" &&
                matching[0].conclusion === "success";
            };
            // The branch's actual required contexts must be one of the
            // reviewed old, new or transitional sets. No zero-required fallback.
            const branchProtection = (await github.rest.repos.getBranch({
              owner, repo, branch: "codex/public-book-library"
            })).data;
            const required = branchProtection.protection?.required_status_checks?.contexts;
            const allowedRequiredSets = new Map([
              ["release-ready", ["hh-core-verified", "hh-specialist", "release-ready"]],
              ["hh-core-verified,hh-specialist", ["hh-core-verified", "hh-specialist"]],
              ["hh-merge-check,release-ready", ["hh-merge-check", "release-ready"]],
              ["hh-merge-check", ["hh-merge-check"]]
            ]);
            const signature = Array.isArray(required) ?
              [...new Set(required)].sort().join(",") : "";
            const need = allowedRequiredSets.get(signature);
            if (!branchProtection.protected || !Array.isArray(required) ||
                required.length !== new Set(required).size || !need) {
              log("SKIP unknown, empty or partially migrated branch protection for PR #" + number);
              return;
            }
            const notPassed = need.filter(name => !passed(name));
            if (notPassed.length) {
              log("SKIP current Core status missing, skipped or red for PR #" +
                number + ": " + notPassed.join(","));
              return;
            }
            // Optional unrelated workflows may still be running. Do not
            // confuse them with the mandatory Core + Specialist release gate.
            // Do not modify branches or mark checks green; GitHub still enforces
            // current effective protection, unresolved discussions and merge method.
            core.setOutput("eligible", "true");
            core.setOutput("pr", String(number));
            core.setOutput("core_run", String(coreRun.id));
            core.setOutput("head", pr.head.sha);
            core.setOutput("base", pr.base.sha);
            core.setOutput("branch", pr.head.ref);
            log("READY PR #" + number + " HEAD " + pr.head.sha.slice(0,12) +
              " after latest exact-head Core and required same-run jobs");
      - name: Verify same-run unified gate and current sensitive production base
        id: freshness
        if: steps.ready.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo,fullRepo=owner+"/"+repo;
            const number=Number('${{ steps.ready.outputs.pr }}');
            const expectedHead='${{ steps.ready.outputs.head }}';
            const expectedBase='${{ steps.ready.outputs.base }}';
            const runId=Number('${{ steps.ready.outputs.core_run }}');
            if(!Number.isSafeInteger(runId)||runId<1)return;
            const pr=(await github.rest.pulls.get({owner,repo,pull_number:number})).data;
            if(pr.state!=="open"||pr.draft||pr.base?.ref!=="codex/public-book-library"||
               pr.base.sha!==expectedBase||pr.head?.sha!==expectedHead||
               pr.head.repo?.full_name!==fullRepo||pr.mergeable!==true||
               pr.mergeable_state==="dirty"){
              core.info("CI_AUTO_MERGE: PR changed before base verification");return;
            }
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:runId})).data;
            const page=(await github.rest.actions.listJobsForWorkflowRun({
              owner,repo,run_id:runId,per_page:100,filter:"latest"
            })).data;
            if(!Number.isSafeInteger(page.total_count)||page.total_count>100||
               !Array.isArray(page.jobs)||page.jobs.length!==page.total_count)return;
            const passed=name=>{
              const match=page.jobs.filter(j=>j.name===name);
              return match.length===1&&match[0].status==="completed"&&match[0].conclusion==="success";
            };
            if(!passed("hh-merge-check")||!passed("hh-specialist")){
              core.info("CI_AUTO_MERGE: unified or Specialist evidence missing");return;
            }
            const policy=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-base-freshness.cjs');
            const classifier=await policy.loadTrustedClassifier(process.env.GITHUB_WORKSPACE);
            const freshness=await policy.assessBaseFreshness({github,owner,repo,pr,...classifier,
              verifiedRunBase:()=>policy.coreRunBase(run,pr,fullRepo,run.check_suite_id)});
            if(!freshness.ok){
              core.info("CI_AUTO_MERGE: "+freshness.reason+" for PR #"+number);return;
            }
            core.setOutput("eligible","true");
            core.setOutput("verified_base",freshness.base);
            core.setOutput("requires_current_base",String(freshness.reason==="SENSITIVE_BASE_VERIFIED"));
      - name: Enable native auto-merge for this exact head
        if: steps.ready.outputs.eligible == 'true' && steps.freshness.outputs.eligible == 'true'
        env:
          # A repo-scoped token lets resulting merges trigger push workflows.
          # Preserve native auto-merge if the optional credential is absent.
          GH_TOKEN: ${{ secrets.HH_AUTOMERGE_TOKEN || github.token }}
          HH_HAS_AUTOMERGE_TOKEN: ${{ secrets.HH_AUTOMERGE_TOKEN != '' }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.ready.outputs.pr }}
          PR_HEAD: ${{ steps.ready.outputs.head }}
          PR_BASE_SHA: ${{ steps.ready.outputs.base }}
          PR_HEAD_BRANCH: ${{ steps.ready.outputs.branch }}
          PR_REQUIRES_CURRENT_BASE: ${{ steps.freshness.outputs.requires_current_base }}
          PR_VERIFIED_BASE: ${{ steps.freshness.outputs.verified_base }}
        run: |
          set -euo pipefail
          if [[ "$HH_HAS_AUTOMERGE_TOKEN" != true ]]; then
            echo '::warning::No repo-scoped auto-merge token: GitHub may suppress production push workflows.'
          fi
          # Stacked child PRs depend on the parent commit ancestry, so the parent
          # must use Merge Commit. Non-stacked PRs keep the original Squash policy.
          # Fail closed rather than accidentally arming Squash if discovery fails.
          if ! stacked_children="$(gh pr list --repo "$GH_REPO" --state open --base "$PR_HEAD_BRANCH" --json number --limit 1 --jq 'length')"; then
            echo '::error::Cannot classify stacked PR ancestry; refusing auto-merge' >&2
            exit 1
          fi
          case "$stacked_children" in
            0) merge_option=--squash; export HH_EXPECTED_MERGE_METHOD=SQUASH ;;
            1) merge_option=--merge; export HH_EXPECTED_MERGE_METHOD=MERGE ;;
            *) echo '::error::Unexpected stacked-child count; refusing auto-merge' >&2; exit 1 ;;
          esac
          # No duplicate ARM, wrong-method overwrite or stale-head merge.
          current="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json state,headRefOid,autoMergeRequest --jq '[.state,.headRefOid,(.autoMergeRequest.mergeMethod // "NONE")] | @tsv')"
          IFS=$'\t' read -r current_state current_head current_method <<< "$current"
          if [[ "$current_state" != OPEN || "$current_head" != "$PR_HEAD" ]]; then
            echo 'CI_AUTO_MERGE: SKIP PR merged/changed after CI preflight'
            exit 0
          fi
          if [[ "$current_method" == "$HH_EXPECTED_MERGE_METHOD" ]]; then
            echo 'CI_AUTO_MERGE: already armed; never issue direct merge'
            exit 0
          fi
          if [[ "$current_method" != NONE ]]; then
            echo '::error::Wrong existing auto-merge method; refusing silent override' >&2
            exit 1
          fi
          for ((attempt=1; attempt<=3; attempt++)); do
            fresh="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json state,isDraft,headRefOid,baseRefName --jq '(.state == "OPEN") and (.isDraft == false) and (.headRefOid == env.PR_HEAD) and (.baseRefName == "codex/public-book-library")')"
            if [[ "$fresh" != true ]]; then
              echo 'CI_AUTO_MERGE: SKIP target, state or HEAD changed before ARM'
              exit 0
            fi
            if [[ "$PR_REQUIRES_CURRENT_BASE" == true ]]; then
              current_base="$(gh api "repos/$GH_REPO/git/ref/heads/codex/public-book-library" --jq '.object.sha')"
              if [[ "$current_base" != "$PR_VERIFIED_BASE" ]]; then
                echo 'CI_AUTO_MERGE: SKIP production advanced since sensitive CI verification'
                exit 0
              fi
            fi
            if gh pr merge "$PR_NUMBER" --auto "$merge_option" --match-head-commit "$PR_HEAD" 2> "$RUNNER_TEMP/auto-merge-error"; then
              echo "CI_AUTO_MERGE: GitHub accepted ARM for PR #$PR_NUMBER at $PR_HEAD" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat "$RUNNER_TEMP/auto-merge-error" >&2
            if [[ "$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json headRefOid,autoMergeRequest --jq '.headRefOid == env.PR_HEAD and .autoMergeRequest.mergeMethod == env.HH_EXPECTED_MERGE_METHOD' 2>/dev/null)" == true ]]; then
              exit 0
            fi
            # Denied native ARM is a blocker, never a separate direct merge.
            if ! grep -Fq 'Unable to determine if workflow can be created or updated due to timeout' "$RUNNER_TEMP/auto-merge-error"; then
              exit 1
            fi
            if ((attempt < 3)); then sleep "$attempt"; fi
          done
          exit 1
  recover-interrupted-core:
    name: recover-interrupted-core
    # Mirror the script's cheap trust and eligibility checks before reserving a runner.
    # The script still revalidates all evidence before any rerun.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.name == 'HH PR core release gate' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt == 1 &&
      contains(fromJSON('["cancelled","timed_out","startup_failure","failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    concurrency:
      group: hh-core-interruption-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Retry proven infrastructure interruption once, never failed code
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo} = context.repo;
            const event = context.payload.workflow_run;
            const fullRepo = owner + "/" + repo;
            const retryConclusions = new Set(["cancelled","timed_out","startup_failure","failure"]);
            const log = message => core.info("CORE_CI_RECOVERY: " + message);
            if (!event || event.name !== "HH PR core release gate" ||
                event.path?.split("@")[0] !== ".github/workflows/hh-pr-core-release.yml" ||
                event.event !== "pull_request" || event.status !== "completed" ||
                event.repository?.full_name !== fullRepo ||
                event.head_repository?.full_name !== fullRepo ||
                !retryConclusions.has(event.conclusion) || event.run_attempt !== 1) {
              log("SKIP no trusted first-attempt interrupted core PR run");
              return;
            }
            const ageMs = Date.now() - Date.parse(event.created_at || "");
            if (!Number.isFinite(ageMs) || ageMs < 0 || ageMs > 2 * 60 * 60 * 1000) {
              log("SKIP unbounded/old workflow run");
              return;
            }
            const associated = (event.pull_requests || []).filter(pr =>
              Number.isInteger(pr.number) && /^[0-9a-f]{40}$/.test(pr.head?.sha || "") &&
              pr.base?.ref === "codex/public-book-library");
            if (associated.length !== 1) {
              log("SKIP missing or ambiguous exact-head PR association");
              return;
            }
            const reference = associated[0];
            const live = (await github.rest.pulls.get({owner,repo,pull_number:reference.number})).data;
            if (live.state !== "open" || live.draft || live.base.ref !== "codex/public-book-library" ||
                live.head.repo?.full_name !== fullRepo || live.head.ref !== event.head_branch ||
                live.head.sha !== reference.head.sha || live.mergeable === false ||
                live.mergeable_state === "dirty" ||
                (reference.base?.sha && reference.base?.sha !== live.base.sha)) {
              log("SKIP PR moved, changed base, became draft, or has conflicts");
              return;
            }
            // Never treat a code failure as recoverable infrastructure failure.
            // Zero-job runs have no code results; interrupted jobs may only be
            // retried when every job ended as cancelled/skipped/timed_out.
            const jobData = (await github.rest.actions.listJobsForWorkflowRun({
              owner,repo,run_id:event.id,per_page:100,filter:"latest"
            })).data;
            if (jobData.total_count > 100 || !Array.isArray(jobData.jobs)) {
              log("SKIP incomplete job listing");
              return;
            }
            const jobs = jobData.jobs;
            const interrupted = jobs.length === 0 ||
              (event.conclusion !== "failure" && jobs.every(job =>
                ["cancelled","skipped","timed_out"].includes(job.conclusion)));
            if (!interrupted) {
              log("SKIP actual code, security or policy job failure; repair the root instead");
              return;
            }
            const fresh = (await github.rest.actions.getWorkflowRun({
              owner,repo,run_id:event.id
            })).data;
            if (fresh.run_attempt !== 1 || fresh.status !== "completed" ||
                fresh.conclusion !== event.conclusion || fresh.head_sha !== event.head_sha) {
              log("SKIP run changed or already retried");
              return;
            }
            // Rerun does NOT mark checks successful, edit the PR, or bypass rules.
            // A second failure, or any changed HEAD, requires investigation.
            try {
              await github.rest.actions.reRunWorkflow({owner,repo,run_id:event.id});
              log("RERUN_ACCEPTED first-attempt interrupted workflow " + event.id +
                  " on exact PR #" + reference.number + "; current verified Core and specialist CI still required");
            } catch (error) {
              if ([403,404,409,422].includes(error.status)) {
                core.warning("CORE_CI_RECOVERY: rerun not permitted/eligible (HTTP " + error.status + ")");
              } else {
                throw error;
              }
            }
  prune-head:
    # Reuse trusted production workflow; no extra GitHub Actions workflow.
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.base.ref == 'codex/public-book-library' &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: hh-ci-prune-head-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Checkout trusted production only
        uses: actions/checkout@v4
        with:
          ref: codex/public-book-library
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test exact-HEAD cancellation policy before mutation
        run: node --test tests/ci-prune-stale-runs.test.mjs
      - name: Cancel ancestor-proven superseded queued or running PR HEADs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HH_CI_PRUNE_LIMIT: '60'
        run: node scripts/ci-prune-stale-runs.mjs
