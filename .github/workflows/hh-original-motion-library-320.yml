name: HH original motion library - one-time 320 MP4 build
on:
  push:
    branches: [codex/original-motion-320-20261103]
    paths:
      - scripts/build-original-motion-320.py
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type create-320 on this feature branch only"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: hh-original-motion-320-branch
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/codex/original-motion-320-20261103' && (github.event_name == 'push' || inputs.confirm == 'create-320')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Install image-only build dependency
        run: |
          python3 -m pip install --disable-pip-version-check --quiet --break-system-packages 'Pillow==11.3.0'
          ffmpeg -hide_banner -version | head -1
          ffprobe -hide_banner -version | head -1
      - name: Generate deterministic original motion art as 320 actual H.264 MP4
        run: python3 scripts/build-original-motion-320.py --verify --max-mebibytes 65
      - name: Verify all 320 real MP4, attribution, uniqueness and budget
        run: python3 scripts/build-original-motion-320.py --check-only --verify --max-mebibytes 65
      - name: Commit encoded media on the feature branch (never main)
        run: |
          git config user.name "holistic-house-video-builder[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/video-catalog/original-motion-scenes-v1.json public/videos/holistic-house/original-motion-v1/
          if git diff --cached --quiet; then
            echo "No new media to commit"; exit 0
          fi
          git commit -m "feat(video): add 320 distinct project-original motion MP4 masters"
          git push origin "HEAD:codex/original-motion-320-20261103"
