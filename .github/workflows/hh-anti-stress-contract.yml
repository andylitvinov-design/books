name: HH Anti-Stress contract
on:
  pull_request:
    branches: [feat/clarity-three-day-coaching-p0-20261126, codex/public-book-library]
    paths:
      - 'lib/coaching/anti-stress-*.mjs'
      - 'lib/coaching/coach-program-mode.mjs'
      - 'lib/coaching/logical-course-clock-engine.mjs'
      - 'lib/coaching/clarity-course-clock.mjs'
      - 'lib/app/anti-stress-runs.js'
      - 'app/api/app/anti-stress/**'
      - 'components/app/anti-stress-archive*'
      - 'components/anti-stress-result*'
      - 'tests/anti-stress-*.test.mjs'
      - '.github/workflows/hh-anti-stress-contract.yml'
permissions:
  contents: read
concurrency:
  group: anti-stress-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify domain, clock, consent and private archive contracts
        run: |
          node --check lib/app/anti-stress-runs.js
          node --check app/api/app/anti-stress/session/route.js
          node --test tests/anti-stress-therapy-course.test.mjs tests/anti-stress-runs.test.mjs tests/anti-stress-archive.test.mjs tests/clarity-course-clock.test.mjs
