name: Reports development programme isolated verification
on:
  push:
    branches: ['codex/reports-development-program-20261017', 'codex/public-book-library']
    paths:
      - '.github/workflows/hh-reports-development-program.yml'
      - 'components/app/development-program*'
      - 'components/app/app-workspace.jsx'
      - 'components/app/profile-domains.jsx'
      - 'lib/profile/development-program.js'
      - 'lib/app/development-goals.js'
      - 'app/api/app/**'
      # The Commander PR API is independently guarded by Core and PR Sweep Guard.
      - '!app/api/app/commander/**'
      - 'tests/reports-development-program.test.mjs'
      - 'tests/profile-portrait-test-suggestions.test.mjs'
      - 'tests/goal-profile-journey.test.mjs'
      - 'lib/profile/goal-profile.js'
      - 'components/app/goal-profile-panel.jsx'
      - 'components/app/goal-profile-panel.module.css'
      - 'lib/profile/portrait-test-suggestions.js'
      - 'lib/clients/session-delivery-service.js'
      - 'lib/documents/report-progress.js'
      - 'components/prescription-document.jsx'
      - 'components/admin-session-studio.jsx'
      - 'tests/client-report-before-after-rings.test.mjs'
      - 'tests/report-progress-before-after.test.mjs'
      - 'tests/session-publication-review.test.mjs'
      - 'tests/report-program-placement.test.mjs'
      - 'tests/daybook-report-index.test.mjs'
      - 'tests/uploaded-pdf-report.test.mjs'
      - 'tests/report-google-identity.test.mjs'
      - 'lib/app/report-client-crm-link.js'
      - 'supabase/migrations/20261126153747_hh_client_report_google_crm_claim_20261126.sql'
      - 'lib/consultations/report-program.mjs'
      - 'lib/app/daybook-report-index.js'
      - 'app/api/app/daybook-reports/route.js'
      - 'components/app/daybook-week-reports*'
      - '.github/workflows/hh-client-report-progress.yml'
      - 'components/client-session-page.jsx'
      - 'components/client-session.module.css'
      - 'public/images/holistic-house/report-lighthouse-coast.svg'
      - 'tests/client-report-coastal-v2.test.mjs'
      - '.github/workflows/hh-client-report-coastal-v2.yml'
      # Signed Telegram CRM provider ingress has dedicated CRM/App security owners, not report builder.
      - '!app/api/app/crm/messenger/webhook/**'
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'components/app/development-program*'
      - 'lib/profile/development-program.js'
      - 'lib/app/development-goals.js'
      - 'tests/reports-development-program.test.mjs'
      - 'tests/profile-portrait-test-suggestions.test.mjs'
      - 'tests/goal-profile-journey.test.mjs'
      - 'lib/profile/goal-profile.js'
      - 'components/app/goal-profile-panel.jsx'
      - 'components/app/goal-profile-panel.module.css'
      - 'lib/profile/portrait-test-suggestions.js'
      - '.github/workflows/hh-reports-development-program.yml'
      - 'lib/clients/session-delivery-service.js'
      - 'lib/documents/report-progress.js'
      - 'components/prescription-document.jsx'
      - 'components/admin-session-studio.jsx'
      - 'tests/client-report-before-after-rings.test.mjs'
      - 'tests/report-progress-before-after.test.mjs'
      - 'tests/session-publication-review.test.mjs'
      - 'tests/report-program-placement.test.mjs'
      - 'tests/daybook-report-index.test.mjs'
      - 'tests/uploaded-pdf-report.test.mjs'
      - 'tests/report-google-identity.test.mjs'
      - 'lib/app/report-client-crm-link.js'
      - 'supabase/migrations/20261126153747_hh_client_report_google_crm_claim_20261126.sql'
      - 'lib/consultations/report-program.mjs'
      - 'lib/app/daybook-report-index.js'
      - 'app/api/app/daybook-reports/route.js'
      - 'components/app/daybook-week-reports*'
      - '.github/workflows/hh-client-report-progress.yml'
      - 'components/client-session-page.jsx'
      - 'components/client-session.module.css'
      - 'public/images/holistic-house/report-lighthouse-coast.svg'
      - 'tests/client-report-coastal-v2.test.mjs'
      - '.github/workflows/hh-client-report-coastal-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hh-development-program-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.action == 'synchronize' }}
jobs:
  isolated-unit-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Test development programme and canonical sector calculations
        run: node --conditions=react-server --test tests/reports-development-program.test.mjs tests/profile-portrait-test-suggestions.test.mjs tests/portrait-sectors.test.mjs tests/psych-portrait.test.mjs tests/my-course-programs.test.mjs tests/goal-profile-journey.test.mjs
      - name: Check saved client report progress, before/after diagrams and safe republish
        run: node --test tests/report-progress-before-after.test.mjs tests/client-report-before-after-rings.test.mjs tests/session-publication-review.test.mjs tests/client-report-coastal-v2.test.mjs tests/report-program-placement.test.mjs tests/daybook-report-index.test.mjs tests/report-google-identity.test.mjs tests/uploaded-pdf-report.test.mjs
      # Security proposal preflight: isolated loopback DB, no production secrets.
      # The existing App R1 database gate remains mandatory when Ready.
      - name: Draft report CRM claim isolated Postgres preflight
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["codex/report-google-identity-gate-5564","codex/pdf-report-format-20261124"]'), github.event.pull_request.head.ref) }}
        env:
          CI: 'true'
          NODE_ENV: test
          HH_APP_TEST_RUNTIME: isolated
          HH_APP_ENABLED: 'true'
          HH_APP_SIGNUPS_ENABLED: 'true'
          HH_APP_GUEST_ENABLED: 'true'
          HH_APP_REPORTS_ENABLED: 'true'
          HH_APP_SUPABASE_URL: http://127.0.0.1:54329
          HH_APP_SUPABASE_PUBLISHABLE_KEY: synthetic-publishable-key
          HH_APP_DATABASE_URL: postgres://hh_app_ci_login:synthetic-ci-only@127.0.0.1:5432/hh_app_test
          HH_TEST_ADMIN_DATABASE_URL: postgres://postgres:synthetic-ci-admin@127.0.0.1:5432/hh_app_test
          HH_APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          HH_APP_ALLOWED_ORIGINS: http://127.0.0.1:3100
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f hh-report-crm-ci >/dev/null 2>&1 || true' EXIT
          docker run --rm -d --name hh-report-crm-ci -p 127.0.0.1:5432:5432 -e POSTGRES_DB=hh_app_test -e POSTGRES_PASSWORD=synthetic-ci-admin postgres:17-alpine
          for attempt in $(seq 1 30); do
            if docker exec hh-report-crm-ci pg_isready -U postgres -d hh_app_test; then break; fi
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 1
          done
          node --conditions=react-server --test --test-concurrency=1 --test-name-pattern='verified Google report claim atomically links' tests/app-database.integration.mjs
      - name: Lint newly created feature files
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npx --no-install eslint components/app/development-program.jsx lib/profile/development-program.js lib/profile/portrait-test-suggestions.js lib/app/development-goals.js lib/profile/goal-profile.js components/app/goal-profile-panel.jsx tests/profile-portrait-test-suggestions.test.mjs tests/goal-profile-journey.test.mjs
      - name: Verify production Next.js build without preview deployment
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/codex/public-book-library') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'codex/public-book-library') }}
        run: npm run build
