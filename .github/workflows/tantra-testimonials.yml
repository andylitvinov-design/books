name: Tantra testimonial verification
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ['codex/public-book-library']
    paths:
      - 'middleware.ts'
      - 'components/tantra-reiki-testimonials.tsx'
      - 'components/tantra-video-testimonials.tsx'
      - 'components/academy-video-player.tsx'
      - 'components/csp-navigation-boundary.tsx'
      - 'lib/csp-prehydration.js'
      - 'tests/tantra-video-lifecycle.test.mjs'
      - 'data/academy/tantra-reiki-full.generated.json'
      - 'data/academy/tantra-native-assets.json'
      - 'public/images/tantra-reiki/**'
      - 'scripts/verify-tantra-testimonials.mjs'
      - 'tests/video-csp-navigation.test.mjs'
      - '.github/workflows/tantra-testimonials.yml'
  push:
    branches: ['codex/public-book-library']
    paths:
      - 'middleware.ts'
      - 'components/tantra-reiki-testimonials.tsx'
      - 'components/tantra-video-testimonials.tsx'
      - 'components/academy-video-player.tsx'
      - 'components/csp-navigation-boundary.tsx'
      - 'lib/csp-prehydration.js'
      - 'tests/tantra-video-lifecycle.test.mjs'
      - 'data/academy/tantra-reiki-full.generated.json'
      - 'data/academy/tantra-native-assets.json'
      - 'public/images/tantra-reiki/**'
      - 'scripts/verify-tantra-testimonials.mjs'
      - 'tests/video-csp-navigation.test.mjs'
      - '.github/workflows/tantra-testimonials.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hh-tantra-browser-${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.before != github.event.after && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.before != github.event.after }}
jobs:
  browser:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Route sensitive CSP and verifier changes to real PR browsers
        id: risk
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HH_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HH_EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          full=true
          checked_head="$(git rev-parse HEAD^2 2>/dev/null || true)"
          checked_base="$(git rev-parse HEAD^1 2>/dev/null || true)"
          if [[ "$checked_head" == "$HH_EXPECTED_HEAD" && "$checked_base" == "$HH_EXPECTED_BASE" ]]; then
            git diff --no-renames --name-only -z "$checked_base" "$checked_head" > "$RUNNER_TEMP/tantra-changed.z"
            mapfile -d '' -t changed < "$RUNNER_TEMP/tantra-changed.z"
            if (( ${#changed[@]} > 0 )); then
              full=false
              for file in "${changed[@]}"; do
                case "$file" in
                  components/tantra-reiki-testimonials.tsx|components/tantra-video-testimonials.tsx|components/academy-video-player.tsx|tests/tantra-video-lifecycle.test.mjs|data/academy/tantra-reiki-full.generated.json|data/academy/tantra-native-assets.json|public/images/tantra-reiki/*|.github/workflows/tantra-testimonials.yml)
                    ;;
                  *) full=true; break ;;
                esac
              done
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
      - name: Validate scoped changes
        run: |
          node --test tests/video-csp-navigation.test.mjs tests/tantra-video-lifecycle.test.mjs
          npx eslint middleware.ts components/tantra-reiki-testimonials.tsx components/tantra-video-testimonials.tsx
          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' || "${GITHUB_BASE_REF:-}" != 'codex/public-book-library' ]]; then npx tsc --noEmit; fi
      - name: Install isolated browser tools
        if: github.event_name != 'pull_request' || steps.risk.outputs.full == 'true'
        run: |
          npm install --prefix /tmp/tantra-tools --no-package-lock --ignore-scripts @playwright/test@1.64.0
          ln -s /tmp/tantra-tools/node_modules/@playwright node_modules/@playwright
          /tmp/tantra-tools/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Build proposed application
        if: github.event_name != 'pull_request' || steps.risk.outputs.full == 'true'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Verify only local Tantra testimonials
        if: github.event_name != 'pull_request' || steps.risk.outputs.full == 'true'
        run: |
          npm run start -- --port 3123 > /tmp/tantra-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3123/en/academy/reiki/tantra-reiki >/dev/null && break || sleep 2; done
          node scripts/verify-tantra-testimonials.mjs
        env:
          TANTRA_ORIGIN: http://127.0.0.1:3123
      - name: Save public Tantra evidence
        if: always() && (github.event_name != 'pull_request' || steps.risk.outputs.full == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: tantra-testimonial-verification
          path: output/tantra-testimonials/verification.json
          if-no-files-found: warn

