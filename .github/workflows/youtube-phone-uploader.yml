name: YouTube phone uploader checks
on:
  pull_request:
    paths:
      - 'lib/youtube/**'
      - 'components/youtube-phone-uploader*'
      - 'components/prescription-admin-header.jsx'
      - 'components/csp-navigation-boundary.tsx'
      - 'app/admin/youtube-upload/**'
      - 'scripts/verify-youtube-phone-mobile.mjs'
      - 'tests/youtube-phone-upload.test.mjs'
      - 'tests/youtube-upload-history.test.mjs'
      - 'tests/youtube-upload-readback.test.mjs'
      - '.github/workflows/youtube-phone-uploader.yml'
      - 'components/app/compact-video-composer.*'
      - 'components/app/practice-youtube-uploader.*'
      - 'lib/practitioners/browser-presentation-upload.js'
      - 'app/api/app/practice/youtube/**'
      - 'tests/practice-video-composer-compact.test.mjs'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Protocol + persistent history unit tests
        run: node --test tests/youtube-phone-upload.test.mjs tests/youtube-upload-history.test.mjs tests/youtube-upload-readback.test.mjs tests/youtube-practitioner-store.test.mjs tests/practice-video-composer-compact.test.mjs
      - name: Browser transport and server history syntax
        run: |
          node --check lib/youtube/phone-upload-protocol.mjs
          node --check lib/youtube/upload-history-model.mjs
          node --check lib/youtube/upload-history-store.js
          node --check lib/youtube/browser-upload.js
          node --check lib/youtube/practitioner-upload-model.mjs
          node --check lib/youtube/practitioner-upload-store.js
          node --check app/api/app/practice/youtube/route.js
          node --check app/admin/youtube-upload/actions.js
          node --check scripts/verify-youtube-phone-mobile.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint practitioner YouTube implementation
        run: npx eslint lib/youtube/practitioner-upload-model.mjs lib/youtube/practitioner-upload-store.js app/api/app/practice/youtube/route.js components/app/practice-youtube-uploader.jsx components/app/compact-video-composer.jsx lib/practitioners/browser-presentation-upload.js
      - name: Next.js production build
        run: npm run build
      - name: Install isolated Chromium and WebKit for phone UX acceptance
        timeout-minutes: 12
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          npm install --prefix /tmp/youtube-ux-playwright --no-package-lock --ignore-scripts @playwright/test@1.63.0
          ln -s /tmp/youtube-ux-playwright/node_modules/@playwright node_modules/@playwright
          /tmp/youtube-ux-playwright/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Reproduce iPhone-sized scrolling in real Chromium/WebKit
        run: node scripts/verify-youtube-phone-mobile.mjs
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-phone-mobile-evidence
          path: /tmp/youtube-phone-mobile-evidence
          retention-days: 5
