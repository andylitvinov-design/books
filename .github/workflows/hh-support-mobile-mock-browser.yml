name: Holistic Support original mobile mock — browser parity
on:
  push:
    branches: ['codex/public-book-library']
    paths:
      - 'components/holistic-support-mobile.tsx'
      - 'components/holistic-support-course-profiles.tsx'
      - 'components/holistic-support-course-profiles.module.css'
      - 'tests/holistic-support-course-profiles.test.mjs'
      - 'components/holistic-support-goal-filter.tsx'
      - 'components/holistic-support-goal-filter.module.css'
      - 'lib/holistic-support/goal-filter.js'
      - 'tests/holistic-support-goal-filter.test.mjs'
      - 'components/holistic-support-mobile.module.css'
      - 'components/holistic-support-master-gallery.tsx'
      - 'components/holistic-support-master-gallery.module.css'
      - 'components/holistic-reiki-offer-shelf.tsx'
      - 'components/holistic-reiki-offer-shelf.module.css'
      - 'lib/academy/reiki-public-offers.mjs'
      - 'tests/holistic-reiki-offer-shelf.test.mjs'
      - 'lib/practitioners/public-remote-support-masters.ts'
      - 'lib/practitioners/public-service-media.mjs'
      - 'tests/public-service-gallery-media.test.mjs'
      - 'tests/holistic-support-consultation-showcase.test.mjs'
      - 'components/holistic-support-talisman-viewer.tsx'
      - 'components/holistic-support-talisman-viewer.module.css'
      - 'scripts/fixtures/holistic-support-directory.mjs'
      - 'scripts/verify-holistic-support-mock-fidelity.mjs'
      - 'tests/holistic-support-mobile-mock-parity.test.mjs'
      - 'tests/holistic-meditation-mobile-categories.test.mjs'
      - '.github/workflows/hh-support-mobile-mock-browser.yml'
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'components/holistic-support-mobile.tsx'
      - 'components/holistic-support-course-profiles.tsx'
      - 'components/holistic-support-course-profiles.module.css'
      - 'tests/holistic-support-course-profiles.test.mjs'
      - 'components/holistic-support-goal-filter.tsx'
      - 'components/holistic-support-goal-filter.module.css'
      - 'lib/holistic-support/goal-filter.js'
      - 'tests/holistic-support-goal-filter.test.mjs'
      - 'components/holistic-support-mobile.module.css'
      - 'components/holistic-support-master-gallery.tsx'
      - 'components/holistic-support-master-gallery.module.css'
      - 'components/holistic-reiki-offer-shelf.tsx'
      - 'components/holistic-reiki-offer-shelf.module.css'
      - 'lib/academy/reiki-public-offers.mjs'
      - 'tests/holistic-reiki-offer-shelf.test.mjs'
      - 'lib/practitioners/public-remote-support-masters.ts'
      - 'lib/practitioners/public-service-media.mjs'
      - 'tests/public-service-gallery-media.test.mjs'
      - 'tests/holistic-support-consultation-showcase.test.mjs'
      - 'components/holistic-support-talisman-viewer.tsx'
      - 'components/holistic-support-talisman-viewer.module.css'
      - 'scripts/fixtures/holistic-support-directory.mjs'
      - 'scripts/verify-holistic-support-mock-fidelity.mjs'
      - 'tests/holistic-support-mobile-mock-parity.test.mjs'
      - 'tests/holistic-meditation-mobile-categories.test.mjs'
      - '.github/workflows/hh-support-mobile-mock-browser.yml'
permissions:
  contents: read
concurrency:
  # Keep push and each PR independent: an unrelated PR must not cancel
  # production visual verification for this exact published commit.
  group: hh-support-mobile-mock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-visual-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HH_PUBLIC_QA_ORIGIN: http://127.0.0.1:3118
      HH_PLAYWRIGHT_PACKAGE: /tmp/hh-support-mock-tools/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audited project dependencies
        run: npm ci --no-audit --no-fund
      - name: Test source contracts and TSX
        run: |
          node --test tests/holistic-support-course-profiles.test.mjs tests/holistic-support-mobile-mock-parity.test.mjs tests/holistic-support-mobile-alternative.test.mjs tests/holistic-support-recommendation-engine.test.mjs tests/holistic-support-goal-filter.test.mjs tests/holistic-support-consultation-showcase.test.mjs tests/holistic-reiki-offer-shelf.test.mjs tests/public-service-gallery-media.test.mjs tests/holistic-meditation-mobile-categories.test.mjs
          npx eslint components/holistic-support-course-profiles.tsx components/holistic-support-mobile.tsx components/holistic-support-goal-filter.tsx lib/holistic-support/goal-filter.js components/holistic-support-master-gallery.tsx components/holistic-reiki-offer-shelf.tsx lib/academy/reiki-public-offers.mjs components/holistic-support-talisman-viewer.tsx scripts/verify-holistic-support-mock-fidelity.mjs scripts/fixtures/holistic-support-directory.mjs
          npx tsc --noEmit --pretty false
      - name: Install Chromium and WebKit
        run: |
          mkdir -p /tmp/hh-support-mock-tools
          npm install --prefix /tmp/hh-support-mock-tools --no-audit --no-fund playwright@1.63.0
          /tmp/hh-support-mock-tools/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Check 320 / 390 / 430 in Chromium and WebKit
        run: |
          mkdir -p artifacts/holistic-support-mock-fidelity
          npx next dev --hostname 127.0.0.1 --port 3118 > /tmp/hh-support-mock-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            if curl --silent --fail http://127.0.0.1:3118/ru/holistic-support/mobile > /dev/null; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then tail -80 /tmp/hh-support-mock-next.log; exit 1; fi
            sleep 2
          done
          node scripts/verify-holistic-support-mock-fidelity.mjs
      - name: Keep only public synthetic geometry and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holistic-support-mock-browser
          path: artifacts/holistic-support-mock-fidelity/
          retention-days: 3
          if-no-files-found: warn
