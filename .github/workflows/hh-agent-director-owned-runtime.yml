name: Agent Director owned runtime contracts

on:
  push:
    branches: ['feat/agent-director-owned-runtime-20261110']
    paths:
      - 'app/api/agent-director/commander-run/route.js'
      - 'lib/agent-director/**'
      - 'lib/holistic-support/owned-ollama.mjs'
      - 'supabase/functions/agent-commander-private-store-v1/**'
      - 'tests/agent-director-owned-runtime.test.mjs'
      - 'tests/commander-context-edge.test.mjs'
      - 'tests/agent-commander-private-store.test.mjs'
      - '.github/workflows/hh-agent-director-owned-runtime.yml'
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'app/api/agent-director/commander-run/route.js'
      - 'lib/agent-director/**'
      - 'lib/holistic-support/owned-ollama.mjs'
      - 'supabase/functions/agent-commander-private-store-v1/**'
      - 'tests/agent-director-owned-runtime.test.mjs'
      - 'tests/agent-commander-private-store.test.mjs'
      - '.github/workflows/hh-agent-director-owned-runtime.yml'

permissions:
  contents: read

concurrency:
  group: agent-director-owned-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax-check runtime files
        run: |
          node --check lib/agent-director/commander-owned-runtime.mjs
          node --check app/api/agent-director/commander-run/route.js
      - name: Run owned model and private store contracts
        run: node --test tests/agent-director-owned-runtime.test.mjs tests/agent-commander-private-store.test.mjs tests/commander-context-edge.test.mjs
