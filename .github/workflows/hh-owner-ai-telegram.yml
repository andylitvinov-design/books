name: Holistic House owner AI Telegram
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'lib/practitioners/owner-ai-telegram.mjs'
      - 'lib/practitioners/owner-ai-telegram-service.js'
      - 'lib/practitioners/owner-ai-ensemble.mjs'
      - 'lib/practitioners/owner-ai-five.mjs'
      - 'lib/practitioners/council-argon-gateway.mjs'
      - 'tests/practitioner-owner-ai-ensemble.test.mjs'
      - 'tests/practitioner-owner-ai-five.test.mjs'
      - 'tests/practitioner-argon-gateway.test.mjs'
      - 'supabase/migrations/*owner_ai_telegram_real_modes*.sql'
      - 'lib/practitioners/owner-ai-provider-settings.js'
      - 'tests/practitioner-owner-ai-provider-setup.test.mjs'
      - 'lib/practitioners/council-free-models.mjs'
      - 'lib/app/client-telegram-transport.js'
      - 'app/api/app/notification-channels/telegram/**'
      - 'app/api/admin/materials/telegram/**'
      - 'app/admin/materials/telegram/**'
      - 'lib/practitioners/owner-telegram-audio-*'
      - 'tests/owner-telegram-audio-combine.test.mjs'
      - 'tests/owner-telegram-audio-staging-lifecycle.test.mjs'
      - 'tests/owner-telegram-combined-document-delivery.test.mjs'
      - 'tests/owner-telegram-audio-batch-folder.test.mjs'
      - 'tests/owner-telegram-audio-connection.test.mjs'
      - 'supabase/migrations/*telegram_owner_audio_combine.sql'
      - 'components/admin-telegram-audio.*'
      - 'components/app/practice-telegram-audio.jsx'
      - 'components/app/practice-telegram-audio.module.css'
      - 'lib/practitioners/practice-telegram-auth-fetch.mjs'
      - 'tests/practice-telegram-auth-fetch.test.mjs'
      - 'tests/practice-telegram-audio.test.mjs'
      - 'tests/owner-telegram-audio-inbox.test.mjs'
      - 'supabase/migrations/*telegram_owner_audio_inbox.sql'
      - 'supabase/migrations/*telegram_owner_audio_destination.sql'
      - 'components/app/customer-telegram-bot-setup.jsx'
      - 'tests/practitioner-owner-ai-telegram.test.mjs'
      - 'lib/practitioners/owner-ai-bootstrap.mjs'
      - 'lib/practitioners/council-provider-readiness.mjs'
      - 'app/api/internal/council-provider-readiness/**'
      - 'tests/practitioner-council-provider-readiness.test.mjs'
      - 'app/api/internal/owner-ai-bootstrap/**'
      - 'app/api/internal/practice-telegram-digest/route.js'
      - 'tests/practitioner-owner-ai-bootstrap.test.mjs'
      - 'supabase/migrations/*owner_ai_telegram_updates*.sql'
      - 'docs/integrations/OWNER_AI_CONSOLE_TELEGRAM_20261020.md'
      - '.github/workflows/hh-owner-ai-telegram.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-owner-chat:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check lib/practitioners/council-provider-readiness.mjs
          node --check app/api/internal/council-provider-readiness/route.js
          node --check lib/practitioners/owner-ai-bootstrap.mjs
          node --check app/api/internal/owner-ai-bootstrap/route.js
          node --check app/api/internal/practice-telegram-digest/route.js
          node --check lib/practitioners/owner-ai-telegram.mjs
          node --check lib/practitioners/owner-ai-telegram-service.js
          node --check lib/practitioners/owner-ai-ensemble.mjs
          node --check lib/practitioners/owner-ai-five.mjs
          node --check lib/practitioners/council-argon-gateway.mjs
          node --check lib/practitioners/owner-telegram-audio-model.mjs
          node --check lib/practitioners/owner-telegram-audio-join.mjs
          node --check lib/practitioners/owner-telegram-audio-service.js
          node --check app/api/admin/materials/telegram/route.js
          node --check app/api/admin/materials/telegram/connection/route.js
          node --check lib/practitioners/owner-ai-provider-settings.js
          node --check lib/practitioners/council-free-models.mjs
          node --check lib/app/client-telegram-transport.js
          node --check app/api/app/notification-channels/telegram/webhook/route.js
          node --check app/api/app/notification-channels/telegram/setup/route.js
      - name: My Practice Telegram private player and fresh-owner bridge regressions
        run: |
          node --check lib/practitioners/practice-telegram-auth-fetch.mjs
          node --test tests/practice-telegram-auth-fetch.test.mjs tests/practice-telegram-audio.test.mjs tests/owner-telegram-audio-playback.test.mjs
      - name: Owner-only chat, free-cost model verification and customer pairing regressions
        run: |
          node --test tests/owner-telegram-audio-inbox.test.mjs tests/owner-telegram-audio-combine.test.mjs tests/owner-telegram-audio-batch-folder.test.mjs tests/owner-telegram-audio-connection.test.mjs tests/owner-telegram-combined-document-delivery.test.mjs tests/owner-telegram-audio-staging-lifecycle.test.mjs
          node --test tests/practitioner-owner-ai-provider-setup.test.mjs tests/practitioner-council-provider-readiness.test.mjs tests/practitioner-owner-ai-bootstrap.test.mjs tests/practitioner-owner-ai-telegram.test.mjs tests/practitioner-owner-ai-ensemble.test.mjs tests/practitioner-owner-ai-five.test.mjs tests/practitioner-argon-gateway.test.mjs tests/practitioner-council-free-models.test.mjs tests/messenger-telegram-link.test.mjs tests/client-telegram-owner-pilot.test.mjs tests/practitioner-telegram-hub.test.mjs
