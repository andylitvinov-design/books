name: Holistic House public services production acceptance
on:
  pull_request:
    branches: ['codex/public-book-library']
permissions:
  contents: read
concurrency:
  group: public-services-production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      HH_PUBLIC_QA_ORIGIN: http://127.0.0.1:3100
      HH_PLAYWRIGHT_PACKAGE: /tmp/hh-public-services-tools/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium and WebKit for isolated public acceptance
        run: |
          mkdir -p /tmp/hh-public-services-tools
          npm install --prefix /tmp/hh-public-services-tools --no-audit --no-fund playwright@1.63.0
          /tmp/hh-public-services-tools/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Canonical Homeopathy / Alchemy service routing regression
        run: node --test tests/practitioner-homeopathy-canonical-route.test.mjs tests/alchemy-soul-mobile-landing.test.mjs
      - name: Production build and public browser acceptance
        run: |
          mkdir -p artifacts/public-services-production
          npm run build > artifacts/public-services-production/build.log 2>&1
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/hh-public-services-next.log 2>&1 & SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:3100/en/services >/dev/null; then break; fi
            sleep 2
          done
          status=0
          node scripts/verify-business-quiz-mobile.mjs || status=$?
          node scripts/verify-ideas-mobile-browser.mjs || status=$?
          node scripts/verify-public-services-production.mjs || status=$?
          node scripts/verify-home-consultation-first-screen.mjs || status=$?
          # Capture safe aggregate HTML / Flight metrics from THIS PR's local
          # production build; the separate public audit reads old live alias.
          # Never upload Flight contents or private routes.
          TTFB_SAMPLES=3 node scripts/measure-hh-public-ttfb.mjs http://127.0.0.1:3100 > artifacts/public-services-production/home-rsc-local.json || status=$?
          node scripts/verify-contact-channel-chooser-browser.mjs || status=$?
          node scripts/verify-service-cart-browser.mjs || status=$?
          node scripts/verify-storefront-shop-browser.mjs || status=$?
          {
            echo "Production server diagnostic summary (no application secrets are configured for this job)"
            grep -Ei 'ready|started|error|warn|failed|exception' /tmp/hh-public-services-next.log | tail -n 200 || true
          } > artifacts/public-services-production/server-diagnostics.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-services-production-acceptance
          path: |
            artifacts/public-services-production/
            artifacts/business-quiz-mobile/
            artifacts/ideas-mobile/
            artifacts/home-first-screen/
            artifacts/contact-channel-browser/
            artifacts/service-cart/
            artifacts/storefront-shop/
          retention-days: 7
          if-no-files-found: warn