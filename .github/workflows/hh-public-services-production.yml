name: Holistic House public services production acceptance
# Fast source/consent/booking PR contracts; sensitive-risk PRs retain required
# exact-head real Chromium/WebKit acceptance. Full optional browser matrix is
# also available via workflow_dispatch on an explicitly selected candidate.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ['codex/public-book-library']
    paths:
      # CI-policy YAML itself is guarded by actionlint and protected Core;
      # only source/test changes launch this specialist.
      - 'scripts/ci-public-services-plan.mjs'
      - 'tests/ci-public-services-plan.test.mjs'
      # Alchemy landing/form and consent are direct browser surfaces, not generic *service* filenames.
      - 'components/alchemy-soul-landing.tsx'
      - 'components/alchemy-soul-landing.module.css'
      - 'components/alchemy-soul-lead-form.tsx'
      - 'components/compact-lead-capture*'
      - 'components/contact-channel-chooser*'
      - 'components/sitewide-lead-capture*'
      # Real public conversion/consent/booking and cart UI are NOT covered by
      # the shallow components/*service* glob. A source change to these
      # surfaces needs real Public Services Chromium/WebKit, not only Core.
      - 'components/consultation-choice-capture*'
      - 'components/public-consultation-cta*'
      - 'components/free-diagnosis-offers*'
      - 'components/business-website-enquiry*'
      - 'components/phone-country-input*'
      - 'components/free-resource-enquiry*'
      - 'components/academy-course-capture*'
      - 'components/commerce/**'
      - 'lib/whatsapp-enquiry.js'
      - 'lib/public-lead-capture.js'
      - 'lib/practitioners/enquiry-receipt.mjs'
      - 'app/api/service-enquiries/**'
      - 'components/academy-course-video-playlist.tsx'
      - 'lib/practitioners/taoist-talisman-cart.js'
      - 'scripts/fixtures/holistic-support-directory.mjs'
      - 'scripts/measure-hh-public-ttfb.mjs'
      # Direct E2E helper dependencies: edits must still trigger real browser QA.
      - 'scripts/helpers/alchemy-payment-disclosure-verifier.mjs'
      - 'scripts/helpers/contact-channel-verifier.mjs'
      - 'scripts/helpers/alchemy-panel-overflow-diagnostics.mjs'
      - 'scripts/service-cart-response-probe.mjs'
      - 'scripts/service-cart-browser-fixture.mjs'
      - 'scripts/verify-alchemy-one-screen.mjs'
      - 'scripts/verify-business-quiz-mobile.mjs'
      - 'scripts/verify-contact-channel-chooser-browser.mjs'
      - 'scripts/verify-academy-messenger-order.mjs'
      - 'scripts/verify-direction-focus-mobile.mjs'
      - 'scripts/verify-home-consultation-first-screen.mjs'
      - 'scripts/verify-ideas-mobile-browser.mjs'
      - 'scripts/verify-reiki-mobile-order-browser.mjs'
      - 'scripts/verify-service-cart-browser.mjs'
      - 'scripts/verify-storefront-shop-browser.mjs'
      - 'scripts/verify-talisman-google-checkout-browser.mjs'
      - 'tests/goal-support-offers.test.mjs'
      - 'tests/sitewide-lead-capture.test.mjs'
      - 'tests/practitioner-homeopathy-canonical-route.test.mjs'
      - 'tests/practitioner-remote-energy-support.test.mjs'
      - 'tests/service-alchemy-one-screen-story.test.mjs'
      - 'tests/talisman-google-checkout.test.mjs'
      - 'tests/temple-insights-compact-cta.test.mjs'
      - 'tests/temple-support-hub.test.mjs'
      - 'app/**/holistic-support/**'
      - 'app/**/services/**'
      - 'app/**/toronto/**'
      - 'app/**/alchemy/**'
      - 'app/**/business/**'
      - 'app/api/public/**'
      - 'app/api/payments/**'
      - 'app/api/app/practitioner/**'
      - 'app/api/app/\[...path\]/route.js'
      # The exact dispatcher is cross-domain. Node's BASE-trusted glob reader
      # does not match GitHub's escaped Next route, so also use this narrowly
      # bounded one-segment route with explicit Messenger exclusions.
      - 'app/api/app/*/route.js'
      - '!app/api/app/direct-messages/**'
      - '!app/api/app/practitioner-client-messages/**'
      - '!app/api/app/notification-channels/**'
      - 'app/api/app/services/**'
      - 'app/api/app/bookings/**'
      - 'components/holistic-*'
      - 'components/mandala-*'
      - 'components/remote-energy-*'
      - 'components/taoist-*'
      - 'components/*service*'
      - 'components/practice-showcase*'
      - 'lib/holistic-support/**'
      # Pure, side-effect-free Intelligence Core policy/bridge input parsers
      # have their own focused axis-to-offer unit, type and production-build gate.
      # No public services routes, client UI, checkout or publication logic are
      # edited by these files, so do NOT launch unrelated 20-minute storefront
      # mobile browser matrix for a policy-only PR. All real service/UI changes
      # still match the surrounding positive globs and run full acceptance.
      - '!lib/holistic-support/client-reasoning-*.mjs'
      - '!lib/holistic-support/intelligence-request.mjs'
      - 'lib/practitioners/public-*'
      - 'lib/commerce/**'
      - 'lib/checkout/**'
      - 'tests/holistic-*.mjs'
      - 'tests/alchemy-*.mjs'
      - 'tests/remote-*.mjs'
      - 'tests/direction-*.mjs'
      - 'tests/public-service*.mjs'
      - 'scripts/verify-holistic-*.mjs'
      - 'scripts/verify-public-services*.mjs'
      - 'middleware.ts'
      - 'next.config.*'
      - 'package.json'
      - 'package-lock.json'
      # Director-only art planning and its encoded-video browser test are fully
      # covered by holistic-support-mandala.yml. They do not modify service
      # discovery, checkout, Alchemy or master-catalog journeys tested here.
      # Keep the broad shared mandala-* patterns for other Mandala components.
      - '!components/mandala-cinematic-director.tsx'
      - '!components/mandala-cinematic-director.module.css'
      - '!scripts/verify-holistic-mandala-browser.mjs'
      # Only the public /install PWA and signed-native-release registry use
      # these two tests; holistic-house-mobile-install.yml runs both exact files,
      # full production build and 320-430px Chromium/WebKit acceptance.
      # They never touch Alchemy, Reiki, business, checkout or public services.
      # Keep all public service path tests and broad holistic-* coverage intact.
      - '!tests/holistic-house-free-install.test.mjs'
      - '!tests/holistic-house-native-public-downloads.test.mjs'
      # A signed-APK-only unit contract is owned by Holistic House Native CI.
      # It does not modify public Services/Alchemy/booking/cart routes.
      # Mixed changes to any real public service still trigger this suite.
      - '!tests/holistic-house-play-release.test.mjs'
      # The dedicated Support Mobile Mock workflow checks these exact synthetic
      # screenshot/QAs in 18 Chromium/WebKit EN/RU/ES viewport combinations.
      # They do not change real public services, booking, checkout or navigation.
      # Real service/UI/auth/payment paths above still trigger the full suite.
      - '!scripts/verify-holistic-support-mock-fidelity.mjs'
      - '!tests/holistic-support-mobile-mock-parity.test.mjs'
      # Video Studio creative/editor changes are independently covered by
      # holistic-support-mandala.yml: exact-head Node/lint/tsc/Next build,
      # RU/EN/ES Chromium+WebKit, real MediaRecorder output and audio rights.
      # Do not duplicate unrelated Alchemy/checkout/browser test matrices for
      # a change isolated to the Video Studio. Other public routes and support
      # components still run the full Public Services suite.
      - '!components/mandala-free-video-studio.tsx'
      - '!components/mandala-video-mobile.module.css'
      # Characters/Stories only changes the existing video editor, never
      # public checkout, practitioner listings, booking or service enquiries.
      # Dedicated Mandala CI owns its renderer, consent and browser acceptance.
      - '!components/mandala-stories-characters*'
      # The goal-first Auto Video Director only selects previously licensed
      # local MP4 montages. Its entire Node/TypeScript/Next.js/Chromium/WebKit
      # recorder/rights acceptance is owned by holistic-support-mandala.yml.
      # Do not run unrelated Alchemy/checkout E2E for this isolated widget.
      # Main public service routes/components still match the positive globs.
      - '!components/mandala-auto-video-director*'
      - '!components/mandala-first-video-start*'
      - '!app/api/holistic-support/first-video-prompt/route.js'
      # These isolated editor modules run the dedicated Mandala real-media E2E.
      - '!components/mandala-hypno-compact*'
      - '!components/mandala-personal-meditation*'
      # The Ideas & Coaching specialist owns this exact browser harness.
      - '!scripts/verify-holistic-support-browser.mjs'
      # Independently owned Voice Studio paths continue under Mandala real-media E2E.
      - '!app/**/holistic-support/voice-studio/route.ts'
      - '!app/api/holistic-support/voice/**'
      - '!components/mandala-affirmation-voice.*'
      - '!components/mandala-cloud-voice-studio.*'
      # Video Director's isolated source-only test also belongs to Mandala.
      - '!tests/first-video-director.test.mjs'
      - '!components/mandala-meditation.module.css'
      # Exact reviewed Video Studio-only UI: no booking, checkout or
      # public service API; independently verified by Mandala Core/WebKit.
      # Mixed PRs touching other service files still start this workflow.
      - '!components/mandala-pro-enhance.tsx'
      - '!components/mandala-pro-enhance.module.css'
      - '!components/mandala-video-ideas.tsx'
      - '!components/mandala-video-ideas.module.css'
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: public-services-production-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.action == 'synchronize' }}
jobs:
  public-services:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    # Pinned official Chromium/WebKit image includes all OS browser libraries.
    # Avoid 181-package apt cold start; no extra runner tier or paid service.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      HH_PUBLIC_QA_ORIGIN: http://127.0.0.1:3100
      HH_PLAYWRIGHT_PACKAGE: /tmp/hh-public-services-tools/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Pin the event's immutable PR merge SHA. A moving pull/merge ref
          # can change while queued; the exact event SHA must be the checkout.
          ref: ${{ github.sha }}
          # Fetch both parents when available; raw parent headers are still
          # verified below even when the runner marks the depth boundary shallow.
          fetch-depth: 2
      # GitHub checkout marks this path safe for the host runner. This job runs
      # in a separate Playwright container with a different Git HOME/owner.
      # Trust ONLY GitHub's exact checkout workspace, never safe.directory=*.
      - name: Trust checked-out workspace inside Public Services container
        run: |
          set -euo pipefail
          [[ -n "${GITHUB_WORKSPACE:-}" && -d "$GITHUB_WORKSPACE/.git" ]] || {
            echo "::error::Missing checked-out GitHub workspace"; exit 1;
          }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$(git rev-parse --show-toplevel)" == "$GITHUB_WORKSPACE" ]] || {
            echo "::error::Checkout path does not match GitHub workspace"; exit 1;
          }
      - name: Verify live PR readiness before costly CI
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-pr-readiness.mjs
      - name: Verify bounded Public Services PR ancestry before impact routing
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MERGE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid event source/base/merge SHA"; exit 1;
          }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MERGE_SHA" ]] || {
            echo "::error::Checkout differs from the exact PR event merge SHA"; exit 1;
          }
          # Prove the immutable two-parent merge checkout from GitHub's commit graph.
          # Local shallow clones may contain only a tiny fragment of a long-running
          # production branch; bounded deepen loops cannot prove a 200+ commit ancestry.
          mapfile -t tested_parents < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          [[ "${#tested_parents[@]}" -eq 2 ]] || {
            echo "::error::Exact event SHA is not a two-parent test merge"; exit 1;
          }
          tested_base="${tested_parents[0]}"
          tested_head="${tested_parents[1]}"
          [[ "$tested_head" == "$PR_HEAD_SHA" && "$tested_base" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Checkout parent SHAs differ from the submitted PR HEAD"; exit 1;
          }
          compare_json="$(curl --fail --silent --show-error --max-time 20 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${EVENT_BASE_SHA}...${tested_base}")"
          relation="$(printf '%s' "$compare_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const x=JSON.parse(s);if(typeof x.status!=="string")process.exit(2);process.stdout.write(x.status)}catch{process.exit(2)}})')"
          [[ "$relation" == "ahead" || "$relation" == "identical" ]] || {
            echo "::error::Event base is not an ancestor of the immutable tested base ($relation)"; exit 1;
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Select exact-head Public Services impact
        id: scope
        env:
          HH_PUBLIC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HH_PUBLIC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-public-services-plan.mjs
      - name: Verify fail-closed Public Services routing
        run: node --test tests/ci-public-services-plan.test.mjs
      - name: Verify independent public CI release proof (no store/payment browsers)
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.release_proof == 'true' }}
        run: node --test tests/ci-public-release-evidence.test.mjs
      # NODE_ENV=production is needed for the browser build, but our
      # source-level render tests need devDependency 'typescript'.
      - name: Load original checksum-verified FFmpeg for npm ci
        uses: ./.github/actions/ci-ffmpeg-static
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.reason != 'INDEPENDENT_OWNER_OR_CORE' }}
      - run: npm ci --include=dev --no-audit --no-fund
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.reason != 'INDEPENDENT_OWNER_OR_CORE' }}

      - name: Install SHA-verified FFmpeg into package after npm ci
        uses: ./.github/actions/ci-ffmpeg-static
        if: ${{ github.event_name != 'pull_request' || steps.scope.outputs.reason != 'INDEPENDENT_OWNER_OR_CORE' }}
        with:
          stage: materialize
      - name: Run exact modified public unit tests (no unrelated browser matrix)
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.reason == 'MODIFIED_PUBLIC_TESTS_ONLY' }}
        run: |
          set -euo pipefail
          files=()
          # The BASE/HEAD event impact planner already verified status=M only.
          # Repeat the check against the tested two-parent merge, then execute
          # every modified unit contract. Never infer success from zero tests.
          while IFS= read -r -d '' status && IFS= read -r -d '' file; do
            [[ "$status" == M && "$file" =~ ^tests/(holistic-|alchemy-|remote-|direction-|public-service)[a-zA-Z0-9._-]*\.test\.mjs$ ]] || exit 1
            [[ -f "$file" ]] || exit 1
            files+=("$file")
          done < <(git diff --no-renames --name-status -z HEAD^1 HEAD -- tests/)
          (( ${#files[@]} > 0 && ${#files[@]} <= 12 )) || exit 1
          node --test "${files[@]}"

      - name: Holistic Support first screen, private handoff and Coaching Lounge contracts
        if: ${{ github.event_name != 'pull_request' || (steps.scope.outputs.reason != 'INDEPENDENT_OWNER_OR_CORE' && steps.scope.outputs.reason != 'MODIFIED_PUBLIC_TESTS_ONLY') }}
        run: |
          node --test tests/temple-support-hub.test.mjs tests/holistic-support-first-screen.test.mjs tests/temple-insights-compact-cta.test.mjs tests/holistic-support-topics.test.mjs tests/remote-energy-support-mobile-compact.test.mjs tests/remote-energy-support-booking.test.mjs tests/practitioner-remote-energy-support.test.mjs tests/holistic-support-meditations.test.mjs tests/holistic-inline-talisman-order.test.mjs tests/holistic-compact-search.test.mjs
          npx eslint 'app/[locale]/holistic-support/page.tsx' components/holistic-support-topic-filter.tsx components/remote-energy-support-booking.tsx components/holistic-inline-support-order.tsx components/academy-course-video-playlist.tsx lib/practitioners/public-remote-support-masters.ts app/api/public/remote-energy-support-masters/route.ts
          node --test tests/holistic-support-mobile-alternative.test.mjs tests/holistic-support-recommendation-engine.test.mjs tests/holistic-talisman-mobile-categories.test.mjs
          node --test tests/talisman-google-checkout.test.mjs
          npx eslint components/holistic-support-mobile.tsx components/holistic-support-master-gallery.tsx components/holistic-support-talisman-viewer.tsx components/taoist-talisman-catalog.tsx components/taoist-talisman-cart.tsx lib/practitioners/taoist-talisman-cart.js lib/commerce/talisman-checkout.js app/api/public/talisman-checkout/route.js app/api/payments/talismans/checkout/route.js lib/holistic-support/recommendation-engine.js scripts/verify-holistic-support-recommendations-mobile.mjs scripts/verify-talisman-google-checkout-browser.mjs scripts/fixtures/holistic-support-directory.mjs
          # Whole-project TypeScript is required by the unconditional PR Core gate.
      - name: Energy Love Business inline focus regression
        if: ${{ github.event_name != 'pull_request' || (steps.scope.outputs.reason != 'INDEPENDENT_OWNER_OR_CORE' && steps.scope.outputs.reason != 'MODIFIED_PUBLIC_TESTS_ONLY') }}
        run: node --test tests/direction-three-sections.test.mjs tests/direction-offers.test.mjs tests/goal-support-offers.test.mjs tests/direction-extras.test.mjs
      # Exact-version binaries; no untrusted cross-PR/browser-version restore.
      # Browser engines install on explicit full workflow_dispatch OR when
      # PR impact is independently classified as sensitive/high-risk. No
      # checkout, consent or unknown risk can bypass required real browser QA.
      # Keep incremental compiler outputs inside the same trusted PR: never
      # restore caches from another PR, lockfile or unrelated code candidate.
      # This is a performance cache, never a substitute for a real Next build.
      - name: Restore PR-isolated Next.js compiler cache
        id: next_cache
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.build == 'true' && steps.scope.outputs.pr_heavy == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: hh-public-next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            hh-public-next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-pr-${{ github.event.pull_request.number }}-
      # Chromium + WebKit and system dependencies are provided by the exact
      # Playwright 1.63.0 image, so no repeated apt install/download is needed.
      # Still launch each required real browser; never waive missing evidence.
      - name: Verify preinstalled Chromium and WebKit for isolated public acceptance
        if: ${{ steps.scope.outputs.browser == 'true' && (github.event_name != 'pull_request' || steps.scope.outputs.pr_heavy == 'true') }}
        env:
          HH_PUBLIC_BROWSER_ENGINES: ${{ steps.scope.outputs.engines }}
        run: |
          set -euo pipefail
          npm install --prefix /tmp/hh-public-services-tools --no-audit --no-fund --ignore-scripts playwright@1.63.0
          [[ "${PLAYWRIGHT_BROWSERS_PATH:-}" == /ms-playwright ]] || {
            echo "::error::Pinned browser image missing expected /ms-playwright directory" >&2
            exit 1
          }
          node --input-type=module <<'NODE'
          import { chromium, webkit } from '/tmp/hh-public-services-tools/node_modules/playwright/index.mjs';
          const engines = process.env.HH_PUBLIC_BROWSER_ENGINES === 'chromium'
            ? [['chromium', chromium]]
            : [['chromium', chromium], ['webkit', webkit]];
          for (const [name, engine] of engines) {
            const browser = await engine.launch({ headless: true, timeout: 15000 });
            await browser.close();
            console.log('Verified preinstalled Playwright engine:', name);
          }
          NODE
      - name: Canonical Homeopathy / Alchemy service routing regression
        if: ${{ github.event_name != 'pull_request' || (steps.scope.outputs.reason != 'INDEPENDENT_OWNER_OR_CORE' && steps.scope.outputs.reason != 'MODIFIED_PUBLIC_TESTS_ONLY') }}
        run: node --test tests/practitioner-homeopathy-canonical-route.test.mjs tests/alchemy-soul-mobile-landing.test.mjs tests/alchemy-soul-spanish-parity.test.mjs tests/service-alchemy-one-screen-story.test.mjs tests/alchemy-panel-overflow-diagnostics.test.mjs
      # Required fast checks cover actual contact consent, private handoff and
      # service order safety. No redundant production build/browser install.
      - name: Fast public consent, service and Reiki contract tests
        if: github.event_name == 'pull_request' && steps.scope.outputs.reason != 'INDEPENDENT_OWNER_OR_CORE' && steps.scope.outputs.reason != 'MODIFIED_PUBLIC_TESTS_ONLY'
        run: node --test tests/contact-channel-chooser.test.mjs tests/services-browser-order-contract.test.mjs tests/reiki-unified-order-capture.test.mjs tests/public-service-enquiries.test.mjs
      - name: Record fast PR acceptance
        if: github.event_name == 'pull_request'
        run: |
          echo 'Public Services PR: source, lint and targeted consent/service/booking contracts only. Impact=${{ steps.scope.outputs.mode }}; heavy-risk=${{ steps.scope.outputs.pr_heavy }}; candidate manual cases=${{ steps.scope.outputs.cases }}. Sensitive PRs run risk-scoped protected real browser QA; low-risk PRs use fast contracts. For full standalone QA, run workflow_dispatch on the precise PR branch/commit before release; Core/security/release-ready remain separate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Production build and public browser acceptance
        if: ${{ steps.scope.outputs.build == 'true' && (github.event_name != 'pull_request' || steps.scope.outputs.pr_heavy == 'true') }}
        id: public_acceptance
        env:
          HH_PUBLIC_CASES: ${{ steps.scope.outputs.cases }}
          HH_PUBLIC_METRICS: ${{ steps.scope.outputs.metrics }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-services-production
          printf 'case,status,seconds\n' > artifacts/public-services-production/timings.csv
          acceptance_started=$SECONDS
          build_started=$SECONDS
          build_code=0
          # The required Core gate already runs ALL package prebuild tests.
          # Preserve each asset-producing prebuild prerequisite and a genuine
          # Next production build here; do not repeat unrelated coaching suites.
          {
            node scripts/ensure-owner-video-renderer.mjs
            node scripts/cache-ancient-coaching-photos.mjs
            node scripts/generate-soft-ocean-melody.mjs
            node scripts/build-public-card-artwork.mjs
            node scripts/build-report-pdf-art.mjs
            ./node_modules/.bin/next build
          } > artifacts/public-services-production/build.log 2>&1 || build_code=$?
          if (( build_code != 0 )); then
            printf 'next-production-build,FAIL,%s\n' "$((SECONDS-build_started))" >> artifacts/public-services-production/timings.csv
            echo "::error::Public Services production build failed (exit $build_code)"
            tail -n 100 artifacts/public-services-production/build.log
            exit 1
          fi
          printf 'next-production-build,PASS,%s\n' "$((SECONDS-build_started))" >> artifacts/public-services-production/timings.csv
          echo 'build_ok=true' >> "$GITHUB_OUTPUT"
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/hh-public-services-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for ((i=1; i<=30; i++)); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Public Services server exited before readiness" >&2
              break
            fi
            if curl --fail --silent --max-time 3 --output /dev/null http://127.0.0.1:3100/en/services; then
              ready=1
              break
            fi
            echo "Public services readiness attempt ${i}/30" >&2
            sleep 2
          done
          if [[ "$ready" != "1" ]]; then
            echo "::error::Public Services server not ready; browser suites were not run" >&2
            tail -n 120 /tmp/hh-public-services-next.log || true
            exit 1
          fi
          status=0
          # Real 13-case risk-scoped E2E on PR and full manual QA, including payment,
          # consent, browser engines and RU/EN/ES viewports. One Next server,
          # two bounded independent lanes with checked exit statuses.
          # Each suite writes its own diagnostics; both lanes MUST be awaited.
          run_case() {
            local label="$1"; shift
            if [[ "$HH_PUBLIC_CASES" != all && ",${HH_PUBLIC_CASES}," != *",${label},"* ]]; then
              printf '%s,NOT_APPLICABLE,0\n' "$label" >> artifacts/public-services-production/timings.csv
              return 0
            fi
            local started=$SECONDS
            local code=0
            local outcome=PASS
            local log="artifacts/public-services-production/$label.log"
            "$@" > "$log" 2>&1 || code=$?
            if (( code != 0 )); then
              outcome=FAIL
              echo "::error::Public Services browser case $label failed (exit $code)"
              tail -n 100 "$log" || true
            else
              echo "$label: PASS in $((SECONDS-started))s"
              tail -n 3 "$log" || true
            fi
            printf '%s,%s,%s\n' "$label" "$outcome" "$((SECONDS-started))" >> artifacts/public-services-production/timings.csv
            return "$code"
          }
          lane_a() {
            local failed=0
            # Alchemy covers 320–430px, three languages and booking consent.
            run_case "verify-alchemy-one-screen.mjs" node scripts/verify-alchemy-one-screen.mjs || failed=1
            run_case "verify-holistic-support-recommendations-mobile.mjs" node scripts/verify-holistic-support-recommendations-mobile.mjs || failed=1
            run_case "verify-public-services-production.mjs" node scripts/verify-public-services-production.mjs || failed=1
            run_case "verify-service-cart-browser.mjs" node scripts/verify-service-cart-browser.mjs || failed=1
            run_case "verify-holistic-master-browser.mjs" node scripts/verify-holistic-master-browser.mjs || failed=1
            run_case "verify-holistic-topics-browser.mjs" node scripts/verify-holistic-topics-browser.mjs || failed=1
            run_case "verify-direction-focus-mobile.mjs" node scripts/verify-direction-focus-mobile.mjs || failed=1
            return "$failed"
          }
          lane_b() {
            local failed=0
            run_case "verify-ideas-mobile-browser.mjs" node scripts/verify-ideas-mobile-browser.mjs || failed=1
            run_case "verify-home-consultation-first-screen.mjs" node scripts/verify-home-consultation-first-screen.mjs || failed=1
            run_case "verify-business-quiz-mobile.mjs" node scripts/verify-business-quiz-mobile.mjs || failed=1
            run_case "verify-reiki-mobile-order-browser.mjs" node scripts/verify-reiki-mobile-order-browser.mjs || failed=1
            run_case "verify-talisman-google-checkout-browser.mjs" node scripts/verify-talisman-google-checkout-browser.mjs || failed=1
            run_case "verify-storefront-shop-browser.mjs" node scripts/verify-storefront-shop-browser.mjs || failed=1
            run_case "verify-academy-messenger-order.mjs" node scripts/verify-academy-messenger-order.mjs || failed=1
            return "$failed"
          }
          lane_a &
          lane_a_pid=$!
          lane_b &
          lane_b_pid=$!
          trap 'kill "$lane_a_pid" "$lane_b_pid" "$SERVER_PID" 2>/dev/null || true' EXIT
          wait "$lane_a_pid" || { echo "::error::Public Services acceptance lane A failed"; status=1; }
          wait "$lane_b_pid" || { echo "::error::Public Services acceptance lane B failed"; status=1; }
          # Measure unladen production TTFB *after* browsers finish, never under
          # concurrent test load; do not save HTML, Flight bodies or private data.
          if [[ "$HH_PUBLIC_METRICS" == true ]]; then
            metrics_started=$SECONDS
            if TTFB_SAMPLES=3 node scripts/measure-hh-public-ttfb.mjs http://127.0.0.1:3100 > artifacts/public-services-production/home-rsc-local.json 2> artifacts/public-services-production/ttfb-stderr.log; then
              printf 'home-rsc-local,PASS,%s\n' "$((SECONDS-metrics_started))" >> artifacts/public-services-production/timings.csv
            else
              echo "::error::Public Services local performance measurement failed"
              tail -n 40 artifacts/public-services-production/ttfb-stderr.log || true
              printf 'home-rsc-local,FAIL,%s\n' "$((SECONDS-metrics_started))" >> artifacts/public-services-production/timings.csv
              status=1
            fi
          else
            printf 'home-rsc-local,NOT_APPLICABLE,0\n' >> artifacts/public-services-production/timings.csv
          fi
          printf 'public-services-total,%s,%s\n' "$([[ "$status" == 0 ]] && echo PASS || echo FAIL)" "$((SECONDS-acceptance_started))" >> artifacts/public-services-production/timings.csv
          echo "Public Services complete: status=$status, elapsed=$((SECONDS-acceptance_started))s, max browser concurrency=2"
          cat artifacts/public-services-production/timings.csv
                    {
            echo "Production server diagnostic summary (no application secrets are configured for this job)"
            grep -Ei 'ready|started|error|warn|failed|exception' /tmp/hh-public-services-next.log | tail -n 200 || true
          } > artifacts/public-services-production/server-diagnostics.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.build == 'true' && (github.event_name != 'pull_request' || steps.scope.outputs.pr_heavy == 'true')
        with:
          name: public-services-production-acceptance
          path: |
            artifacts/public-services-production/
            artifacts/business-quiz-mobile/
            artifacts/ideas-mobile/
            artifacts/holistic-support-mobile/
            artifacts/reiki-mobile-order/
            artifacts/holistic-support-recommendations/
            artifacts/talisman-google-checkout/
            artifacts/holistic-topic-mobile/
            artifacts/home-first-screen/
            artifacts/contact-channel-browser/
            artifacts/service-cart/
            artifacts/storefront-shop/
            artifacts/academy-messenger-order/
          retention-days: 7
          if-no-files-found: warn
      # Explicit save also works after browser failure: a successful, exact
      # production build is still reusable on a subsequent push to THIS PR.
      - name: Save successful PR-local Next.js compiler cache
        if: ${{ always() && github.event_name == 'pull_request' && steps.public_acceptance.outputs.build_ok == 'true' && steps.next_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ steps.next_cache.outputs.cache-primary-key }}
