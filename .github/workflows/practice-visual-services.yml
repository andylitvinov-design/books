name: Practitioner visual service editor
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'components/app/simple-service-editor.*'
      - 'components/app/my-services-dashboard.*'
      - 'components/app/practice-dashboard.css'
      - 'components/app/practice-workspace.jsx'
      - 'lib/practitioners/service-editor-steps.mjs'
      - 'lib/practitioners/reiki-offer.*'
      - 'lib/practitioners/contracts.js'
      - 'lib/practitioners/public-remote-support-masters.ts'
      - 'tests/practice-reiki-offer-parity.test.mjs'
      - 'tests/practice-service-visual-blocks.test.mjs'
      - 'tests/practice-service-mobile-one-screen.test.mjs'
      - 'tests/practitioner-preview-auth.test.mjs'
      - 'components/practice-showcase.*'
      - 'app/[locale]/practice/page.jsx'
      - '.github/workflows/practice-visual-services.yml'
permissions:
  contents: read
concurrency:
  group: practice-visual-services-${{ github.ref }}
  cancel-in-progress: true
jobs:
  service-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Auth, service editor, quota, media and workflow contracts
        run: node --test tests/practice-reiki-offer-parity.test.mjs tests/practice-service-mobile-one-screen.test.mjs tests/practice-service-visual-blocks.test.mjs tests/practice-service-editor-simplified.test.mjs tests/practice-hobby-service-quota.test.mjs tests/practice-photo-upload.test.mjs tests/practitioner-presentation-video.test.mjs tests/practice-services-search.test.mjs tests/practice-single-screen-workspace.test.mjs tests/practice-materials-action-first.test.mjs tests/practitioner-preview-auth.test.mjs
      - name: Remote goal support pricing, privacy and scheduling
        run: node --test tests/remote-energy-support-booking.test.mjs tests/remote-support-privacy-contract.test.mjs tests/practitioner-remote-energy-support.test.mjs
      - name: Lint all changed components
        run: npx --no-install eslint components/app/simple-service-editor.jsx components/app/my-services-dashboard.jsx components/app/practice-workspace.jsx lib/practitioners/service-editor-steps.mjs components/practice-showcase.jsx 'app/[locale]/practice/page.jsx'
      - name: TypeScript
        run: npx --no-install tsc --noEmit
      - name: Production build
        run: npm run build
