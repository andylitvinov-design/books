name: Practitioner visual service editor
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ['codex/public-book-library']
    paths:
      - 'components/app/simple-service-editor.*'
      - 'components/app/my-services-dashboard.*'
      - 'components/app/practice-dashboard.css'
      - 'components/app/practice-workspace.jsx'
      - 'app/api/app/practice/**'
      - 'app/api/app/\[...path\]/route.js'
      # The exact dispatcher is cross-domain. Node's BASE-trusted glob reader
      # does not match GitHub's escaped Next route, so also use this narrowly
      # bounded one-segment route with explicit Messenger exclusions.
      - 'app/api/app/*/route.js'
      - '!app/api/app/direct-messages/**'
      - '!app/api/app/practitioner-client-messages/**'
      - '!app/api/app/notification-channels/**'
      - 'app/api/app/services/**'
      - 'components/home-master-path.*'
      - 'components/profi-hub.*'
      - 'tests/practice-public-private-unified.test.mjs'
      - 'tests/practice-google-return-and-services-v5.test.mjs'
      - 'tests/home-master-path.test.mjs'
      - 'tests/profi-hub.test.mjs'
      - 'components/app/practice-inner-navigation.jsx'
      - 'components/app/practitioner-client-profiles.*'
      - 'components/app/practice-materials.*'
      - 'tests/practice-inner-mock-parity.test.mjs'
      - 'lib/practitioners/service-editor-steps.mjs'
      - 'lib/practitioners/reiki-offer.*'
      - 'lib/practitioners/contracts.js'
      - 'lib/practitioners/public-remote-support-masters.ts'
      - 'tests/practice-reiki-offer-parity.test.mjs'
      - 'tests/practice-service-visual-blocks.test.mjs'
      - 'tests/practice-service-mobile-one-screen.test.mjs'
      - 'tests/practitioner-preview-auth.test.mjs'
      - 'components/practice-showcase.*'
      - 'app/**/practice/page.jsx'
      - '.github/workflows/practice-visual-services.yml'
      # Client Live Photo APIs have their own App/IA/billing/video owners.
      # Keep the literal shared catch-all dispatcher and all source/security routes.
      - '!app/api/app/live-photos/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: practice-visual-services-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.action == 'synchronize' }}
jobs:
  service-editor:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install only locked TypeScript for protected PR source contracts
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'codex/public-book-library' }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d "${RUNNER_TEMP}/hh-contract-deps.XXXXXX")"
          if node --input-type=commonjs - "$tmp" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const entry = lock.packages?.['node_modules/typescript'];
          // Only the standalone compiler, at the exact repository-locked integrity.
          if (lock.lockfileVersion !== 3 || !entry ||
              !/^\d+\.\d+\.\d+$/.test(entry.version || '') ||
              entry.resolved !== `https://registry.npmjs.org/typescript/-/typescript-${entry.version}.tgz` ||
              !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(entry.integrity || '') ||
              entry.link || entry.hasInstallScript ||
              ['dependencies','optionalDependencies','peerDependencies','bundleDependencies','bundledDependencies'].some(k => Object.keys(entry[k] || {}).length)) process.exit(1);
          const manifest = {name:'hh-ci-contract-deps',version:'1.0.0',devDependencies:{typescript:entry.version}};
          const dir = process.argv[2];
          fs.writeFileSync(path.join(dir,'package.json'),JSON.stringify({...manifest,private:true}));
          fs.writeFileSync(path.join(dir,'package-lock.json'),JSON.stringify({...manifest,lockfileVersion:3,requires:true,packages:{'':manifest,'node_modules/typescript':{...entry,dev:true}}}));
          NODE
          then
            npm ci --prefix "$tmp" --include=dev --ignore-scripts --no-audit --no-fund
            mkdir -p node_modules
            ln -s "$tmp/node_modules/typescript" node_modules/typescript
          else
            # Unknown lockfile/compiler dependency shape: retain the full install.
            npm ci --include=dev --no-audit --no-fund
          fi
      - name: Install complete dependencies for standalone QA
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npm ci --include=dev --no-audit --no-fund
      - name: Auth, service editor, quota, media and workflow contracts
        run: node --test tests/practice-google-return-and-services-v5.test.mjs tests/practice-public-private-unified.test.mjs tests/home-master-path.test.mjs tests/profi-hub.test.mjs tests/practice-inner-mock-parity.test.mjs tests/messages-orders-clients.test.mjs tests/messages-simple-inbox.test.mjs tests/messages-iphone-keyboard-layout.test.mjs tests/practice-reiki-offer-parity.test.mjs tests/practice-service-mobile-one-screen.test.mjs tests/practice-service-visual-blocks.test.mjs tests/practice-service-editor-simplified.test.mjs tests/practice-hobby-service-quota.test.mjs tests/practice-photo-upload.test.mjs tests/practitioner-presentation-video.test.mjs tests/practice-services-search.test.mjs tests/practice-single-screen-workspace.test.mjs tests/practice-materials-action-first.test.mjs tests/practitioner-preview-auth.test.mjs
      - name: Remote goal support pricing, privacy and scheduling
        run: node --test tests/remote-energy-support-booking.test.mjs tests/remote-support-privacy-contract.test.mjs tests/practitioner-remote-energy-support.test.mjs
      - name: Lint all changed components
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npx --no-install eslint components/app/simple-service-editor.jsx components/app/my-services-dashboard.jsx components/app/practice-workspace.jsx lib/practitioners/service-editor-steps.mjs components/practice-showcase.jsx 'app/[locale]/practice/page.jsx'
      - name: TypeScript
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npx --no-install tsc --noEmit
      - name: Production build
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npm run build
