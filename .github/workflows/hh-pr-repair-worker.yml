name: HH PR source Repair Worker
on:
  # Exact-head task dispatch only; no empty cron/push claims may hold the
  # source writing lease. Independent CI schedule wakes Control Tower instead.
  workflow_dispatch:
    inputs:
      commander_source_task:
        description: 'Owner-approved source task JSON; empty keeps existing repair behavior'
        type: string
        required: false
        default: ''
      pr_number:
        description: 'Signed exact PR number; 0 audits queue only'
        type: string
        default: '0'
      expected_sha:
        description: 'Exact PR HEAD SHA required for source writes'
        type: string
        default: ''
      task_key:
        description: 'Addressed queue task identity; exact-head verified by worker'
        type: string
        default: ''
      reservation_run_id:
        description: 'Trusted dispatcher run that reserved this exact task'
        type: string
        default: ''
      dry_run:
        description: 'Audit only; no claim or source writes'
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write
concurrency:
  # One writer per source PR, without serializing unrelated source fixes.
  # Dispatch inputs are verified against the signed exact-HEAD reservation.
  group: hh-real-repair-pr-${{ inputs.pr_number || 'unaddressed' }}
  cancel-in-progress: false
jobs:
  claim:
    if: github.repository == 'andylitvinov-design/books' && github.ref == 'refs/heads/codex/bootstrap-books' && !(github.event_name == 'workflow_dispatch' && inputs.commander_source_task != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      strategy: ${{ steps.select.outputs.strategy }}
      pr_number: ${{ steps.select.outputs.pr_number }}
      sha: ${{ steps.select.outputs.sha }}
      files_json: ${{ steps.select.outputs.files_json }}
      task_key: ${{ steps.select.outputs.task_key }}
      claim_status: ${{ steps.select.outputs.claim_status }}
      claim_reason: ${{ steps.select.outputs.claim_reason }}
      code_available: ${{ steps.select.outputs.code_available }}
      code_provider: ${{ steps.select.outputs.code_provider }}
      no_fix_finalized: ${{ steps.finalize_no_fix.outcome }}
      audit_only: ${{ steps.select.outputs.audit_only }}
      legacy_production_sha: ${{ steps.select.outputs.legacy_production_sha }}
      legacy_base_sha: ${{ steps.select.outputs.legacy_base_sha }}
    steps:
      - name: Checkout trusted default-branch code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      # Full repair contracts run on code changes; keep fast live syntax checks.
      - name: Check trusted repair worker syntax
        run: |
          node --check scripts/ci-pr-repair-worker.cjs
          node --check scripts/ci-pr-runner-evidence.cjs
          node --check scripts/ci-pr-repair-test-scope.cjs
          node --check scripts/ci-pr-repair-deterministic.cjs
          node --check scripts/ci-pr-repair-free-agent.cjs
          node --check scripts/ci-pr-repair-openrouter-free.cjs
          node --check scripts/ci-pr-repair-graphql-writer.cjs
          node --check scripts/ci-pr-repair-code-candidate.cjs
          node --check scripts/ci-pr-manus-handoff.cjs
          node --check scripts/ci-pr-priority.cjs
      - id: select
        name: Verify exact-HEAD owner, PR branch, repair lease and queue
        uses: actions/github-script@v7
        env:
          HH_HAS_OWNER_TOKEN: ${{ secrets.HH_AUTOMERGE_TOKEN != '' }}
          # Paid AI credentials are deliberately not inspected by the repair worker.
          HH_HAS_CODEX_TOKEN: 'false'
          # Only a separately provisioned free-tier OpenCode key can enable inference.
          HH_HAS_FREE_OPENCODE_TOKEN: ${{ secrets.HH_OPENCODE_FREE_API_KEY != '' }}
          HH_HAS_OPENROUTER_FREE_TOKEN: ${{ secrets.HH_OPENROUTER_FREE_API_KEY != '' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const worker=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-repair-worker.cjs');
            const requested=Number(context.payload.inputs?.pr_number || 0);
            // A requested PR number becomes a writer lock key only for a
            // canonical signed exact-HEAD dispatch; other runs are audit-only.
            const addressed=context.eventName==='workflow_dispatch' &&
              Number.isSafeInteger(requested) && requested>0 &&
              String(requested)===String(context.payload.inputs?.pr_number || '') &&
              /^[0-9a-f]{40}$/i.test(String(context.payload.inputs?.expected_sha || '')) &&
              /^[0-9a-f]{32}$/i.test(String(context.payload.inputs?.task_key || '')) &&
              /^[1-9][0-9]{0,18}$/.test(String(context.payload.inputs?.reservation_run_id || ''));
            const dryRun=!addressed || String(context.payload.inputs?.dry_run ?? 'false')==='true';
            core.setOutput('audit_only',String(dryRun));
            if(!addressed)core.info('HH_REPAIR: unaddressed dispatch is audit-only');
            const result=await worker.claim({github,core,context,
              number:Number.isSafeInteger(requested)?requested:0,
              expectedSha:String(context.payload.inputs?.expected_sha || ''),
              taskKey:String(context.payload.inputs?.task_key || ''),
              reservationRunId:String(context.payload.inputs?.reservation_run_id || ''),dryRun,
              hasToken:process.env.HH_HAS_OWNER_TOKEN==='true'});
            core.setOutput('claim_status',result.status);
            // One signed REST comparison, only after a real legacy claim.
            // Read-only provenance; cannot authorize a source patch or merge.
            if(result.status==='claimed'&&result.strategy==='legacy'&&!dryRun){
              try{
                const {owner,repo}=context.repo;
                const production=(await github.rest.repos.getBranch({
                  owner,repo,branch:'codex/public-book-library'})).data;
                if(production?.protected===true&&
                   /^[a-f0-9]{40}$/i.test(production.commit?.sha||'')){
                  const compare=(await github.rest.repos.compareCommits({
                    owner,repo,base:result.sha,head:production.commit.sha,per_page:1})).data;
                  const proof=require(process.env.GITHUB_WORKSPACE+
                    '/scripts/ci-pr-legacy-snapshot.cjs').verifiedLegacyMergeBase({
                      prSha:result.sha,production,compare});
                  if(proof){
                    core.setOutput('legacy_production_sha',proof.production_sha);
                    core.setOutput('legacy_base_sha',proof.merge_base_sha);
                    core.info('HH_LEGACY_MERGE_BASE_PROOF READ_ONLY_VERIFIED');
                  }
                }
              }catch(_){core.warning('HH_LEGACY_MERGE_BASE_PROOF_UNAVAILABLE');}
            }
            if(result.status==='claimed'&&!dryRun){
              const {confirmRepairRunner}=require(process.env.GITHUB_WORKSPACE+
                '/scripts/ci-pr-runner-evidence.cjs');
              try{
                const evidence=await confirmRepairRunner({github,context,
                  number:result.number,expectedSha:result.sha,
                  taskKey:String(context.payload.inputs?.task_key||'')});
                core.info('HH_EXECUTION_REAL_RUNNER '+JSON.stringify(evidence));
                if(evidence.status!=='RUNNER_CONFIRMED')
                  core.warning('Metadata dispatch is NOT execution: '+evidence.reason);
              }catch(error){
                core.warning('RUNNER_PROOF_UNAVAILABLE: '+String(error.message||error).slice(0,160));
              }
            }
            core.setOutput('claim_reason',result.reason||'');
            const provider=process.env.HH_HAS_OPENROUTER_FREE_TOKEN==='true'?'openrouter':
              process.env.HH_HAS_FREE_OPENCODE_TOKEN==='true'?'opencode':'none';
            core.setOutput('code_provider',provider);
            core.setOutput('code_available',provider==='none'?'false':'true');
            const {wakeAfterWorker}=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-control-tower-wakeup.cjs');
            core.info('HH_REPAIR_COMPLETION_WAKE '+await wakeAfterWorker({github,context,kind:'repair',status:result.status,dryRun,log:core.warning}));
      # Fast terminal path: no untrusted source runs on this trusted runner.
      - name: Finalize no-fix task on claim runner
        id: finalize_no_fix
        if: >-
          always() && github.event_name != 'push' &&
          (steps.select.outcome != 'success' ||
           (steps.select.outputs.strategy != 'lint' &&
            steps.select.outputs.strategy != 'code' &&
            steps.select.outputs.strategy != 'legacy'))
        uses: actions/github-script@v7
        env:
          HH_CLAIM_NUMBER: ${{ steps.select.outputs.pr_number }}
          HH_CLAIM_SHA: ${{ steps.select.outputs.sha }}
          HH_CLAIM_KEY: ${{ steps.select.outputs.task_key }}
          HH_CLAIM_STATUS: ${{ steps.select.outputs.claim_status }}
          HH_CLAIM_REASON: ${{ steps.select.outputs.claim_reason }}
          HH_CLAIM_RESULT: ${{ steps.select.outcome }}
          HH_CODE_AVAILABLE: ${{ steps.select.outputs.code_available }}
          HH_AUDIT_ONLY: ${{ steps.select.outputs.audit_only }}
        with:
          github-token: ${{ github.token }}
          script: |
            const worker=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-repair-worker.cjs');
            const inputs=context.payload.inputs||{};
            const result=await worker.finalize({github,core,context,
              number:Number(inputs.pr_number||process.env.HH_CLAIM_NUMBER||0),
              expectedSha:String(inputs.expected_sha||process.env.HH_CLAIM_SHA||''),
              taskKey:String(inputs.task_key||process.env.HH_CLAIM_KEY||''),
              claimStatus:process.env.HH_CLAIM_STATUS,
              claimReason:process.env.HH_CLAIM_REASON,
              claimResult:process.env.HH_CLAIM_RESULT,
              fixResult:'skipped',
              codeAvailable:process.env.HH_CODE_AVAILABLE==='true',
              codeResult:'skipped',codeVerifyResult:'skipped',publishResult:'skipped',
              dryRun:process.env.HH_AUDIT_ONLY==='true'||String(inputs.dry_run||'false')==='true'});
            core.info('HH_REPAIR_FINAL_OUTCOME '+JSON.stringify(result));
  fix:
    needs: claim
    # Deterministic repair is always first, including verified Core/TypeScript failures.
    if: >-
      needs.claim.outputs.strategy == 'lint' ||
      needs.claim.outputs.strategy == 'code' ||
      needs.claim.outputs.strategy == 'legacy'
    outputs:
      candidate_status: ${{ steps.legacy_scan.outputs.candidate_status || steps.build_candidate.outputs.candidate_status }}
      candidate_detail: ${{ steps.legacy_scan.outputs.candidate_detail || steps.build_candidate.outputs.candidate_detail }}
      candidate_snapshot: ${{ steps.legacy_scan.outputs.candidate_snapshot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      REPAIR_SHA: ${{ needs.claim.outputs.sha }}
      REPAIR_FILES_JSON: ${{ needs.claim.outputs.files_json }}
      REPAIR_STRATEGY: ${{ needs.claim.outputs.strategy }}
      LEGACY_PRODUCTION_SHA: ${{ needs.claim.outputs.legacy_production_sha }}
      LEGACY_MERGE_BASE_SHA: ${{ needs.claim.outputs.legacy_base_sha }}
    steps:
      - name: Checkout untrusted PR HEAD without any write credentials or secrets
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.claim.outputs.sha }}
          persist-credentials: false
      - name: Checkout trusted test selector without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .hh-trusted
          persist-credentials: false
      # A signed claim can become obsolete before the isolated runner begins.
      # One current-HEAD check avoids npm, build and tests on a stale source.
      # Read errors fail closed; finalization and publisher checks remain.
      - id: fresh_head
        name: Recheck current source HEAD before expensive repair steps
        uses: actions/github-script@v7
        env:
          HH_REPAIR_PR: ${{ needs.claim.outputs.pr_number }}
          HH_REPAIR_SHA: ${{ needs.claim.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const worker=require(process.env.GITHUB_WORKSPACE+
              '/.hh-trusted/scripts/ci-pr-repair-worker.cjs');
            const number=Number(process.env.HH_REPAIR_PR);
            const expected=String(process.env.HH_REPAIR_SHA||'');
            if(!Number.isSafeInteger(number)||number<1||
               !/^[a-f0-9]{40}$/i.test(expected))
              throw Error('HH_PRE_NPM_INVALID_SIGNED_CLAIM');
            const {owner,repo}=context.repo;
            const pr=(await github.rest.pulls.get({
              owner,repo,pull_number:number})).data;
            const current=worker.currentRepairHead(pr,number,expected);
            core.setOutput('current',String(current));
            core.info('HH_REPAIR_PRE_NPM '+JSON.stringify({
              status:current?'CURRENT':'SUPERSEDED_OR_HELD',
              number,expected_sha:expected,source_published:false,
              requires_finalization:true}));
      # No safe scoped tests in a legacy PR = no need for a full npm install.
      # This shortens a metadata-only preflight without changing any repair gate.
      - id: legacy_deps
        name: Identify whether legacy focused tests need npm dependencies
        if: steps.fresh_head.outputs.current == 'true' && needs.claim.outputs.strategy == 'legacy'
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const safe=require('./.hh-trusted/scripts/ci-pr-repair-free-agent.cjs').safeSourcePath;
          const files=JSON.parse(process.env.REPAIR_FILES_JSON||'[]');
          if(!Array.isArray(files)||files.length>8||
             files.some(x=>typeof x!=='string'))
            throw Error('Invalid legacy dependency scope');
          const needed=files.some(safe);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'needed='+String(needed)+'\n');
          console.log('HH_LEGACY_DEPENDENCY_SCOPE '+JSON.stringify({needed,files:files.length}));
          NODE
      - uses: actions/setup-node@v4
        if: steps.fresh_head.outputs.current == 'true' && (needs.claim.outputs.strategy != 'legacy' || steps.legacy_deps.outputs.needed == 'true')
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without running lifecycle scripts
        if: steps.fresh_head.outputs.current == 'true' && (needs.claim.outputs.strategy != 'legacy' || steps.legacy_deps.outputs.needed == 'true')
        run: npm ci --ignore-scripts --no-audit --no-fund
      - id: legacy_scan
        name: Cloud-only legacy source comparison and focused test preflight
        if: steps.fresh_head.outputs.current == 'true' && needs.claim.outputs.strategy == 'legacy'
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const sha=process.env.REPAIR_SHA;
          const files=JSON.parse(process.env.REPAIR_FILES_JSON||'[]');
          if(!/^[a-f0-9]{40}$/i.test(sha)||!Array.isArray(files)||
             files.length>8)throw Error('Invalid bounded legacy preflight');
          const run=(cmd,args,timeout=120000)=>cp.spawnSync(cmd,args,{
            encoding:'utf8',timeout,maxBuffer:512000,env:process.env});
          const head=run('git',['rev-parse','HEAD'],10000);
          if(head.status!==0||head.stdout.trim()!==sha)
            throw Error('Legacy exact-HEAD checkout changed');
          const safe=require('./.hh-trusted/scripts/ci-pr-repair-free-agent.cjs').safeSourcePath;
          const allowlisted=files.filter(safe);
          const report={schema:'HH_LEGACY_CLOUD_PREFLIGHT_V1',head_sha:sha,
            source_files:files,source_safe_for_AI:allowlisted,
            mode:'READ_ONLY_NO_SOURCE_PUBLICATION',base_compare:'UNKNOWN',
            local_tests:'NOT_RUN',next:'SOURCE_SEMANTIC_REVIEW'};
          const fetch=run('git',['fetch','--no-tags','--depth=1','--filter=blob:none',
            'origin','codex/public-book-library'],45000);
          if(fetch.status===0){
            const base=run('git',['rev-parse','FETCH_HEAD'],10000);
            if(base.status===0&&/^[a-f0-9]{40}$/i.test(base.stdout.trim()))
              report.production_base_sha=base.stdout.trim();
            const ancestor=run('git',['merge-base','HEAD','FETCH_HEAD'],10000);
            if(ancestor.status===0){
              const check=run('git',['merge-tree','--write-tree','HEAD','FETCH_HEAD'],25000);
              report.base_compare=check.status===0?'GIT_TREE_MERGES_WITHOUT_CONFLICT':
                check.status===1?'GIT_TREE_CONFLICT':'MERGE_TREE_NOT_VERIFIED';
            }else{
              report.base_compare='SHALLOW_ANCESTRY_UNAVAILABLE';
              const prod=process.env.LEGACY_PRODUCTION_SHA;
              const base=process.env.LEGACY_MERGE_BASE_SHA;
              // A claimed, SHA-bound GitHub compare may prove the ancestor
              // even though both shallow checkouts have no connected history.
              if(/^[a-f0-9]{40}$/i.test(prod||'')&&
                 /^[a-f0-9]{40}$/i.test(base||'')&&
                 report.production_base_sha===prod){
                const fetchBase=run('git',['fetch','--no-tags','--depth=1',
                  '--filter=blob:none','origin',base],30000);
                if(fetchBase.status===0){
                  const check=run('git',['merge-tree','--write-tree',
                    '--merge-base='+base,'HEAD',prod],25000);
                  if(check.status===0||check.status===1){
                    report.base_compare=check.status===0?
                      'GIT_TREE_MERGES_WITHOUT_CONFLICT':'GIT_TREE_CONFLICT';
                    report.base_compare_source='GITHUB_VERIFIED_MERGE_BASE';
                  }
                }
              }
            }
            if(report.base_compare==='SHALLOW_ANCESTRY_UNAVAILABLE'){
              // Shallow checkouts cannot prove ancestry. Compare bounded Git
              // tree/blob OIDs instead, without source reads or authorization.
              const {compareLegacySnapshot}=require(
                './.hh-trusted/scripts/ci-pr-legacy-snapshot.cjs');
              report.source_snapshot=compareLegacySnapshot({files,
                read:(ref,path,timeout)=>run('git',
                  ['ls-tree','-z',ref==='FETCH_HEAD'&&report.production_base_sha?report.production_base_sha:ref,'--',':(literal)'+path],timeout)});
            }
          }else report.base_compare='PRODUCTION_FETCH_UNAVAILABLE';
          // Run only the already trusted bounded test selector and never
          // send source or any credential to an external model.
          if(allowlisted.length){
            const test=run(process.execPath,
              ['.hh-trusted/scripts/ci-pr-repair-test-scope.cjs',...allowlisted],130000);
            report.local_tests=test.status===0?'FOCUSED_PASS':'FOCUSED_FAIL_OR_UNAVAILABLE';
          }
          fs.writeFileSync('legacy-prep.json',JSON.stringify(report,null,2));
          // Only six bounded integer counts cross the untrusted-HEAD job boundary.
          // Blob IDs, paths and source text never enter the signed receipt.
          const snapshot=report.source_snapshot;
          const sc=snapshot?.counts;
          const summaryNumbers=sc?[
            snapshot.paths,sc.identical,sc.divergent,
            sc.only_legacy,sc.only_production,sc.unknown]:[];
          const snapshotSummary=summaryNumbers.length===6 &&
            summaryNumbers.every(n=>Number.isSafeInteger(n)&&n>=0&&n<=8) &&
            summaryNumbers[0]>0 &&
            summaryNumbers.slice(1).reduce((a,b)=>a+b,0)===summaryNumbers[0]
              ? summaryNumbers.join(','):'';

          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'candidate_status=prepared\n'+
            'candidate_detail='+report.base_compare+'\n'+
            'candidate_snapshot='+snapshotSummary+'\n');
          console.log('HH_LEGACY_PREPARED '+JSON.stringify(report));
          NODE
      - uses: actions/upload-artifact@v4
        if: steps.fresh_head.outputs.current == 'true' && needs.claim.outputs.strategy == 'legacy'
        with:
          name: hh-legacy-preflight
          path: legacy-prep.json
          retention-days: 1
          if-no-files-found: error
      - name: Apply trusted TypeScript type-only import codemods
        if: steps.fresh_head.outputs.current == 'true' && needs.claim.outputs.strategy != 'legacy'
        env:
          REPAIR_SHA: ${{ needs.claim.outputs.sha }}
          REPAIR_FILES_JSON: ${{ needs.claim.outputs.files_json }}
        run: node .hh-trusted/scripts/ci-pr-repair-deterministic.cjs
      - name: Verify deterministic Core repair with TypeScript
        if: steps.fresh_head.outputs.current == 'true' && needs.claim.outputs.strategy == 'code'
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit --incremental false --pretty false 2>&1 | tee .hh-repair-tsc-errors.log
      - name: Restore only exact compiler-proven changed line from protected base
        if: steps.fresh_head.outputs.current == 'true' && needs.claim.outputs.strategy == 'code'
        timeout-minutes: 2
        env:
          REPAIR_SHA: ${{ needs.claim.outputs.sha }}
          REPAIR_FILES_JSON: ${{ needs.claim.outputs.files_json }}
        run: node .hh-trusted/scripts/ci-pr-repair-deterministic.cjs base-line
      - id: build_candidate
        if: steps.fresh_head.outputs.current == 'true' && needs.claim.outputs.strategy != 'legacy'
        name: Try targeted ESLint autofix and write bounded patch candidate
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const {execFileSync,spawnSync}=require('node:child_process');
          const paths=JSON.parse(process.env.REPAIR_FILES_JSON);
          const sha=process.env.REPAIR_SHA;
          if (!Array.isArray(paths) || paths.length<1 || paths.length>8 ||
              !/^[a-f0-9]{40}$/i.test(sha) ||
              !paths.every(x=>typeof x==='string' && /^[\w./-]+\.(js|jsx|ts|tsx|mjs|cjs)$/.test(x)))
            throw Error('Invalid isolated repair scope');
          const result={head_sha:sha,files:[],detail_code:'NO_AUTOFIXABLE_ESLINT_CHANGE'};
          // ESLint may return 0 while silently ignoring files not in its flat
          // config. Do not treat an ignored file as a completed repair.
          const executable=paths.filter(path=>{
            const config=spawnSync('./node_modules/.bin/eslint',['--print-config',path],
              {encoding:'utf8',timeout:30000});
            if(config.status!==0)return false;
            try {
              const parsed=JSON.parse(config.stdout);
              return !!(parsed&&typeof parsed==='object'&&parsed.rules&&
                typeof parsed.rules==='object');
            } catch { return false; }
          });
          result.scope={requested:paths.length,configured:executable.length,
            ignored:paths.length-executable.length};
          if(!executable.length){
            result.detail_code='ESLINT_SCOPE_NOT_CONFIGURED';
          }else{
            const fix=spawnSync('./node_modules/.bin/eslint',['--fix',...executable],{stdio:'inherit'});
            const verify=spawnSync('./node_modules/.bin/eslint',executable,{stdio:'inherit'});
            const changed=execFileSync('git',['diff','--name-only','-z']).toString('utf8')
              .split('\0').filter(Boolean);
            if(fix.status!==0 || verify.status!==0){
              result.detail_code='ESLINT_REMAINING_ERRORS';
            }else if(changed.some(p=>!executable.includes(p))||changed.length>8){
              result.detail_code='UNSAFE_SCOPED_DIFF';
            }else if(changed.length){
              const crypto=require('node:crypto');
              const digest=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
              const before=new Map(changed.map(p=>[p,digest(p)]));
              const gate=spawnSync(process.execPath,
                ['.hh-trusted/scripts/ci-pr-repair-test-scope.cjs',...changed],
                {stdio:'inherit',timeout:195000});
              // A deterministic proposal is NOT publishable when the Core
              // TypeScript failure remains. The initial check is diagnostic;
              // this second exact-patch check is the actual proof.
              const mustCompile=process.env.REPAIR_STRATEGY==='code'||
                changed.some(p=>/\.(?:ts|tsx)$/.test(p));
              const types=mustCompile?spawnSync('./node_modules/.bin/tsc',
                ['--noEmit','--incremental','false','--pretty','false'],
                {stdio:'inherit',timeout:210000}):{status:0};
              const after=execFileSync('git',['diff','--name-only','-z']).toString('utf8')
                .split('\0').filter(Boolean);
              const verified=gate.status===0 && types.status===0 && after.length===changed.length &&
                after.every(p=>before.has(p)&&before.get(p)===digest(p));
              if(!verified) result.detail_code='SCOPED_TESTS_NOT_GREEN';
              for(const path of verified?changed:[]){
                const content=fs.readFileSync(path);
                if(content.length>150000 || content.includes(0))throw Error('Oversized or binary patch');
                result.files.push({path,
                  original_sha:execFileSync('git',['rev-parse','HEAD:'+path]).toString().trim(),
                  base64:content.toString('base64')});
              }
              if(result.files.length)result.detail_code='VERIFIED_SOURCE_PATCH';
            }
          }
          fs.writeFileSync('candidate.json',JSON.stringify(result));
          const candidateStatus=result.files.length?'ready':'manual_required';
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'candidate_status='+candidateStatus+'\n'+
            'candidate_detail='+result.detail_code+'\n');
          console.log('HH_REPAIR_CANDIDATE '+JSON.stringify({
            status:candidateStatus,detail_code:result.detail_code,scope:result.scope,
            source_files:result.files.map(file=>file.path)}));
          NODE
      - uses: actions/upload-artifact@v4
        if: steps.fresh_head.outputs.current == 'true' && needs.claim.outputs.strategy != 'legacy'
        with:
          name: hh-repair-candidate
          path: candidate.json
          retention-days: 1
          if-no-files-found: error
  # Free-only code repair: proposed source patches are created in a no-token
  # runner, independently checked in another runner, and published by the
  # existing guarded trusted publisher only after exact-HEAD verification.
  code_fix:
    needs: [claim,fix]
    if: >-
      needs.claim.result == 'success' &&
      needs.claim.outputs.code_available == 'true' &&
      needs.fix.result == 'success' &&
      needs.fix.outputs.candidate_status == 'manual_required' &&
      (needs.claim.outputs.strategy == 'lint' || needs.claim.outputs.strategy == 'code')
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    permissions:
      contents: read
    outputs:
      candidate_status: ${{ steps.capture.outputs.candidate_status }}
      candidate_detail: ${{ steps.capture.outputs.candidate_detail }}
      model_audit: ${{ steps.capture.outputs.model_audit }}
    env:
      REPAIR_SHA: ${{ needs.claim.outputs.sha }}
      REPAIR_PR: ${{ needs.claim.outputs.pr_number }}
      REPAIR_TASK_KEY: ${{ needs.claim.outputs.task_key }}
      REPAIR_FILES_JSON: ${{ needs.claim.outputs.files_json }}
    steps:
      - name: Checkout exact PR HEAD with no persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.claim.outputs.sha }}
          persist-credentials: false
      - name: Checkout immutable trusted repair scripts without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .hh-trusted
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fail early on unsupported or sensitive free-model source scope
        run: node -e "require('./.hh-trusted/scripts/ci-pr-repair-free-agent.cjs').sourceScope()"
      - name: Install PR test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact free OpenCode CLI version outside PR worktree
        if: needs.claim.outputs.code_provider == 'opencode'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hh-opencode"
          npm install --prefix "$RUNNER_TEMP/hh-opencode" --no-audit --no-fund --no-save @opencode/cli@2.1.2
          "$RUNNER_TEMP/hh-opencode/node_modules/.bin/opencode" --version
      - name: Generate one bounded no-token free-model patch; never retry paid
        shell: bash
        env:
          HH_OPENCODE_BIN: ${{ runner.temp }}/hh-opencode/node_modules/.bin/opencode
          HH_OPENCODE_FREE_API_KEY: ${{ needs.claim.outputs.code_provider == 'opencode' && secrets.HH_OPENCODE_FREE_API_KEY || '' }}
          HH_OPENROUTER_FREE_API_KEY: ${{ needs.claim.outputs.code_provider == 'openrouter' && secrets.HH_OPENROUTER_FREE_API_KEY || '' }}
          # Free model resolved in the trusted adapter from the live zero-price catalog.
          # A profile change never bypasses repair leases, isolation or exact-HEAD CI.
          HH_OPENROUTER_FREE_MODEL: openrouter/free
        run: |
          set -euo pipefail
          # Proposer runs OpenCode in an empty temporary cwd, with an empty
          # HOME/XDG config and deny-all ACL. Only the dedicated free-tier
          # OpenCode credential is passed; no GitHub or paid-provider secret.
          if ! node .hh-trusted/scripts/ci-pr-repair-free-agent.cjs; then
            echo 'Free model unavailable, quota-limited, or patch rejected.'
            echo 'No paid retry, commit, push, or relaxed safety gate.'
            git restore --worktree -- .
          fi
      - id: capture
        name: Capture exact-HEAD allowlisted source proposal only
        run: node .hh-trusted/scripts/ci-pr-repair-code-candidate.cjs capture
      - name: Store untrusted proposal for independent verification
        uses: actions/upload-artifact@v4
        with:
          name: hh-code-repair-raw
          path: candidate-raw.json
          retention-days: 1
          if-no-files-found: error

  code_verify:
    needs: [claim,fix,code_fix]
    if: >-
      always() &&
      needs.claim.result == 'success' &&
      needs.fix.result == 'success' &&
      ((needs.fix.outputs.candidate_status == 'ready') ||
       (needs.code_fix.result == 'success' &&
        needs.code_fix.outputs.candidate_status == 'proposed'))
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: read
    outputs:
      candidate_status: ${{ steps.verify.outputs.candidate_status }}
      candidate_detail: ${{ steps.verify.outputs.candidate_detail }}
    env:
      REPAIR_SHA: ${{ needs.claim.outputs.sha }}
      REPAIR_FILES_JSON: ${{ needs.claim.outputs.files_json }}
    steps:
      - name: Fresh exact-HEAD checkout; no shared model worktree or token
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.claim.outputs.sha }}
          persist-credentials: false
      - name: Read trusted verifier from exact dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .hh-trusted
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.fix.outputs.candidate_status == 'ready' && 'hh-repair-candidate' || 'hh-code-repair-raw' }}
          path: hh-code-candidate
      - id: verify
        name: Independently verify exact SHA, direct tests, lint, TS and diff
        env:
          REPAIR_FROM_DETERMINISTIC: ${{ needs.fix.outputs.candidate_status == 'ready' && 'true' || 'false' }}
        run: node .hh-trusted/scripts/ci-pr-repair-code-candidate.cjs verify
      - name: Upload ONLY independently verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: hh-code-repair-verified
          path: candidate.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [claim,fix,code_fix,code_verify]
    # Do not schedule a separate terminal job for a claimed lint task.
    # The owner token is injected only into the guarded publish_source step.
    if: >-
      always() &&
      github.repository == 'andylitvinov-design/books' &&
      github.ref == 'refs/heads/codex/bootstrap-books' &&
      github.event_name != 'push' &&
      needs.claim.result == 'success' &&
      (needs.claim.outputs.strategy == 'lint' || needs.claim.outputs.strategy == 'code')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    outputs:
      publish_status: ${{ steps.publish_source.outputs.publish_status }}
      publish_sha: ${{ steps.publish_source.outputs.publish_sha }}
      finalization_status: ${{ steps.finalize_outcome.outcome }}
    steps:
      - name: Checkout trusted publisher only (never run PR code with token)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        id: download_candidate
        if: needs.code_verify.result == 'success' && needs.code_verify.outputs.candidate_status == 'ready'
        with:
          name: hh-code-repair-verified
          path: hh-candidate
      - name: Revalidate owner + SHA; publish one source commit with existing owner token
        id: publish_source
        if: needs.code_verify.result == 'success' && needs.code_verify.outputs.candidate_status == 'ready'
        uses: actions/github-script@v7
        env:
          HH_AUTOMERGE_TOKEN: ${{ secrets.HH_AUTOMERGE_TOKEN }}
          HH_REPAIR_JOB_TOKEN: ${{ github.token }}
          HH_REPAIR_SHA: ${{ needs.claim.outputs.sha }}
          HH_REPAIR_PR: ${{ needs.claim.outputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs=require('node:fs');
            const worker=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-repair-worker.cjs');
            const ownerToken=process.env.HH_AUTOMERGE_TOKEN||'';
            const jobToken=process.env.HH_REPAIR_JOB_TOKEN||'';
            const rateGuard=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-repair-owner-rate.cjs');
            const atomicWriter=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-repair-graphql-writer.cjs');
            if(!jobToken)throw Error('HH_REPAIR_JOB_TOKEN_NOT_CONFIGURED');
            let token=jobToken;
            // Credentials are used only in the trusted publisher, after an
            // independently verified candidate. Never run PR code here.
            const probe=async key=>{
              if(!key)return null;
              try{
                const response=await fetch('https://api.github.com/repos/andylitvinov-design/books',{
                  method:'GET',signal:AbortSignal.timeout(12000),
                  headers:{Authorization:'Bearer '+key,Accept:'application/vnd.github+json',
                    'X-GitHub-Api-Version':'2022-11-28'}
                });
                const data=await response.json().catch(()=>({}));
                const raw=response.headers.get('x-ratelimit-remaining');
                return {ok:response.ok&&data.full_name==='andylitvinov-design/books',
                  canPush:data.permissions?.push===true,
                  remaining:typeof raw==='string'&&/^(?:0|[1-9][0-9]{0,9})$/.test(raw)?
                    Number(raw):null};
              }catch{return null;}
            };
            const call=async(method,path,payload,minRemaining=0)=>{
              const response=await fetch('https://api.github.com'+path,{
                method,signal:AbortSignal.timeout(20000),
                headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json',
                  'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
                ...(payload?{body:JSON.stringify(payload)}:{})
              });
              const data=await response.json().catch(()=>({}));
              if(!response.ok){
                // Log only allowlisted operation/status/permission metadata.
                // Never log raw provider errors, branch, token or source code.
                const operation=rateGuard.writerOperation(method,path);
                const receipt={
                  schema:'HH_REPAIR_GIT_DATA_DENIED_V1',
                  operation,status:response.status,
                  kind:rateGuard.errorKind(response.status,String(data.message||'')),
                  accepted_permissions:rateGuard.allowedPermissions(
                    response.headers.get('x-accepted-github-permissions'))
                };
                core.error('HH_REPAIR_GIT_DATA_DENIED '+JSON.stringify(receipt));
                const failure=Error('HH_REPAIR_GIT_DATA_'+operation+'_HTTP_'+response.status);
                failure.status=response.status;
                failure.operation=operation;
                failure.kind=receipt.kind;
                throw failure;
              }
              if(minRemaining>0){
                const rate=rateGuard.requireOwnerRateBudget(response.headers,minRemaining);
                core.info('HH_REPAIR_OWNER_RATE_BUDGET '+JSON.stringify(rate));
              }
              return data;
            };
            const writer={commit:async({owner,repo,branch,expectedSha,treeSha,files,number})=>{
              if(owner!=='andylitvinov-design' || repo!=='books' ||
                 !/^[a-f0-9]{40}$/i.test(expectedSha) || files.length>8)
                throw Error('Unsafe writer arguments');
              const base='/repos/'+owner+'/'+repo;
              const ref='/git/ref/heads/'+branch.split('/').map(encodeURIComponent).join('/');
              // The owner PAT returned Git Data API 403 despite repository
              // permissions.push=true (verified #4275, run 42907804597).
              // Prefer this job's repository-scoped contents:write token.
              // GitHub-token ref updates require the EXISTING next-Core wake
              // fallback; do not fabricate a pull_request synchronization.
              const required=rateGuard.requiredOwnerBudget(files.length);
              const jobProbe=await probe(jobToken);
              // This trusted publisher job declares contents:write; the GitHub
              // repository API may not expose permissions.push for GITHUB_TOKEN.
              // The true write proof is the subsequent Git Data commit/ref.
              const writeJobAuthorized=context.repo.owner==='andylitvinov-design'&&
                context.repo.repo==='books'&&
                context.ref==='refs/heads/codex/bootstrap-books'&&
                context.eventName==='workflow_dispatch';
              const ownerProbe=rateGuard.eligibleScopedJobWriter(jobProbe,required,writeJobAuthorized)?
                null:await probe(ownerToken);
              const mode=rateGuard.chooseWriterMode({job:jobProbe,owner:ownerProbe},required,
                {writeJobAuthorized});
              core.info('HH_REPAIR_SCOPED_WRITER_SELECTION '+JSON.stringify({
                mode,job_identity_verified:jobProbe?.ok===true,
                job_push_field:jobProbe?.canPush===true?'true':'not_true',
                budget_verified:Number.isSafeInteger(jobProbe?.remaining)&&jobProbe.remaining>=required
              }));
              token=mode==='job'?jobToken:ownerToken;
              const repository=await call('GET',base,undefined,required);
              if(repository?.full_name!==owner+'/'+repo||
                (mode==='owner'&&repository.permissions?.push!==true))
                throw Error('HH_REPAIR_WRITER_REPO_WRITE_PERMISSION_MISSING');
              core.info('HH_REPAIR_WRITE_CREDENTIAL VERIFIED_REPOSITORY_IDENTITY_RATE mode='+mode+
                ' remote_write_unverified_until_ref_readback');
              const current=await call('GET',base+ref);
              if(current.ref!=='refs/heads/'+branch || current.object?.sha!==expectedSha)
                throw Error('Source branch moved before repair commit');
              const tree=[];
              for(const [index,file] of files.entries()){
                let blob;
                try{
                  blob=await call('POST',base+'/git/blobs',{content:file.content,encoding:'base64'});
                }catch(error){
                  // One atomic CAS alternative ONLY for a DEFINITIVELY
                  // denied FIRST Git blob. Never after a successful write,
                  // multiple files' mutations, unknown errors or stale HEAD.
                  if(index!==0||mode!=='job'||error?.status!==403||
                     error?.operation!=='CREATE_BLOB'||
                     error?.kind!=='INTEGRATION_PERMISSION_DENIED'||
                     error?.message!=='HH_REPAIR_GIT_DATA_CREATE_BLOB_HTTP_403')
                    throw error;
                  const beforeCas=await call('GET',base+ref);
                  if(beforeCas.ref!=='refs/heads/'+branch||
                     beforeCas.object?.sha!==expectedSha)
                    throw Error('HH_REPAIR_GRAPHQL_FALLBACK_STALE_HEAD');
                  core.info('HH_REPAIR_GIT_DATA_403_GRAPHQL_CAS_ATTEMPT '+JSON.stringify({
                    pr:number,prior_sha:expectedSha,files:files.length,
                    endpoint:'createCommitOnBranch',denied_operation:'CREATE_BLOB',
                    source_write_unverified:true
                  }));
                  const atomic=await atomicWriter.atomicGraphqlCommit({
                    owner,repo,branch,expectedSha,files,number,
                    repairKind:candidate.repair_kind,token});
                  // A GraphQL response alone is not proof of publication.
                  // Worker.publish subsequently verifies remote SHA + parent.
                  const posted=await call('GET',base+ref);
                  if(posted.ref!=='refs/heads/'+branch||
                     posted.object?.sha!==atomic.sha)
                    throw Error('HH_REPAIR_GRAPHQL_REMOTE_REF_NOT_VERIFIED');
                  core.info('HH_REPAIR_REMOTE_REF VERIFIED '+JSON.stringify({
                    sha:atomic.sha,branch,method:atomic.method}));
                  return {sha:atomic.sha};
                }
                if(!/^[a-f0-9]{40}$/i.test(blob.sha||''))throw Error('Blob creation failed');
                tree.push({path:file.path,mode:'100644',type:'blob',sha:blob.sha});
              }
              const t=await call('POST',base+'/git/trees',{base_tree:treeSha,tree});
              const commit=await call('POST',base+'/git/commits',{
                message:'fix(ci): '+(candidate.repair_kind==='free_ai'?'verified free-model source repair':candidate.repair_kind==='codex'?'verified legacy code repair':'verified deterministic source repair')+' for PR #'+number,
                tree:t.sha,parents:[expectedSha]});
              if(!/^[a-f0-9]{40}$/i.test(commit.sha||''))throw Error('No commit SHA');
              const still=await call('GET',base+ref);
              if(still.ref!=='refs/heads/'+branch||still.object?.sha!==expectedSha)
                throw Error('PR branch changed during repair commit');
              let sourceSha=commit.sha,sourceMethod='REST_FAST_FORWARD';
              try{
                await call('PATCH',base+'/git/refs/heads/'+branch.split('/').map(encodeURIComponent).join('/'),
                  {sha:commit.sha,force:false});
              }catch(error){
                // The real v10 failure was UPDATE_REF HTTP 403, AFTER successful
                // blob, tree and unreferenced commit creation. GraphQL CAS
                // safely publishes a separate commit only when HEAD is intact.
                // Never retry if the REST ref write was ambiguous or rate-limited.
                if(!atomicWriter.isDefinitiveRefUpdateDenial(error,mode))throw error;
                const beforeCas=await call('GET',base+ref);
                if(beforeCas.ref!=='refs/heads/'+branch||
                   beforeCas.object?.sha!==expectedSha)
                  throw Error('HH_REPAIR_GRAPHQL_REF_FALLBACK_STALE_HEAD');
                core.info('HH_REPAIR_REF_403_GRAPHQL_CAS_ATTEMPT '+JSON.stringify({
                  pr:number,prior_sha:expectedSha,files:files.length,
                  denied_operation:'UPDATE_REF',source_write_unverified:true
                }));
                const atomic=await atomicWriter.atomicGraphqlCommit({
                  owner,repo,branch,expectedSha,files,number,
                  repairKind:candidate.repair_kind,token
                });
                sourceSha=atomic.sha;
                sourceMethod=atomic.method;
              }
              // An API acceptance is not a published commit until its remote ref
              // and exact parent are independently checked by worker.publish.
              const published=await call('GET',base+ref);
              if(published.ref!=='refs/heads/'+branch||published.object?.sha!==sourceSha)
                throw Error('HH_REPAIR_REMOTE_REF_UPDATE_NOT_VERIFIED');
              core.info('HH_REPAIR_REMOTE_REF VERIFIED '+JSON.stringify({
                sha:sourceSha,branch,method:sourceMethod}));
              return {sha:sourceSha};
            }};
            const candidate=JSON.parse(fs.readFileSync('hh-candidate/candidate.json','utf8'));
            let result;
            try {
              result=await worker.publish({github,core,context,
                prNumber:Number(process.env.HH_REPAIR_PR),
                expectedSha:process.env.HH_REPAIR_SHA,candidate,writer});
            } catch (error) {
              if (error?.message !== 'HH_REPAIR_PUBLISH_STALE_HEAD') throw error;
              // Changed HEAD is a correct fail-closed abort, not a code repair.
              // No PR source, labels or CI checks are altered in this branch.
              result={status:'skipped_stale_head',reason:'STALE_HEAD_ABORTED',
                pr_number:Number(process.env.HH_REPAIR_PR),
                expected_sha:process.env.HH_REPAIR_SHA,source_published:false};
              core.warning('HH_REPAIR: stale source HEAD; discarded isolated candidate');
            }
            core.setOutput('publish_status',result.status);
            core.setOutput('publish_sha',result.sha||'');
            core.info('HH_REPAIR_PUBLISH '+JSON.stringify(result));
            await core.summary.addHeading('HH PR Repair Worker outcome')
              .addCodeBlock(JSON.stringify(result,null,2)).write();
            const {wakeAfterWorker}=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-control-tower-wakeup.cjs');
            core.info('HH_REPAIR_COMPLETION_WAKE '+await wakeAfterWorker({github,context,kind:'repair',status:result.status,dryRun:false,log:core.warning}));

      # A source commit is not a completed repair until the next real
      # pull_request Core run is visible for this exact PR and new source SHA.
      # If the PAT push event is delayed or suppressed, enqueue the existing
      # signed CI bootstrap lane instead of waiting for the next scheduled sweep.
      - name: Verify and recover the next exact-HEAD Core CI wave
        id: verify_next_ci
        if: steps.publish_source.outputs.publish_status == 'committed'
        timeout-minutes: 3
        uses: actions/github-script@v7
        env:
          HH_REPAIR_PR: ${{ needs.claim.outputs.pr_number }}
          HH_PUBLISHED_SHA: ${{ steps.publish_source.outputs.publish_sha }}
          HH_BASE_REF: codex/public-book-library
          # Existing owner credential is exposed only to the trusted publisher
          # step, never the isolated model, fix or code_verify jobs.
          HH_AUTOMERGE_TOKEN: ${{ secrets.HH_AUTOMERGE_TOKEN }}
        with:
          github-token: ${{ github.token }}
          script: |
            const proof=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-next-wave-proof.cjs');
            const owner=context.repo.owner,repo=context.repo.repo;
            const number=Number(process.env.HH_REPAIR_PR);
            const sha=String(process.env.HH_PUBLISHED_SHA||'');
            const baseRef=process.env.HH_BASE_REF;
            if(owner+'/'+repo!==proof.REPO||!Number.isSafeInteger(number)||number<1||
               !/^[a-f0-9]{40}$/i.test(sha))throw Error('HH_NEXT_CI_INVALID_PUBLISHED_IDENTITY');
            const firstSeen=Date.now();
            const identity={prNumber:number,branch:'',sha,baseRef,publishedAt:firstSeen};
            const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
            const find=async()=>{
              const pr=(await github.rest.pulls.get({owner,repo,pull_number:number})).data;
              if(pr.state!=='open'||pr.draft||pr.base?.ref!==baseRef||
                 pr.head?.repo?.full_name!==proof.REPO)
                return {state:'BLOCKED',reason:'PR_CLOSED_DRAFT_OR_FOREIGN'};
              if(pr.head?.sha!==sha)
                return {state:'SUPERSEDED',current_sha:pr.head?.sha||null};
              identity.branch=pr.head.ref;
              const response=await github.rest.actions.listWorkflowRuns({
                owner,repo,workflow_id:'hh-pr-core-release.yml',
                event:'pull_request',branch:identity.branch,per_page:100
              });
              const match=proof.findExactHeadCoreRun(response.data?.workflow_runs,identity);
              if(!match)return {state:'PENDING'};
              const summary={run_id:match.id,url:match.html_url,
                status:match.status,conclusion:match.conclusion};
              if(['queued','waiting','pending','requested'].includes(match.status))
                return {state:'QUEUED',...summary};
              const evidence=await github.rest.actions.listJobsForWorkflowRun({
                owner,repo,run_id:match.id,per_page:100,filter:'latest'});
              const snapshot=evidence?.data;
              const coreJobs=Number.isSafeInteger(snapshot?.total_count)&&
                snapshot.total_count>=0&&snapshot.total_count<=100&&
                Array.isArray(snapshot.jobs)&&snapshot.jobs.length===snapshot.total_count?
                snapshot.jobs:null;
              const state=proof.coreExecutionState(match,coreJobs);
              return {state:state==='UNVERIFIED'?'PENDING':state,...summary};
            };
            let outcome={state:'PENDING'};
            // Give the PAT-authenticated PR synchronize event a short chance to
            // create the ordinary mandatory Core run.
            for(let i=0;i<6;i++){
              outcome=await find();
              if(outcome.state!=='PENDING')break;
              if(i<5)await wait(5000);
            }
            if(outcome.state==='PENDING'){
              // Bot-authored PR synchronization can be action_required
              // with ZERO jobs. A bounded, exact-HEAD owner-authored PR
              // metadata edit requests the ordinary read-only PR Core.
              // No source push, no approval/check spoofing, no paid service.
              const ownerWake=await proof.requestOwnerCoreWake({
                token:process.env.HH_AUTOMERGE_TOKEN||'',prNumber:number,sha,
                fetchImpl:fetch
              });
              core.info('HH_NEXT_CI_OWNER_METADATA_WAKE '+JSON.stringify(ownerWake));
              if(['OWNER_METADATA_EDIT_ACCEPTED','OWNER_WAKE_ALREADY_REQUESTED']
                .includes(ownerWake.status)){
                for(let i=0;i<12;i++){
                  await wait(5000);
                  outcome=await find();
                  if(outcome.state!=='PENDING')break;
                }
              }
            }
            if(outcome.state==='PENDING'){
              // Durable queue hint + existing serialized Watchdog is the
              // no-new-service fallback. The CI worker creates a genuine
              // PR synchronization event; it never marks checks green.
              let live=(await github.rest.pulls.get({owner,repo,pull_number:number})).data;
              if(live.state==='open'&&!live.draft&&live.head?.sha===sha&&
                 live.base?.ref===baseRef){
                const hasHint=(live.labels||[]).some(label=>label.name==='hh:ci-needed');
                if(!hasHint){
                  try{
                    await github.rest.issues.addLabels({owner,repo,issue_number:number,labels:['hh:ci-needed']});
                  }catch(error){
                    if(![404,422].includes(Number(error.status)))throw error;
                    try{
                      await github.rest.issues.createLabel({owner,repo,name:'hh:ci-needed',
                        color:'1d76db',description:'Verified current PR HEAD needs a real Core CI wake'});
                    }catch(createError){if(Number(createError.status)!==422)throw createError;}
                    await github.rest.issues.addLabels({owner,repo,issue_number:number,labels:['hh:ci-needed']});
                  }
                }
                await github.rest.actions.createWorkflowDispatch({
                  owner,repo,workflow_id:'hh-pr-ten-minute-watchdog.yml',
                  ref:'codex/bootstrap-books',inputs:{dry_run:'false',direct_dispatch:'true'}
                });
                core.info('HH_NEXT_CI_FALLBACK_DISPATCHED '+JSON.stringify({pr:number,sha}));
                for(let i=0;i<18;i++){
                  await wait(5000);
                  outcome=await find();
                  if(outcome.state!=='PENDING')break;
                }
              }else outcome={state:'SUPERSEDED',current_sha:live.head?.sha||null};
            }
            core.setOutput('next_ci_status',outcome.state);
            core.info('HH_NEXT_CI_WAVE '+JSON.stringify({pr:number,sha,...outcome}));
            if(outcome.state==='CONFIRMED'){
              await core.summary.addHeading('Next exact-HEAD Core CI wave confirmed')
                .addLink(outcome.url,'Open verified Core run')
                .addRaw('\n\nSource SHA: '+sha).write();
            }else if(outcome.state==='QUEUED'||outcome.state==='RUNNING'){
              // A queued/running job is NOT a completed CI or VERIFIED repair.
              // The existing finalizer and required gates must check results.
              await core.summary.addHeading('Next exact-HEAD Core wave pending independent result')
                .addRaw('\n\nSource SHA: '+sha+'; state: '+outcome.state).write();
            }else if(outcome.state==='SUPERSEDED'){
              await core.summary.addHeading('Published repair superseded by a newer owner HEAD')
                .addRaw('\n\nNewer HEAD: '+String(outcome.current_sha)).write();
            }else{
              try{
                await github.rest.issues.createComment({owner,repo,issue_number:number,
                  body:'HH Repair Worker: source commit `'+sha+'` was published, but a new exact-HEAD Core CI run was not confirmed after automatic recovery. The `hh:ci-needed` queue and existing Watchdog were woken. This is not a GREEN or merge receipt.'});
              }catch(error){core.warning('HH_NEXT_CI_FAILURE_RECEIPT_UNAVAILABLE '+String(error.message||error).slice(0,120));}
              core.setFailed('HH_NEXT_CI_NOT_CONFIRMED: no mandatory Core run observed for published SHA '+sha);
            }

      # Logical finalization on the same trusted runner, not the isolated fix.
      # HH_AUTOMERGE_TOKEN is step-scoped above and absent from this step.
      - name: Finalize on publisher runner
        id: finalize_outcome
        if: always()
        uses: actions/github-script@v7
        env:
          HH_CLAIM_NUMBER: ${{ needs.claim.outputs.pr_number }}
          HH_CLAIM_SHA: ${{ needs.claim.outputs.sha }}
          HH_CLAIM_KEY: ${{ needs.claim.outputs.task_key }}
          HH_AUDIT_ONLY: ${{ needs.claim.outputs.audit_only }}
          HH_CLAIM_STATUS: ${{ needs.claim.outputs.claim_status }}
          HH_CLAIM_REASON: ${{ needs.claim.outputs.claim_reason }}
          HH_CLAIM_RESULT: ${{ needs.claim.result }}
          HH_FIX_RESULT: ${{ needs.fix.result }}
          HH_REPAIR_STRATEGY: ${{ needs.claim.outputs.strategy }}
          HH_CODE_AVAILABLE: ${{ needs.claim.outputs.code_available }}
          HH_CODE_RESULT: ${{ needs.code_fix.result }}
          HH_CODE_STATUS: ${{ needs.code_fix.outputs.candidate_status }}
          HH_CODE_DETAIL: ${{ needs.code_fix.outputs.candidate_detail }}
          HH_MODEL_AUDIT: ${{ needs.code_fix.outputs.model_audit }}
          HH_WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
          HH_CODE_VERIFY_RESULT: ${{ needs.code_verify.result }}
          HH_CODE_VERIFY_STATUS: ${{ needs.code_verify.outputs.candidate_status }}
          HH_CODE_VERIFY_DETAIL: ${{ needs.code_verify.outputs.candidate_detail }}
          HH_DOWNLOAD_RESULT: ${{ steps.download_candidate.outcome }}
          HH_PUBLISH_RESULT: ${{ steps.publish_source.outcome }}
          HH_PUBLISH_STATUS: ${{ steps.publish_source.outputs.publish_status }}
          HH_PUBLISH_SHA: ${{ steps.publish_source.outputs.publish_sha }}
          HH_CANDIDATE_STATUS: ${{ needs.fix.outputs.candidate_status }}
          HH_CANDIDATE_DETAIL: ${{ needs.fix.outputs.candidate_detail }}
          HH_CANDIDATE_SNAPSHOT: ${{ needs.fix.outputs.candidate_snapshot }}
        with:
          github-token: ${{ github.token }}
          script: |
            const worker=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-repair-worker.cjs');
            const inputs=context.payload.inputs||{};
            const publishResult=process.env.HH_DOWNLOAD_RESULT==='failure'
              ? 'failure' : process.env.HH_PUBLISH_RESULT;
            const result=await worker.finalize({github,core,context,
              number:Number(inputs.pr_number||process.env.HH_CLAIM_NUMBER||0),
              expectedSha:String(inputs.expected_sha||process.env.HH_CLAIM_SHA||''),
              taskKey:String(inputs.task_key||process.env.HH_CLAIM_KEY||''),
              claimStatus:process.env.HH_CLAIM_STATUS,
              claimReason:process.env.HH_CLAIM_REASON,
              claimResult:process.env.HH_CLAIM_RESULT,
              fixResult:process.env.HH_FIX_RESULT,
              strategy:process.env.HH_REPAIR_STRATEGY||'lint',
              codeAvailable:process.env.HH_CODE_AVAILABLE==='true',
              codeResult:process.env.HH_CODE_RESULT,
              codeStatus:process.env.HH_CODE_STATUS,
              codeDetail:process.env.HH_CODE_DETAIL,
              modelAuditRaw:process.env.HH_MODEL_AUDIT,
              modelAuditRunAttempt:Number(process.env.HH_WORKFLOW_ATTEMPT||0),
              codeVerifyResult:process.env.HH_CODE_VERIFY_RESULT,
              codeVerifyStatus:process.env.HH_CODE_VERIFY_STATUS,
              codeVerifyDetail:process.env.HH_CODE_VERIFY_DETAIL,
              publishResult,
              publishStatus:process.env.HH_PUBLISH_STATUS,
              publishSha:process.env.HH_PUBLISH_SHA,
              candidateStatus:process.env.HH_CANDIDATE_STATUS,
              candidateDetail:process.env.HH_CANDIDATE_DETAIL,
              candidateSnapshot:process.env.HH_CANDIDATE_SNAPSHOT,
              dryRun:process.env.HH_AUDIT_ONLY==='true'||String(inputs.dry_run||'false')==='true'});
            core.info('HH_REPAIR_FINAL_OUTCOME '+JSON.stringify(result));
            core.setOutput('terminal_state',result.state||'');
            core.setOutput('terminal_reason',result.reason_code||'');
            // The authenticated final outcome is recorded before the job can fail.
            // Never report a claimed repair GREEN without a published source SHA.
            if(worker.claimedRepairMissingSourceProof(result))
              core.setFailed('HH_REPAIR_SOURCE_NOT_PUBLISHED: claimed task has no verified remote SHA; state='+result.state);
      - name: Manus optional single-HEAD manual repair handoff
        if: >-
          always() &&
          steps.finalize_outcome.outputs.terminal_state == 'MANUAL' &&
          needs.claim.outputs.claim_status == 'claimed' &&
          needs.claim.outputs.audit_only != 'true'
        uses: actions/github-script@v7
        env:
          HH_MANUS_ENABLED: ${{ vars.HH_MANUS_ENABLED }}
          HH_MANUS_CREDITS_APPROVED: ${{ vars.HH_MANUS_CREDITS_APPROVED }}
          HH_MANUS_WEBHOOK_URL: ${{ secrets.HH_MANUS_WEBHOOK_URL }}
          HH_MANUS_WEBHOOK_AUTH_HEADER: ${{ secrets.HH_MANUS_WEBHOOK_AUTH_HEADER }}
          HH_MANUS_PR: ${{ needs.claim.outputs.pr_number }}
          HH_MANUS_SHA: ${{ needs.claim.outputs.sha }}
          HH_MANUS_TASK_KEY: ${{ needs.claim.outputs.task_key }}
          HH_MANUS_TERMINAL_STATE: ${{ steps.finalize_outcome.outputs.terminal_state }}
          HH_MANUS_TERMINAL_REASON: ${{ steps.finalize_outcome.outputs.terminal_reason }}
          HH_MANUS_CLAIM_STATUS: ${{ needs.claim.outputs.claim_status }}
        with:
          github-token: ${{ github.token }}
          script: |
            const manus=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-manus-handoff.cjs');
            try {
              const result=await manus.handoff({github,core,context,
                number:Number(process.env.HH_MANUS_PR||0),
                sha:process.env.HH_MANUS_SHA,
                taskKey:process.env.HH_MANUS_TASK_KEY,
                terminalState:process.env.HH_MANUS_TERMINAL_STATE,
                terminalReason:process.env.HH_MANUS_TERMINAL_REASON,
                claimStatus:process.env.HH_MANUS_CLAIM_STATUS,
                enabled:process.env.HH_MANUS_ENABLED,
                creditsApproved:process.env.HH_MANUS_CREDITS_APPROVED,
                url:process.env.HH_MANUS_WEBHOOK_URL,
                authHeader:process.env.HH_MANUS_WEBHOOK_AUTH_HEADER});
              core.info('HH_MANUS_RESULT '+JSON.stringify(result));
            } catch(error) {
              core.warning('HH_MANUS_HANDOFF_UNAVAILABLE '+String(error?.name||'GUARD_ERROR').slice(0,40));
            }

  finalize:
    # Always close an addressed task, even if claim, npm, tests or publish fail.
    # A workflow dispatch or claim is not proof of a source commit.
    needs: [claim,fix,code_fix,code_verify,publish]
    # Normally skipped; if trusted inline recording fails, retry once in
    # a separate read-only-source recovery runner (idempotent task receipt).
    if: >-
      always() &&
      github.repository == 'andylitvinov-design/books' &&
      github.ref == 'refs/heads/codex/bootstrap-books' &&
      github.event_name != 'push' &&
      (
        ((needs.claim.result == 'failure' || needs.claim.result == 'cancelled') &&
         needs.claim.outputs.no_fix_finalized != 'success') ||
        ((needs.claim.outputs.strategy == 'lint' &&
          needs.publish.outputs.finalization_status != 'success') ||
         (needs.claim.outputs.strategy == 'legacy' &&
          needs.claim.result == 'success'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted finalizer without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source commit or record an explicit failure
        uses: actions/github-script@v7
        env:
          HH_CLAIM_NUMBER: ${{ needs.claim.outputs.pr_number }}
          HH_CLAIM_SHA: ${{ needs.claim.outputs.sha }}
          HH_CLAIM_KEY: ${{ needs.claim.outputs.task_key }}
          HH_AUDIT_ONLY: ${{ needs.claim.outputs.audit_only }}
          HH_CLAIM_STATUS: ${{ needs.claim.outputs.claim_status }}
          HH_CLAIM_REASON: ${{ needs.claim.outputs.claim_reason }}
          HH_CLAIM_RESULT: ${{ needs.claim.result }}
          HH_FIX_RESULT: ${{ needs.fix.result }}
          HH_REPAIR_STRATEGY: ${{ needs.claim.outputs.strategy }}
          HH_CODE_AVAILABLE: ${{ needs.claim.outputs.code_available }}
          HH_CODE_RESULT: ${{ needs.code_fix.result }}
          HH_CODE_STATUS: ${{ needs.code_fix.outputs.candidate_status }}
          HH_CODE_DETAIL: ${{ needs.code_fix.outputs.candidate_detail }}
          HH_MODEL_AUDIT: ${{ needs.code_fix.outputs.model_audit }}
          HH_WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
          HH_CODE_VERIFY_RESULT: ${{ needs.code_verify.result }}
          HH_CODE_VERIFY_STATUS: ${{ needs.code_verify.outputs.candidate_status }}
          HH_CODE_VERIFY_DETAIL: ${{ needs.code_verify.outputs.candidate_detail }}
          HH_PUBLISH_RESULT: ${{ needs.publish.result }}
          HH_PUBLISH_STATUS: ${{ needs.publish.outputs.publish_status }}
          HH_PUBLISH_SHA: ${{ needs.publish.outputs.publish_sha }}
          HH_CANDIDATE_STATUS: ${{ needs.fix.outputs.candidate_status }}
          HH_CANDIDATE_DETAIL: ${{ needs.fix.outputs.candidate_detail }}
          HH_CANDIDATE_SNAPSHOT: ${{ needs.fix.outputs.candidate_snapshot }}
        with:
          github-token: ${{ github.token }}
          script: |
            const worker=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-repair-worker.cjs');
            const inputs=context.payload.inputs||{};
            const result=await worker.finalize({github,core,context,
              number:Number(inputs.pr_number||process.env.HH_CLAIM_NUMBER||0),
              expectedSha:String(inputs.expected_sha||process.env.HH_CLAIM_SHA||''),
              taskKey:String(inputs.task_key||process.env.HH_CLAIM_KEY||''),
              claimStatus:process.env.HH_CLAIM_STATUS,
              claimReason:process.env.HH_CLAIM_REASON,
              claimResult:process.env.HH_CLAIM_RESULT,
              fixResult:process.env.HH_FIX_RESULT,
              strategy:process.env.HH_REPAIR_STRATEGY||'lint',
              codeAvailable:process.env.HH_CODE_AVAILABLE==='true',
              codeResult:process.env.HH_CODE_RESULT,
              codeStatus:process.env.HH_CODE_STATUS,
              codeDetail:process.env.HH_CODE_DETAIL,
              modelAuditRaw:process.env.HH_MODEL_AUDIT,
              modelAuditRunAttempt:Number(process.env.HH_WORKFLOW_ATTEMPT||0),
              codeVerifyResult:process.env.HH_CODE_VERIFY_RESULT,
              codeVerifyStatus:process.env.HH_CODE_VERIFY_STATUS,
              codeVerifyDetail:process.env.HH_CODE_VERIFY_DETAIL,
              publishResult:process.env.HH_PUBLISH_RESULT,
              publishStatus:process.env.HH_PUBLISH_STATUS,
              publishSha:process.env.HH_PUBLISH_SHA,
              candidateStatus:process.env.HH_CANDIDATE_STATUS,
              candidateDetail:process.env.HH_CANDIDATE_DETAIL,
              candidateSnapshot:process.env.HH_CANDIDATE_SNAPSHOT,
              dryRun:process.env.HH_AUDIT_ONLY==='true'||String(inputs.dry_run||'false')==='true'});
            core.info('HH_REPAIR_FINAL_OUTCOME '+JSON.stringify(result));

  commander-source-task:
    name: Owner-approved Commander source edit to draft PR
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.ref == 'refs/heads/codex/bootstrap-books' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'andylitvinov-design' &&
      inputs.commander_source_task != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: hh-commander-source-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout immutable trusted control-plane code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated source-task contract tests
        run: |
          node --check scripts/ci-pr-commander-source-task.cjs
          node --test tests/ci-pr-commander-source-task.test.cjs
      - name: Prepare one bounded source candidate without write credentials
        id: source_prep
        uses: actions/github-script@v7
        env:
          HH_COMMANDER_TASK_JSON: ${{ inputs.commander_source_task }}
          HH_OPENROUTER_FREE_API_KEY: ${{ secrets.HH_OPENROUTER_FREE_API_KEY }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {prepare}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-commander-source-task.cjs');
            await prepare({github,context,core,
              raw:process.env.HH_COMMANDER_TASK_JSON,
              freeKey:process.env.HH_OPENROUTER_FREE_API_KEY});
      - name: Publish one verified branch and draft PR with existing owner token
        if: steps.source_prep.outcome == 'success' && inputs.dry_run != true
        uses: actions/github-script@v7
        env:
          HH_COMMANDER_TASK_JSON: ${{ inputs.commander_source_task }}
          HH_OWNER_WRITER_PRESENT: ${{ secrets.HH_AUTOMERGE_TOKEN != '' }}
        with:
          github-token: ${{ secrets.HH_AUTOMERGE_TOKEN }}
          script: |
            if(process.env.HH_OWNER_WRITER_PRESENT!=='true')
              throw Error('COMMANDER_OWNER_GITHUB_TOKEN_NOT_CONFIGURED');
            const {publish}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-commander-source-task.cjs');
            await publish({github,context,core,raw:process.env.HH_COMMANDER_TASK_JSON});
