name: HH Hermes exact-head CI event forwarder

on:
  pull_request:
    branches: ['codex/bootstrap-books']
    paths:
      - '.github/workflows/hh-hermes-ci-event-forward.yml'
      - 'scripts/ci-hermes-event-forwarder.cjs'
      - 'scripts/ci-hermes-event-forwarder.test.cjs'
  workflow_run:
    workflows:
      - 'HH PR core release gate'
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: hh-hermes-ci-event-${{ github.event.workflow_run.id || github.event.pull_request.number }}-${{ github.event.workflow_run.run_attempt || 'pr' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Hermes event guard and negative fixtures
        run: |
          node --check scripts/ci-hermes-event-forwarder.cjs
          node --test scripts/ci-hermes-event-forwarder.test.cjs

  forward:
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'andylitvinov-design/books' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'startup_failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout trusted default-branch helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/bootstrap-books
          persist-credentials: false
      - name: Forward trusted exact-head failure to Hermes
        id: forward
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          HERMES_BASE_URL: ${{ vars.HERMES_BASE_URL }}
          HERMES_SHARED_SECRET: ${{ secrets.HERMES_SHARED_SECRET }}
        with:
          script: |
            const helper = require(process.env.GITHUB_WORKSPACE +
              '/scripts/ci-hermes-event-forwarder.cjs');
            const payload = context.payload;
            const repository = context.repo.owner + '/' + context.repo.repo;
            const validated = helper.validateCoreFailureEvent(payload, repository);
            if (!validated.ok) {
              core.setOutput('forwarded', 'false');
              core.setOutput('reason', validated.reason);
              core.warning('HERMES_CI_EVENT_NOT_FORWARDED ' + validated.reason);
              return;
            }

            const event = validated.value;
            const baseUrl = String(process.env.HERMES_BASE_URL || '').trim();
            const sharedSecret = String(process.env.HERMES_SHARED_SECRET || '');
            if (!baseUrl || !sharedSecret) {
              core.setOutput('forwarded', 'false');
              core.setOutput('reason', 'HERMES_ENDPOINT_OR_SHARED_SECRET_NOT_CONFIGURED');
              core.warning('HERMES_CI_EVENT_NOT_FORWARDED HERMES_ENDPOINT_OR_SHARED_SECRET_NOT_CONFIGURED');
              return;
            }

            let endpoint;
            try {
              const parsed = new URL(baseUrl);
              if (parsed.protocol !== 'https:' || parsed.username || parsed.password ||
                  parsed.search || parsed.hash) throw new Error('invalid endpoint');
              endpoint = new URL('/webhooks/github/workflow-run', parsed.origin).toString();
            } catch {
              core.setOutput('forwarded', 'false');
              core.setOutput('reason', 'HERMES_ENDPOINT_INVALID');
              core.warning('HERMES_CI_EVENT_NOT_FORWARDED HERMES_ENDPOINT_INVALID');
              return;
            }

            let diagnostics = { category: 'UNKNOWN', failedJobs: [], failedSteps: [] };
            try {
              const response = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: event.runId,
                per_page: 100,
                filter: 'latest'
              });
              diagnostics = helper.diagnosticsFromJobs(response.data.jobs || []);
            } catch (error) {
              core.warning('HERMES_CI_DIAGNOSTICS_UNAVAILABLE HTTP ' +
                String(error.status || 'unknown') + '; forwarding event without job names');
            }

            const response = await fetch(endpoint, {
              method: 'POST',
              redirect: 'error',
              signal: AbortSignal.timeout(10000),
              headers: {
                'content-type': 'application/json',
                'x-hermes-secret': sharedSecret,
                'accept': 'application/json'
              },
              body: JSON.stringify({ ...payload, diagnostics })
            });
            if (!response.ok) {
              throw new Error('HERMES_CI_EVENT_RECEIVER_HTTP_' + response.status);
            }

            let receipt;
            try { receipt = await response.json(); }
            catch { throw new Error('HERMES_CI_EVENT_RECEIVER_INVALID_RESPONSE'); }

            core.setOutput('forwarded', 'true');
            core.setOutput('outcome', String(receipt.outcome || 'UNKNOWN').slice(0, 80));
            core.info('HERMES_CI_EVENT_RECEIPT ' + JSON.stringify({
              accepted: receipt.accepted === true,
              outcome: receipt.outcome || 'UNKNOWN',
              job_id: receipt.job_id || null,
              pr_number: event.prNumber,
              head_sha: event.sourceSha,
              run_id: event.runId,
              run_attempt: event.attempt
            }));
