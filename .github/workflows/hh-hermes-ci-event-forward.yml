name: HH Hermes exact-head CI event forwarder

on:
  workflow_run:
    workflows:
      - 'HH PR core release gate'
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: hh-hermes-ci-event-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  forward:
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'startup_failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Forward trusted exact-head failure to Hermes
        id: forward
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          HERMES_BASE_URL: ${{ vars.HERMES_BASE_URL }}
          HERMES_SHARED_SECRET: ${{ secrets.HERMES_SHARED_SECRET }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const repository = context.repo.owner + '/' + context.repo.repo;
            const fail = (code) => {
              core.setOutput('forwarded', 'false');
              core.setOutput('reason', code);
              core.warning('HERMES_CI_EVENT_NOT_FORWARDED ' + code);
            };

            // Keep this sender narrow: the exact trusted Core release workflow only.
            if (repository !== 'andylitvinov-design/books' ||
                run?.name !== 'HH PR core release gate' ||
                run?.event !== 'pull_request' ||
                run?.status !== 'completed' ||
                !['failure', 'timed_out', 'startup_failure'].includes(run?.conclusion)) {
              fail('EVENT_NOT_IN_SCOPE');
              return;
            }

            const runId = Number(run.id);
            const attempt = Number(run.run_attempt);
            if (!Number.isSafeInteger(runId) || runId <= 0 ||
                !Number.isSafeInteger(attempt) || attempt <= 0) {
              fail('INVALID_RUN_IDENTITY');
              return;
            }

            const associations = Array.isArray(run.pull_requests) ? run.pull_requests : [];
            if (associations.length !== 1) {
              fail('PR_ASSOCIATION_NOT_UNAMBIGUOUS');
              return;
            }
            const linked = associations[0];
            const sourceSha = String(linked?.head?.sha || '').toLowerCase();
            if (!Number.isSafeInteger(Number(linked?.number)) ||
                Number(linked.number) <= 0 ||
                !/^[a-f0-9]{40}$/.test(sourceSha) ||
                linked?.head?.repo?.full_name !== repository ||
                linked?.base?.repo?.full_name !== repository ||
                String(run.head_branch || '') !== String(linked?.head?.ref || '')) {
              fail('PR_SOURCE_HEAD_NOT_VERIFIED');
              return;
            }

            const baseUrl = String(process.env.HERMES_BASE_URL || '').trim();
            const sharedSecret = String(process.env.HERMES_SHARED_SECRET || '');
            if (!baseUrl || !sharedSecret) {
              fail('HERMES_ENDPOINT_OR_SHARED_SECRET_NOT_CONFIGURED');
              return;
            }

            let endpoint;
            try {
              const parsed = new URL(baseUrl);
              if (parsed.protocol !== 'https:' || parsed.username || parsed.password ||
                  parsed.search || parsed.hash) throw new Error('invalid endpoint');
              endpoint = new URL('/webhooks/github/workflow-run', parsed.origin).toString();
            } catch {
              fail('HERMES_ENDPOINT_INVALID');
              return;
            }

            // Diagnostics are names only; do not forward raw CI logs or artifacts.
            let failedJobs = [];
            let failedSteps = [];
            try {
              const response = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
                filter: 'latest'
              });
              for (const job of response.data.jobs || []) {
                if (job.conclusion !== 'failure' &&
                    job.conclusion !== 'timed_out' &&
                    job.conclusion !== 'startup_failure') continue;
                if (job.name) failedJobs.push(String(job.name).slice(0, 160));
                for (const step of job.steps || []) {
                  if (['failure', 'timed_out', 'startup_failure'].includes(step.conclusion) &&
                      step.name) failedSteps.push(String(step.name).slice(0, 160));
                }
              }
            } catch (error) {
              core.warning('HERMES_CI_DIAGNOSTICS_UNAVAILABLE HTTP ' +
                String(error.status || 'unknown') + '; forwarding event without job names');
            }

            const payload = {
              ...context.payload,
              diagnostics: {
                category: 'UNKNOWN',
                failedJobs: [...new Set(failedJobs)].slice(0, 10),
                failedSteps: [...new Set(failedSteps)].slice(0, 10)
              }
            };

            const response = await fetch(endpoint, {
              method: 'POST',
              redirect: 'error',
              signal: AbortSignal.timeout(10000),
              headers: {
                'content-type': 'application/json',
                'x-hermes-secret': sharedSecret,
                'accept': 'application/json'
              },
              body: JSON.stringify(payload)
            });
            if (!response.ok) {
              throw new Error('HERMES_CI_EVENT_RECEIVER_HTTP_' + response.status);
            }

            let receipt;
            try { receipt = await response.json(); }
            catch { throw new Error('HERMES_CI_EVENT_RECEIVER_INVALID_RESPONSE'); }

            core.setOutput('forwarded', 'true');
            core.setOutput('outcome', String(receipt.outcome || 'UNKNOWN').slice(0, 80));
            core.info('HERMES_CI_EVENT_RECEIPT ' + JSON.stringify({
              accepted: receipt.accepted === true,
              outcome: receipt.outcome || 'UNKNOWN',
              job_id: receipt.job_id || null,
              pr_number: Number(linked.number),
              head_sha: sourceSha,
              run_id: runId,
              run_attempt: attempt
            }));
