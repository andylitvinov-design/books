name: Holistic House IA v2 checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ['codex/public-book-library']
    paths:
      - '.github/workflows/ia-v2.yml'
      # Core always validates tests/pr-fast-lane.test.mjs on CI-policy PRs.
      # Do not start the full IA/PostgreSQL/Redis/Chromium/WebKit suite for that test alone.
      # Changes to IA workflow, auth, clients, migrations and app remain fully gated.
      - 'scripts/verify-ia-v2.mjs'
      - 'scripts/ia-v2-loopback-proxy.mjs'
      - 'scripts/ia-public-navigation-diagnostics.mjs'
      - 'lib/clients/**'
      - 'lib/prescriptions/**'
      - 'lib/site-navigation-model.js'
      - 'app/api/app/**'
      - 'app/api/auth/**'
      - 'app/**/app/**'
      - 'app/**/client/**'
      - 'components/app/**'
      - 'components/site-navigation*'
      - 'components/csp-navigation*'
      - 'lib/app/**'
      - 'lib/security/**'
      - 'lib/ia/**'
      - 'lib/encryption/**'
      - 'lib/practitioners/**'
      - 'tests/ia-*.mjs'
      - 'tests/app-auth-*.mjs'
      - 'tests/app-migration-*.mjs'
      - 'supabase/migrations/**'
      - 'middleware.ts'
      - 'next.config.*'
      - 'package.json'
      - 'package-lock.json'
      # Public practitioner directory/checkout use Public Services acceptance,
      # not synthetic encrypted owner/client IA with Redis and two browsers.
      - '!lib/practitioners/public-*'
      - '!lib/practitioners/taoist-talisman-cart.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ia-v2-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.action == 'synchronize' }}
jobs:
  browser_preflight:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-slim
    timeout-minutes: 7
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live PR readiness and exact tested HEAD/base before browser budget
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HH_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HH_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci-pr-readiness.mjs
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^2)" = "$HH_EVENT_HEAD_SHA"
          tested_base="$(git rev-parse HEAD^1)"
          [[ "$tested_base" =~ ^[0-9a-f]{40}$ && "$HH_EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$tested_base" != "$HH_EVENT_BASE_SHA" ]]; then
            echo "Tested merge base $tested_base differs from event base $HH_EVENT_BASE_SHA; final trusted gate evaluates production-base freshness." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Node syntax and focused IA source-contract tests
        run: |
          set -euo pipefail
          node --check scripts/verify-ia-v2.mjs
          node --check scripts/ia-v2-loopback-proxy.mjs
          node --check scripts/ia-public-navigation-diagnostics.mjs
          node --check scripts/ci-pr-readiness.mjs
          node --test tests/ia-v2-loopback-proxy.test.mjs tests/ia-public-navigation-diagnostics.test.mjs
  verify:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: [browser_preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hh_app_test
          POSTGRES_PASSWORD: synthetic-ci-admin
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d hh_app_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HH_APP_TEST_RUNTIME: isolated
      HH_TEST_ADMIN_DATABASE_URL: postgres://postgres:synthetic-ci-admin@127.0.0.1:5432/hh_app_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 120
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record exact tested checkout
        run: |
          mkdir -p /tmp/ia222-evidence
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          writeFileSync('/tmp/ia222-evidence/provenance.json', JSON.stringify({
            commit: git('rev-parse', 'HEAD'), tree: git('rev-parse', 'HEAD^{tree}'),
            harnessBlob: git('rev-parse', 'HEAD:scripts/verify-ia-v2.mjs'),
            runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: process.env.GITHUB_REF, productionAccess: false
          }, null, 2));
          JS
      - name: Detect exact Mobile Dock-only batch before costly IA work (fail closed)
        id: dock-scope
        env:
          HH_PR_EVENT: ${{ github.event_name }}
          HH_EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          HH_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo 'dock_only=false' >> "$GITHUB_OUTPUT"
          if [[ "$HH_PR_EVENT" != 'pull_request' ]]; then exit 0; fi
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process'
          import {appendFileSync} from 'node:fs'
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',stdio:['ignore','pipe','pipe']}).trim()
          let dockOnly=false
          try {
            const merge=git('rev-parse','HEAD')
            const parents=git('rev-list','--parents','-n','1','HEAD').split(/\s+/)
            const firstParent=parents[1], secondParent=parents[2]
            const expectedBase=process.env.HH_EXPECTED_BASE||''
            const expectedHead=process.env.HH_EXPECTED_HEAD||''
            const exactHead=/^[0-9a-f]{40}$/.test(expectedHead)&&secondParent===expectedHead
            let baseValid=/^[0-9a-f]{40}$/.test(expectedBase)&&firstParent===expectedBase
            if(!baseValid&&/^[0-9a-f]{40}$/.test(expectedBase)){
              try { git('merge-base','--is-ancestor',expectedBase,firstParent); baseValid=true } catch {}
            }
            const fields=execFileSync('git',['diff','--no-renames','--name-status','-z','HEAD^1','HEAD'],{encoding:'utf8'}).split('\0')
            if(fields.at(-1)==='') fields.pop()
            const expected=new Map([
              ['app/[locale]/app/[[...path]]/workspace.css','M'],
              ['app/[locale]/app/messages/messages-page.css','M'],
              ['components/app/messages-bottom-navigation.jsx','M'],
              ['lib/mobile-visual-bottom.mjs','M'],
            ])
            const rows=[]
            if(fields.length===expected.size*2){
              for(let i=0;i<fields.length;i+=2) rows.push([fields[i+1],fields[i]])
            }
            dockOnly=merge===process.env.GITHUB_SHA&&exactHead&&baseValid&&
              rows.length===expected.size&&rows.every(([path,status])=>expected.get(path)===status)&&
              [...expected.keys()].every(path=>rows.some(row=>row[0]===path))
            console.log(JSON.stringify({merge,firstParent,secondParent,baseValid,dockOnly,files:rows}))
          } catch(error) {
            console.error('Mobile Dock scope not proven; retaining full IA:',error.message)
          }
          appendFileSync(process.env.GITHUB_OUTPUT,'dock_only='+dockOnly+'\n')
          JS
      # These contract suites are deliberately not part of the fast-lane diff allowlist.
      # They are trusted unchanged tests from the production base, never self-modified by the PR.
      - name: Mobile Dock geometry and iPhone keyboard contracts
        if: ${{ steps.dock-scope.outputs.dock_only == 'true' }}
        run: node --test tests/mobile-visual-dock.test.mjs tests/messages-iphone-keyboard-layout.test.mjs
      - run: npm ci --no-audit --no-fund
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' }}
      # Keep IA-owned auth, encryption, ownership and navigation contracts on
      # every non-dock PR. Only the exact five-file dock scope uses focused tests;
      # all ambiguous or mixed changes retain the complete IA release suite.
      - name: IA security, ownership and navigation contracts
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' }}
        run: >-
          node --conditions=react-server --test
          tests/ia-v2.test.mjs tests/ia-preview-verifier.test.mjs tests/admin-session-lifecycle.test.mjs
          tests/ia-v2-loopback-proxy.test.mjs
          tests/ia-public-navigation-diagnostics.test.mjs tests/app-auth-pkce.integration.mjs
          tests/app-migration-contract.test.mjs tests/app-guest-report-migration.test.mjs
          tests/app-http-security.test.mjs tests/prescriptions.test.mjs
          tests/prescription-access.test.mjs tests/client-account-document-save.test.mjs
          tests/practitioner-private-relay.test.mjs tests/admin-login-security.test.mjs
          tests/remote-support-privacy-contract.test.mjs tests/client-session-recorder-auth.test.mjs
          tests/practitioner-preview-auth.test.mjs tests/admin-auth-refresh.test.mjs
          tests/oauth-public-pages.test.mjs tests/public-security-headers.test.mjs
          tests/crm-security-contract.test.mjs tests/session-delivery-security.test.mjs
          tests/practice-telegram-auth-fetch.test.mjs tests/crm-consent.test.mjs
          tests/manual-billing-security.test.mjs
      - name: Application, CRM and billing functional contracts
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' }}
        run: npm run test:app
      - name: Guest test access and privacy contracts
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' }}
        run: >-
          node --conditions=react-server --test
          --test-name-pattern='public picker transparently|public selector sends|guest results display'
          tests/public-tests-auth-transparency.test.mjs
      # Only isolate the Messenger scopes after GitHub PR HEAD and base match.
      # Ambiguous changes retain FULL IA. Auth, CRM/RLS, browser, native/PWA,
      # source validators, and production build remain separately required.
      - name: Select exact-merge Messenger fast lane (fail closed)
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' }}
        id: messenger-scope
        env:
          HH_PR_EVENT: ${{ github.event_name }}
          HH_EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          HH_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process'
          import {appendFileSync} from 'node:fs'
          import {isPrivateMeditationRelease} from './scripts/ci-practitioner-meditation-scope.mjs'
          const allowed=[
            /^app\/\[locale\]\/app\/messages\//,
            /^components\/app\/(?:messages-|crm-messenger|crm-salesbot-assist)/,
            /^lib\/app\/messages-inbox-tabs\.mjs$/,
            /^scripts\/verify-messages-wellness-browser\.mjs$/,
            /^scripts\/verify-ia-v2\.mjs$/,
            /^tests\/messages-[^/]+\.test\.mjs$/,
            /^docs\/crm\/EXTERNAL_TO_PRACTITIONER_MESSENGER_20261031\.md$/,
            /^docs\/design\/MESSAGES_[^/]+\.md$/,
            // One-off consented guest reply: explicit scoped contract only.
            // Never include account auth, webhook, RLS or provider-send files.
            /^components\/app\/public-enquiry-(?:contact|reply)(?:\.jsx|\.module\.css)$/,
            /^lib\/practitioners\/public-enquiry-reply-links\.mjs$/,
            /^lib\/practitioners\/public-service-enquiry\.js$/,
            /^tests\/public-enquiry-reply-handoff\.test\.mjs$/,
            /^\.github\/workflows\/hh-messages-wellness-v2\.yml$/,
          ]
          const mobileDockExpected=new Map([
            ["app/[locale]/app/[[...path]]/workspace.css","M"],
            ["app/[locale]/app/messages/messages-page.css","M"],
            ["components/app/messages-bottom-navigation.jsx","M"],
            ["lib/mobile-visual-bottom.mjs","M"],
          ])
          const operatorExpected=new Map([[".github/workflows/hh-messages-wellness-v2.yml","M"],[".github/workflows/ia-v2.yml","M"],["app/api/app/messages/public-enquiries/[id]/reply-contact/route.js","A"],["components/app/messages-contact-card.jsx","M"],["components/app/messages-simple-inbox.jsx","M"],["components/app/public-enquiry-contact.jsx","M"],["components/app/public-enquiry-operator-reply.jsx","A"],["components/app/public-enquiry-reply.jsx","A"],["components/app/public-enquiry-reply.module.css","A"],["lib/practitioners/public-enquiry-operator-contact.js","A"],["lib/practitioners/public-enquiry-reply-links.mjs","A"],["lib/practitioners/public-service-enquiry.js","M"],["scripts/ci-public-services-plan.mjs","M"],["supabase/migrations/20261101041500_hh_public_enquiry_contact_disclosure_audit.sql","A"],["tests/ci-public-services-plan.test.mjs","M"],["tests/messages-reply-contact-route.test.mjs","A"],["tests/public-enquiry-contact-audit-rls.integration.mjs","A"],["tests/public-enquiry-operator-contact.test.mjs","A"],["tests/public-enquiry-operator-ui.test.mjs","A"],["tests/public-enquiry-reply-handoff.test.mjs","A"]])
          let operatorOnly=false
          let mobileDockOnly=false
          let messengerOnly=false
          let practitionerMeditationOnly=false
          if(process.env.HH_PR_EVENT==='pull_request'){
            try{
              const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim()
              const base=git('rev-parse','HEAD^1')
              const head=git('rev-parse','HEAD^2')
              const files=git('diff','--name-only','HEAD^1','HEAD').split('\n').filter(Boolean)
              const raw=execFileSync('git',['diff','--name-status','-z','HEAD^1','HEAD'],{encoding:'utf8'})
              const fields=raw.split('\0')
              mobileDockOnly=fields.at(-1)==='' &&
                fields.length===mobileDockExpected.size*2+1 &&
                files.length===mobileDockExpected.size &&
                files.every(file=>mobileDockExpected.has(file)) &&
                [...mobileDockExpected].every(([path,status])=>{
                  const i=fields.indexOf(path)
                  return i>0 && fields[i-1]===status
                })
              operatorOnly=fields.at(-1)==='' &&
                fields.length===operatorExpected.size*2+1 &&
                files.length===operatorExpected.size &&
                files.every(file=>operatorExpected.has(file)) &&
                [...operatorExpected].every(([path,status])=>{
                  const i=fields.indexOf(path)
                  return i>0 && fields[i-1]===status
                })
              // The event base SHA can lag the actual test-merge first
              // parent on a fast-moving production branch. Accept only an
              // ancestry-proven descendant from the fetched history. A
              // divergent base, missing history or changed PR HEAD fails shut.
              let baseValid=base===process.env.HH_EXPECTED_BASE
              if(!baseValid && /^[0-9a-f]{40}$/.test(process.env.HH_EXPECTED_BASE||'')){
                git('merge-base','--is-ancestor',process.env.HH_EXPECTED_BASE,base)
                baseValid=true
              }
              messengerOnly=baseValid &&
                head===process.env.HH_EXPECTED_HEAD && files.length>0 &&
                (files.every(file=>allowed.some(pattern=>pattern.test(file)))||operatorOnly||mobileDockOnly)
              operatorOnly=operatorOnly&&messengerOnly
              practitionerMeditationOnly=baseValid &&
                head===process.env.HH_EXPECTED_HEAD && files.length>0 &&
                isPrivateMeditationRelease(files)
              console.log(JSON.stringify({base,head,files,operatorOnly,mobileDockOnly,messengerOnly,practitionerMeditationOnly}))
            }catch(err){
              console.error('Messenger scoped classification unavailable; keeping full IA',err.message)
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT,'messenger_only='+messengerOnly+'\noperator_only='+operatorOnly+'\npractitioner_meditation_only='+practitionerMeditationOnly+'\n')
          JS
      - name: Relevant Messenger, CRM and private-media IA unit contracts
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' && steps.messenger-scope.outputs.messenger_only == 'true' }}
        run: |
          node --test --test-concurrency=2 tests/messages-*.test.mjs tests/practitioner-direct-messages.test.mjs tests/crm-messenger.test.mjs tests/public-enquiry-reply-handoff.test.mjs
          # Server-only imports have React Server conditional exports in Next.js.
          # Execute the full private-media policy tests with their real server condition.
          node --conditions=react-server --test tests/direct-message-media-transport.test.mjs
      - name: Exact operator-only contact consent and tenant authorization contracts
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' && steps.messenger-scope.outputs.operator_only == 'true' }}
        run: node --test tests/messages-reply-contact-route.test.mjs tests/public-enquiry-operator-contact.test.mjs tests/public-enquiry-operator-ui.test.mjs tests/public-enquiry-reply-handoff.test.mjs
      # Original IA security/app contracts above remain mandatory outside the exact dock-only lane.
      # Repository-wide historical inventory stays on explicit maintenance/manual runs.
      # An additional exact-HEAD private-media suite; existing IA auth, RLS,
      # guest browser and production build remain mandatory and unchanged.
      - name: Private meditation owner, authentication, media and safe course contracts
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' && steps.messenger-scope.outputs.practitioner_meditation_only == 'true' }}
        run: |
          node --test tests/practitioner-meditation-studio.test.mjs tests/practitioner-preview-auth.test.mjs tests/practitioner-bridge.test.mjs tests/admin-login-security.test.mjs tests/course-slide-recorder.test.mjs tests/practice-course-materials-navigation.test.mjs tests/practitioner-course-builder.test.mjs tests/practitioner-course-quick-start.test.mjs tests/practice-single-owner-cabinet.test.mjs tests/growth-studio-benchmark-quick-compose.test.mjs tests/ci-practitioner-meditation-scope.test.mjs
      - name: Source-content validators
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' }}
        run: npm run validate:remedy-inventory && npm run validate:remedy-content && npm run validate:remedy-images
      - name: Full lint outside production PR (core release-ready owns production lint)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npm run lint
      - run: npm run native:check && npm run pwa:check
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' }}
      # Read-only restores from the production-seeded cache used by Core.
      # PR jobs never publish shared cache entries; a miss is a safe full build.
      - name: Restore trusted production-owned scenario media cache
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: public/audio/mandala/scenarios
          key: hh-core-media-v1-${{ runner.os }}-${{ hashFiles('scripts/generate-scenario-melodies.mjs', 'scripts/generate-mandala-melodies.mjs', 'lib/mandala/scenario-audio-catalog.mjs', 'package-lock.json') }}
      - name: Restore trusted production Next compiler cache
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: hh-core-next-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}
      - run: npm run build
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' }}
      - name: Full TypeScript outside production PR (core release-ready owns production typing)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npx --no-install tsc --noEmit

      - name: Restore production-owned Playwright browsers (read-only)
        if: steps.dock-scope.outputs.dock_only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: hh-public-browser-blobs-${{ runner.os }}-${{ runner.arch }}-pw1.63.0-v1
      - name: Isolated browser tools and Redis CLI
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' }}
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi
          npm install --prefix /tmp/ia222-browser-tools --no-package-lock --ignore-scripts @playwright/test@1.63.0
          ln -s /tmp/ia222-browser-tools/node_modules/@playwright node_modules/@playwright
          /tmp/ia222-browser-tools/node_modules/.bin/playwright install --with-deps chromium webkit
          sudo apt-get update -qq && sudo apt-get install -y redis-tools
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/ia222-key.pem -out /tmp/ia222-cert.pem -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - name: Initialize disposable owner database with real app migrations
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' }}
        run: node --conditions=react-server tests/helpers/app-db-setup.mjs
      - name: Synthetic encrypted-store and owner/client browser acceptance
        if: ${{ steps.dock-scope.outputs.dock_only != 'true' }}
        run: npm run verify:ia-v2
        env:
          NODE_EXTRA_CA_CERTS: /tmp/ia222-cert.pem
          HH_IA_MESSENGER_ONLY: ${{ steps.messenger-scope.outputs.messenger_only }}
      - name: Full unit inventory outside production PR
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run test:unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia222-synthetic-evidence
          path: /tmp/ia222-evidence/
          retention-days: 7
