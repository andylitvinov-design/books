name: Andrey Voice free local narration checks
on:
  pull_request:
    paths:
      - 'app/api/report-narration/**'
      - 'lib/clients/local-narration*'
      - 'lib/clients/report-narration*'
      - 'components/local-report-narration-player.jsx'
      - 'components/prescription-document.jsx'
      - 'scripts/andrey-voice/**'
      - 'tests/local-narration*'
      - 'tests/report-narration.test.mjs'
      - 'tests/test_andrey_voice_*.py'
      - '.github/workflows/andrey-voice-free-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check lib/clients/local-narration-queue.mjs
          node --check lib/clients/local-narration-service.js
          node --check lib/clients/local-narration-redis.js
          node --check lib/clients/local-narration-media.js
          node --check lib/clients/local-narration-worker-request.js
          node --check lib/clients/report-narration-access.js
          node --check lib/clients/report-narration-service.js
          node --check tests/local-narration-queue.test.mjs
          node --check tests/local-narration-backend-contract.test.mjs
          node --check tests/local-narration-redis-runtime.test.mjs
          node --check tests/report-narration.test.mjs
      - name: Run Node privacy and cost contracts
        run: node --test tests/local-narration-queue.test.mjs tests/local-narration-backend-contract.test.mjs tests/report-narration.test.mjs
      - name: Check Python worker and synthetic references
        run: |
          bash -n scripts/andrey-voice/setup_macos.sh
          python3 -m compileall -q scripts/andrey-voice
          python3 -m unittest discover -s tests -p 'test_andrey_voice_reference.py' -v
          python3 -m unittest discover -s tests -p 'test_andrey_voice_worker.py' -v
          python3 -m unittest discover -s tests -p 'test_andrey_voice_launch_agent.py' -v


  redis-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Launch isolated synthetic-only Redis
        run: docker run -d --rm --name andrey-voice-redis-ci redis:7-alpine
      - name: Exercise real Redis Lua queue, leases and revocation
        run: node --test tests/local-narration-redis-runtime.test.mjs
      - name: Remove test Redis
        if: always()
        run: docker rm -f andrey-voice-redis-ci || true

  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies without invoking any speech providers
        run: npm ci --no-audit --no-fund
      - name: Next.js production build
        run: npm run build
