name: Andrey Voice free local narration contract
on:
  pull_request:
    paths:
      - 'lib/clients/local-narration-queue.mjs'
      - 'lib/clients/report-narration-service.js'
      - 'tests/local-narration-queue.test.mjs'
      - 'tests/report-narration.test.mjs'
      - '.github/workflows/andrey-voice-free-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax (no paid APIs or external voice assets)
        run: |
          node --check lib/clients/local-narration-queue.mjs
          node --check lib/clients/report-narration-service.js
          node --check tests/local-narration-queue.test.mjs
          node --check tests/report-narration.test.mjs
      - name: Run cost and security contracts
        run: node --test tests/local-narration-queue.test.mjs tests/report-narration.test.mjs
