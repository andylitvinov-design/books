name: HH Business Coaching 90-day validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - codex/public-book-library
    paths:
      - 'lib/business-coaching/**'
      - 'lib/app/business-coaching.js'
      - 'components/app/business-coaching*'
      - 'tests/business-coaching-90-days.test.mjs'
      - '.github/workflows/hh-business-coaching.yml'
  workflow_dispatch:
concurrency:
  group: hh-business-coaching-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.action == 'synchronize' }}

jobs:
  business-coaching-contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check lib/business-coaching/program.js
          node --check lib/app/business-coaching.js
          node scripts/check-business-coaching-syntax.mjs
      - name: Business tests
        run: node --test tests/business-coaching-90-days.test.mjs tests/reports-development-program.test.mjs
