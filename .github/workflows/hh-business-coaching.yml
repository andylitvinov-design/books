name: HH Business Coaching 90-day validation
on:
  push:
    branches:
      - feat/business-coaching-90-days-20261020
  pull_request:
    branches:
      - codex/public-book-library
  workflow_dispatch:
jobs:
  business-coaching-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check lib/business-coaching/program.js
          node --check lib/app/business-coaching.js
          node scripts/check-business-coaching-syntax.mjs
      - name: Business tests
        run: node --test tests/business-coaching-90-days.test.mjs tests/reports-development-program.test.mjs
