name: HH PR 10-minute watchdog
on:
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'
  workflow_run:
    workflows:
      - 'HH PR core release gate'
      - 'HH PR source Repair Worker'
      - 'HH zero-cost PR CI worker'
    types: [completed]
  push:
    branches: ['codex/bootstrap-books']
    paths:
      - '.github/workflows/hh-pr-ten-minute-watchdog.yml'
      - 'scripts/ci-pr-ten-minute-watchdog.cjs'
      - 'scripts/ci-pr-event-handoff.cjs'
      - 'tests/ci-pr-event-handoff.test.cjs'
      - 'scripts/ci-pr-control-tower-wakeup.cjs'
      - 'tests/ci-pr-control-tower-wakeup.test.cjs'
      - 'scripts/ci-pr-slot-wakeup.cjs'
      - 'tests/ci-pr-slot-wakeup.test.cjs'
      - 'scripts/ci-pr-priority.cjs'
      - '.github/hh-pr-directions.json'
      - 'scripts/ci-pr-direction-watcher.cjs'
      - '.github/workflows/hh-pr-direction-watcher.yml'
      - 'tests/ci-pr-priority.test.cjs'
      - 'tests/ci-pr-ten-minute-watchdog.test.cjs'
      - 'scripts/ci-pr-queue-dispatcher.cjs'
      - 'scripts/ci-pr-monitor-feed.cjs'
      - 'tests/ci-pr-monitor-feed.test.cjs'
      - 'scripts/ci-pr-ci-wake-reconcile.cjs'
      - 'tests/ci-pr-ci-wake-reconcile.test.cjs'
      - 'tests/ci-pr-control-tower.test.cjs'
      - 'tests/ci-pr-direct-handoff.test.cjs'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect only; no CI retries, PR comments or merge dispatch'
        required: false
        type: boolean
        default: false
      completion_wake:
        description: 'Verify a finished Worker run before direct refill'
        required: false
        type: boolean
        default: false
      worker_run_id:
        description: 'Trusted worker run ID'
        required: false
        type: string
        default: ''
      direct_dispatch:
        description: 'Refill Worker lane without redundant reconciliation'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
  checks: read
  issues: write
  pull-requests: write
jobs:
  reconcile:
    # Skipped successful Core callbacks do not contend for the real worker lease.
    # Each failed-Core PR has an independent exact-branch lease. Periodic
    # reconciliation has its own lane, so event storms cannot replace it.
    concurrency:
      group: hh-pr-ten-minute-watchdog-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || 'periodic' }}
      cancel-in-progress: false
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.ref == 'refs/heads/codex/bootstrap-books' &&
      github.event_name != 'workflow_run' &&
      !(github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.completion_wake == 'true' ||
         github.event.inputs.direct_dispatch == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read trusted watchdog from default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      # Decision/regression tests belong to HH PR watchdog contract on code changes.
      # A stale unit-test assertion must never prevent this live sweep from running.
      - name: Reconcile complete PR inventory; retry transient CI; hand off red source; dispatch guarded merge
        uses: actions/github-script@v7
        env:
          HH_AUTOMERGE_TOKEN: ${{ secrets.HH_AUTOMERGE_TOKEN }}
          HH_HAS_AUTOMERGE_TOKEN: ${{ secrets.HH_AUTOMERGE_TOKEN != '' }}
          HH_CONTROL_TOWER_ENABLED: 'true'
          HH_DIRECT_HANDOFF_ENABLED: 'true'
        with:
          # High-frequency reads use GITHUB_TOKEN, not the scarce merge PAT.
          github-token: ${{ github.token }}
          script: |
            const {run} = require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-ten-minute-watchdog.cjs');
            const token=process.env.HH_AUTOMERGE_TOKEN;
            // Only one trusted GitHub API mutation uses the existing dedicated token.
            // Its events can start CI; a GITHUB_TOKEN base update cannot do that.
            const repairGithub=token ? {request:async(route,args)=>{
              if(route!=='PUT /repos/{owner}/{repo}/pulls/{pull_number}/update-branch' ||
                 args.owner!==context.repo.owner || args.repo!==context.repo.repo ||
                 !Number.isSafeInteger(args.pull_number) ||
                 !/^[a-f0-9]{40}$/i.test(args.expected_head_sha || ''))
                throw Error('Unsafe legacy branch update rejected');
              const url='https://api.github.com/repos/'+args.owner+'/'+args.repo+
                '/pulls/'+args.pull_number+'/update-branch';
              const response=await fetch(url,{
                method:'PUT',signal:AbortSignal.timeout(20000),
                headers:{
                  Authorization:'Bearer '+token,
                  Accept:'application/vnd.github+json',
                  'Content-Type':'application/json',
                  'X-GitHub-Api-Version':'2022-11-28'
                },
                body:JSON.stringify({expected_head_sha:args.expected_head_sha})
              });
              const data=await response.json().catch(()=>({}));
              if(response.status!==202){
                const error=new Error('Dedicated-token update denied: HTTP '+
                  response.status+' '+String(data.message || '').slice(0,200));
                error.status=response.status;
                throw error;
              }
              return {status:response.status,data,
                headers:{'x-ratelimit-remaining':response.headers.get('x-ratelimit-remaining')}};
            }} : null;
            await run({
              github, core, context, repairGithub,
              hasMergeToken: Boolean(token),
              dryRun: context.eventName === 'push' || String(context.payload.inputs?.dry_run ?? 'false') === 'true'
            });
  completion-wait:
    # Wait without holding the direct task writer lease.
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.ref == 'refs/heads/codex/bootstrap-books' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.completion_wake == 'true' &&
      github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: hh-direct-worker-completion-${{ github.event.inputs.worker_run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - name: Read trusted completion verifier
        uses: actions/checkout@v4
        with:
          ref: codex/bootstrap-books
          persist-credentials: false
      - name: Verify completed Worker and relay direct refill
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {relayCompletionWake}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-control-tower-wakeup.cjs');
            const result=await relayCompletionWake({github,context,log:core.warning});
            core.info('HH_DIRECT_WORKER_REFILL '+result);
            if(result!=='DISPATCH_ACCEPTED')core.warning('Verified completion not ready: '+result);
  failed-core-event-handoff:
    name: verified-core-failure-event-handoff
    # Core failures are classified and dispatched in ONE runner allocation.
    # Schedule still runs reconcile + direct-handoff as an independent backstop.
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.ref == 'refs/heads/codex/bootstrap-books' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'HH PR core release gate' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'startup_failure')
    concurrency:
      # Share the same authenticated reservation writer as scheduled dispatch.
      group: hh-control-tower-single-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: write
      checks: read
    steps:
      - name: Checkout trusted control-plane only
        uses: actions/checkout@v4
        with:
          ref: codex/bootstrap-books
          persist-credentials: false
          fetch-depth: 1
      - name: Check exact-HEAD event handler syntax
        run: |
          node --check scripts/ci-pr-event-handoff.cjs
          node --check scripts/ci-pr-ten-minute-watchdog.cjs
          node --check scripts/ci-pr-queue-dispatcher.cjs
          node --check scripts/ci-pr-monitor-feed.cjs
          node --check scripts/ci-pr-ci-wake-reconcile.cjs
      - name: Classify proven failed Core and dispatch the targeted worker immediately
        uses: actions/github-script@v7
        env:
          HH_CONTROL_TOWER_ENABLED: 'true'
          HH_DIRECT_HANDOFF_ENABLED: 'true'
        with:
          github-token: ${{ github.token }}
          script: |
            const {run}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-event-handoff.cjs');
            const report=await run({github,core,context,dryRun:false});
            core.info('HH_CORE_EVENT_HANDOFF '+JSON.stringify(report));
            await core.summary.addHeading('Core failure: event-driven exact-HEAD repair')
              .addCodeBlock(JSON.stringify(report,null,2)).write();
  direct-handoff:
    # Reuse the exact-head worker reservation and admission policy from the
    # dispatcher module, but run it INSIDE Watchdog; Control Tower is not a hop.
    needs: reconcile
    if: >-
      always() &&
      github.repository == 'andylitvinov-design/books' &&
      github.ref == 'refs/heads/codex/bootstrap-books' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.completion_wake != 'true') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.status == 'completed' &&
        github.event.workflow_run.repository.full_name == 'andylitvinov-design/books' &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.conclusion != 'skipped' &&
        (github.event.workflow_run.name == 'HH PR source Repair Worker' ||
         github.event.workflow_run.name == 'HH zero-cost PR CI worker') &&
        github.event.workflow_run.head_branch == 'codex/bootstrap-books' &&
        (github.event.workflow_run.event == 'workflow_dispatch' ||
         (github.event.workflow_run.name == 'HH zero-cost PR CI worker' &&
          github.event.workflow_run.event == 'schedule'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      # Same writer group as pre-migration Control Tower protects rollout races.
      group: hh-control-tower-single-writer
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: write
      checks: read
    steps:
      - name: Checkout trusted worker dispatcher
        uses: actions/checkout@v4
        with:
          ref: codex/bootstrap-books
          persist-credentials: false
          fetch-depth: 1
      - name: Verify queue admission source
        run: |
          node --check scripts/ci-pr-task-state.cjs
          node --check scripts/ci-pr-capacity.cjs
          node --check scripts/ci-pr-queue-dispatcher.cjs
          node --check scripts/ci-pr-monitor-feed.cjs
          node --check scripts/ci-pr-ci-wake-reconcile.cjs
          node --check scripts/ci-pr-ci-legacy-recovery.cjs
      - name: Start workers from Watchdog with signed HEAD reservations
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {run}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-queue-dispatcher.cjs');
            const dryRun=String(context.payload.inputs?.dry_run ?? 'false')==='true';
            const report=await run({github,core,context,dryRun});
            core.info('HH_WATCHDOG_DIRECT_HANDOFF '+JSON.stringify({
              candidates:report.candidates,dispatched:report.dispatchAccepted,
              blocked:report.blocked,reason:report.reason
            }));
            // The monitor consumes the same schema as before, but now from
            // live direct handoff receipts, never a Control Tower observer.
            if(!dryRun && report?.schema==='HH_CONTROL_DISPATCH_V1' &&
               report.reason!=='UNTRUSTED_EVENT' &&
               context.repo.owner==='andylitvinov-design' &&
               context.repo.repo==='books'){
              try {
                const {publishMonitorSnapshot}=require(process.env.GITHUB_WORKSPACE+
                  '/scripts/ci-pr-monitor-feed.cjs');
                const outcome=await publishMonitorSnapshot({github,context,report});
                core.info('HH_DIRECT_HANDOFF_MONITOR_'+outcome.status+
                  ' #3128'+(outcome.run_id?' run='+outcome.run_id:''));
              }catch(error){
                core.warning('HH_DIRECT_HANDOFF_MONITOR_UNAVAILABLE '+
                  String(error?.message||'unknown').slice(0,80));
              }
            }
  reactivate-schedules:
    name: reactivate-schedules-and-dispatch
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/bootstrap-books'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify active workflows, repair disabled schedules and start one real cycle
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            const paths=[
              'hh-pr-ten-minute-watchdog.yml',
              'hh-pr-direction-watcher.yml',
              'hh-pr-ci-worker.yml',
              'hh-pr-repair-worker.yml',
              'hh-pr-full-inventory.yml'
            ];
            const results=[];
            for(const path of paths){
              const before=(await github.rest.actions.getWorkflow({
                owner,repo,workflow_id:path
              })).data;
              if(before.state!=='active'){
                core.warning('HH_SCHEDULER_REPAIR: '+path+' was '+before.state);
                await github.rest.actions.enableWorkflow({owner,repo,workflow_id:path});
              }
              const after=(await github.rest.actions.getWorkflow({
                owner,repo,workflow_id:path
              })).data;
              if(after.state!=='active')
                throw Error('HH_SCHEDULER_REPAIR_NOT_ACTIVE: '+path+' '+after.state);
              results.push({path,before:before.state,after:after.state});
            }
            // Labels are reconciled by the separate Direction Watcher.
            // workflow_dispatch is a documented GITHUB_TOKEN recursion exception.
            // This is ONE bootstrap per trusted workflow change, not every push.
            await github.rest.actions.createWorkflowDispatch({
              owner,repo,workflow_id:'hh-pr-ten-minute-watchdog.yml',
              ref:'codex/bootstrap-books',inputs:{dry_run:'false'}
            });
            // Classify open production PRs immediately on policy rollout; cron
            // remains a ten-minute fallback, not the only activation path.
            await github.rest.actions.createWorkflowDispatch({
              owner,repo,workflow_id:'hh-pr-direction-watcher.yml',
              ref:'codex/bootstrap-books',inputs:{dry_run:'false'}
            });
            core.info('HH_SCHEDULER_REPAIR: '+JSON.stringify(results));
            core.info('HH_WATCHDOG_LIVE_DISPATCH_ACCEPTED');
            await core.summary.addHeading('HH Scheduler activation')
              .addCodeBlock(JSON.stringify(results,null,2))
              .addRaw('Live watchdog workflow_dispatch accepted (dry_run=false).')
              .write();

  core-slot-wakeup:
    name: core-ci-freed-slot-wakeup
    # Success already wakes native AutoMerge. Only schedule a fresh Watchdog
    # when the exact trusted Core event frees scarce CI capacity.
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: hh-pr-core-slot-wakeup
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout trusted default branch for bounded admission policy
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: codex/bootstrap-books
      # The same slot-wakeup decisions are tested by HH PR watchdog contract on code changes.
      - name: Dispatch one live Watchdog only when actual CI capacity is free
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {run}=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-slot-wakeup.cjs');
            await run({github,core,context});
