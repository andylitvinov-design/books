name: HH PR 10-minute watchdog
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: ['codex/bootstrap-books']
    paths:
      - '.github/workflows/hh-pr-ten-minute-watchdog.yml'
      - 'scripts/ci-pr-ten-minute-watchdog.cjs'
      - 'tests/ci-pr-ten-minute-watchdog.test.cjs'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect only; no CI retries, PR comments or merge dispatch'
        required: false
        type: boolean
        default: true
permissions:
  contents: read
  actions: write
  checks: read
  issues: write
  pull-requests: read
concurrency:
  group: hh-pr-ten-minute-watchdog
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'andylitvinov-design/books' && github.ref == 'refs/heads/codex/bootstrap-books'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read trusted watchdog from default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Test watchdog decisions without network
        run: node --test tests/ci-pr-ten-minute-watchdog.test.cjs
      - name: Reconcile complete PR inventory; retry transient CI; hand off red source; dispatch guarded merge
        uses: actions/github-script@v7
        env:
          HH_HAS_AUTOMERGE_TOKEN: ${{ secrets.HH_AUTOMERGE_TOKEN != '' }}
          HH_AUTOMERGE_TOKEN: ${{ secrets.HH_AUTOMERGE_TOKEN }}
        with:
          # All read-only triage and PR handoffs use the short-lived GitHub token.
          # Only the verified branch-update adapter below uses the owner token.
          github-token: ${{ github.token }}
          script: |
            const {run,makeOwnerBranchUpdater} = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci-pr-ten-minute-watchdog.cjs`);
            const dedicated = process.env.HH_AUTOMERGE_TOKEN;
            const repairGithub = dedicated ? makeOwnerBranchUpdater({
              token: dedicated, fetcher: fetch, owner: context.repo.owner, repo: context.repo.repo
            }) : null;
            await run({
              github, core, context,
              repairGithub,
              hasMergeToken: Boolean(dedicated),
              dryRun: context.eventName === 'push' || String(context.payload.inputs?.dry_run ?? 'false') === 'true'
            });
