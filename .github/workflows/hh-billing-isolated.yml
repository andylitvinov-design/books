name: Holistic House isolated billing database verification
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'tests/talisman-google-checkout.test.mjs'
      - 'app/**/cart/**'
      - 'app/api/payments/**'
      - 'app/api/billing/**'
      - 'app/api/services/**'
      - 'components/commerce/**'
      - 'components/*cart*'
      - 'lib/commerce/**'
      - 'lib/billing/**'
      - 'lib/wallet/**'
      - 'components/wallet/**'
      - 'app/api/app/wallet/**'
      - 'app/admin/api/wallet/**'
      - 'app/admin/wallet/**'
      - 'tests/wallet-*.mjs'
      - 'lib/checkout/**'
      - 'tests/billing-*.mjs'
      - 'tests/square-*.mjs'
      - 'tests/service-*.mjs'
      - 'tests/paypal-*.mjs'
      - 'tests/consultation-cart*.mjs'
      - 'tests/personal-cart*.mjs'
      - 'supabase/migrations/**'
      - 'middleware.ts'
      - 'next.config.*'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: hh-billing-database-${{ github.ref }}
  cancel-in-progress: true
jobs:
  billing-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This must be a fresh, dedicated service. Never reuse the app-R1 database.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hh_app_test
          POSTGRES_PASSWORD: synthetic-ci-admin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hh_app_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
      NODE_ENV: test
      HH_APP_TEST_RUNTIME: isolated
      HH_BILLING_TEST_APPLY_PROPOSALS: synthetic-only
      HH_TEST_ADMIN_DATABASE_URL: postgres://postgres:synthetic-ci-admin@127.0.0.1:5432/hh_app_test
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - name: Square checkout syntax, TypeScript and focused lint
        run: |
          node --check lib/wallet/model.js
          node --check lib/wallet/service.js
          node --check app/api/app/wallet/'[action]'/route.js
          node --check app/admin/api/wallet/route.js
          node --check lib/commerce/square-payment-links.js
          node --check lib/commerce/square-gateway.js
          node --check lib/commerce/square-cart-service.js
          node --check app/api/payments/square/checkout/route.js
          node --check app/api/payments/square/status/route.js
          node --check app/api/payments/square/webhook/route.js
          node --check lib/commerce/talisman-checkout.js
          node --check app/api/payments/talismans/checkout/route.js
          npx tsc --noEmit --pretty false
          npx eslint lib/wallet/model.js lib/wallet/service.js app/api/app/wallet app/admin/api/wallet components/wallet/wallet-panel.jsx components/wallet/wallet-review.jsx lib/commerce/square-payment-links.js lib/commerce/square-gateway.js lib/commerce/square-cart-service.js app/api/payments/square components/commerce/personal-cart.tsx app/'[locale]'/cart/page.tsx
      - name: Active PayPal.Me EUR manual fallback, kill switch and no fake paid status
        run: node --test tests/paypal-personal-payments.test.mjs tests/wallet-topups.test.mjs
      - name: Square dynamic checkout signature, CAD price and provider-readback contracts
        run: node --test tests/service-square-api-cart.test.mjs
      - name: Talisman fixed-price provider checkout gate and Google account return
        run: node --test tests/talisman-google-checkout.test.mjs
      - name: Square isolated payment-ledger FORCE RLS on PostgreSQL 17
        run: node --test tests/square-ledger-isolated.integration.mjs
      - name: ZEN checkout signatures, IPN, merchant readback and legacy Stripe regression
        run: node --test tests/service-zen-transfer-inquiry.test.mjs tests/service-commerce-zen.test.mjs tests/service-cart.test.mjs tests/service-commerce-flow.test.mjs tests/service-commerce-stripe.test.mjs tests/service-commerce-paypal.test.mjs tests/service-paypal-hosted-links.test.mjs tests/service-paypal-auto-public-flow.test.mjs tests/service-commerce-repository.test.mjs tests/service-commerce-account-binding.test.mjs tests/service-individual-checkout-methods.test.mjs tests/service-square-individual-payments.test.mjs tests/service-square-api-cart.test.mjs tests/service-personal-payment-entry.test.mjs tests/consultation-cart-experience.test.mjs tests/personal-cart-photo-order.test.mjs tests/service-storefront-shop.test.mjs
      - name: Billing, commerce, CRM and push SQL/RLS with real concurrent transactions
        run: npm run test:billing:db
