name: HH First Video LIVE · encoded file acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['codex/public-book-library']
    paths:
      - 'scripts/benchmarking/first-video-live-export.mjs'
      - 'scripts/benchmarking/video-director-chat-live-acceptance.mjs'
      - 'tests/video-director-chat-live-acceptance.test.mjs'
      - 'tests/ci-pr-selective-workflows.test.mjs'
  workflow_dispatch:
    inputs:
      probe_free_ai:
        description: 'One synthetic opt-in free-AI question; no personal text or payment'
        type: boolean
        default: false
      require_licensed:
        description: 'Verify four licensed MP4 sources in the downloaded video'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hh-live-video-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.action == 'synchronize' }}

jobs:
  anonymous-encoded-video:
    # PR runs validate current source contracts; never compare unmerged source
    # to a different, already-published LIVE deployment. Candidate real
    # Chromium/macOS WebKit media must independently pass Mandala CI.
    # The two LIVE encoded-file smokes remain available on workflow_dispatch.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate safe standalone browser test syntax
        run: |
          node --check scripts/benchmarking/first-video-live-export.mjs
          node --check scripts/benchmarking/video-director-chat-live-acceptance.mjs
          node --test tests/video-director-chat-live-acceptance.test.mjs
      - name: One-shot free AI synthetic opt-in diagnostic
        if: (github.event_name == 'pull_request' && github.event.action == 'opened') || (github.event_name == 'workflow_dispatch' && inputs.probe_free_ai)
        timeout-minutes: 1
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync,writeFileSync} from 'node:fs';
          const origin='https://holistichouse.vercel.app';
          const endpoint=origin+'/api/holistic-support/video-director-chat';
          const payload={consent:true,locale:'en',
            goal:'A gentle sunrise over a quiet mountain meadow',step:'mood',
            draft:{mood:null,aspect:'portrait',duration:20,music:null,phrases:null}};
          const report={test:'single synthetic opt-in free AI question',
            personalDataSent:false,photoOrVoiceSent:false,
            consentGuardVerified:false,providerResponseVerified:false,
            provider:null,httpStatus:null,errorCode:null,durationMs:null,result:'UNVERIFIED'};
          const started=Date.now();
          async function request(consent,timeoutMs){
           const response=await fetch(endpoint,{
             method:'POST',redirect:'error',cache:'no-store',
             headers:{Origin:origin,'Sec-Fetch-Site':'same-origin',
               'Content-Type':'application/json',Accept:'application/json'},
             body:JSON.stringify({...payload,consent}),signal:AbortSignal.timeout(timeoutMs)});
           const responseBody=await response.text();
           let json={};
           if(responseBody.length<=2000){try{json=JSON.parse(responseBody);}catch{}}
           return {response,json};
          }
          try{
           // Must reject absence of consent BEFORE any free provider request.
           const denied=await request(false,5500);
           report.consentGuardVerified=denied.response.status===400&&
             denied.json.error==='VIDEO_CHAT_INVALID_OR_NO_CONSENT';
           if(report.consentGuardVerified){
             // Exactly ONE consented request. Production owns free-confirmed provider routing.
             const {response,json}=await request(true,13000);
             report.httpStatus=response.status;
             if(typeof json.error==='string'&&/^[A-Z0-9_]{1,80}$/.test(json.error))
               report.errorCode=json.error;
             report.providerResponseVerified=response.status===200&&
               ['gemini_free','openrouter_free','groq_free'].includes(json.provider)&&
               typeof json.reply==='string'&&json.reply.length>=12&&json.reply.length<=160&&
               json.changesApplied===false&&json.externalVideoGenerated===false;
             if(report.providerResponseVerified)report.provider=json.provider;
             report.result=report.providerResponseVerified?'PASS':'UNVERIFIED';
           }else report.errorCode='CONSENT_GUARD_UNVERIFIED';
          }catch(error){
           report.errorCode=error?.name==='TimeoutError'?'TIMEOUT':'PROBE_NETWORK_UNAVAILABLE';
          }finally{
           report.durationMs=Date.now()-started;
           mkdirSync('artifacts/benchmarking',{recursive:true});
           writeFileSync('artifacts/benchmarking/video-chat-free-ai-probe.json',
             JSON.stringify(report,null,2)+'\n');
           console.log('VIDEO_CHAT_FREE_AI_LIVE_'+report.result,JSON.stringify(report));
           if(process.env.GITHUB_STEP_SUMMARY)
             writeFileSync(process.env.GITHUB_STEP_SUMMARY,
               'Free AI synthetic opt-in diagnostic: **'+report.result+'**. HTTP: '+
               String(report.httpStatus||'unavailable')+
               '. This is not a mandatory media release check.\n',{flag:'a'});
           if(report.result!=='PASS')console.log('::warning::Free AI provider response unverified; local Director fallback is still available.');
          }
          NODE
      - name: Preserve privacy-safe free AI probe result
        if: always() && ((github.event_name == 'pull_request' && github.event.action == 'opened') || (github.event_name == 'workflow_dispatch' && inputs.probe_free_ai))
        uses: actions/upload-artifact@v4
        with:
          name: hh-video-chat-free-ai-opt-in-diagnostic
          path: artifacts/benchmarking/video-chat-free-ai-probe.json
          retention-days: 2
          if-no-files-found: warn
      - name: PR scope summary — candidate media verified in Mandala CI
        if: github.event_name == 'pull_request'
        run: echo 'PR source contracts passed. Pre-merge LIVE browser checks intentionally not run; exact-HEAD encoded media is owned by the required Mandala specialist.' >> "$GITHUB_STEP_SUMMARY"
      - name: Reuse preinstalled Google Chrome; install pinned Playwright client only
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 2
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/hh-live-video-browser" \
            --no-audit --no-fund --no-package-lock --ignore-scripts \
            playwright@1.63.0
          # Ubuntu 24.04 GitHub runners already include Chrome. Do not waste
          # minutes downloading a second Chromium copy.
          if command -v google-chrome >/dev/null; then google-chrome --version;
          elif command -v google-chrome-stable >/dev/null; then google-chrome-stable --version;
          else echo 'RUNNER_SYSTEM_CHROME_MISSING' >&2; exit 1; fi
      - name: Verify media inspection utilities
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 4
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get install -y --no-install-recommends ffmpeg || {
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends ffmpeg
            }
          fi
          ffprobe -version | sed -n '1p'
      - name: Real LIVE four-shot montage → 20s download → ffprobe/PCM/source identity
        id: legacy_export
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        env:
          HH_LIVE_VIDEO_PLAYWRIGHT: ${{ runner.temp }}/hh-live-video-browser/node_modules/playwright/index.mjs
          # Explicit manual audit chooses whether all four licensed sources are mandatory.
          HH_LIVE_VIDEO_REQUIRE_STOCK: ${{ inputs.require_licensed && 'true' || 'false' }}
        run: node scripts/benchmarking/first-video-live-export.mjs
      - name: Real LIVE Video Director Chat → guided storyboard → encoded audio-video
        # Always verify the real Chat MP4 on PRs; manual QA runs Chat only
        # after a successful legacy form audit. A real Chat failure stays red.
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 5
        env:
          HH_LIVE_VIDEO_PLAYWRIGHT: ${{ runner.temp }}/hh-live-video-browser/node_modules/playwright/index.mjs
        run: node scripts/benchmarking/video-director-chat-live-acceptance.mjs
      - name: Preserve only anonymous capability and failure summary
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hh-first-video-live-encoded-evidence
          path: |
            artifacts/benchmarking/first-video-live-export.json
            artifacts/benchmarking/video-director-chat-live-acceptance.json
          retention-days: 2
          if-no-files-found: warn
