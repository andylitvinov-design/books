name: HH Ideas & Coaching public release
on:
  pull_request:
    branches: [codex/public-book-library]
    paths:
      - '.github/workflows/hh-ideas-coaching-public.yml'
      - 'components/ideas-discovery.tsx'
      - 'components/holistic-support-choices.tsx'
      - 'scripts/verify-holistic-support-browser.mjs'
      - 'tests/holistic-support-*.test.mjs'
      - 'tests/temple-support-hub.test.mjs'
      - 'components/coaching-intake-form.tsx'
      - 'components/coaching-intake-form.module.css'
      - 'components/free-diagnostic-start.tsx'
      - 'components/free-diagnostic-start.module.css'
      - 'app/[locale]/holistic-support/**'
      - 'app/[locale]/temple-insights/**'
      - 'app/api/coaching-diagnostic/**'
      - 'lib/coaching/diagnostic-enquiry.*'
      - 'lib/practitioners/public-service-enquiry-input.mjs'
      - 'lib/whatsapp-enquiry.js'
      - 'tests/coaching-diagnostic-funnel.test.mjs'
      - 'tests/coaching-intake-form.test.mjs'
      - 'tests/temple-insights-compact-cta.test.mjs'
      - 'components/tests-coaching-switchboard.tsx'
      - 'components/tests-coaching-switchboard.module.css'
      - 'components/ideas-discovery.module.css'
      - 'components/public-coaching-discovery.jsx'
      - 'components/public-coaching-discovery.module.css'
      - 'app/[locale]/coaching/page.jsx'
      - 'app/[locale]/coaching/page.module.css'
      - 'app/[locale]/coaching/session/**'
      - 'lib/coaching/public-coaching-catalog.js'
      - 'lib/coaching/public-session-art.js'
      - 'lib/app/personal-coaching-catalog.js'
      - 'lib/site-navigation-model.js'
      - 'lib/public-locales.ts'
      - 'app/[locale]/books/page.tsx'
      - 'app/es/books/page.tsx'
      - 'tests/ideas-guidance.test.mjs'
      - 'tests/tests-coaching-switchboard.test.mjs tests/coaching-diagnostic-funnel.test.mjs tests/coaching-intake-form.test.mjs tests/temple-insights-compact-cta.test.mjs tests/public-service-enquiries.test.mjs'
      - 'scripts/verify-ideas-mobile-browser.mjs'
      - 'scripts/verify-coaching-lounge-mobile.mjs'
      - 'tests/ideas-mobile-ui.test.mjs'
      - 'tests/public-coaching-discovery.test.mjs'
      # The independent Support mobile mock has its own real 18-case acceptance.
      # Source-only parity edits must not run the unrelated Ideas/Coaching build.
      - '!tests/holistic-support-mobile-mock-parity.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hh-ideas-coaching-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-coaching-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Focused Ideas and Coaching regression tests
        run: |
          node --check lib/personal-coaching/model-matcher.js
          node --check scripts/verify-coaching-lounge-mobile.mjs
          node --check scripts/verify-ideas-mobile-browser.mjs
          node --check scripts/verify-holistic-support-browser.mjs
          node --check lib/app/personal-coaching-catalog.js
          node --check lib/coaching/public-coaching-catalog.js
          node --check lib/coaching/public-session-art.js
          node --test tests/public-coaching-discovery.test.mjs tests/ideas-mobile-ui.test.mjs tests/ideas-guidance.test.mjs tests/personal-coaching-model-selection.test.mjs tests/tests-coaching-switchboard.test.mjs tests/holistic-support-first-screen.test.mjs tests/holistic-support-meditations.test.mjs tests/holistic-support-three-choices.test.mjs tests/holistic-support-topics.test.mjs tests/holistic-support-talismans.test.mjs tests/temple-support-hub.test.mjs
      - name: Lint modified application components
        run: npx --no-install eslint components/tests-coaching-switchboard.tsx components/ideas-discovery.tsx components/holistic-support-choices.tsx components/public-coaching-discovery.jsx app/\[locale\]/coaching/page.jsx app/\[locale\]/coaching/session/\[sessionId\]/page.jsx lib/coaching/public-coaching-catalog.js lib/coaching/public-session-art.js lib/app/personal-coaching-catalog.js lib/site-navigation-model.js lib/public-locales.ts components/free-diagnostic-start.tsx components/coaching-intake-form.tsx app/\[locale\]/holistic-support/page.tsx app/\[locale\]/temple-insights/page.tsx app/api/coaching-diagnostic/route.js lib/coaching/diagnostic-enquiry.mjs lib/practitioners/public-service-enquiry-input.mjs lib/whatsapp-enquiry.js
      - name: TypeScript noEmit
        run: npx --no-install tsc --noEmit
      - name: Next.js production build
        run: npm run build
      - name: Install isolated mobile browsers
        run: |
          mkdir -p /tmp/hh-ideas-playwright
          npm install --prefix /tmp/hh-ideas-playwright --no-audit --no-fund --ignore-scripts playwright@1.63.0
          /tmp/hh-ideas-playwright/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Real choice-first mobile journey in Chromium and WebKit (EN/RU/ES)
        env:
          HH_PLAYWRIGHT_PACKAGE: /tmp/hh-ideas-playwright/node_modules/playwright
          HH_PUBLIC_QA_ORIGIN: http://127.0.0.1:3100
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/hh-ideas-next.log 2>&1 & SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3100/en/books >/dev/null; then ready=1; break; fi
            echo "Waiting for local Ideas browser, attempt ${i}/60" >&2
            sleep 2
          done
          if [ "$ready" != 1 ]; then tail -n 120 /tmp/hh-ideas-next.log; exit 1; fi
          node scripts/verify-coaching-lounge-mobile.mjs
          node scripts/verify-holistic-support-browser.mjs
          node scripts/verify-ideas-mobile-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ideas-mobile-choice-first
          path: |
            artifacts/holistic-support/
            artifacts/ideas-mobile/
            artifacts/coaching-mobile/
          retention-days: 7
          if-no-files-found: warn
