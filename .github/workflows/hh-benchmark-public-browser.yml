name: Holistic House benchmark public mobile browser smoke
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ['codex/public-book-library']
    paths:
      - '.github/workflows/hh-benchmark-public-browser.yml'
      - 'scripts/benchmarking/public-browser-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hh-benchmark-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anonymous-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Anonymous Chromium/WebKit · 320–430 · EN/RU/ES
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check test syntax without using project secrets
        run: node --check scripts/benchmarking/public-browser-smoke.mjs
      - name: Install disposable pinned browser runners
        timeout-minutes: 10
        run: |
          npm install --prefix "$RUNNER_TEMP/hh-benchmark-browser" --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.63.0
          "$RUNNER_TEMP/hh-benchmark-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify public test landing and guest entry without writing data
        timeout-minutes: 9
        env:
          HH_BENCH_BROWSER_PKG: ${{ runner.temp }}/hh-benchmark-browser/node_modules/playwright/index.mjs
        run: node scripts/benchmarking/public-browser-smoke.mjs
      - name: Preserve only aggregate anonymous result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hh-benchmark-public-browser-results
          path: artifacts/benchmark-public-browser/results.json
          retention-days: 3
          if-no-files-found: warn
