name: Holistic House CRM source checks

on:
  pull_request:
    branches: [codex/public-book-library]
    paths:
      - 'lib/crm/**'
      - 'lib/business-consulting/**'
      - 'app/api/services/business-consulting/**'
      - 'components/business-website-enquiry.*'
      - 'components/app/crm-business-enquiries.*'
      - 'supabase/migrations/*business_consulting*'
      - 'tests/business-website-enquiry.test.mjs'
      - 'app/api/app/crm/**'
      - 'components/app/crm-manager.*'
      - 'components/app/crm-export-tools.*'
      - 'components/app/crm-contact-editor.*'
      - 'components/app/crm-workflow.*'
      - 'components/app/crm-contact-activity.*'
      - 'supabase/migrations/*crm_*'
      - 'components/app/crm-sms-*.jsx'
      - 'components/app/crm-sms-tools.jsx'
      - 'components/app/crm-sms-setup.jsx'
      - 'components/app/crm-email-*.jsx'
      - 'components/app/crm-email-*.css'
      - 'app/[locale]/email-preferences/**'
      - 'supabase/migrations/*crm_email*'
      - 'tests/crm-*.test.mjs'
      - 'tests/practitioner-client-crm.test.mjs'
      - 'lib/practitioners/client-*.js'
      - 'app/api/app/practitioner-client-messages/**'
      - 'components/app/practitioner-client-profiles.*'
      - 'components/app/practice-request-conversation.*'
      - 'components/app/practice-workspace.jsx'
      - 'components/app/app-workspace.jsx'
      - 'docs/crm/**'
      - '.github/workflows/hh-crm-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned packages
        run: npm ci --no-audit --no-fund
      - name: Verify consent, ownership, actions and fail-closed client requests
        run: node --test tests/crm-consent.test.mjs tests/crm-security-contract.test.mjs tests/crm-client-request.test.mjs tests/crm-email.test.mjs tests/crm-email-source.test.mjs tests/crm-sms.test.mjs tests/crm-workflow.test.mjs tests/crm-activity.test.mjs tests/crm-phone.test.mjs tests/crm-contact-maintenance.test.mjs tests/crm-owner-ops.test.mjs tests/crm-messenger.test.mjs tests/business-website-enquiry.test.mjs tests/practitioner-client-crm.test.mjs
      - name: Lint changed CRM runtime and UI
        run: npx eslint lib/crm/sms-text.js lib/crm/sms-setup.js lib/crm/sms-status.js lib/crm/sms.js lib/crm/sms-store.js lib/crm/sms-dispatch.js app/api/app/crm/sms/webhook/route.js components/app/crm-sms-tools.jsx components/app/crm-sms-setup.jsx lib/crm/repository.js lib/crm/email.js lib/crm/email-store.js lib/crm/email-dispatch.js lib/crm/sms.js lib/crm/sms-store.js lib/crm/sms-dispatch.js app/api/app/crm/route.js app/api/app/crm/sms/webhook/route.js components/app/crm-sms-tools.jsx app/api/app/crm/email-token/route.js app/api/app/crm/webhook/route.js components/app/crm-manager.jsx components/app/crm-contact-editor.jsx lib/crm/contact-edit.js lib/crm/contact-pagination.js lib/crm/contact-search.js lib/crm/contact-csv.js lib/crm/contact-operations-store.js app/api/app/crm/search/route.js app/api/app/crm/export/route.js components/app/crm-export-tools.jsx components/app/crm-email-tools.jsx components/app/crm-email-preferences.jsx components/app/crm-workflow.jsx components/app/crm-contact-activity.jsx lib/crm/activity-pagination.js lib/crm/activity-history-store.js app/api/app/crm/activity/route.js lib/crm/workflow.js lib/crm/workflow-store.js lib/crm/messenger-policy.js lib/crm/messenger-provider.js lib/crm/messenger-store.js lib/crm/messenger-webhook.js app/api/app/crm/messenger/route.js 'app/api/app/crm/messenger/webhook/[provider]/route.js' components/app/crm-messenger.jsx lib/business-consulting/intake-policy.js lib/business-consulting/enquiry-store.js app/api/services/business-consulting/route.js components/app/crm-business-enquiries.jsx components/business-website-enquiry.tsx lib/practitioners/client-profile-groups.js lib/practitioners/client-messages.js app/api/app/practitioner-client-messages/route.js components/app/practitioner-client-profiles.jsx components/app/practice-request-conversation.jsx
