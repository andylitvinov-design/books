name: Holistic House CRM source checks

on:
  pull_request:
    branches: [codex/public-book-library]
    paths:
      - 'lib/crm/**'
      - 'app/api/app/crm/**'
      - 'components/app/crm-manager.*'
      - 'components/app/crm-workflow.*'
      - 'supabase/migrations/*crm_*'
      - 'components/app/crm-email-*.jsx'
      - 'components/app/crm-email-*.css'
      - 'app/[locale]/email-preferences/**'
      - 'supabase/migrations/*crm_email*'
      - 'tests/crm-*.test.mjs'
      - 'docs/crm/**'
      - '.github/workflows/hh-crm-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned packages
        run: npm ci --no-audit --no-fund
      - name: Verify consent, ownership, actions and fail-closed client requests
        run: node --test tests/crm-consent.test.mjs tests/crm-security-contract.test.mjs tests/crm-client-request.test.mjs tests/crm-email.test.mjs tests/crm-email-source.test.mjs tests/crm-workflow.test.mjs
      - name: Lint changed CRM runtime and UI
        run: npx eslint lib/crm/repository.js lib/crm/email.js lib/crm/email-store.js lib/crm/email-dispatch.js app/api/app/crm/route.js app/api/app/crm/email-token/route.js app/api/app/crm/webhook/route.js components/app/crm-manager.jsx components/app/crm-email-tools.jsx components/app/crm-email-preferences.jsx components/app/crm-workflow.jsx lib/crm/workflow.js lib/crm/workflow-store.js
