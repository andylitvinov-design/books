name: Holistic House CRM source checks

on:
  pull_request:
    branches: [codex/public-book-library]
    paths:
      - 'lib/crm/**'
      - 'lib/business-consulting/**'
      - 'components/app/business-enquiry-other-reply.jsx'
      - 'tests/business-enquiry-reply-handoffs.test.mjs'
      - 'components/app/business-enquiry-sms-reply.jsx'
      - 'tests/business-enquiry-reply-channel.test.mjs'
      - 'lib/app/client-phone-*.js'
      - 'app/api/app/contact-phone/**'
      - 'components/app/client-contact-phone.*'
      - 'supabase/migrations/*client_phone_self_service*'
      - 'tests/client-contact-phone.test.mjs'
      - 'app/api/services/business-consulting/**'
      - 'components/business-website-enquiry.*'
      - 'app/[locale]/contact/**'
      - 'tests/public-contact-page.test.mjs'
      - 'components/app/crm-business-enquiries.*'
      - 'supabase/migrations/*business_consulting*'
      - 'tests/business-website-enquiry.test.mjs'
      - 'app/api/app/crm/**'
      - 'components/app/crm-manager.*'
      - 'components/app/crm-messages-navigation.jsx'
      - 'components/app/crm-integration-diagnostics.jsx'
      - 'components/app/crm-export-tools.*'
      - 'components/app/crm-contact-editor.*'
      - 'components/app/crm-workflow.*'
      - 'components/app/crm-contact-activity.*'
      - 'supabase/migrations/*crm_*'
      - 'components/app/crm-sms-*.jsx'
      - 'components/app/notification-settings.jsx'
      - 'tests/notifications-device-onboarding.test.mjs'
      - 'components/contact-channel-chooser.tsx'
      - 'lib/practitioners/public-enquiry-submission.js'
      - 'tests/public-enquiry-*.test.mjs'
      - 'components/free-resource-enquiry.tsx'
      - 'components/free-entry-landing.tsx'
      - 'components/free-drawing-intake.tsx'
      - 'components/alchemy-soul-landing.tsx'
      - 'components/alchemy-soul-lead-form.tsx'
      - 'tests/free-review-conversion.test.mjs'
      - 'tests/alchemy-soul-spanish-parity.test.mjs'
      - 'components/app/crm-sms-tools.jsx'
      - 'components/app/crm-sms-setup.jsx'
      - 'components/app/crm-email-*.jsx'
      - 'components/app/crm-email-*.css'
      - 'app/[locale]/email-preferences/**'
      - 'supabase/migrations/*crm_email*'
      - 'tests/crm-*.test.mjs'
      - 'tests/compact-google-lead-entry.test.mjs'
      - 'lib/app/enquiry-auth-redirect.js'
      - 'tests/practitioner-client-crm.test.mjs'
      - 'tests/practitioner-crm-tasks.test.mjs'
      - 'tests/practitioner-client-work-queue.test.mjs'
      - 'tests/practitioner-conversation-state.test.mjs'
      - 'tests/practitioner-message-send.integration.mjs'
      - 'lib/practitioners/request-tasks.js'
      - 'lib/practitioners/conversation-state.js'
      - 'lib/practitioners/repository.js'
      - 'lib/practitioners/task-policy.js'
      - 'app/api/app/practitioner-request-tasks/**'
      - 'components/app/practitioner-request-tasks.*'
      - 'supabase/migrations/*practitioner_request_followup*'
      - 'supabase/migrations/*practitioner_private_message_push*'
      - 'public/course-notifications-sw.js'
      - 'lib/app/client-message-push.js'
      - 'lib/app/notification-contract.js'
      - 'lib/practitioners/client-*.js'
      - 'app/api/app/practitioner-client-messages/**'
      - 'components/app/practitioner-client-profiles.*'
      - 'components/app/practice-request-conversation.*'
      - 'components/app/practice-workspace.jsx'
      - 'components/app/app-workspace.jsx'
      - 'components/app/messenger-notification-settings.*'
      - 'lib/app/messenger-notification-*.js'
      - 'app/api/app/notification-channels/**'
      - 'supabase/migrations/*messenger_pending_contacts*'
      - 'tests/messenger-notification-subscriptions.test.mjs'
      - 'docs/notifications/MESSENGER_SUBSCRIPTIONS_V1_20261020.md'
      - 'docs/crm/**'
      - '.github/workflows/hh-crm-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned packages
        run: npm ci --no-audit --no-fund
      - name: Verify intake lifecycle, public copy, device onboarding and recorded SMS consent
        run: node --conditions=react-server --test tests/notifications-device-onboarding.test.mjs tests/crm-sms-recorded-consent.test.mjs tests/public-enquiry-submission.test.mjs tests/public-enquiry-component-lifecycle.test.mjs tests/crm-public-registration.test.mjs tests/public-enquiry-copy.test.mjs tests/public-enquiry-single-entry.test.mjs tests/free-review-conversion.test.mjs tests/alchemy-soul-spanish-parity.test.mjs
      - name: Compact enquiry and OAuth return policy
        run: node --test tests/compact-google-lead-entry.test.mjs tests/crm-public-registration.test.mjs tests/contact-channel-chooser.test.mjs tests/organic-event-referrals.test.mjs
      - name: Verify consent, ownership, actions and fail-closed client requests
        run: node --test tests/business-enquiry-reply-handoffs.test.mjs tests/business-enquiry-reply-channel.test.mjs tests/client-contact-phone.test.mjs tests/crm-consent.test.mjs tests/crm-integration-diagnostics.test.mjs tests/crm-communications-hub.test.mjs tests/crm-security-contract.test.mjs tests/crm-public-registration.test.mjs tests/public-service-enquiries.test.mjs tests/crm-client-request.test.mjs tests/crm-email.test.mjs tests/crm-email-source.test.mjs tests/crm-sms.test.mjs tests/crm-workflow.test.mjs tests/crm-lead-triage.test.mjs tests/crm-followup-pagination.test.mjs tests/crm-workday.test.mjs tests/crm-workday-ui.test.mjs tests/crm-activity.test.mjs tests/crm-phone.test.mjs tests/crm-contact-maintenance.test.mjs tests/crm-owner-ops.test.mjs tests/crm-messenger.test.mjs tests/business-website-enquiry.test.mjs tests/public-contact-page.test.mjs tests/practitioner-client-crm.test.mjs tests/practitioner-crm-tasks.test.mjs tests/practitioner-client-work-queue.test.mjs tests/practitioner-conversation-state.test.mjs tests/messenger-notification-subscriptions.test.mjs
      - name: Verify UTF-8 envelopes and concurrent in-app message sends
        run: node --conditions=react-server --test tests/practitioner-message-send.integration.mjs
      - name: Validate practitioner CRM JSX explicitly
        run: npx eslint lib/business-consulting/reply-handoffs.js components/app/business-enquiry-other-reply.jsx components/app/business-enquiry-sms-reply.jsx lib/business-consulting/reply-policy.js 'app/[locale]/contact/page.tsx' lib/app/client-phone-policy.js lib/app/client-phone-repository.js app/api/app/contact-phone/route.js components/app/client-contact-phone.jsx lib/business-consulting/contact-import.js --ext .js,.jsx components/app/practitioner-client-profiles.jsx components/app/practitioner-request-tasks.jsx components/app/practice-request-conversation.jsx lib/practitioners/client-work-queue.js lib/practitioners/conversation-state.js
      - name: Lint changed CRM runtime and UI
        run: npx eslint lib/crm/sms-text.js lib/crm/sms-setup.js lib/crm/sms-status.js lib/crm/sms.js lib/crm/sms-store.js lib/crm/sms-dispatch.js app/api/app/crm/sms/webhook/route.js components/app/crm-sms-tools.jsx components/app/crm-sms-setup.jsx lib/crm/repository.js lib/practitioners/public-service-enquiry.js lib/practitioners/public-service-enquiry-input.mjs components/contact-channel-chooser.tsx components/app/public-enquiry-contact.jsx lib/crm/email.js lib/crm/email-store.js lib/crm/email-dispatch.js lib/crm/sms.js lib/crm/sms-store.js lib/crm/sms-dispatch.js app/api/app/crm/route.js app/api/app/crm/sms/webhook/route.js components/app/crm-sms-tools.jsx app/api/app/crm/email-token/route.js app/api/app/crm/webhook/route.js components/app/crm-manager.jsx components/app/crm-messages-navigation.jsx components/app/crm-integration-diagnostics.jsx lib/crm/integration-readiness.js components/app/crm-lead-triage.jsx app/api/app/crm/leads/route.js components/app/crm-contact-editor.jsx lib/crm/contact-edit.js lib/crm/contact-pagination.js lib/crm/contact-search.js lib/crm/contact-csv.js lib/crm/contact-operations-store.js app/api/app/crm/search/route.js app/api/app/crm/export/route.js components/app/crm-export-tools.jsx components/app/crm-email-tools.jsx components/app/crm-email-preferences.jsx components/app/crm-workflow.jsx components/app/crm-contact-activity.jsx lib/crm/activity-pagination.js lib/crm/activity-history-store.js app/api/app/crm/activity/route.js lib/crm/workflow.js lib/crm/workflow-store.js lib/crm/followup-pagination.js app/api/app/crm/followups/route.js lib/crm/workday.js app/api/app/crm/contact/route.js lib/crm/messenger-policy.js lib/crm/messenger-provider.js lib/crm/messenger-store.js lib/crm/messenger-webhook.js app/api/app/crm/messenger/route.js 'app/api/app/crm/messenger/webhook/[provider]/route.js' components/app/crm-messenger.jsx lib/business-consulting/intake-policy.js lib/business-consulting/enquiry-store.js app/api/services/business-consulting/route.js components/app/crm-business-enquiries.jsx components/business-website-enquiry.tsx lib/practitioners/client-profile-groups.js lib/practitioners/client-work-queue.js lib/practitioners/conversation-state.js lib/practitioners/repository.js lib/practitioners/client-messages.js app/api/app/practitioner-client-messages/route.js components/app/practitioner-client-profiles.jsx components/app/practice-request-conversation.jsx lib/practitioners/task-policy.js lib/practitioners/request-tasks.js app/api/app/practitioner-request-tasks/route.js components/app/practitioner-request-tasks.jsx lib/app/notification-contract.js lib/app/client-message-push.js lib/app/messenger-notification-policy.js lib/app/messenger-notification-repository.js app/api/app/notification-channels/route.js components/app/messenger-notification-settings.jsx components/app/app-workspace.jsx
      - name: Check notification worker syntax
        run: node --check public/course-notifications-sw.js

  # Run Next production build independently of older application unit suites.
  # This protects a CRM release even when unrelated app tests are red.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned packages
        run: npm ci --no-audit --no-fund
      - name: Production Next.js build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
