permissions:
  contents: read
concurrency:
  group: hh-watchdog-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  watchdog-contract:
    name: watchdog-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Resolve and syntax-compile Agent Commander Supabase Edge Function
        run: |
          cd supabase/functions/agent-commander-private-store-v1 && deno cache --no-lock index.ts
          cd ../agent-commander-openrouter-worker && deno cache --no-lock index.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install trusted test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify cloud OpenRouter worker leases, zero-cost, and typed SQL contracts
        run: node --test tests/commander-openrouter-worker.test.mjs
      - name: Syntax-check trusted watchdog and tests
        run: |
          node --check ops/pr-monitor/commander-learning-model.cjs
          node --check ops/pr-monitor/api/commander-learning.js
          node --check ops/pr-monitor/commander-learning.js
          node --check ops/pr-monitor/api/commander-chats.js
