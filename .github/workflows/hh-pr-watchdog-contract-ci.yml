name: HH PR watchdog contract
on:
  pull_request:
    branches: ['codex/bootstrap-books']
    paths:
      - 'scripts/ci-pr-ten-minute-watchdog.cjs'
      - 'scripts/ci-pr-event-handoff.cjs'
      - 'scripts/ci-pr-conflict-event-handoff.cjs'
      - 'scripts/ci-pr-direction-event-label.cjs'
      - 'tests/ci-pr-conflict-event-handoff.test.cjs'
      - 'tests/ci-pr-direction-event-label.test.cjs'
      - 'tests/ci-pr-event-snapshot-fastpath.test.cjs'
      - 'scripts/ci-pr-task-state.cjs'
      - 'tests/ci-pr-event-handoff.test.cjs'
      - 'scripts/ci-pr-control-tower-wakeup.cjs'
      - 'tests/ci-pr-control-tower-wakeup.test.cjs'
      - 'tests/ci-pr-control-tower.test.cjs'
      - 'tests/ci-pr-inprocess-snapshot.test.cjs'
      - 'tests/ci-pr-direct-handoff.test.cjs'
      - 'scripts/ci-pr-queue-dispatcher.cjs'
      - 'scripts/ci-pr-monitor-feed.cjs'
      - 'scripts/ci-pr-ci-daytime-signals.cjs'
      - 'tests/ci-pr-ci-daytime-signals.test.cjs'
      - 'scripts/ci-pr-blocker-progress.cjs'
      - 'tests/ci-pr-monitor-feed.test.cjs'
      - 'tests/ci-pr-blocker-progress.test.cjs'
      - 'scripts/ci-pr-ci-wake-reconcile.cjs'
      - 'scripts/ci-pr-selective-core-rerun.cjs'
      - 'tests/ci-pr-selective-core-rerun.test.cjs'
      - 'tests/ci-pr-ci-wake-reconcile.test.cjs'
      - '.github/workflows/hh-pr-queue-dispatcher.yml'
      - 'scripts/ci-pr-slot-wakeup.cjs'
      - 'tests/ci-pr-slot-wakeup.test.cjs'
      - 'scripts/ci-pr-priority.cjs'
      - 'scripts/ci-pr-direction-watcher.cjs'
      - 'tests/ci-pr-direction-watcher.test.cjs'
      - '.github/hh-pr-directions.json'
      - '.github/workflows/hh-pr-direction-watcher.yml'
      - 'tests/ci-pr-priority.test.cjs'
      - '.github/workflows/hh-pr-ten-minute-watchdog.yml'
      - '.github/workflows/hh-pr-full-inventory.yml'
      - 'scripts/ci-pr-api-budget.cjs'
      - 'tests/ci-pr-api-budget.test.cjs'
      - 'scripts/ci-pr-live-verifier.cjs'
      - 'scripts/ci-pr-release-outcomes.cjs'
      - 'scripts/ci-pr-served-release.cjs'
      - 'tests/ci-pr-served-release.test.cjs'
      - 'tests/ci-pr-release-outcomes.test.cjs'
      - 'scripts/ci-pr-release-kpi.cjs'
      - 'tests/ci-pr-release-kpi.test.cjs'
      - 'scripts/ci-pr-kpi*.cjs'
      - 'scripts/ci-pr-phase-times.cjs'
      - 'scripts/ci-pr-timeline-audit.cjs'
      - 'ops/pr-monitor/ci-pr-timeline-audit.cjs'
      - 'ops/pr-monitor/api/ci-journey-summary.js'
      - 'ops/pr-monitor/ci-journey-dashboard.js'
      - 'tests/ci-pr-core-journey-summary.test.cjs'
      - 'ops/pr-monitor/api/pr-attribution.js'
      - 'ops/pr-monitor/pr-attribution-ui.js'
      - 'ops/pr-monitor/pr-attribution-ui.css'
      - 'ops/pr-monitor/pr-open-queue.js'
      - 'ops/pr-monitor/pr-two-screen.js'
      - 'ops/pr-monitor/watchdog-control-tower.js'
      - 'tests/pr-monitor-reconciliation-v2.test.cjs'
      - 'tests/ci-pr-timeline-audit.test.cjs'
      - 'tests/pr-attribution-api.test.cjs'
      - 'ops/pr-monitor/pr-checkpoint-evidence.cjs'
      - 'tests/pr-checkpoint-evidence.test.cjs'
      - 'tests/ci-pr-kpi*.test.cjs tests/ci-pr-api-budget.test.cjs'
      - 'tests/ci-pr-live-verifier.test.cjs'
      - 'tests/ci-pr-orchestration-triggers.test.cjs'
      - '.github/workflows/hh-native-auto-merge.yml'
      - 'scripts/ci-pr-base-freshness.cjs'
      - 'scripts/ci-pr-base-advanced-recovery.cjs'
      - 'tests/ci-pr-base-advanced-recovery.test.cjs'
      - '.github/workflows/hh-pr-direct-core-failure.yml'
      - 'scripts/ci-pr-native-merge-policy.cjs'
      - 'tests/ci-pr-native-merge-policy.test.cjs'
      - 'tests/ci-pr-base-freshness.test.cjs'
      - 'tests/ci-pr-base-classifier-integration.test.cjs'
      - 'tests/ci-pr-merge-gates.test.cjs'
      - 'tests/ci-pr-ten-minute-watchdog.test.cjs'
      - '.github/workflows/hh-pr-closed-run-cleanup.yml'
      - 'scripts/ci-pr-closed-run-cleanup.cjs'
      - 'tests/ci-pr-closed-run-cleanup.test.cjs'
      - '.github/workflows/hh-pr-watchdog-contract-ci.yml'
      - '.github/workflows/hh-pr-ci-worker.yml'
      - '.github/workflows/hh-pr-repair-worker.yml'
      - '.github/workflows/hh-pr-cron-owner-repair.yml'
      - 'scripts/ci-pr-repair-worker.cjs'
      - 'scripts/ci-pr-runner-evidence.cjs'
      - 'tests/ci-pr-runner-evidence.test.cjs'
      - 'scripts/ci-pr-repair-test-scope.cjs'
      - 'scripts/ci-pr-repair-deterministic.cjs'
      - 'scripts/ci-pr-repair-free-agent.cjs'
      - 'scripts/ci-pr-repair-code-candidate.cjs'
      - 'tests/ci-pr-repair-free-agent.test.cjs'
      - 'tests/ci-pr-repair-worker.test.cjs'
      - 'tests/ci-pr-legacy-cloud.test.cjs'
      - 'tests/ci-pr-repair-source-proof.test.cjs'
      - 'tests/ci-pr-repair-test-scope.test.cjs'
      - 'tests/ci-pr-repair-deterministic.test.cjs'
      - 'scripts/ci-pr-ci-worker.cjs'
      - 'scripts/ci-pr-core-metadata-wake.cjs'
      - 'scripts/ci-pr-schedule-fallback.cjs'
      - 'tests/ci-pr-core-metadata-wake.test.cjs'
      - 'tests/ci-pr-ci-worker.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hh-watchdog-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  watchdog-contract:
    name: watchdog-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install trusted test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax-check trusted watchdog and tests
        run: |
          node --check scripts/ci-pr-priority.cjs
          node --check scripts/ci-pr-direction-watcher.cjs
          node --check tests/ci-pr-direction-watcher.test.cjs
          node --check tests/ci-pr-priority.test.cjs
          node --check scripts/ci-pr-ten-minute-watchdog.cjs
          node --check scripts/ci-pr-event-handoff.cjs
          node --check scripts/ci-pr-conflict-event-handoff.cjs
          node --check scripts/ci-pr-direction-event-label.cjs
          node --check tests/ci-pr-direction-event-label.test.cjs
          node --check tests/ci-pr-conflict-event-handoff.test.cjs
          node --check tests/ci-pr-event-snapshot-fastpath.test.cjs
          node --check tests/ci-pr-event-handoff.test.cjs
          node --check scripts/ci-pr-api-budget.cjs
          node --check tests/ci-pr-api-budget.test.cjs
          node --check scripts/ci-pr-control-tower-wakeup.cjs
          node --check scripts/ci-pr-queue-dispatcher.cjs
          node --check scripts/ci-pr-monitor-feed.cjs
          node --check scripts/ci-pr-ci-daytime-signals.cjs
          node --check tests/ci-pr-ci-daytime-signals.test.cjs
          node --check scripts/ci-pr-blocker-progress.cjs
          node --check tests/ci-pr-monitor-feed.test.cjs
          node --check tests/ci-pr-blocker-progress.test.cjs
          node --check scripts/ci-pr-ci-wake-reconcile.cjs
          node --check scripts/ci-pr-selective-core-rerun.cjs
          node --check tests/ci-pr-selective-core-rerun.test.cjs
          node --check tests/ci-pr-ci-wake-reconcile.test.cjs
          node --check tests/ci-pr-control-tower.test.cjs
          node --check tests/ci-pr-inprocess-snapshot.test.cjs
          node --check tests/ci-pr-direct-handoff.test.cjs
          node --check scripts/ci-pr-slot-wakeup.cjs
          node --check tests/ci-pr-slot-wakeup.test.cjs
          node --check tests/ci-pr-ten-minute-watchdog.test.cjs
          node --check scripts/ci-pr-closed-run-cleanup.cjs
          node --check tests/ci-pr-closed-run-cleanup.test.cjs
          node --check scripts/ci-pr-ci-worker.cjs
          node --check scripts/ci-pr-core-metadata-wake.cjs
          node --check scripts/ci-pr-schedule-fallback.cjs
          node --check tests/ci-pr-core-metadata-wake.test.cjs
          node --check scripts/ci-pr-repair-worker.cjs
          node --check scripts/ci-pr-runner-evidence.cjs
          node --check tests/ci-pr-runner-evidence.test.cjs
          node --check scripts/ci-pr-repair-test-scope.cjs
          node --check scripts/ci-pr-repair-deterministic.cjs
          node --check scripts/ci-pr-repair-free-agent.cjs
          node --check scripts/ci-pr-repair-code-candidate.cjs
          node --check tests/ci-pr-repair-free-agent.test.cjs
          node --check tests/ci-pr-repair-deterministic.test.cjs
          node --check scripts/ci-pr-live-verifier.cjs
          node --check scripts/ci-pr-base-freshness.cjs
          node --check scripts/ci-pr-base-advanced-recovery.cjs
          node --check tests/ci-pr-base-advanced-recovery.test.cjs
          node --check scripts/ci-pr-native-merge-policy.cjs
          node --check tests/ci-pr-native-merge-policy.test.cjs
          node --check tests/ci-pr-merge-gates.test.cjs
          node --check scripts/ci-pr-release-outcomes.cjs
          node --check scripts/ci-pr-served-release.cjs
          node --check tests/ci-pr-served-release.test.cjs
          node --check scripts/ci-pr-release-kpi.cjs
          node --check scripts/ci-pr-phase-times.cjs
          node --check scripts/ci-pr-timeline-audit.cjs
          node --check ops/pr-monitor/ci-pr-timeline-audit.cjs
          node --check ops/pr-monitor/api/pr-attribution.js
          node --check ops/pr-monitor/pr-attribution-ui.js
          node --check ops/pr-monitor/pr-cohort-wall-clock.js
          node --check ops/pr-monitor/pr-journey-health.js
          node --check ops/pr-monitor/pr-two-screen.js
          node --check ops/pr-monitor/api/ci-journey-summary.js
          node --check ops/pr-monitor/ci-journey-dashboard.js
          node --check tests/pr-cohort-wall-clock.test.cjs
          node --check tests/pr-monitor-reconciliation-v2.test.cjs
          node --check tests/ci-pr-timeline-audit.test.cjs
          node --check tests/pr-attribution-api.test.cjs
          node --check ops/pr-monitor/pr-checkpoint-evidence.cjs
          node --check tests/pr-checkpoint-evidence.test.cjs
          for f in scripts/ci-pr-kpi*.cjs tests/ci-pr-kpi*.test.cjs; do node --check "$f"; done
          node --check tests/ci-pr-ci-worker.test.cjs
          node --check tests/ci-pr-repair-worker.test.cjs
          node --check scripts/ci-pr-manus-handoff.cjs
          node --check tests/ci-pr-manus-handoff.test.cjs
          node --check tests/ci-pr-legacy-cloud.test.cjs
          node --check tests/ci-pr-repair-source-proof.test.cjs
      - name: Watchdog decision contracts
        run: node --test tests/ci-pr-direction-watcher.test.cjs tests/ci-pr-slot-wakeup.test.cjs tests/ci-pr-priority.test.cjs tests/ci-pr-ten-minute-watchdog.test.cjs tests/ci-pr-merge-gates.test.cjs tests/ci-pr-native-merge-policy.test.cjs tests/ci-pr-base-freshness.test.cjs tests/ci-pr-base-advanced-recovery.test.cjs tests/ci-pr-ci-worker.test.cjs tests/ci-pr-core-metadata-wake.test.cjs tests/ci-pr-repair-worker.test.cjs tests/ci-pr-legacy-cloud.test.cjs tests/ci-pr-repair-source-proof.test.cjs tests/ci-pr-runner-evidence.test.cjs tests/ci-pr-repair-test-scope.test.cjs tests/ci-pr-repair-deterministic.test.cjs tests/ci-pr-repair-free-agent.test.cjs tests/ci-pr-orchestration-triggers.test.cjs tests/ci-pr-control-tower-wakeup.test.cjs tests/ci-pr-control-tower.test.cjs tests/ci-pr-ci-wake-reconcile.test.cjs tests/ci-pr-selective-core-rerun.test.cjs tests/ci-pr-direct-handoff.test.cjs tests/ci-pr-inprocess-snapshot.test.cjs tests/ci-pr-monitor-feed.test.cjs tests/ci-pr-ci-daytime-signals.test.cjs tests/ci-pr-blocker-progress.test.cjs tests/ci-pr-event-handoff.test.cjs tests/ci-pr-conflict-event-handoff.test.cjs tests/ci-pr-direction-event-label.test.cjs tests/ci-pr-event-snapshot-fastpath.test.cjs tests/ci-pr-live-verifier.test.cjs tests/ci-pr-served-release.test.cjs tests/ci-pr-release-outcomes.test.cjs tests/ci-pr-release-kpi.test.cjs tests/ci-pr-kpi*.test.cjs tests/ci-pr-closed-run-cleanup.test.cjs tests/ci-pr-manus-handoff.test.cjs
      - name: PR attribution timeline evidence contracts
        run: node --test tests/ci-pr-timeline-audit.test.cjs tests/pr-attribution-api.test.cjs tests/pr-checkpoint-evidence.test.cjs tests/pr-cohort-wall-clock.test.cjs tests/pr-monitor-reconciliation-v2.test.cjs tests/ci-pr-core-journey-summary.test.cjs tests/pr-monitor-two-screen.test.cjs
      - name: Checkout protected production classifier for integration test
        uses: actions/checkout@v4
        with:
          ref: codex/public-book-library
          path: .hh-merge-policy-production
          persist-credentials: false
      - name: Verify pinned classifier integration without write credentials
        run: node --test tests/ci-pr-base-classifier-integration.test.cjs
      - name: Probe real KPI evidence without write credentials
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'codex/control-tower-kpi-')
        timeout-minutes: 6
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const kpi=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-kpi-run.cjs');
            await kpi.run({github,core,context});
