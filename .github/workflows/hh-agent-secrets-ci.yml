name: HH Agent Secrets Safety

on:
  pull_request:
    branches:
      - codex/public-book-library
    paths:
      - AGENTS.md
      - docs/integrations/AGENT_SECRET_AUTOMATION.md
      - scripts/agent-secret-bridge.mjs
      - tests/agent-secret-bridge.test.mjs
      - package.json
      - .github/workflows/hh-agent-secrets-ci.yml
  push:
    branches:
      - codex/public-book-library
    paths:
      - AGENTS.md
      - docs/integrations/AGENT_SECRET_AUTOMATION.md
      - scripts/agent-secret-bridge.mjs
      - tests/agent-secret-bridge.test.mjs
      - package.json
      - .github/workflows/hh-agent-secrets-ci.yml

permissions:
  contents: read

jobs:
  no-secret-agent-bridge:
    name: Dry-run and no-leak contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Parse helper and tests
        run: |
          node --check scripts/agent-secret-bridge.mjs
          node --check tests/agent-secret-bridge.test.mjs
      - name: Test protected secret transport without live credentials
        run: npm run test:agent-secrets
      - name: Verify read-only plan needs no Vercel token
        run: |
          node scripts/agent-secret-bridge.mjs plan \
            --key=HH_CRM_MSG_TELEGRAM_WEBHOOK_SECRET \
            --target=preview \
            --branch=codex/sandbox-secret-verification
