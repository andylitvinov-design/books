name: One-time HH cinematic money MP4 masters
on:
  push:
    branches: ['feat/real-money-mp4-library-20261028']
    paths:
      - scripts/render-real-money-mp4-library.mjs
      - .github/workflows/hh-render-real-money-masters-once.yml
permissions:
  contents: write
concurrency:
  group: hh-money-film-masters-once
  cancel-in-progress: false
jobs:
  render-and-commit:
    if: github.repository == 'andylitvinov-design/books'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      HH_MONEY_VIDEO_RENDER_APPROVED: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/real-money-mp4-library-20261028
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify original ffmpeg-static already required by HH
        run: node scripts/ensure-owner-video-renderer.mjs
      - name: Remix licensed moving footage into 12 authored MP4 loops
        run: node scripts/render-real-money-mp4-library.mjs
      - name: Validate all twelve genuine MP4 masters and posters
        run: |
          test "$(find public/videos/holistic-house/money-films-v1 -name '*.mp4' | wc -l)" -eq 12
          test "$(find public/videos/holistic-house/money-films-v1 -name '*.jpg' | wc -l)" -eq 12
          test -f public/videos/holistic-house/money-films-v1/manifest.json
      - name: Commit generated media to current feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/videos/holistic-house/money-films-v1
          git diff --cached --quiet && exit 0
          git commit -m 'assets(video): 12 licensed, remixed genuine cinematic MP4 loops and posters'
          git push origin HEAD:refs/heads/feat/real-money-mp4-library-20261028
