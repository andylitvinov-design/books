name: Home language switch first-click regression
on:
  pull_request:
    paths:
      - 'components/holistic-house-home.tsx'
      - 'components/home-section-carousel.tsx'
      - 'app/\[locale\]/services/page.tsx'
      - 'app/es/services/page.tsx'
      - 'tests/stable-session-entry.test.mjs'
      - 'tests/home-section-carousel.test.mjs'
      - 'tests/home-carousel-first-screen-cta.test.mjs'
      - 'components/home-featured-workspace.tsx'
      - 'components/home-featured-workspace.module.css'
      - 'tests/home-featured-workspace.test.mjs'
      - 'tests/personality-profiles-builder.test.mjs'
      - 'components/personality-profiles-builder.tsx'
      - 'components/personality-profiles-builder.module.css'
      - 'lib/profile/profile-battery.js'
      - 'app/\[locale\]/personality-profiles/page.tsx'
      - 'tests/home-master-path.test.mjs'
      - 'tests/home-rsc-on-demand.test.mjs'
      - 'components/home-core-methods.tsx'
      - 'components/home-core-methods.module.css'
      - 'app/es/page.tsx'
      - 'tests/home-core-methods.test.mjs'
      - 'components/site-navigation.tsx'
      - 'tests/home-locale-menu-state.test.mjs'
      - 'app/page.tsx'
      - 'scripts/verify-home-locale-switch.mjs'
      - 'scripts/helpers/home-inline-analysis-verifier.mjs'
      - 'tests/home-inline-analysis-verifier.test.mjs'
      - 'components/homepage-free-capture.tsx'
      - 'components/contact-channel-chooser.tsx'
      - '.github/workflows/home-locale-switch.yml'
  push:
    branches: ['codex/public-book-library']
    paths:
      - 'components/holistic-house-home.tsx'
      - 'components/home-section-carousel.tsx'
      - 'app/\[locale\]/services/page.tsx'
      - 'app/es/services/page.tsx'
      - 'tests/stable-session-entry.test.mjs'
      - 'tests/home-section-carousel.test.mjs'
      - 'tests/home-carousel-first-screen-cta.test.mjs'
      - 'components/home-featured-workspace.tsx'
      - 'components/home-featured-workspace.module.css'
      - 'tests/home-featured-workspace.test.mjs'
      - 'tests/personality-profiles-builder.test.mjs'
      - 'components/personality-profiles-builder.tsx'
      - 'components/personality-profiles-builder.module.css'
      - 'lib/profile/profile-battery.js'
      - 'app/\[locale\]/personality-profiles/page.tsx'
      - 'tests/home-master-path.test.mjs'
      - 'tests/home-rsc-on-demand.test.mjs'
      - 'components/home-core-methods.tsx'
      - 'components/home-core-methods.module.css'
      - 'app/es/page.tsx'
      - 'tests/home-core-methods.test.mjs'
      - 'components/site-navigation.tsx'
      - 'tests/home-locale-menu-state.test.mjs'
      - 'app/page.tsx'
      - 'scripts/verify-home-locale-switch.mjs'
      - 'scripts/helpers/home-inline-analysis-verifier.mjs'
      - 'tests/home-inline-analysis-verifier.test.mjs'
      - 'components/homepage-free-capture.tsx'
      - 'components/contact-channel-chooser.tsx'
      - '.github/workflows/home-locale-switch.yml'
permissions:
  contents: read
jobs:
  core-methods:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Stable offer, manual carousel and early existing session selector
        run: |
          node --test tests/stable-session-entry.test.mjs tests/home-section-carousel.test.mjs tests/home-carousel-first-screen-cta.test.mjs
          npx --no-install eslint components/home-section-carousel.tsx app/'[locale]'/services/page.tsx app/es/services/page.tsx tests/stable-session-entry.test.mjs
      - name: Seven-step immersion, existing methods, privacy, typecheck and lint
        run: |
          node --test tests/home-featured-workspace.test.mjs tests/personality-profiles-builder.test.mjs tests/home-core-methods.test.mjs tests/home-master-path.test.mjs tests/home-rsc-on-demand.test.mjs
          npx eslint components/home-featured-workspace.tsx components/personality-profiles-builder.tsx lib/profile/profile-battery.js app/'[locale]'/personality-profiles/page.tsx components/home-core-methods.tsx components/holistic-house-home.tsx app/es/page.tsx
          npx tsc --noEmit
      - name: Build three home locales with reviewed dependencies
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  first-click:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Navigation, types and affected-component lint
        run: |
          node --test tests/home-inline-analysis-verifier.test.mjs tests/home-locale-canonical-navigation.test.mjs tests/home-locale-menu-state.test.mjs tests/home-core-methods.test.mjs tests/navigation-cabinet.test.mjs tests/page-video-release.test.mjs
          npx eslint components/site-navigation.tsx components/holistic-house-home.tsx components/home-core-methods.tsx app/es/page.tsx
          npx tsc --noEmit
      - name: Build the real application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install isolated browsers without changing app dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          npm install --prefix /tmp/locale-browser-tools --no-package-lock --ignore-scripts @playwright/test@1.63.0
          ln -s /tmp/locale-browser-tools/node_modules/@playwright node_modules/@playwright
          /tmp/locale-browser-tools/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Delayed navigation cannot discard the first play click
        run: node scripts/verify-home-locale-switch.mjs
      - name: Repeat read-only on Production
        if: github.event_name == 'push'
        run: node scripts/verify-home-locale-switch.mjs --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-locale-switch-evidence
          path: tmp/home-locale-switch/
          retention-days: 7
