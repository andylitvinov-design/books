name: HH PR direct failed-Core handoff
on:
  workflow_run:
    workflows:
      - 'HH PR core release gate'
    types: [completed]
permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write
  checks: read
jobs:
  direct-core-failure:
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.ref == 'refs/heads/codex/bootstrap-books' &&
      github.event.workflow_run.name == 'HH PR core release gate' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'startup_failure')
    concurrency:
      group: hh-control-tower-single-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted control branch, never untrusted PR code
        uses: actions/checkout@v4
        with:
          ref: codex/bootstrap-books
          persist-credentials: false
          fetch-depth: 1
      - name: Check trusted direct event code
        run: |
          node --check scripts/ci-pr-event-handoff.cjs
          node --check scripts/ci-pr-ten-minute-watchdog.cjs
          node --check scripts/ci-pr-queue-dispatcher.cjs
          node --check scripts/ci-pr-base-advanced-recovery.cjs
      - name: Validate trusted base recovery contracts
        run: node --test tests/ci-pr-base-advanced-recovery.test.cjs
      - name: Refresh exactly the proven BASE_ADVANCED PR
        id: base_recovery
        if: github.event.workflow_run.conclusion == 'failure'
        uses: actions/github-script@v7
        env:
          HH_OWNER_TOKEN_PRESENT: ${{ secrets.HH_AUTOMERGE_TOKEN != '' }}
        with:
          # The existing owner token is needed so that a real branch
          # synchronize emits new pull_request checks. GITHUB_TOKEN alone
          # can suppress those workflow events; never create a stale HEAD.
          github-token: ${{ secrets.HH_AUTOMERGE_TOKEN || github.token }}
          script: |
            const {recoverBaseAdvanced}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-base-advanced-recovery.cjs');
            const result=await recoverBaseAdvanced({github,context,
              hasOwnerToken:process.env.HH_OWNER_TOKEN_PRESENT==='true'});
            core.info('HH_BASE_ADVANCED_RECOVERY '+JSON.stringify(result));
            if(result.status==='UPDATED')core.setOutput('updated','true');
            await core.summary.addHeading('Exact-head production BASE recovery')
              .addCodeBlock(JSON.stringify(result,null,2)).write();
      - name: Route verified failed Core directly to signed Repair
        if: steps.base_recovery.outputs.updated != 'true'
        uses: actions/github-script@v7
        env:
          HH_CONTROL_TOWER_ENABLED: 'true'
          HH_DIRECT_HANDOFF_ENABLED: 'true'
        with:
          github-token: ${{ github.token }}
          script: |
            const {run}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-event-handoff.cjs');
            const result=await run({github,core,context,dryRun:false});
            core.info('HH_DIRECT_CORE_HANDOFF '+JSON.stringify(result));
            await core.summary.addHeading('Core failure: direct exact-HEAD Repair')
              .addCodeBlock(JSON.stringify(result,null,2)).write();
      - name: Persist completed Core job timings without another runner
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            try {
              const {archive}=require(process.env.GITHUB_WORKSPACE+
                '/scripts/ci-pr-core-journey-archive.cjs');
              const result=await archive({github,context});
              core.info('HH_CI_JOURNEY_ARCHIVE '+JSON.stringify(result));
            } catch(error) {
              core.warning('HH_CI_JOURNEY_ARCHIVE_UNAVAILABLE '+
                String(error.message||error).slice(0,120));
            }
  core-slot-wakeup:
    name: core-ci-freed-slot-wakeup
    # Success already wakes native AutoMerge. Only schedule a fresh Watchdog
    # when the exact trusted Core event frees scarce CI capacity.
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: hh-pr-core-slot-wakeup
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      pull-requests: read
      issues: write
    steps:
      - name: Checkout trusted default branch for bounded admission policy
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: codex/bootstrap-books
      # The same slot-wakeup decisions are tested by HH PR watchdog contract on code changes.
      - name: Dispatch one live Watchdog only when actual CI capacity is free
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {run}=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-slot-wakeup.cjs');
            await run({github,core,context});
      - name: Persist completed Core job timings without another runner
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            try {
              const {archive}=require(process.env.GITHUB_WORKSPACE+
                '/scripts/ci-pr-core-journey-archive.cjs');
              const result=await archive({github,context});
              core.info('HH_CI_JOURNEY_ARCHIVE '+JSON.stringify(result));
            } catch(error) {
              core.warning('HH_CI_JOURNEY_ARCHIVE_UNAVAILABLE '+
                String(error.message||error).slice(0,120));
            }
