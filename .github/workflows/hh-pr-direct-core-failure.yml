name: HH PR direct failed-Core handoff
on:
  workflow_run:
    workflows:
      - 'HH PR core release gate'
    types: [completed]
permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write
  checks: read
  id-token: write
jobs:
  direct-core-failure:
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.ref == 'refs/heads/codex/bootstrap-books' &&
      github.event.workflow_run.name == 'HH PR core release gate' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'startup_failure')
    concurrency:
      group: hh-control-tower-single-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted control branch, never untrusted PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check trusted direct event code
        run: |
          node --check scripts/ci-pr-event-handoff.cjs
          node --check scripts/ci-pr-commander-strategy-router.cjs
          node --check scripts/ci-pr-error-task.cjs
          node --check scripts/ci-pr-ten-minute-watchdog.cjs
          node --check scripts/ci-pr-queue-dispatcher.cjs
          node --check scripts/ci-pr-base-advanced-recovery.cjs
          node --check scripts/ci-pr-selective-core-rerun.cjs
      - name: Validate trusted base recovery contracts
        run: node --test tests/ci-pr-base-advanced-recovery.test.cjs
      - name: Refresh exactly the proven BASE_ADVANCED PR
        id: base_recovery
        if: github.event.workflow_run.conclusion == 'failure'
        uses: actions/github-script@v7
        env:
          HH_OWNER_TOKEN_PRESENT: ${{ secrets.HH_AUTOMERGE_TOKEN != '' }}
        with:
          # The existing owner token is needed so that a real branch
          # synchronize emits new pull_request checks. GITHUB_TOKEN alone
          # can suppress those workflow events; never create a stale HEAD.
          github-token: ${{ secrets.HH_AUTOMERGE_TOKEN || github.token }}
          script: |
            const {recoverBaseAdvanced}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-base-advanced-recovery.cjs');
            const result=await recoverBaseAdvanced({github,context,
              hasOwnerToken:process.env.HH_OWNER_TOKEN_PRESENT==='true'});
            core.info('HH_BASE_ADVANCED_RECOVERY '+JSON.stringify(result));
            if(result.status==='UPDATED')core.setOutput('updated','true');
            await core.summary.addHeading('Exact-head production BASE recovery')
              .addCodeBlock(JSON.stringify(result,null,2)).write();
      - name: Recover one infrastructure-only job inside existing failed-Core handoff
        id: infra_recovery
        if: steps.base_recovery.outputs.updated != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const event=context.payload.workflow_run,{owner,repo}=context.repo;
            const fullRepo=owner+"/"+repo;
            const log=message=>core.info("FAILED_CORE_TARGETED_RECOVERY "+message);
            // Failure may mask a timed-out mandatory job behind a red aggregate.
            // Reuse this ALREADY RUNNING handoff job, not an extra workflow/runner.
            if(event?.conclusion!=="failure"||event.run_attempt!==1||
               event.event!=="pull_request"||event.status!=="completed"||
               event.name!=="HH PR core release gate"||
               event.path?.split("@")[0]!==".github/workflows/hh-pr-core-release.yml"||
               event.repository?.full_name!==fullRepo||
               event.head_repository?.full_name!==fullRepo){
              log("SKIP not a first-attempt trusted failed Core");return;
            }
            const age=Date.now()-Date.parse(event.created_at||"");
            if(!Number.isFinite(age)||age<0||age>2*60*60*1000)return;
            const linked=(event.pull_requests||[]).filter(p=>
              Number.isSafeInteger(p.number)&&
              /^[a-f0-9]{40}$/.test(p.head?.sha||"")&&
              p.base?.ref==="codex/public-book-library");
            if(linked.length!==1){log("SKIP exact PR association unknown");return;}
            const ref=linked[0];
            const pr=(await github.rest.pulls.get({owner,repo,pull_number:ref.number})).data;
            if(pr.state!=="open"||pr.draft||
               pr.base?.ref!=="codex/public-book-library"||
               pr.head.repo?.full_name!==fullRepo||
               pr.head.ref!==event.head_branch||pr.head.sha!==ref.head.sha||
               pr.mergeable===false||pr.mergeable_state==="dirty"||
               (ref.base?.sha&&ref.base.sha!==pr.base.sha))return;
            // An immutable synthetic merge is valid only for this exact HEAD/base.
            if(!/^[a-f0-9]{40}$/.test(event.head_sha||""))return;
            if(event.head_sha!==pr.head.sha){
              const merge=(await github.rest.repos.getCommit({
                owner,repo,ref:event.head_sha
              })).data;
              if(merge.parents?.length!==2||
                 merge.parents[1]?.sha!==pr.head.sha||
                 merge.parents[0]?.sha!==pr.base.sha)return;
            }
            const {selectInterruptedMandatoryJob}=require(process.env.GITHUB_WORKSPACE+
              "/scripts/ci-pr-selective-core-rerun.cjs");
            const runJobs=()=>github.rest.actions.listJobsForWorkflowRun({
              owner,repo,run_id:event.id,per_page:100,filter:"latest"
            });
            const initial=selectInterruptedMandatoryJob((await runJobs()).data);
            log("JOB_DECISION "+JSON.stringify(initial));
            if(initial.action!=="rerun_job")return;
            // A verified timeout must never be misrouted as a product source error.
            core.setOutput("infra_hold","true");
            const fresh=(await github.rest.actions.getWorkflowRun({
              owner,repo,run_id:event.id
            })).data;
            if(fresh.run_attempt!==1||fresh.status!=="completed"||
               fresh.conclusion!=="failure"||fresh.head_sha!==event.head_sha)return;
            const current=(await github.rest.pulls.get({
              owner,repo,pull_number:ref.number
            })).data;
            if(current.state!=="open"||current.draft||
               current.head.sha!==pr.head.sha||current.base.sha!==pr.base.sha)return;
            const latest=selectInterruptedMandatoryJob((await runJobs()).data);
            if(latest.action!=="rerun_job"||latest.jobId!==initial.jobId)return;
            try {
              await github.rest.actions.reRunJobForWorkflowRun({
                owner,repo,job_id:initial.jobId
              });
              core.setOutput("targeted_rerun","true");
              log("TARGETED_JOB_RERUN_ACCEPTED #"+initial.jobId+
                " only; remaining green jobs preserved and no source repair dispatched");
            }catch(error){
              if([403,404,409,422].includes(error.status)){
                core.warning("FAILED_CORE_TARGETED_RECOVERY denied HTTP "+error.status);
              }else{throw error;}
            }
      - name: Send trusted failed-Core evidence to Commander via GitHub OIDC
        id: commander_ci_event
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {sendWorkflowFailure}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-hermes-event-bridge.cjs');
            const oidcToken=await core.getIDToken('hh-commander-ci');
            const result=await sendWorkflowFailure({github,context,core,oidcToken});
            core.setOutput('verified_receipt_json',JSON.stringify(result));
            await core.summary.addHeading('Commander CI event and task association')
              .addCodeBlock(JSON.stringify(result,null,2)).write();

      # The classified Commander task must exist before the code-writing
      # handoff. The trusted ci-pr-event-handoff.cjs still independently checks
      # causal job evidence, exact PR HEAD, leases, worker slots and labels.
      - name: Route confirmed Commander CI task through guarded dispatcher
        if: ${{ always() && steps.commander_ci_event.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          HH_CONTROL_TOWER_ENABLED: 'true'
          HH_DIRECT_HANDOFF_ENABLED: 'true'
          HH_COMMANDER_CI_RECEIPT: ${{ steps.commander_ci_event.outputs.verified_receipt_json }}
          HH_BASE_UPDATED: ${{ steps.base_recovery.outputs.updated }}
          HH_INFRA_RERUN: ${{ steps.infra_recovery.outputs.targeted_rerun }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {route}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-commander-strategy-router.cjs');
            const {run:existingCoreHandoff}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-event-handoff.cjs');
            let receipt=null;
            try{receipt=JSON.parse(process.env.HH_COMMANDER_CI_RECEIPT||'null');}
            catch(error){core.warning('COMMANDER_CI_RECEIPT_PARSE_FAILED');}
            const result=await route({receipt,github,core,context,dryRun:false,
              baseUpdated:process.env.HH_BASE_UPDATED==='true',
              infraRerun:process.env.HH_INFRA_RERUN==='true',
              existingCoreHandoff});
            core.info('HH_DIRECT_CORE_HANDOFF '+JSON.stringify(result));
            await core.summary.addHeading('Commander CI strategy route (not execution proof)')
              .addCodeBlock(JSON.stringify(result,null,2)).write();

      - name: Persist completed Core job timings without another runner
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            try {
              const {archive}=require(process.env.GITHUB_WORKSPACE+
                '/scripts/ci-pr-core-journey-archive.cjs');
              const result=await archive({github,context});
              core.info('HH_CI_JOURNEY_ARCHIVE '+JSON.stringify(result));
            } catch(error) {
              core.warning('HH_CI_JOURNEY_ARCHIVE_UNAVAILABLE '+
                String(error.message||error).slice(0,120));
            }
  core-slot-wakeup:
    name: core-ci-freed-slot-wakeup
    # Success already wakes native AutoMerge. Only schedule a fresh Watchdog
    # when the exact trusted Core event frees scarce CI capacity.
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: hh-pr-core-slot-wakeup
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      pull-requests: read
      issues: write
      checks: read
    steps:
      - name: Checkout trusted default branch for bounded admission policy
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      # The same slot-wakeup decisions are tested by HH PR watchdog contract on code changes.
      - name: Dispatch one live Watchdog only when actual CI capacity is free
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {run}=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-slot-wakeup.cjs');
            await run({github,core,context});
      - name: Record independently verified repair outcome on real new HEAD
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {run}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-repair-verified-finalizer.cjs');
            const result=await run({github,core,context});
            await core.summary.addHeading('Repair task: exact-HEAD CI outcome')
              .addCodeBlock(JSON.stringify(result,null,2)).write();
      - name: Persist completed Core job timings without another runner
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            try {
              const {archive}=require(process.env.GITHUB_WORKSPACE+
                '/scripts/ci-pr-core-journey-archive.cjs');
              const result=await archive({github,context});
              core.info('HH_CI_JOURNEY_ARCHIVE '+JSON.stringify(result));
            } catch(error) {
              core.warning('HH_CI_JOURNEY_ARCHIVE_UNAVAILABLE '+
                String(error.message||error).slice(0,120));
            }
