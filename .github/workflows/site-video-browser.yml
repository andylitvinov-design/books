name: Website video browser verification
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ['codex/public-book-library']
    paths:
      - 'lib/app/session.js'
      - 'app/api/app/practitioner/**'
      - 'app/api/app/\[...path\]/route.js'
      # The exact dispatcher is cross-domain. Node's BASE-trusted glob reader
      # does not match GitHub's escaped Next route, so also use this narrowly
      # bounded one-segment route with explicit Messenger exclusions.
      - 'app/api/app/*/route.js'
      - '!app/api/app/direct-messages/**'
      - '!app/api/app/practitioner-client-messages/**'
      - '!app/api/app/notification-channels/**'
      - 'app/api/app/site-video/**'
      - 'lib/site-videos/**'
      - 'lib/public-locales.ts'
      - 'lib/spanish-metadata.ts'
      - 'components/site-video-*'
      - 'components/services-studio-extras.tsx'
      - 'components/personal-testimonials.tsx'
      - 'components/home-testimonial-more.tsx'
      - 'tests/home-testimonial-lazy-disclosure.test.mjs'
      - 'tests/personal-testimonials*.test.mjs'
      - 'components/spanish-*'
      - 'components/page-video.tsx'
      - 'components/psychic-alchemy-intro-video*'
      - 'components/site-navigation.tsx'
      - 'components/public-site-header.tsx'
      - 'components/mobile-bottom-navigation.tsx'
      - 'components/personal-consultation-form.tsx'
      - 'components/client-cabinet-entry.tsx'
      - 'data/about-es.ts'
      - 'data/spanish-*'
      - 'data/remedies-es.*'
      - 'app/admin/videos/**'
      - 'app/site-video*.css'
      - 'app/reader-responsive.css'
      - 'app/layout.tsx'
      - 'app/sitemap.ts'
      # Run the costly production build/browser suite only for its actual
      # video, public content, services and locale paths, not every app page.
      - 'app/**/services/**'
      - 'app/**/about/**'
      - 'app/**/homeopathy/**'
      - 'app/**/books/**'
      - 'app/es/**'
      - 'app/page.tsx'
      - 'middleware.ts'
      - 'scripts/verify-site-video-browser.mjs'
      - 'scripts/verify-site-video-admin-browser.mjs'
      - 'tests/site-video-admin-e2e-gate.test.mjs'
      - 'scripts/verify-page-video-release.mjs'
      - 'tests/page-video-release.test.mjs'
      - 'scripts/verify-ru-about-video.mjs'
      - 'scripts/verify-es-*.mjs'
      - 'tests/es-*.test.mjs'
      - 'tests/ru-about-video-presentation.test.mjs'
      - 'public/images/holistic-house/video-posters/**'
      - '.github/workflows/site-video-browser.yml'
      - 'scripts/ci-site-video-scope.mjs'
      - 'tests/ci-site-video-scope.test.mjs'
      - 'app/**/about/page.tsx'
      - 'tests/psychic-alchemy-intro-video.test.mjs'
      - 'tests/site-video*.mjs'
      - '.github/workflows/holistic-about-video-check.yml'
  push:
    branches: ['codex/public-book-library']
    paths:
      - 'lib/app/session.js'
      - 'app/api/app/practitioner/**'
      - 'app/api/app/\[...path\]/route.js'
      # The exact dispatcher is cross-domain. Node's BASE-trusted glob reader
      # does not match GitHub's escaped Next route, so also use this narrowly
      # bounded one-segment route with explicit Messenger exclusions.
      - 'app/api/app/*/route.js'
      - '!app/api/app/direct-messages/**'
      - '!app/api/app/practitioner-client-messages/**'
      - '!app/api/app/notification-channels/**'
      - 'app/api/app/site-video/**'
      - 'lib/site-videos/**'
      - 'lib/public-locales.ts'
      - 'lib/spanish-metadata.ts'
      - 'components/site-video-*'
      - 'components/services-studio-extras.tsx'
      - 'components/personal-testimonials.tsx'
      - 'components/home-testimonial-more.tsx'
      - 'tests/home-testimonial-lazy-disclosure.test.mjs'
      - 'tests/personal-testimonials*.test.mjs'
      - 'components/spanish-*'
      - 'components/site-navigation.tsx'
      - 'components/public-site-header.tsx'
      - 'components/mobile-bottom-navigation.tsx'
      - 'components/personal-consultation-form.tsx'
      - 'components/client-cabinet-entry.tsx'
      - 'data/about-es.ts'
      - 'data/spanish-*'
      - 'data/remedies-es.*'
      - 'app/es/**'
      - 'app/layout.tsx'
      - 'app/page.tsx'
      - 'app/sitemap.ts'
      - 'middleware.ts'
      - 'app/admin/videos/**'
      - 'scripts/verify-site-video-browser.mjs'
      - 'scripts/verify-site-video-admin-browser.mjs'
      - 'tests/site-video-admin-e2e-gate.test.mjs'
      - 'scripts/verify-page-video-release.mjs'
      - 'tests/page-video-release.test.mjs'
      - 'scripts/verify-ru-about-video.mjs'
      - 'scripts/verify-es-*.mjs'
      - 'tests/es-*.test.mjs'
      - 'tests/ru-about-video-presentation.test.mjs'
      - 'public/images/holistic-house/video-posters/**'
      - '.github/workflows/site-video-browser.yml'
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: site-video-browser-${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.before != github.event.after && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.before != github.event.after }}
jobs:
  browser:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify live PR readiness before costly CI
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-pr-readiness.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Route exact tested-merge Site Video risk
        id: impact
        env:
          HH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-site-video-scope.mjs
      - name: Check Spanish translation and affected components
        run: |
          node --test tests/es-about.test.mjs tests/es-public-site.test.mjs tests/about-page.test.mjs tests/native-*.test.mjs
          node --test tests/personal-testimonials.test.mjs tests/personal-testimonials-prefetch.test.mjs tests/home-testimonial-lazy-disclosure.test.mjs
          npx eslint app/es/ data/about-es.ts data/spanish-books.ts components/spanish-*.tsx components/site-navigation.tsx components/public-site-header.tsx components/mobile-bottom-navigation.tsx components/personal-consultation-form.tsx components/client-cabinet-entry.tsx components/home-testimonial-more.tsx components/personal-testimonials.tsx components/services-studio-extras.tsx app/page.tsx app/layout.tsx app/sitemap.ts middleware.ts lib/public-locales.ts lib/spanish-metadata.ts
          # Core release-ready validates whole-project TypeScript for Ready production PRs.
          # Standalone push/manual/non-production verification remains unchanged.
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" || "${GITHUB_BASE_REF:-}" != "codex/public-book-library" ]]; then
            npx tsc --noEmit
          else
            echo 'Whole-project TypeScript delegated to mandatory Core release gate'
          fi
      - name: Original About video and default-stream contracts
        run: node --test tests/psychic-alchemy-intro-video.test.mjs tests/site-videos.test.mjs tests/site-video-defaults.test.mjs tests/ru-about-video-presentation.test.mjs tests/page-video-release.test.mjs
      - name: Original About video source lint
        run: npx --no-install eslint components/psychic-alchemy-intro-video.tsx components/site-video-player.tsx components/site-video-manager.tsx components/page-video.tsx 'app/[locale]/about/page.tsx' app/admin/videos/page.tsx
      - name: Install isolated browser test dependencies without changing the app lockfile
        if: github.event_name != 'pull_request' || steps.impact.outputs.full == 'true'
        timeout-minutes: 12
        run: |
          # Use the official Ubuntu archive only in this ephemeral runner.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          npm install --prefix /tmp/video-browser-tools --no-package-lock --ignore-scripts @playwright/test@1.63.0
          ln -s /tmp/video-browser-tools/node_modules/@playwright node_modules/@playwright
          /tmp/video-browser-tools/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y redis-tools
        if: github.event_name != 'pull_request' || steps.impact.outputs.full == 'true'
      - name: Create ephemeral local test certificate
        if: github.event_name != 'pull_request' || steps.impact.outputs.full == 'true'
        run: openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/video-test-key.pem -out /tmp/video-test-cert.pem -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - name: Build actual application with locked production dependencies
        if: github.event_name != 'pull_request' || steps.impact.outputs.full == 'true'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Exercise editor against isolated Redis
        if: github.event_name != 'pull_request' || steps.impact.outputs.full == 'true'
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
          node scripts/verify-site-video-browser.mjs
        env:
          NODE_EXTRA_CA_CERTS: /tmp/video-test-cert.pem
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Check production read-only after release
        if: github.event_name == 'push'
        run: node scripts/verify-site-video-browser.mjs --live
      - name: Check released RU preview read-only
        if: github.event_name == 'push'
        run: node scripts/verify-ru-about-video.mjs --live
      - name: Check released Spanish About read-only
        if: github.event_name == 'push'
        run: node scripts/verify-es-about.mjs --live
      - name: Check all released Spanish public pages read-only
        if: github.event_name == 'push'
        run: node scripts/verify-es-public-site.mjs --live
      - name: Verify the new Spanish video streams through the public embed
        if: github.event_name == 'push'
        run: node scripts/verify-es-about-playback.mjs
      - name: Verify all eight released page videos with full natural playback
        if: github.event_name == 'push'
        run: node scripts/verify-page-video-release.mjs --live
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || steps.impact.outputs.full == 'true')
        with:
          name: site-video-browser-evidence
          path: /tmp/site-video-evidence/
          retention-days: 7

  admin-verified-owner-browser:
    name: Isolated verified-owner video editor, real actions and Redis
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hh_app_test
          POSTGRES_PASSWORD: synthetic-ci-admin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hh_app_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      CI: 'true'
      HH_APP_ENABLED: 'true'
      HH_APP_PRODUCTION_APPROVED: 'false'
      HH_APP_TEST_RUNTIME: isolated
      HH_APP_SUPABASE_URL: http://127.0.0.1:54321
      HH_APP_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_012345678901234567890
      HH_APP_DATABASE_URL: postgres://hh_app_ci_login:synthetic-ci-only@127.0.0.1:5432/hh_app_test
      HH_TEST_ADMIN_DATABASE_URL: postgres://postgres:synthetic-ci-admin@127.0.0.1:5432/hh_app_test
      HH_APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HH_APP_ALLOWED_ORIGINS: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify live PR readiness before costly CI
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-pr-readiness.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Route exact tested-merge Site Video risk
        id: impact
        env:
          HH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-site-video-scope.mjs
      - name: Verify synthetic owner bridge, E2E isolation and scripts before database setup
        run: |
          node --check scripts/verify-site-video-admin-browser.mjs
          node --test tests/site-video-admin-e2e-gate.test.mjs tests/admin-session-lifecycle.test.mjs
      - name: Initialize disposable empty PostgreSQL with exact app migrations
        if: github.event_name != 'pull_request' || steps.impact.outputs.full == 'true'
        run: node --conditions=react-server tests/helpers/app-db-setup.mjs
      - name: Install pinned Chromium and Redis client for authenticated E2E
        if: github.event_name != 'pull_request' || steps.impact.outputs.full == 'true'
        run: |
          mkdir -p /tmp/hh-video-admin-browser
          npm install --prefix /tmp/hh-video-admin-browser --no-audit --no-fund @playwright/test@1.63.0
          ln -s /tmp/hh-video-admin-browser/node_modules/@playwright node_modules/@playwright
          /tmp/hh-video-admin-browser/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y redis-tools
      - name: Prepare a loopback TLS certificate for the synthetic Redis gateway
        if: github.event_name != 'pull_request' || steps.impact.outputs.full == 'true'
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/video-test-key.pem -out /tmp/video-test-cert.pem -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - name: Exercise REAL practitioner/open and protected editor publication with fake local identity
        if: github.event_name != 'pull_request' || steps.impact.outputs.full == 'true'
        env:
          NODE_EXTRA_CA_CERTS: /tmp/video-test-cert.pem
        run: node scripts/verify-site-video-admin-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || steps.impact.outputs.full == 'true')
        with:
          name: site-video-admin-owner-browser-synthetic
          path: /tmp/site-video-admin-evidence/
          retention-days: 3
          if-no-files-found: warn
