name: Website video playback acceptance
on:
  push:
    branches: [codex/site-video-live-acceptance]
    paths:
      - .github/workflows/site-video-live-acceptance.yml
      - scripts/verify-site-video-production.mjs
permissions:
  contents: read
concurrency:
  group: website-video-production-acceptance
  cancel-in-progress: false
jobs:
  playback:
    if: github.repository == 'andylitvinov-design/books'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install isolated browser tools
        run: |
          npm install --prefix /tmp/video-browser-tools --no-package-lock --ignore-scripts @playwright/test@1.63.0
          /tmp/video-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify public player controls and decoded media
        run: node scripts/verify-site-video-production.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-video-playback
          path: /tmp/holistic-video-playback/
          retention-days: 7
