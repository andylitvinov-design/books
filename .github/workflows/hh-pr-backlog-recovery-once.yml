name: HH one-shot PR backlog recovery
on:
  pull_request:
    branches: ['codex/bootstrap-books']
    paths:
      - '.github/workflows/hh-pr-backlog-recovery-once.yml'
      - 'scripts/ci-pr-backlog-recovery.cjs'
      - 'tests/ci-pr-backlog-recovery.test.cjs'
  push:
    branches: ['codex/bootstrap-books']
    paths:
      - '.github/workflows/hh-pr-backlog-recovery-once.yml'
      - 'scripts/ci-pr-backlog-recovery.cjs'
      - 'tests/ci-pr-backlog-recovery.test.cjs'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply only verified missing-CI and conflict queue labels'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
  actions: write
  checks: read
  issues: write
  pull-requests: write
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Test bounded backlog classifier without credentials
        run: |
          node --check scripts/ci-pr-backlog-recovery.cjs
          node --test tests/ci-pr-backlog-recovery.test.cjs
  one-shot:
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.ref == 'refs/heads/codex/bootstrap-books' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: hh-control-tower-single-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: codex/bootstrap-books
          persist-credentials: false
          fetch-depth: 1
      - name: Verify classifier and trusted dispatcher syntax
        run: |
          node --check scripts/ci-pr-backlog-recovery.cjs
          node --check scripts/ci-pr-queue-dispatcher.cjs
          node --test tests/ci-pr-backlog-recovery.test.cjs
      - name: Bounded once-only classification and signed task handoff
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {run}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-backlog-recovery.cjs');
            const apply=context.eventName==='push' ||
              String(context.payload.inputs?.apply||'false')==='true';
            const report=await run({github,core,context,apply,maxLabels:20});
            core.info('HH_BACKLOG_ONCE '+JSON.stringify({
              apply,classified:report.classified,byKind:report.byKind,
              queuedLabels:report.queuedLabels,
              dispatchAccepted:report.dispatchAccepted,
              dispatchReason:report.dispatchReason
            }));
