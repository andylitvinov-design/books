name: HH Growth Studio editorial checks

on:
  pull_request:
    branches: [codex/public-book-library]
    paths:
      - 'app/admin/growth-studio/**'
      - 'components/growth-studio.*'
      - 'components/growth-studio-bulk.jsx'
      - 'components/growth-studio-bulk.jsx'
      - 'components/prescription-admin-header.jsx'
      - 'components/practitioner-cabinet.jsx'
      - 'components/app/practice-workspace.jsx'
      - 'lib/growth-studio/**'
      - 'tests/growth-studio-editorial.test.mjs'
      - 'tests/growth-studio-csv.test.mjs'
      - 'tests/growth-studio-bulk.test.mjs'
      - 'tests/growth-studio-telegram.test.mjs'
      - '.github/workflows/hh-growth-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-security:
    name: Owner editorial and storage safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS modules
        run: |
          node --check lib/growth-studio/model.mjs
          node --check lib/growth-studio/bulk.mjs
          node --check lib/growth-studio/store.js
          node --check app/admin/growth-studio/actions.js
      - name: Check editorial transitions, URL and Redis guards
        run: node --test tests/growth-studio-editorial.test.mjs tests/growth-studio-csv.test.mjs tests/growth-studio-bulk.test.mjs

  next-build:
    name: Next.js production build / Growth Studio
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependency lock
        run: npm ci
      - name: Next.js build
        run: npm run build
