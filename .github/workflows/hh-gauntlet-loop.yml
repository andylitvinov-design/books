name: Holistic House Gauntlet free-model safety and contract gate

on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - '.github/workflows/hh-gauntlet-loop.yml'
      - '.opencode/agents/hh-gauntlet-*.md'
      - 'docs/benchmarking/HH_GAUNTLET_LOOP_20261027.md'
      - 'lib/benchmarking/hh-gauntlet-loop.mjs'
      - 'scripts/benchmarking/hh-gauntlet-loop.mjs'
      - 'tests/hh-gauntlet-loop.test.mjs'
  push:
    branches: ['codex/public-book-library']
    paths:
      - '.github/workflows/hh-gauntlet-loop.yml'
      - '.opencode/agents/hh-gauntlet-*.md'
      - 'lib/benchmarking/hh-gauntlet-loop.mjs'
      - 'scripts/benchmarking/hh-gauntlet-loop.mjs'
      - 'tests/hh-gauntlet-loop.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hh-gauntlet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    name: No-model, no-provider, no-private-data Gauntlet policy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Check offline-only CLI, model allowlist, critic rubric and permissions
        run: |
          node scripts/benchmarking/hh-gauntlet-loop.mjs --check
          node --test tests/hh-gauntlet-loop.test.mjs
      - name: Check existing free express flow and consent contracts
        run: |
          node --test tests/free-express-wizard-v2.test.mjs tests/free-express-unified-v2.test.mjs tests/free-express-owner-reply.test.mjs tests/free-express-retention.test.mjs tests/free-express-mobile-consent-layout.test.mjs
      - name: Lint and typecheck
        run: |
          npx eslint scripts/benchmarking/hh-gauntlet-loop.mjs lib/benchmarking/hh-gauntlet-loop.mjs tests/hh-gauntlet-loop.test.mjs
          npx tsc --noEmit
      # Never invoke a model in the contract job: repeatable, zero-provider baseline.

  isolated-free-model-smoke:
    name: Zero-credential OpenCode GLM Free connectivity, synthetic-only
    # Run on this explicit tooling PR, never on a normal production push.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/hh-gauntlet-execution-')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned official OpenCode CLI outside repository
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hh-opencode-cli"
          npm install --prefix "$RUNNER_TEMP/hh-opencode-cli" --no-audit --no-fund --no-save @opencode/cli@2.1.2
          "$RUNNER_TEMP/hh-opencode-cli/node_modules/.bin/opencode" --version
      - name: Verify one anonymous free-only synthetic invocation
        shell: bash
        env:
          HH_FREE_MODEL: opencode/glm-5.3-flash-free
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hh-oc-home" "$RUNNER_TEMP/hh-oc-home/config" "$RUNNER_TEMP/hh-oc-home/data" "$RUNNER_TEMP/hh-oc-home/cache" "$RUNNER_TEMP/hh-oc-work"
          cd "$RUNNER_TEMP/hh-oc-work"
          set +e
          timeout --kill-after=5s 100s env -i \
            HOME="$RUNNER_TEMP/hh-oc-home" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/hh-oc-home/config" \
            XDG_DATA_HOME="$RUNNER_TEMP/hh-oc-home/data" \
            XDG_CACHE_HOME="$RUNNER_TEMP/hh-oc-home/cache" \
            TMPDIR="$RUNNER_TEMP" PATH="$PATH" CI=true \
            "$RUNNER_TEMP/hh-opencode-cli/node_modules/.bin/opencode" run \
            --standalone --model "$HH_FREE_MODEL" --format json \
            "Reply with exactly the token HH_GAUNTLET_FREE_20261027_OK. No tools; do not access files or websites." \
            > "$RUNNER_TEMP/hh-oc-free.stdout" 2> "$RUNNER_TEMP/hh-oc-free.stderr"
          status=$?
          set -e
          echo "OpenCode process exit status: $status"
          if [ "$status" -ne 0 ]; then
            echo "No free-model inference was confirmed. No paid retry is permitted."
            sed -E 's/[A-Za-z0-9_=-]{30,}/[REDACTED]/g' "$RUNNER_TEMP/hh-oc-free.stderr" | tail -c 1500
            exit 1
          fi
          node -e '
            const fs=require("fs");
            const raw=fs.readFileSync(process.argv[1],"utf8");
            const lines=raw.split(/\r?\n/).filter(Boolean);
            let hasText=false, error=false; const types=new Set();
            for(const line of lines){
              try{
                const p=JSON.parse(line);
                types.add(String(p.type || "unknown"));
                if(p.type==="error" || p.type==="session.error")error=true;
                const data=JSON.stringify(p);
                if(data.includes("HH_GAUNTLET_FREE_20261027_OK") && /message|text|part|delta/i.test(data))hasText=true;
              } catch {}
            }
            console.log("Event types: "+[...types].join(", ").slice(0,350));
            console.log("Synthetic free-model response received: "+(hasText&&!error));
            if(!hasText || error)process.exit(1);
          ' "$RUNNER_TEMP/hh-oc-free.stdout"
          echo "PASS: one zero-credential free-model response. Not proof of GitHub builder/critic or CRM E2E."
      - name: Checkout public HH source without write access
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install existing test tools only
        run: npm ci --include=dev --no-audit --no-fund
      - name: Run one live free Builder and separate Critic in ephemeral branch
        shell: bash
        timeout-minutes: 12
        env:
          CI: 'true'
          HH_GAUNTLET_CI_SYNTHETIC: isolated-20261027
          HH_GAUNTLET_BROWSER: 'disabled-no-browser-claim'
          HOME: ${{ runner.temp }}/hh-oc-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/hh-oc-home/config
          XDG_DATA_HOME: ${{ runner.temp }}/hh-oc-home/data
          XDG_CACHE_HOME: ${{ runner.temp }}/hh-oc-home/cache
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          git switch -c codex/hh-gauntlet-ci-20261027
          export PATH="$RUNNER_TEMP/hh-opencode-cli/node_modules/.bin:$PATH"
          timeout --kill-after=8s 660s node scripts/benchmarking/hh-gauntlet-loop.mjs \
            --run --rounds 1 --timeout-seconds 180 \
            --model opencode/glm-5.3-flash-free
          echo "PASS: real Builder + fresh Critic + deterministic gates (synthetic only)."
      - name: Copy no-PII pilot scorecard
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hh-gauntlet-evidence"
          find "$RUNNER_TEMP" -maxdepth 2 -type f -path '*/hh-gauntlet-scorecard-*/scorecard.json' \
            -exec cp {} "$RUNNER_TEMP/hh-gauntlet-evidence/scorecard.json" \;
          if [ -f "$RUNNER_TEMP/hh-gauntlet-evidence/scorecard.json" ]; then
            node -e '
              const r=require(process.argv[1]);
              console.log("Result: "+r.result);
              console.log("Rounds: "+r.rounds.length);
              console.log("No real CRM/provider receipt: "+r.real_crm_delivery+"/"+r.real_provider_receipt);
            ' "$RUNNER_TEMP/hh-gauntlet-evidence/scorecard.json"
          else
            echo "No scorecard produced: blocked before model runner startup."
          fi
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            if node --input-type=module -e '
              import { execFileSync } from "node:child_process";
              import { checkEditScope, changedPathsFromPorcelain } from "./lib/benchmarking/hh-gauntlet-loop.mjs";
              const status=execFileSync("git", ["status","--porcelain=v1","--untracked-files=all"], {encoding:"utf8"});
              const scope=checkEditScope(changedPathsFromPorcelain(status));
              console.log("Safe patch: "+scope.ok+"; "+scope.reason);
              if (!scope.ok) process.exit(1);
            '; then
              git diff --no-ext-diff --no-color HEAD -- components/free-express-wizard.tsx components/free-express-wizard.module.css components/personal-express-enquiry.tsx tests/free-express-wizard-v2.test.mjs tests/free-express-unified-v2.test.mjs tests/free-express-mobile-consent-layout.test.mjs \
                > "$RUNNER_TEMP/hh-gauntlet-evidence/safe-proposal.patch"
              if [ "$(wc -c < "$RUNNER_TEMP/hh-gauntlet-evidence/safe-proposal.patch")" -gt 35000 ]; then
                rm "$RUNNER_TEMP/hh-gauntlet-evidence/safe-proposal.patch"
                echo "Proposal exceeded bounded safe diff; discarded."
              fi
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hh-gauntlet-free-agent-scorecard
          path: ${{ runner.temp }}/hh-gauntlet-evidence/
          retention-days: 7
          if-no-files-found: warn
