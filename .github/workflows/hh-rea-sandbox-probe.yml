name: Holistic House REA isolated runtime and dry-run doctor
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - '.github/workflows/hh-rea-sandbox-probe.yml'
      - 'scripts/benchmarking/rea-*'
      - 'tests/benchmark-rea-node-readiness.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hh-rea-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rea-sandbox:
    name: Node 22.23.4 · immutable REA 6.8.0 · isolated doctor
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Check Node version, offline unit tests, and script syntax
        run: |
          node scripts/benchmarking/rea-node-readiness.mjs --strict
          node --test tests/benchmark-rea-node-readiness.test.mjs
          node --check scripts/benchmarking/rea-node-readiness.mjs
          bash -n scripts/benchmarking/rea-sandbox-probe.sh
          bash scripts/benchmarking/rea-sandbox-probe.sh --check
      - name: Review pinned tarball and perform no-write REA CLI doctor
        timeout-minutes: 9
        run: bash scripts/benchmarking/rea-sandbox-probe.sh --probe
