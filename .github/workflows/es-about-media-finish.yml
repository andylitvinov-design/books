name: Finish Spanish About media QA
on:
  push:
    branches: ['chatgpt/es-about-video-2026-10-01']
    paths: ['.github/workflows/es-about-media-finish.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain exact previous master and decode to PCM
        run: |
          mkdir -p /tmp/es-media-final
          python - <<'PY'
          import urllib.request, yaml, hashlib
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/es-about-media-prepare.yml').read_text())['jobs']['prepare']['steps']
          url=next(s['env']['VIDEO_URL'] for s in steps if 'VIDEO_URL' in s.get('env',{}))
          with urllib.request.urlopen(url,timeout=120) as r: data=r.read()
          assert hashlib.sha256(data).hexdigest()=='5618c762a8d5ca5b906077d7c669319f9d81294e345dd7fc9632dfaac9067b93'
          Path('/tmp/es-media-final/master.mp4').write_bytes(data)
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -v error -i /tmp/es-media-final/master.mp4 -vn -ac 1 -ar 16000 /tmp/es-media-final/audio.wav
          ffmpeg -v error -ss 1.5 -i /tmp/es-media-final/master.mp4 -frames:v 1 -vf scale=1280:720 -c:v libwebp -quality 85 /tmp/es-media-final/poster.webp
      - name: Independent ASR from decoded PCM, not the provider subtitle
        run: |
          python -m pip install --disable-pip-version-check faster-whisper==1.2.1
          python - <<'PY'
          import json,wave,numpy as np
          from pathlib import Path
          from faster_whisper import WhisperModel
          root=Path('/tmp/es-media-final')
          with wave.open(str(root/'audio.wav')) as f:
            assert f.getnchannels()==1 and f.getframerate()==16000 and f.getsampwidth()==2
            audio=np.frombuffer(f.readframes(f.getnframes()),dtype=np.int16).astype(np.float32)/32768
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          segments,info=model.transcribe(audio,beam_size=5,word_timestamps=True)
          data={'language':info.language,'probability':info.language_probability,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word} for w in s.words]} for s in segments]}
          (root/'speech-qa.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          assert info.language=='es', 'Unexpected speech language'
          print('Spanish audio independently transcribed.')
          PY
      - name: Store only the reviewed public poster as a Git blob, never the MP4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,hashlib,urllib.request
          from pathlib import Path
          root=Path('/tmp/es-media-final'); poster=(root/'poster.webp').read_bytes()
          assert hashlib.sha256(poster).hexdigest()=='53646820605fbd228ec1511b11f9701cbba6127b8b79fb7863a101ee7ad5347c'
          req=urllib.request.Request('https://api.github.com/repos/andylitvinov-design/books/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(poster).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: result=json.load(r)
          (root/'poster-blob.json').write_text(json.dumps({'sha':result['sha'],'sha256':hashlib.sha256(poster).hexdigest(),'bytes':len(poster)}))
          print('Poster blob: '+result['sha'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: es-media-final-qa
          path: |
            /tmp/es-media-final/speech-qa.json
            /tmp/es-media-final/poster-blob.json
          retention-days: 3
