# GitHub executes cron/dispatch workflows ONLY from the default branch.
# Read the current production source; never build/deploy Vercel or commit to a site branch.
name: Holistic House SEOmator weekly audit
on:
  schedule:
    - cron: '12 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hh-seomator-history-publish
  cancel-in-progress: false

jobs:
  # Third-party CLI runs in a read-only job; release writing is isolated.
  public-technical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read current production parser and public crawl policy
        uses: actions/checkout@v4
        with:
          ref: codex/public-book-library
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned MIT audit CLI
        run: npm install --prefix /tmp/hh-seomator --no-audit --no-fund --save-exact '@seomator/seo-audit@8.0.1'
      - name: Audit a bounded sample of the public production site
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          # No browser render: avoid heavyweight Playwright downloads and Vercel request usage.
          timeout 420 /tmp/hh-seomator/node_modules/.bin/seomator audit https://holistichouse.vercel.app/ \
            --config scripts/seomator-public.toml --no-cwv --crawl --max-pages 24 \
            --concurrency 2 --timeout 15000 --max-duration 360 \
            --format json --output artifacts/seomator-raw.json --no-save --fail-under 0
          result=$?
          # SEO findings (exit 1) are a measured result; unreachable/config errors are not.
          if [ "$result" -ne 0 ] && [ "$result" -ne 1 ]; then
            echo "SEOmator failed to measure the public site (exit $result)"
            exit 2
          fi
          test -s artifacts/seomator-raw.json
      - name: Retrieve previous dated snapshot without extra storage services
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/previous
          gh release download hh-seomator-history \
            --repo "$GITHUB_REPOSITORY" --pattern seo-audit.json \
            --dir artifacts/previous || true
      - name: Validate and build bounded public-only snapshot
        env:
          HH_SEO_AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HH_SEO_AUDIT_VERSION: '8.0.1'
        run: node scripts/build-seomator-snapshot.mjs artifacts/seomator-raw.json artifacts/previous/seo-audit.json artifacts/seo-audit.json
      - name: Add scores and coverage to GitHub run summary
        run: |
          node --input-type=module -e '
            import {readFileSync,appendFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("artifacts/seo-audit.json","utf8"));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "## Holistic House public technical SEO\n"+
              "Score: **"+r.score+"/100**\n"+
              "Sampled public pages: **"+r.crawledPages+"** (not the complete sitemap)\n"+
              "Dated: "+r.asOf+"\n"+
              "Failures shown: "+r.findings.filter(f=>f.status==="fail").length+" (top findings only)\n"+
              "Search clicks and website views are separate sources, not part of this score.\n");
          '
      - name: Keep raw CLI and reduced reports for diagnostic review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hh-seomator-${{ github.run_id }}
          path: |
            artifacts/seomator-raw.json
            artifacts/seo-audit.json
          if-no-files-found: warn
          retention-days: 14

  publish-snapshot:
    needs: public-technical-audit
    if: ${{ needs.public-technical-audit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download only the validated audit artifact
        uses: actions/download-artifact@v4
        with:
          name: hh-seomator-${{ github.run_id }}
          path: artifacts
      - name: Verify the expected public-only snapshot exists
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/seo-audit.json
      - name: Publish latest tiny JSON as public GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view hh-seomator-history --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create hh-seomator-history \
              --repo "$GITHUB_REPOSITORY" --target codex/public-book-library \
              --title "Holistic House SEO audit history" --latest=false \
              --notes "Public technical SEO sampling only. No Search Console credentials, client data or paid integrations."
          fi
          gh release upload hh-seomator-history artifacts/seo-audit.json \
            --repo "$GITHUB_REPOSITORY" --clobber
