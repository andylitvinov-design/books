name: Holistic House App R1 isolated verification
on:
  push:
    branches: ['codex/holistic-house-app-r1']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ['codex/public-book-library']
    paths:
      - 'tests/development-vector-wheel.test.mjs'
      - 'tests/daybook-*.mjs'
      - 'tests/helpers/daybook-canonical-schema.mjs'
      - 'tests/ci-daybook-*.mjs'
      - 'scripts/ci-daybook*.mjs'
      - 'scripts/ci-coaching-rls*.mjs'
      - 'tests/ci-coaching-rls-guard.test.mjs'
      - 'tests/personal-coaching-rls-isolated.integration.mjs'
      - 'scripts/verify-eight-v2-registry-proposal.mjs'
      - 'tests/author-score-clusters.test.mjs'
      - 'tests/cabinet-today.test.mjs'
      - 'tests/canonical-pdf.test.mjs'
      - 'tests/checkin-course-result-integrity.test.mjs'
      - 'tests/checkin-scoring-analysis-quality.test.mjs'
      - 'tests/consultation-draft-preview.test.mjs'
      - 'tests/consultation-report-language.test.mjs'
      - 'tests/course-banner/browser.mjs'
      - 'tests/distance-homeopathy-report.test.mjs'
      - 'tests/free-course-banner.test.mjs'
      - 'tests/full-assessment-library-quality.test.mjs'
      - 'tests/hh-original-review-ledger.test.mjs'
      - 'tests/historical-interpretation-coverage.test.mjs'
      - 'tests/personal-analysis-cabinet.test.mjs'
      - 'tests/professional-test-expansion-2026.test.mjs'
      - 'tests/psi-monitoring.test.mjs'
      - 'tests/psychometric-validity-directory.test.mjs'
      - 'tests/public-test-match-paging.test.mjs'
      - 'tests/session-publication-review.test.mjs'
      - 'app/**/app/**'
      - 'app/**/client/**'
      - 'app/api/app/**'
      - 'app/api/client/**'
      - 'app/api/assessments/**'
      - 'components/app/**'
      - 'components/academy-video-library-client.tsx'
      - 'components/my-course*'
      - 'components/profile-*'
      - 'lib/app/**'
      - 'lib/profile/**'
      - 'lib/assessments/**'
      - 'lib/course/**'
      - 'lib/academy/**'
      - 'lib/security/**'
      - 'data/assessments/**'
      - 'tests/app-*.mjs'
      - 'tests/client-report*.mjs'
      - 'tests/assessment-*.mjs'
      - 'tests/profile-*.mjs'
      - 'tests/course-immersive-start-ui.test.mjs'
      - 'tests/my-course*.mjs'
      - 'tests/personal-video-cloud.test.mjs'
      - 'supabase/migrations/**'
      - 'middleware.ts'
      - 'next.config.*'
      - 'package-lock.json'
      - 'scripts/ci-heavy-impact.mjs'
      - '.github/workflows/hh-app-r1.yml'
      - '!app/api/app/crm/messenger/webhook/**'
      - '!lib/app/client-telegram-transport.js'
      # Commander signed PR completion is validated by Core and the focused Guard, not this unrelated heavy suite.
      - '!app/api/app/commander/**'
      # Public Ali greeting and support quiz: focused conversation owner; private Messenger/auth changes keep full tests.
      - '!components/app/messenger-ai-landing.*'
      - '!components/app/messenger-support-quiz.*'
      # Public Ali greeting and decorative coach portrait are not authenticated
      # App/CRM, assessment, cabinet or SQL/RLS changes. Core now runs focused
      # persona/media contracts. Mixed private changes still run App QA.
      - '!components/app/ali-persona-audio.js'
      - '!components/app/coaching-avatar.jsx'
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: app-r1-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && (github.event.action == 'synchronize' || github.event.action == 'converted_to_draft') }}
jobs:
  impact:
    name: route-expensive-app-suites
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-slim
    timeout-minutes: 8
    outputs:
      full_app: ${{ steps.choose.outputs.full_app }}
      database: ${{ steps.choose.outputs.database }}
      profile: ${{ steps.choose.outputs.profile }}
      banner: ${{ steps.choose.outputs.banner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          # Verify exact synthetic merge with full git trees, not media blobs.
          sparse-checkout: |
            scripts
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Classify exact-head changes, otherwise run all original jobs
        id: choose
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HH_PR_NUMBER: ${{ github.event.pull_request.number }}
          HH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-heavy-impact.mjs app-r1
  unit-build:
    needs: impact
    # CI-only changes are validated by Core + actionlint + focused routing tests.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.impact.result == 'success' }}
    # Full App assertions retain the original runner; a proven no-op uses one lightweight shell check.
    runs-on: ${{ needs.impact.outputs.profile == 'true' && 'ubuntu-latest' || 'ubuntu-slim' }}
    timeout-minutes: 20
    steps:
      - name: Confirm App R1 profile was safely routed away
        if: needs.impact.outputs.profile != 'true'
        env:
          HH_ROUTED_SCOPE: ${{ needs.impact.outputs.profile }}
        run: test "$HH_ROUTED_SCOPE" = false
      - uses: actions/checkout@v4
        if: needs.impact.outputs.profile == 'true'
        with: {persist-credentials: false}
      - name: Verify live PR readiness before costly CI
        if: github.event_name == 'pull_request' && needs.impact.outputs.profile == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-pr-readiness.mjs
      - uses: actions/setup-node@v4
        if: needs.impact.outputs.profile == 'true'
        with: {node-version: 22, cache: npm}
      - name: Load original checksum-verified FFmpeg for npm ci
        uses: ./.github/actions/ci-ffmpeg-static
        if: needs.impact.outputs.profile == 'true'
      - run: npm ci --no-audit --no-fund
        if: needs.impact.outputs.profile == 'true'
      - name: Install SHA-verified FFmpeg into package after npm ci
        uses: ./.github/actions/ci-ffmpeg-static
        if: needs.impact.outputs.profile == 'true'
        with:
          stage: materialize
      - name: Daybook private workspace unit acceptance
        if: needs.impact.outputs.full_app == 'true'
        run: node --conditions=react-server --test tests/daybook-*.test.mjs tests/ci-daybook-isolated.test.mjs tests/development-vector-wheel.test.mjs tests/profile-inner-balance-preview.test.mjs
      - name: Check-in evidence, scoring and report-priority regressions
        if: needs.impact.outputs.full_app == 'true'
        run: node --conditions=react-server --test tests/checkin-scoring-analysis-quality.test.mjs tests/checkin-course-result-integrity.test.mjs tests/author-score-clusters.test.mjs tests/hh-original-review-ledger.test.mjs tests/full-assessment-library-quality.test.mjs tests/professional-test-expansion-2026.test.mjs tests/assessment-selectable-report.test.mjs tests/assessment-interpretation-band-model.test.mjs tests/assessment-report-semantic-summary.test.mjs tests/assessment-interpretation-consumer.test.mjs tests/psychometric-validity-directory.test.mjs tests/public-test-match-paging.test.mjs
      - name: Historical interpretation and monitoring regressions
        if: needs.impact.outputs.full_app == 'true'
        run: node --conditions=react-server --test tests/historical-interpretation-coverage.test.mjs tests/psi-monitoring.test.mjs
      - name: Profile four domains, truthful scales and compact responsive UI
        if: needs.impact.outputs.profile == 'true'
        run: node --conditions=react-server --test tests/profile-four-domains.test.mjs tests/profile-assessment-overview.test.mjs tests/profile-integrated-summary.test.mjs tests/cabinet-today.test.mjs
      - name: Optional free-course banner render contracts
        if: needs.impact.outputs.full_app == 'true' || needs.impact.outputs.banner == 'true'
        run: node --conditions=react-server --test tests/free-course-banner.test.mjs
      - name: Anti-Stress 14-day continuation path regressions (EN/RU/ES)
        if: needs.impact.outputs.full_app == 'true' || needs.impact.outputs.banner == 'true'
        run: node --test tests/course-immersive-start-ui.test.mjs
      - name: Client report HTML/PDF, privacy and long-content regressions
        if: needs.impact.outputs.full_app == 'true'
        run: node --test tests/canonical-pdf.test.mjs tests/client-report-notes-preview.test.mjs tests/distance-homeopathy-report.test.mjs tests/client-report-design.test.mjs tests/consultation-draft-preview.test.mjs tests/consultation-report-language.test.mjs tests/client-report-mobile-layout.test.mjs tests/client-report-premium-v3.test.mjs tests/client-report-before-after-rings.test.mjs tests/session-publication-review.test.mjs
      - name: Personal video owner RLS, signed-upload tombstone and consent contracts
        if: needs.impact.outputs.full_app == 'true'
        run: node --test tests/personal-video-cloud.test.mjs
      - name: Real SDK PKCE and callback cookie regressions
        if: needs.impact.outputs.full_app == 'true'
        run: node --conditions=react-server --test tests/app-auth-pkce.integration.mjs
      - name: Lint complete repository including literal App Router paths
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npm run lint
      - name: Production-mode build, app flags absent
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npm run build
        env: {NEXT_TELEMETRY_DISABLED: '1'}
      - name: Full TypeScript (core release-ready owns production PR typing)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npx --no-install tsc --noEmit
      - name: Independent native/PWA contracts for non-UI changes
        if: needs.impact.outputs.full_app == 'true'
        run: npm run pwa:check && npm run native:check
  course-banner-browser:
    needs: impact
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.impact.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        # Both real browsers when needed; otherwise one fail-closed no-op job.
        browser: ${{ fromJSON(needs.impact.outputs.banner == 'true' && '["chromium","webkit"]' || '["none"]') }}
    # Standard free runner; pin distro and launch the prebuilt browser image
    # only in the actual browser step. The 'none' route stays lightweight.
    # The "none" matrix runs no browser tools; real Chromium/WebKit stay on ubuntu-24.04.
    runs-on: ${{ matrix.browser != 'none' && 'ubuntu-24.04' || 'ubuntu-slim' }}
    timeout-minutes: 15
    env:
      HH_TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Confirm Course banner was safely routed away
        if: needs.impact.outputs.banner != 'true'
        env:
          HH_ROUTED_SCOPE: ${{ needs.impact.outputs.banner }}
        run: test "$HH_ROUTED_SCOPE" = false
      - uses: actions/checkout@v4
        if: needs.impact.outputs.banner == 'true'
        with: {persist-credentials: false}
      - name: Verify live PR readiness before costly CI
        if: github.event_name == 'pull_request' && needs.impact.outputs.banner == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-pr-readiness.mjs
      - uses: actions/setup-node@v4
        if: needs.impact.outputs.banner == 'true'
        with: {node-version: 22, cache: npm}
      # This fixture renders two reviewed components with synthetic local DOM.
      # The two real browser jobs need only locked React/ReactDOM/Scheduler/TS.
      # Any changed source or dependency manifest restores the original full install.
      - name: Plan reviewed minimal Course Banner dependencies
        id: banner-deps
        if: needs.impact.outputs.banner == 'true' && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'codex/public-book-library'
        shell: bash
        env:
          HH_BANNER_DEPS: ${{ runner.temp }}/hh-course-banner-deps
        run: |
          set -euo pipefail
          if node --input-type=commonjs - <<'HH_BANNER_LOCK'
          const {execFileSync}=require('node:child_process');
          const fs=require('node:fs'),path=require('node:path');
          const reviewed={"tests/course-banner/browser.mjs":"5d7450ef09c1102f0279ae4a18e48d66c52f8f2a","components/app/free-course-banner.jsx":"cf33e706c6200c8fa50f93ed1eb1d495dfe2db5d","components/app/compact-assessment-report.jsx":"cb56338d5b8535a4aa06d688c2af75dbb7c7594a","lib/assessments/result-overview.js":"f8d87d560719a26fa34b564263bdf49b14662779","lib/assessments/assessment-evidence-status.js":"1fde5893de9bd45b955623c2d64a6dc7572d69ec","package.json":"5cd2fa9b3778f5d7b0a22aaaa27d6eef0cace73a","package-lock.json":"c68e4bb81338c2ce968b3d35a3b281de83bab7c4"};
          for(const [file,sha] of Object.entries(reviewed)){
            if(execFileSync('git',['hash-object','--',file],{encoding:'utf8'}).trim()!==sha) process.exit(1);
          }
          const full=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if(full.lockfileVersion!==3) process.exit(1);
          const names=['react','react-dom','scheduler','typescript'];
          const entries=Object.fromEntries(names.map(name=>[name,full.packages['node_modules/'+name]]));
          if(names.some(name=>!entries[name]||!/^sha512-[A-Za-z0-9+/=]+$/.test(entries[name].integrity||'')||
            entries[name].resolved!==('https://registry.npmjs.org/'+name+'/-/'+name+'-'+entries[name].version+'.tgz'))) process.exit(1);
          const root={name:'hh-course-banner-ci-deps',version:'1.0.0',dependencies:{
            react:entries.react.version,'react-dom':entries['react-dom'].version,scheduler:entries.scheduler.version},
            devDependencies:{typescript:entries.typescript.version}};
          const dir=process.env.HH_BANNER_DEPS;
          if(!dir) process.exit(1);
          fs.mkdirSync(dir,{recursive:true});
          fs.writeFileSync(path.join(dir,'package.json'),JSON.stringify(root));
          fs.writeFileSync(path.join(dir,'package-lock.json'),JSON.stringify({...root,lockfileVersion:3,requires:true,
           packages:{'':root,...Object.fromEntries(names.map(n=>['node_modules/'+n,entries[n]]))}}));
          HH_BANNER_LOCK
          then
            echo 'minimal=true' >> "$GITHUB_OUTPUT"
          else
            echo 'minimal=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install only the four exact locked Course Banner packages
        if: needs.impact.outputs.banner == 'true' && steps.banner-deps.outputs.minimal == 'true'
        shell: bash
        env:
          HH_BANNER_DEPS: ${{ runner.temp }}/hh-course-banner-deps
        run: |
          set -euo pipefail
          npm ci --prefix "$HH_BANNER_DEPS" --include=dev --ignore-scripts --no-audit --no-fund
          test ! -e node_modules
          mv "$HH_BANNER_DEPS/node_modules" node_modules
      - name: Load original checksum-verified FFmpeg for npm ci
        uses: ./.github/actions/ci-ffmpeg-static
        if: needs.impact.outputs.banner == 'true' && steps.banner-deps.outputs.minimal != 'true'
      - run: npm ci --no-audit --no-fund
        if: needs.impact.outputs.banner == 'true' && steps.banner-deps.outputs.minimal != 'true'
      - name: Install SHA-verified FFmpeg into package after npm ci
        uses: ./.github/actions/ci-ffmpeg-static
        if: needs.impact.outputs.banner == 'true' && steps.banner-deps.outputs.minimal != 'true'
        with:
          stage: materialize
      - name: Install isolated exact-version Playwright test tools (without browser downloads)
        if: needs.impact.outputs.banner == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/hh-course-banner-tools
          npm install --prefix /tmp/hh-course-banner-tools --ignore-scripts --no-audit --no-fund @playwright/test@1.63.0
          ln -s /tmp/hh-course-banner-tools/node_modules/@playwright node_modules/@playwright
      - name: EN/RU course disclosure, keyboard and narrow-screen acceptance in pinned browsers
        if: needs.impact.outputs.banner == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Only synthetic local DOM: no secrets or external network exposed.
          # The image carries 1.63.0 Chromium/WebKit and system dependencies.
          # No apt/playwright install --with-deps and no container pull on no-op.
          docker run --rm --init --ipc=host --network none \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v /tmp/hh-course-banner-tools:/tmp/hh-course-banner-tools:ro \
            -w "$GITHUB_WORKSPACE" \
            -e HH_TEST_BROWSER="$HH_TEST_BROWSER" -e CI=true \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            bash -lc 'test "${PLAYWRIGHT_BROWSERS_PATH:-}" = /ms-playwright && node tests/course-banner/browser.mjs'
      - uses: actions/upload-artifact@v4
        if: always() && needs.impact.outputs.banner == 'true'
        with:
          name: course-banner-synthetic-${{ matrix.browser }}
          path: artifacts/course-banner/
          retention-days: 7
  database:
    needs: impact
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.impact.result == 'success' }}
    # SQL/RLS still use a Docker-capable runner; the proof-only no-op uses ubuntu-slim.
    runs-on: ${{ needs.impact.outputs.database == 'true' && 'ubuntu-latest' || 'ubuntu-slim' }}
    timeout-minutes: 15
    services:
      postgres:
        # Empty image disables the unneeded service on a verified no-database path.
        image: ${{ needs.impact.outputs.database == 'true' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_DB: hh_app_test
          POSTGRES_PASSWORD: synthetic-ci-admin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hh_app_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
      NODE_ENV: test
      HH_APP_TEST_RUNTIME: isolated
      HH_APP_ENABLED: 'true'
      HH_APP_SIGNUPS_ENABLED: 'true'
      HH_APP_GUEST_ENABLED: 'true'
      HH_APP_REPORTS_ENABLED: 'true'
      HH_APP_SUPABASE_URL: http://127.0.0.1:54329
      HH_APP_SUPABASE_PUBLISHABLE_KEY: synthetic-publishable-key
      HH_APP_DATABASE_URL: postgres://hh_app_ci_login:synthetic-ci-only@127.0.0.1:5432/hh_app_test
      HH_TEST_ADMIN_DATABASE_URL: postgres://postgres:synthetic-ci-admin@127.0.0.1:5432/hh_app_test
      HH_APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HH_APP_ALLOWED_ORIGINS: http://127.0.0.1:3100
    steps:
      - name: Confirm Database was safely routed away
        if: needs.impact.outputs.database != 'true'
        env:
          HH_ROUTED_SCOPE: ${{ needs.impact.outputs.database }}
        run: test "$HH_ROUTED_SCOPE" = false
      - uses: actions/checkout@v4
        if: needs.impact.outputs.database == 'true'
        with: {persist-credentials: false}
      - name: Verify live PR readiness before costly CI
        if: github.event_name == 'pull_request' && needs.impact.outputs.database == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-pr-readiness.mjs
      - uses: actions/setup-node@v4
        if: needs.impact.outputs.database == 'true'
        with: {node-version: 22, cache: npm}
      - name: Load original checksum-verified FFmpeg for npm ci
        uses: ./.github/actions/ci-ffmpeg-static
        if: needs.impact.outputs.database == 'true'
      - run: npm ci --no-audit --no-fund
        if: needs.impact.outputs.database == 'true'
      - name: Install SHA-verified FFmpeg into package after npm ci
        uses: ./.github/actions/ci-ffmpeg-static
        if: needs.impact.outputs.database == 'true'
        with:
          stage: materialize
      - name: Execute SQL, restricted-role RLS, concurrency, rollback and repository tests
        if: needs.impact.outputs.database == 'true'
        run: npm run test:app:db
      - name: Isolated two-client/two-master client memory SQL and RLS acceptance
        if: needs.impact.outputs.database == 'true'
        run: node scripts/ci-client-memory-rls.mjs
      - name: Isolated Daybook journal goals and daily acceptance
        if: needs.impact.outputs.database == 'true'
        run: node scripts/ci-daybook-isolated.mjs
      - name: Isolated personal coaching owner RLS acceptance
        if: needs.impact.outputs.database == 'true'
        run: |
          node --test tests/ci-coaching-rls-guard.test.mjs
          node scripts/ci-coaching-rls.mjs
      - name: Prove exact eight-row registry proposal, atomic conflicts and full readback
        if: needs.impact.outputs.database == 'true'
        run: node scripts/verify-eight-v2-registry-proposal.mjs
