      - name: Verify media and extract posters
        shell: bash
        run: |
          set -euo pipefail
          : > out/ffprobe.jsonl
          : > out/sha256.txt
          for f in out/*.mp4; do
            ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration,size -of json "$f" >> out/ffprobe.jsonl
            sha256sum "$f" >> out/sha256.txt
            b="${f%.mp4}"
            ffmpeg -hide_banner -loglevel error -ss 1.5 -i "$f" -frames:v 1 -vf scale=1280:-2 "${b}_poster.webp"
            sha256sum "${b}_poster.webp" >> out/sha256.txt
          done
      - name: Upload media artifact
        uses: actions/upload-artifact@v4
        with:
          name: approved-ru-page-videos
          path: out/
          if-no-files-found: error
          retention-days: 1
