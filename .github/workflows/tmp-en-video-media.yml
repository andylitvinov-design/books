    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download approved EN service masters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 'https://files2.heygen.ai/aws_pacific/avatar_tmp/29b72be65e0e493f9570e7a40a904b91/8c1634ce904434a91931429b6a7eefe1.mp4?Expires=1791500046&Signature=I3HKzRgsjXdyR4hLMJ6BD3DxLuWkuNpfR42Bvz1ReAdJEEyUXEltkUJvc2~KnF4hPr5W-0NzuVOnEQiJSg9sNOapYNJl3VL0Lh8P3vo7YscZInvVooXDRhko4kgoHZYNMgvZIFSXZmbPOzX-t0kttBoA~VNaJlgVNGamct0mx5-s1uuXFtj0eqxUc-d4lUyQ-m0XuhvcM5oYGlMCFDhruz3ig6MrxRj5l-9lBcgxwzomE5EUqQF87Hva93goYcy4kdkC-u5NlsSPUOIIrVr2IIrVgdd8p0-j5JLwXI-lWCIcuFqoCA9V2QMn02nEYA1bXcvAfM21XrOphlL0CBXH~g__&Key-Pair-Id=K38HBHX5LX3X2H' -o out/2026-10-01_psitrends_hypnotherapy_en_avatarV_16x9_v01.mp4
          curl -fL --retry 3 'https://files2.heygen.ai/aws_pacific/avatar_tmp/29b72be65e0e493f9570e7a40a904b91/7c6b243f048b9c0581ae29619a4a89fc.mp4?Expires=1791500096&Signature=K-W-Xlf7VYgUBYHwP5-lbPRI4kbHwgpEhEy9FfiHc3qMPe6ry9IYWTIVuC8nlydFH89cSSEKVcpd22hva3ZvXgJ80ZbqNh3-bRwRYwdosvvik2ARWuIHUGWczDeon3wgbCPAgAv5ASKlvIMv0y~WdI0xZz3yi5~cxm4xQIWQTS4osJKxid4EBWO1vSFwrSlpvhAdyeWVkCuds0P3GOkcE4JJKcpEWHanf9QM0x3X4osIveHFQcMLOtkW9ILbJad~tJLJGJ3XzQGMm0GntzP2S-pM6q48Zjeebb17k1e9klYJDi7jwlbT9zvg7wdXTAxj8tC03GoRX8mnS0M3F7RXQQ__&Key-Pair-Id=K38HBHX5LX3X2H' -o out/2026-10-01_psitrends_constellations_en_avatarV_16x9_v01.mp4
      - name: Verify media and extract posters
        shell: bash
        run: |
          set -euo pipefail
          : > out/ffprobe.jsonl
          : > out/sha256.txt
          for f in out/*.mp4; do
            ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration,size -of json "$f" >> out/ffprobe.jsonl
            sha256sum "$f" >> out/sha256.txt
            b="${f%.mp4}"
            ffmpeg -hide_banner -loglevel error -ss 1.5 -i "$f" -frames:v 1 -vf scale=1280:-2 "${b}_poster.webp"
            sha256sum "${b}_poster.webp" >> out/sha256.txt
          done
      - name: Upload media artifact
        uses: actions/upload-artifact@v4
        with:
          name: approved-psitrends-service-videos
          path: out/
          if-no-files-found: error
          retention-days: 1
