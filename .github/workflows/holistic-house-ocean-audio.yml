name: Holistic House Ocean Audio

on:
  pull_request:
    paths:
      - 'components/ocean-practice-audio.ts'
      - 'components/app/opora-ocean-outro.jsx'
      - 'components/app/course-guided-timer.jsx'
      - 'components/energywork-ai-learner.tsx'
      - 'public/audio/**'
      - 'tests/ocean-practice-audio*.test.mjs'
      - 'tests/opora-ocean-outro.test.mjs'
      - 'tests/opora-post-save-course-program.test.mjs'
      - '.github/workflows/holistic-house-ocean-audio.yml'
  push:
    branches: ['codex/public-book-library']
    paths:
      - 'components/ocean-practice-audio.ts'
      - 'components/app/opora-ocean-outro.jsx'
      - 'components/app/course-guided-timer.jsx'
      - 'components/energywork-ai-learner.tsx'
      - 'public/audio/**'
      - 'tests/ocean-practice-audio*.test.mjs'
      - 'tests/opora-ocean-outro.test.mjs'
      - 'tests/opora-post-save-course-program.test.mjs'
      - '.github/workflows/holistic-house-ocean-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holistic-house-ocean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ocean-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify audio file, playback, and EN/RU/ES anti-stress flows
        run: node --test tests/ocean-practice-audio.test.mjs tests/ocean-practice-audio-runtime.test.mjs tests/opora-ocean-outro.test.mjs tests/opora-post-save-course-program.test.mjs
