name: Holistic House public event referral contract

on:
  pull_request:
    paths:
      - 'lib/organic-event-referrals.js'
      - 'components/contact-channel-chooser.tsx'
      - 'tests/organic-event-referrals.test.mjs'
      - 'lib/paid-ad-referrals.js'
      - 'tests/paid-ad-referrals.test.mjs'
      - 'data/meta-ads-pilot-draft.json'
      - 'data/google-ads-pilot-draft.json'
      - '.github/workflows/hh-event-referral-contract.yml'
  push:
    branches: [codex/public-book-library]
    paths:
      - 'lib/organic-event-referrals.js'
      - 'components/contact-channel-chooser.tsx'
      - 'tests/organic-event-referrals.test.mjs'
      - 'lib/paid-ad-referrals.js'
      - 'tests/paid-ad-referrals.test.mjs'
      - 'data/meta-ads-pilot-draft.json'
      - 'data/google-ads-pilot-draft.json'
      - '.github/workflows/hh-event-referral-contract.yml'

permissions:
  contents: read

jobs:
  tracked-handoff-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Event referral, messenger and privacy contracts
        run: node --test tests/organic-event-referrals.test.mjs tests/paid-ad-referrals.test.mjs tests/contact-channel-chooser.test.mjs tests/ga4-analytics.test.mjs tests/whatsapp-enquiries.test.mjs tests/free-review-conversion.test.mjs
      - name: Check TypeScript without publishing
        run: npx tsc --noEmit
