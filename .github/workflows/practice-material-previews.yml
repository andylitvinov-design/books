name: Practitioner material previews isolated build
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'components/app/practice-material-preview.jsx'
      - 'components/app/practice-materials.jsx'
      - 'components/app/practice-workspace.jsx'
      - 'components/app/practice-dashboard.css'
      - 'tests/practice-single-screen-workspace.test.mjs'
      - 'tests/practice-v4-visual-parity.test.mjs'
      - 'tests/practice-approved-dashboard.test.mjs'
      - 'tests/practice-single-owner-cabinet.test.mjs'
      - 'components/app/practitioner-articles.*'
      - 'components/admin-reiki-audio.*'
      - 'app/admin/materials/courses/reiki-practitioner/page.jsx'
      - 'tests/practice-materials-action-first.test.mjs'
      - 'components/app/compact-video-composer.*'
      - 'components/app/practice-youtube-uploader.*'
      - 'tests/practice-video-composer-compact.test.mjs'
      - 'components/app/practitioner-course-builder.*'
      - 'components/app/course-slide-recorder.*'
      - 'tests/course-slide-recorder.test.mjs'
      - 'components/public-practitioner-course*'
      - 'app/api/app/practice/courses/**'
      - 'app/api/practitioner-course-media/**'
      - 'app/\[locale\]/courses/masters/**'
      - 'lib/practitioners/course-*'
      - 'supabase/migrations/*practitioner_course_builder*'
      - 'tests/practitioner-course-builder.test.mjs'
      - 'tests/practitioner-course-quick-start.test.mjs'
      - 'tests/practitioner-course-visual-canvas.test.mjs'
      - 'components/app/practice-materials.module.css'
      - 'components/app/practice-report-materials.jsx'
      - 'lib/practitioners/material-preview.js'
      - 'tests/practice-material-preview-url.test.mjs'
      - 'tests/practice-course-materials-navigation.test.mjs'
      - 'tests/practitioner-approved-v4-ui.test.mjs'
      - '.github/workflows/practice-material-previews.yml'
permissions:
  contents: read
concurrency:
  group: practice-material-previews-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-types-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      # NODE_ENV=production must not omit TypeScript, ESLint or Next build tooling.
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Thumbnail URL safety and media source allowlist
        run: node --test tests/practice-material-preview-url.test.mjs tests/practice-materials-action-first.test.mjs tests/practice-v4-visual-parity.test.mjs tests/practice-course-materials-navigation.test.mjs tests/practitioner-approved-v4-ui.test.mjs tests/practitioner-course-builder.test.mjs tests/practitioner-course-quick-start.test.mjs tests/practitioner-course-visual-canvas.test.mjs tests/course-slide-recorder.test.mjs tests/practice-video-composer-compact.test.mjs tests/practitioner-video-materials.test.mjs tests/practice-single-screen-workspace.test.mjs tests/practice-approved-dashboard.test.mjs tests/practice-single-owner-cabinet.test.mjs
      - name: ESLint of changed interactive panels
        run: npx --no-install eslint components/app/practice-workspace.jsx components/app/practice-materials.jsx components/app/practitioner-course-builder.jsx components/public-practitioner-course-player.jsx lib/practitioners/course-contracts.js lib/practitioners/course-repository.js
      - name: TypeScript regression
        run: npx --no-install tsc --noEmit
      - name: Production Next.js build
        run: npm run build
