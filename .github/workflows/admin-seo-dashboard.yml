name: Holistic House SEO admin dashboard
on:
  pull_request:
    paths:
      - 'app/admin/seo/**'
      - 'lib/seo/admin-dashboard-data.mjs'
      - 'data/seo/verified-baseline-2026-10-17.json'
      - 'components/practitioner-cabinet.jsx'
      - 'components/prescription-admin-header.jsx'
      - 'tests/admin-seo-dashboard.test.mjs'
      - 'tests/admin-seo-recommendations.test.mjs'
      - 'lib/seo/actionable-recommendations.mjs'
      - 'components/admin-seo-recommendations.jsx'
      - 'app/admin/acquisition/**'
      - 'lib/acquisition/**'
      - 'components/admin-acquisition-links.jsx'
      - 'tests/acquisition-report.test.mjs'
      - 'scripts/verify-acquisition-admin.mjs'
      - '.github/workflows/admin-seo-dashboard.yml'
  push:
    branches: ['codex/public-book-library']
    paths:
      - 'app/admin/seo/**'
      - 'lib/seo/admin-dashboard-data.mjs'
      - 'data/seo/verified-baseline-2026-10-17.json'
      - 'components/practitioner-cabinet.jsx'
      - 'components/prescription-admin-header.jsx'
      - 'tests/admin-seo-dashboard.test.mjs'
      - 'tests/admin-seo-recommendations.test.mjs'
      - 'lib/seo/actionable-recommendations.mjs'
      - 'components/admin-seo-recommendations.jsx'
      - 'app/admin/acquisition/**'
      - 'lib/acquisition/**'
      - 'components/admin-acquisition-links.jsx'
      - 'tests/acquisition-report.test.mjs'
      - 'scripts/verify-acquisition-admin.mjs'
      - '.github/workflows/admin-seo-dashboard.yml'
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify SEO admin privacy, sources and exports
        run: node --test tests/admin-seo-dashboard.test.mjs tests/admin-seo-recommendations.test.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install isolated acquisition browser tools
        run: |
          npm install --prefix /tmp/acquisition-browser --no-package-lock --ignore-scripts @playwright/test@1.63.0
          ln -s /tmp/acquisition-browser/node_modules/@playwright node_modules/@playwright
          /tmp/acquisition-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify isolated signed-admin acquisition flow
        run: node scripts/verify-acquisition-admin.mjs
      - name: Upload isolated acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-admin-isolated-${{ github.sha }}
          path: output/acquisition-admin-isolated/
          retention-days: 7
