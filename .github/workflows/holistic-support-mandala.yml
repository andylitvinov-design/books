  # Linux Playwright WebKit does not implement Canvas captureStream in this
  # runner image. Prove the *actual encoded* voice/video via WebKit on macOS,
  # the closest supported CI platform to iPhone Safari. Never mock a download.
  # Video source-clock fixes require real macOS Safari encoded-output evidence.
  # Before booking macOS, fail cheaply on stale HEAD, invalid base or broken source contracts.
  webkit_preflight:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-slim
    timeout-minutes: 7
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live PR readiness and exact tested HEAD/base before browser budget
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HH_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HH_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci-pr-readiness.mjs
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^2)" = "$HH_EVENT_HEAD_SHA"
          tested_base="$(git rev-parse HEAD^1)"
          [[ "$tested_base" =~ ^[0-9a-f]{40}$ && "$HH_EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$tested_base" != "$HH_EVENT_BASE_SHA" ]]; then
            echo "Tested merge base $tested_base differs from event base $HH_EVENT_BASE_SHA; final trusted gate evaluates production-base freshness." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Node syntax and focused Mandala/encoded-video source contracts
        run: |
          set -euo pipefail
          node --check scripts/verify-affirmation-voice-browser.mjs
          node --check scripts/benchmarking/first-video-live-export.mjs
          node --check scripts/benchmarking/verify-original-motion-export.mjs
          node --check scripts/benchmarking/verify-five-scene-stories-browser.mjs
          node --check scripts/verify-practices-mobile-browser.mjs
          node --check scripts/ci-pr-readiness.mjs
          # Catch stale compact mobile UI contracts before reserving
          # a macOS runner. The standalone Node/fs suite needs no npm;
          # tests requiring TypeScript stay in the full Mandala unit job.
          # Actual WebKit MP4/audio release acceptance still runs unchanged.
          node --test tests/video-studio-question-registry.test.mjs tests/mandala-video-goal-media-coverage.test.mjs tests/mandala-approved-mobile-studio.test.mjs tests/video-reels-ci-routing.test.mjs
  voice-webkit-macos:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && (startsWith(github.head_ref, 'codex/voice-studio-') || startsWith(github.head_ref, 'codex/voice-mix-') || startsWith(github.head_ref, 'feat/meditation-writer-') || startsWith(github.head_ref, 'codex/stories-') || startsWith(github.head_ref, 'fix/video-') || startsWith(github.head_ref, 'codex/video-reels-') || startsWith(github.head_ref, 'codex/video-concept-') || github.head_ref == 'rebase/video-ideas-personalization-20261109' || github.head_ref == 'codex/ready-signed-video-resumable-20261107' || startsWith(github.head_ref, 'fix/voice-picker-') || startsWith(github.head_ref, 'fix/webkit-') || startsWith(github.head_ref, 'feat/video-120-scenario-media-bindings-') || startsWith(github.head_ref, 'feat/video-phrase-catalog-') || startsWith(github.head_ref, 'codex/perf-video-studio-') || startsWith(github.head_ref, 'codex/hypno-third-workspace-') || startsWith(github.head_ref, 'codex/mandala-cancel-stale-head-cache-') || startsWith(github.head_ref, 'feat/video-chat-context-understanding-') || startsWith(github.head_ref, 'feat/hh-goal-tree-') || startsWith(github.head_ref, 'feat/video-') || github.head_ref == 'feat/ideas-personalization-concept-20261108' || startsWith(github.head_ref, 'feat/voice-timed-storyboard-') || startsWith(github.head_ref, 'feat/mytube-unified-six-bottom-') || startsWith(github.head_ref, 'feat/mytube-six-dock-production-') || github.head_ref == 'fix/mandala-compact-goals-montage-20261103' || github.head_ref == 'codex/professional-growth-templates-20261031') }}
    needs: [webkit_preflight]
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HH_TEST_PUBLIC_ORIGIN: http://127.0.0.1:3100
      HH_VOICE_E2E_ENGINE: webkit
      # Test real WebKit native compositor rather than frozen headless media.
      HH_VOICE_E2E_HEADED: '1'
      HH_EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # This CI-only PR keeps the consent-only WebKit check and encoded media gate.
      HH_VOICE_SKIP_GUIDED_PRACTICES: ${{ startsWith(github.head_ref, 'codex/mandala-cancel-stale-head-cache-') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Reuse Next compiler output across exact-HEAD retries; every run still builds.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: hh-holistic-mandala-next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            hh-holistic-mandala-next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Install pinned dependencies without networked FFmpeg postinstall
        run: |
          # ffmpeg-static's optional upstream binary endpoint intermittently returns HTTP 504.
          # Install the already-used native Homebrew decoder first, then link it only into
          # this ephemeral macOS CI workspace. Production npm/Vercel installs are unchanged.
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          test -f node_modules/ffmpeg-static/package.json
          test "$(node -p "require('./node_modules/ffmpeg-static/package.json').version")" = "5.3.0"
          ffmpeg_bin="$(command -v ffmpeg)"
          test -x "$ffmpeg_bin"
          ln -sfn "$ffmpeg_bin" node_modules/ffmpeg-static/ffmpeg
          resolved_ffmpeg="$(node -p "require('ffmpeg-static')")"
          test "$resolved_ffmpeg" = "$PWD/node_modules/ffmpeg-static/ffmpeg"
          test -x "$resolved_ffmpeg"
          "$resolved_ffmpeg" -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
      - name: Build exact voice release candidate
        run: |
          # Same macOS runner; increase only the build worker's V8 heap, not the CI scope.
          HH_FFMPEG_EXTERNAL_PATH="$(command -v ffmpeg)" NODE_OPTIONS=--max-old-space-size=3072 npm run build
      # Reuse Playwright's version-pinned WebKit payload; encoded-media tests still execute.
      - name: Restore pinned Playwright WebKit browser
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: hh-holistic-mandala-webkit-${{ runner.os }}-playwright-1.63.0
      - name: Install WebKit and real media decoders
        run: |
          mkdir -p "$RUNNER_TEMP/voice-playwright"
          npm install --prefix "$RUNNER_TEMP/voice-playwright" --no-audit --no-fund @playwright/test@1.63.0
          ln -s "$RUNNER_TEMP/voice-playwright/node_modules/@playwright" node_modules/@playwright
          "$RUNNER_TEMP/voice-playwright/node_modules/.bin/playwright" install webkit
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi
          # Full five-MP3 physical audio gate: decode, SHA-256, duration,
          # bitrate, RMS and clipping on the EXISTING required macOS runner.
          # Never accept metadata-only tests as proof of audible media.
          if [ -f data/video-catalog/curated-music-source-wave-v1.json ]; then
            test -f tests/curated-music-wave.test.mjs
            node --test tests/curated-music-wave.test.mjs
          fi
      # Guest recording stays browser-local: test the fragment invitation,
      # voluntary adult consent and zero cloud TTS POST on the existing Mac job.
      - name: Guest voice consent and invitation contract (macOS gate)
        run: |
          node --check scripts/verify-affirmation-voice-browser.mjs
          node --test tests/mandala-guest-voice-message.test.mjs
      - name: WebKit recorded movie contains video and audible consented voice
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3100 >/tmp/hh-voice-macos-next.log 2>&1 & NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT
          ready=0
          for ((i=1; i<=60; i++)); do
            if curl --silent --fail http://127.0.0.1:3100/ru/holistic-support/mandala >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/hh-voice-macos-next.log; exit 1; fi
          node scripts/verify-affirmation-voice-browser.mjs
          # Exercise the actual mobile consent label with WebKit only.
          HH_PRACTICES_BROWSER_ENGINE=webkit HH_PRACTICES_CONSENT_ONLY=1 \
            node scripts/verify-practices-mobile-browser.mjs
          # Gate on the *actual* WebKit four-scene H264/AAC movie, not mock TTS.
          # Validate approved source IDs, scene order, motion, black gaps and audio.
          HH_LIVE_VIDEO_SOURCE=http://127.0.0.1:3100 \
            HH_LIVE_VIDEO_REQUIRE_STOCK=true \
            HH_LIVE_VIDEO_PLAYWRIGHT="$RUNNER_TEMP/voice-playwright/node_modules/playwright/index.mjs" \
            HH_LIVE_VIDEO_ENGINE=webkit HH_LIVE_VIDEO_HEADED=1 \
            node scripts/benchmarking/first-video-live-export.mjs
          HH_ORIGINAL_MOTION_ENGINE=webkit HH_LIVE_VIDEO_PLAYWRIGHT="$RUNNER_TEMP/voice-playwright/node_modules/playwright/index.mjs" \
            node scripts/benchmarking/verify-original-motion-export.mjs
          # Real five-shot vertical movie, identity and soundtrack gate for Stories PRs.
          # The guard is strict, local-only and cannot invoke paid AI or publisher POST.
          if [[ "${GITHUB_HEAD_REF:-}" == codex/stories-* ]]; then
            HH_STORIES_E2E_ENGINE=webkit \
              HH_LIVE_VIDEO_PLAYWRIGHT="$RUNNER_TEMP/voice-playwright/node_modules/playwright/index.mjs" \
              node scripts/benchmarking/verify-five-scene-stories-browser.mjs
          fi
      - name: Preserve anonymous WebKit encoded video evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hh-webkit-four-scene-${{ github.sha }}
          path: |
            artifacts/benchmarking/first-video-live-export.json
            artifacts/benchmarking/five-scene-stories-webkit.json
          if-no-files-found: warn
          retention-days: 7
