name: Holistic Support mandala release checks
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'app/[locale]/holistic-support/**'
      - 'components/mandala-meditation*'
      - 'lib/public-locales.ts'
      - 'public/mandalas/**'
      - 'tests/holistic-mandala-meditation.test.mjs'
      - '.github/workflows/holistic-support-mandala.yml'
permissions:
  contents: read
concurrency:
  group: holistic-support-mandala-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused-unit-types-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Mandala and mobile support contracts
        run: node --test tests/holistic-mandala-meditation.test.mjs tests/holistic-support-meditations.test.mjs tests/holistic-support-mobile-alternative.test.mjs
      - name: Targeted lint
        run: npx --no-install eslint components/mandala-meditation-client.tsx 'app/[locale]/holistic-support/mandala/page.tsx' 'app/[locale]/holistic-support/page.tsx' lib/public-locales.ts
      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Build
        run: npm run build
