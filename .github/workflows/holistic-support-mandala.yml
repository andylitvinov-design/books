      - '.github/workflows/holistic-support-mandala.yml'
      - 'scripts/ci-heavy-impact.mjs'
      # Shared CI-only impact policy is executed by HH PR Sweep Guard.
      # Do not start 3-minute Mandala media generation for a policy-test edit.
  workflow_dispatch:
    inputs:
      dareful_preview_wave:
        description: 'Generate unapproved Dareful editorial previews; no public import'
        type: choice
        required: false
        options: [none, wave1, wave2, both]
        default: none
permissions:
  contents: read
  pull-requests: read
concurrency:
  # One first-attempt group per PR lets synchronize cancel only its obsolete HEAD.
  # Manual reruns remain run-scoped; unrelated PRs never share a cancellation group.
  group: >-
    holistic-support-mandala-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.action == 'synchronize' }}
jobs:
  # Keep focused source/provider contracts on PRs; full real media/browser suite is manual-only per production policy.
  focused-unit-types-build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify exact-head CI-policy-only PR maintenance
        id: policy
        shell: bash
        env:
          HH_EVENT_NAME: ${{ github.event_name }}
          HH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          policy_only=false
          if [[ "$HH_EVENT_NAME" == pull_request &&
                "$HH_PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ &&
                "$(git rev-parse HEAD^2 2>/dev/null || true)" == "$HH_PR_HEAD_SHA" ]]; then
            policy_only=true
            count=0
            while IFS= read -r -d '' status && IFS= read -r -d '' file; do
              count=$((count + 1))
              # Only established CI-policy tests can accompany modified
              # workflow YAML on this no-app-install route. Any video test,
              # app source, unknown file, deletion or rename runs full media QA.
              case "$status:$file" in
                M:.github/workflows/*.yml|M:.github/workflows/*.yaml|\
                M:tests/ci-workflow-globs.test.mjs|\
                M:tests/pr-fast-lane.test.mjs|\
                M:tests/ci-heavy-impact.test.mjs) ;;
                *) policy_only=false ;;
              esac
            done < <(git diff --no-renames --name-status -z HEAD^1 HEAD)
            (( count > 0 )) || policy_only=false
          fi
          echo "policy_only=$policy_only" >> "$GITHUB_OUTPUT"
          echo "Mandala verified CI-policy-only route: $policy_only" >> "$GITHUB_STEP_SUMMARY"
      - name: Classify test-only edits before expensive video build
        if: steps.policy.outputs.policy_only != 'true'
        id: impact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HH_PR_NUMBER: ${{ github.event.pull_request.number }}
          HH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-heavy-impact.mjs mandala
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare verified upstream FFmpeg for full Mandala runtime
        if: steps.policy.outputs.policy_only != 'true'
        uses: ./.github/actions/ci-ffmpeg-static
      - name: Install lockfile dependencies without networked FFmpeg postinstall
        if: steps.policy.outputs.policy_only != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize SHA-verified FFmpeg for Mandala runtime and Next trace
        if: steps.policy.outputs.policy_only != 'true'
        uses: ./.github/actions/ci-ffmpeg-static
        with:
          stage: materialize
      - name: Verify focused Mandala and CI scope contracts without app install
        if: steps.policy.outputs.policy_only == 'true'
        run: node --test tests/ci-heavy-impact.test.mjs tests/ci-workflow-globs.test.mjs
      - name: Verify pending Dareful editorial source rights (no network)
        if: steps.policy.outputs.policy_only != 'true'
        run: |
          if [ -e scripts/preview-dareful-candidates.mjs ] || [ -e tests/dareful-preview-candidates.test.mjs ]; then
            test -f scripts/preview-dareful-candidates.mjs
            test -f scripts/render-dareful-candidate-masters.mjs
            test -f tests/dareful-preview-candidates.test.mjs
            test -f tests/dareful-draft-master-contract.test.mjs
            node --test tests/dareful-preview-candidates.test.mjs tests/dareful-draft-master-contract.test.mjs
          fi
      # Reuse the existing domain job; external stock previews require explicit owner dispatch.
      - name: Generate Dareful editorial previews (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dareful_preview_wave != 'none' }}
        env:
          HH_DAREFUL_WAVE: ${{ inputs.dareful_preview_wave }}
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          case "$HH_DAREFUL_WAVE" in wave1|wave2|both) ;; *) echo 'UNKNOWN_DAREFUL_EDITORIAL_WAVE' >&2; exit 1 ;; esac
          if [[ "$HH_DAREFUL_WAVE" == wave1 || "$HH_DAREFUL_WAVE" == both ]]; then
            node scripts/preview-dareful-candidates.mjs
            node scripts/render-dareful-candidate-masters.mjs
          fi
          if [[ "$HH_DAREFUL_WAVE" == wave2 || "$HH_DAREFUL_WAVE" == both ]]; then
            node scripts/preview-dareful-candidates.mjs --wave2
            node scripts/render-dareful-candidate-masters.mjs --wave2
          fi
      - name: Preserve Dareful editorial artifacts without public publishing
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.dareful_preview_wave != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: hh-dareful-editorial-preview-${{ github.run_id }}
          path: |
            artifacts/dareful-wave-previews/
            artifacts/dareful-wave-masters/
            artifacts/dareful-wave2-previews/
            artifacts/dareful-wave2-masters/
          if-no-files-found: warn
          retention-days: 7
      - name: Check browser acceptance script syntax before slow production build
        if: steps.policy.outputs.policy_only != 'true'
        run: node --check lib/mandala/video-executable-director.mjs && node --check lib/mandala/video-chat-executable-ai.mjs && node --check app/api/holistic-support/video-director-plan/route.js && node --check lib/mandala/first-video-director.mjs && node --check lib/mandala/first-video-free-providers.mjs && node --check app/api/holistic-support/first-video-prompt/route.js && node --check lib/mandala/video-studio-question-registry.mjs && node --check scripts/import-dareful-verified-batch.mjs && node --check scripts/import-free-stock-scene.mjs && node --check lib/mandala/free-stock-sources.mjs && node --check scripts/verify-holistic-mandala-browser.mjs && node --check scripts/cinematic-video-assemble.mjs && node --check scripts/video-ai-gpu-readiness.mjs && node --check scripts/verify-affirmation-voice-browser.mjs && node --check lib/mandala/auto-video-director.mjs && node --check lib/mandala/free-film-timeline.mjs && node --check app/api/holistic-support/hypno-strategy/route.js && node --check lib/mandala/hypno-visual-overlay.mjs && node --check scripts/audit-scenario-media.mjs && node --check scripts/import-scenario-video-batch.mjs && node --check scripts/read-live-film-presets.mjs && node --check lib/mandala/scenario-soundtracks.mjs && node --check lib/mandala/video-goal-media-coverage.mjs
      # WAV masters are reproducible build output; avoid 31MB of binaries in Git.
      # Generate locally before source/asset parity checks; production npm run
      # build has the identical prebuild hook.
      # Reuse the already populated, immutable production Core MP3 cache.
      # Same content hash, no PR cache write or fallback to old revisions:
      # source changes get a miss and regenerate the originals below.
      - name: Restore production-owned scenario MP3 cache (read-only)
        if: steps.policy.outputs.policy_only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: public/audio/mandala/scenarios
          key: hh-core-media-v1-${{ runner.os }}-${{ hashFiles('scripts/generate-scenario-melodies.mjs', 'scripts/generate-mandala-melodies.mjs', 'lib/mandala/scenario-audio-catalog.mjs', 'package-lock.json') }}
      - name: Generate original first-party melody masters
        if: steps.policy.outputs.policy_only != 'true'
        run: node scripts/generate-mandala-melodies.mjs
      - name: Generate dedicated scenario music and four classic performances
        if: steps.policy.outputs.policy_only != 'true'
        run: node scripts/generate-scenario-melodies.mjs && node scripts/generate-scenario-melodies.mjs --check
      - name: Smart Audio Concept 38-field semantic and privacy contracts
        if: steps.policy.outputs.policy_only != 'true'
        run: |
          node --check lib/mandala/video-concept-semantic.mjs
          node --check lib/mandala/auto-video-concept.mjs
          node --check lib/mandala/audio-visual-storyboard.mjs
          node --test tests/mandala-audio-smart-concept.test.mjs tests/mandala-video-concept.test.mjs
      - name: Verify 48 scenarios each have four real unique music files
        if: steps.policy.outputs.policy_only != 'true'
        run: node --test tests/mandala-scenario-audio.test.mjs
      - name: Video chat conversational intent contracts (RU/EN/ES)
        if: steps.policy.outputs.policy_only != 'true'
        run: |
          node --check lib/mandala/video-chat-understanding.mjs
          node --check lib/mandala/video-chat-tree.mjs
          node --test tests/video-chat-understanding.test.mjs tests/video-chat-tree.test.mjs tests/video-chat-contextual-understanding.test.mjs tests/video-director-chat-live-acceptance.test.mjs
          npx --no-install eslint lib/mandala/video-chat-understanding.mjs lib/mandala/video-chat-tree.mjs
      - name: Video phrase catalog deterministic content and security contracts
        if: steps.policy.outputs.policy_only != 'true'
        run: |
          node --check lib/mandala/video-phrase-catalog.mjs
          node --check app/api/holistic-support/video-phrases/route.js
          node --test tests/mandala-video-phrase-catalog.test.mjs
          npx --no-install eslint components/mandala-phrase-catalog.tsx lib/mandala/video-phrase-catalog.mjs app/api/holistic-support/video-phrases/route.js
      - name: Verify all 120 editorial scenarios map to four real soundtrack files
        if: steps.policy.outputs.policy_only != 'true'
        run: node --test tests/goal-tree-audio-playlists.test.mjs
      - name: Verify copyrighted audio cannot be silently imported as reusable tracks
        if: steps.policy.outputs.policy_only != 'true'
        run: node --test tests/import-reviewed-audio.test.mjs
      - name: Verify recording rights, provenance and deterministic audio contracts
        if: steps.policy.outputs.policy_only != 'true'
        run: |
          node --test tests/curated-audio-selection.test.mjs
          # Media tools are not installed on this fast runner. The exact same
          # release must pass full physical ffmpeg/ffprobe validation on macOS.
          node --test --test-name-pattern="five exact|remote master|source provenance|lossy source|short licensed recordings|curated rights review" tests/curated-music-wave.test.mjs
      - name: Mandala and mobile support contracts
        if: steps.policy.outputs.policy_only != 'true'
        run: node --test tests/video-chat-ai.test.mjs tests/original-motion-library.test.mjs tests/video-chat-intent.test.mjs tests/video-executable-director.test.mjs tests/video-project-v2.test.mjs tests/render-plan-v2.test.mjs tests/first-video-director.test.mjs tests/first-video-licensed-render.test.mjs tests/free-film-source-loader.test.mjs tests/video-catalog-probe.test.mjs tests/video-scenario-bindings.test.mjs tests/video-library-growth.test.mjs tests/free-film-source-clock.test.mjs tests/mandala-free-stock-sources.test.mjs tests/real-money-film-library.test.mjs tests/film-collection-v2.test.mjs tests/holistic-mandala-meditation.test.mjs tests/mandala-export.test.mjs tests/mandala-free-video.test.mjs tests/mandala-video-studio-telegram-handoff.test.mjs tests/mandala-mobile-video-design.test.mjs tests/mandala-approved-mobile-studio.test.mjs tests/mandala-workspace-tabs.test.mjs tests/personal-video-intent.test.mjs tests/mandala-sound.test.mjs tests/mandala-native-audio-files.test.mjs tests/mandala-smart-audio.test.mjs tests/mandala-audio-attach.test.mjs tests/video-affirmations.test.mjs tests/personal-guided-course.test.mjs tests/mandala-video-therapy-focus.test.mjs tests/holistic-support-meditations.test.mjs tests/holistic-support-mobile-alternative.test.mjs tests/meditation-filters.test.mjs tests/meditation-narration.test.mjs tests/personal-meditation-script.test.mjs tests/cinematic-studio.test.mjs tests/cinematic-creative-brief.test.mjs tests/video-studio-question-registry.test.mjs tests/video-ai-gpu-readiness.test.mjs tests/voice-studio.test.mjs tests/affirmation-voice.test.mjs tests/wav-pcm-mixer.test.mjs tests/mandala-webcodecs-mp4.test.mjs tests/cinematic-kling-handoff.test.mjs tests/free-film-timeline.test.mjs tests/adaptive-free-film-timeline.test.mjs tests/stage-caption-track.test.mjs tests/mandala-creative-editor-draft-history.test.mjs tests/mandala-creative-timeline.test.mjs tests/mandala-multitrack-timeline.test.mjs tests/mandala-auto-video-direct