      - 'data/video-catalog/goal-tree-audio-playlists-v1.json'
      - 'tests/mandala-audio-attach.test.mjs'
      - 'tests/meditation-filters.test.mjs'
      - 'tests/meditation-narration.test.mjs'
      - 'tests/personal-meditation-script.test.mjs'
      - 'tests/cinematic-studio.test.mjs'
      - 'scripts/cinematic-video-assemble.mjs'
      - 'scripts/video-ai-gpu-readiness.mjs'
      - 'tests/video-ai-gpu-readiness.test.mjs'
      - 'tests/mandala-auto-video-director*.test.mjs'
      - 'tests/mandala-stories-characters.test.mjs'
      - 'tests/mandala-free-scene-taxonomy.test.mjs'
      - 'tests/free-film-timeline.test.mjs'
      - 'tests/adaptive-free-film-timeline.test.mjs'
      - 'tests/stage-caption-track.test.mjs'
      - 'tests/cinematic-creative-brief.test.mjs'
      - 'tests/cinematic-kling-handoff.test.mjs'
      - 'lib/mandala/cinematic-kling-handoff.mjs'
      - 'tests/video-studio-question-registry.test.mjs'
      - '.github/workflows/holistic-support-mandala.yml'
      - 'scripts/ci-heavy-impact.mjs'
      - 'tests/ci-heavy-impact.test.mjs'
  workflow_dispatch:
    inputs:
      dareful_preview_wave:
        description: 'Generate unapproved Dareful editorial previews; no public import'
        type: choice
        required: false
        options: [none, wave1, wave2, both]
        default: none
permissions:
  contents: read
  pull-requests: read
concurrency:
  # One first-attempt group per PR lets synchronize cancel only its obsolete HEAD.
  # Manual reruns remain run-scoped; unrelated PRs never share a cancellation group.
  group: >-
    holistic-support-mandala-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.action == 'synchronize' }}
jobs:
  # Keep focused source/provider contracts on PRs; full real media/browser suite is manual-only per production policy.
  focused-unit-types-build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Classify test-only edits before expensive video build
        id: impact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HH_PR_NUMBER: ${{ github.event.pull_request.number }}
          HH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-heavy-impact.mjs mandala
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify pending Dareful editorial source rights (no network)
        run: |
          if [ -e scripts/preview-dareful-candidates.mjs ] || [ -e tests/dareful-preview-candidates.test.mjs ]; then
            test -f scripts/preview-dareful-candidates.mjs
            test -f scripts/render-dareful-candidate-masters.mjs
            test -f tests/dareful-preview-candidates.test.mjs
            test -f tests/dareful-draft-master-contract.test.mjs
            node --test tests/dareful-preview-candidates.test.mjs tests/dareful-draft-master-contract.test.mjs
          fi
      # Reuse the existing domain job; external stock previews require explicit owner dispatch.
      - name: Generate Dareful editorial previews (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dareful_preview_wave != 'none' }}
        env:
          HH_DAREFUL_WAVE: ${{ inputs.dareful_preview_wave }}
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          case "$HH_DAREFUL_WAVE" in wave1|wave2|both) ;; *) echo 'UNKNOWN_DAREFUL_EDITORIAL_WAVE' >&2; exit 1 ;; esac
          if [[ "$HH_DAREFUL_WAVE" == wave1 || "$HH_DAREFUL_WAVE" == both ]]; then
            node scripts/preview-dareful-candidates.mjs
            node scripts/render-dareful-candidate-masters.mjs
          fi
          if [[ "$HH_DAREFUL_WAVE" == wave2 || "$HH_DAREFUL_WAVE" == both ]]; then
            node scripts/preview-dareful-candidates.mjs --wave2
            node scripts/render-dareful-candidate-masters.mjs --wave2
          fi
      - name: Preserve Dareful editorial artifacts without public publishing
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.dareful_preview_wave != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: hh-dareful-editorial-preview-${{ github.run_id }}
          path: |
            artifacts/dareful-wave-previews/
            artifacts/dareful-wave-masters/
            artifacts/dareful-wave2-previews/
            artifacts/dareful-wave2-masters/
          if-no-files-found: warn
          retention-days: 7
      - name: Check browser acceptance script syntax before slow production build
        run: node --check lib/mandala/video-executable-director.mjs && node --check lib/mandala/video-chat-executable-ai.mjs && node --check app/api/holistic-support/video-director-plan/route.js && node --check lib/mandala/first-video-director.mjs && node --check lib/mandala/first-video-free-providers.mjs && node --check app/api/holistic-support/first-video-prompt/route.js && node --check lib/mandala/video-studio-question-registry.mjs && node --check scripts/import-dareful-verified-batch.mjs && node --check scripts/import-free-stock-scene.mjs && node --check lib/mandala/free-stock-sources.mjs && node --check scripts/verify-holistic-mandala-browser.mjs && node --check scripts/cinematic-video-assemble.mjs && node --check scripts/video-ai-gpu-readiness.mjs && node --check scripts/verify-affirmation-voice-browser.mjs && node --check lib/mandala/auto-video-director.mjs && node --check lib/mandala/free-film-timeline.mjs && node --check app/api/holistic-support/hypno-strategy/route.js && node --check lib/mandala/hypno-visual-overlay.mjs && node --check scripts/audit-scenario-media.mjs && node --check scripts/import-scenario-video-batch.mjs && node --check scripts/read-live-film-presets.mjs && node --check lib/mandala/scenario-soundtracks.mjs && node --check lib/mandala/video-goal-media-coverage.mjs
      # WAV masters are reproducible build output; avoid 31MB of binaries in Git.
      # Generate locally before source/asset parity checks; production npm run
      # build has the identical prebuild hook.
      - name: Generate original first-party melody masters
        run: node scripts/generate-mandala-melodies.mjs
      - name: Generate dedicated scenario music and four classic performances
        run: node scripts/generate-scenario-melodies.mjs && node scripts/generate-scenario-melodies.mjs --check
      - name: Verify 48 scenarios each have four real unique music files
        run: node --test tests/mandala-scenario-audio.test.mjs
      - name: Video chat conversational intent contracts (RU/EN/ES)
        run: |
          node --check lib/mandala/video-chat-understanding.mjs
          node --check lib/mandala/video-chat-tree.mjs
          node --test tests/video-chat-understanding.test.mjs tests/video-chat-tree.test.mjs tests/video-chat-contextual-understanding.test.mjs tests/video-director-chat-live-acceptance.test.mjs
          npx --no-install eslint lib/mandala/video-chat-understanding.mjs lib/mandala/video-chat-tree.mjs
      - name: Video phrase catalog deterministic content and security contracts
        run: |
          node --check lib/mandala/video-phrase-catalog.mjs
          node --check app/api/holistic-support/video-phrases/route.js
          node --test tests/mandala-video-phrase-catalog.test.mjs
          npx --no-install eslint components/mandala-phrase-catalog.tsx lib/mandala/video-phrase-catalog.mjs app/api/holistic-support/video-phrases/route.js
      - name: Verify all 120 editorial scenarios map to four real soundtrack files
        run: node --test tests/goal-tree-audio-playlists.test.mjs
      - name: Verify copyrighted audio cannot be silently imported as reusable tracks
        run: node --test tests/import-reviewed-audio.test.mjs
      - name: Verify reviewed external music is credited and native MP3 selection is safe
        run: node --test tests/curated-audio-selection.test.mjs
      - name: Mandala and mobile support contracts
        run: node --test tests/video-chat-ai.test.mjs tests/video-chat-intent.test.mjs tests/video-executable-director.test.mjs tests/video-project-v2.test.mjs tests/render-plan-v2.test.mjs tests/first-video-director.test.mjs tests/first-video-licensed-render.test.mjs tests/free-film-source-loader.test.mjs tests/video-catalog-probe.test.mjs tests/free-film-source-clock.test.mjs tests/mandala-free-stock-sources.test.mjs tests/real-money-film-library.test.mjs tests/film-collection-v2.test.mjs tests/holistic-mandala-meditation.test.mjs tests/mandala-export.test.mjs tests/mandala-free-video.test.mjs tests/mandala-mobile-video-design.test.mjs tests/mandala-approved-mobile-studio.test.mjs tests/mandala-workspace-tabs.test.mjs tests/personal-video-intent.test.mjs tests/mandala-sound.test.mjs tests/mandala-native-audio-files.test.mjs tests/mandala-smart-audio.test.mjs tests/mandala-audio-attach.test.mjs tests/video-affirmations.test.mjs tests/personal-guided-course.test.mjs tests/mandala-video-therapy-focus.test.mjs tests/holistic-support-meditations.test.mjs tests/holistic-support-mobile-alternative.test.mjs tests/meditation-filters.test.mjs tests/meditation-narration.test.mjs tests/personal-meditation-script.test.mjs tests/cinematic-studio.test.mjs tests/cinematic-creative-brief.test.mjs tests/video-studio-question-registry.test.mjs tests/video-ai-gpu-readiness.test.mjs tests/voice-studio.test.mjs tests/affirmation-voice.test.mjs tests/wav-pcm-mixer.test.mjs tests/mandala-webcodecs-mp4.test.mjs tests/cinematic-kling-handoff.test.mjs tests/free-film-timeline.test.mjs tests/adaptive-free-film-timeline.test.mjs tests/stage-caption-track.test.mjs tests/mandala-auto-video-director.test.mjs tests/mandala-auto-video-director-ui.test.mjs tests/mandala-free-scene-taxonomy.test.mjs tests/hypno-wave-engine.test.mjs tests/mandala-hypnocorrection-mobile.test.mjs tests/mandala-meditation-courses.test.mjs tests/meditation-course-enquiry.test.mjs tests/adaptive-meditation-course.test.mjs tests/meditation-regeneration.test.mjs tests/video-scene-match.test.mjs tests/mandala-therapy-video-intro.test.mjs tests/scenario-media-coverage.test.mjs tests/mandala-classical-melodies.test.mjs tests/mandala-scenario-media-import-contract.test.mjs tests/mandala-scenario-soundtracks.test.mjs tests/mandala-video-goal-media-coverage.test.mjs
      - name: Voice provider contract and negative cases
        run: node --check lib/mandala/voice-studio-openrouter-provider.mjs && node --test tests/voice-studio-provider.test.mjs tests/voice-studio-openrouter.test.mjs
      - name: Stories and Characters exact source acceptance
        run: |
          if [ -e components/mandala-stories-characters.tsx ] || [ -e tests/mandala-stories-characters.test.mjs ]; then
            test -f components/mandala-stories-characters.tsx
            test -f tests/mandala-stories-characters.test.mjs
            test -f lib/mandala/story-addon-catalog.ts
            node --test tests/mandala-stories-characters.test.mjs
            npx --no-install eslint components/mandala-stories-characters.tsx lib/mandala/story-addon-catalog.ts
          fi
      - name: Targeted lint
        run: npx --no-install eslint lib/mandala/video-executable-director.mjs lib/mandala/video-project-v2.mjs lib/mandala/render-plan-v2.mjs lib/mandala/video-chat-executable-ai.mjs app/api/holistic-support/video-director-plan/route.js components/mandala-video-director-chat.tsx lib/mandala/video-chat-intent.mjs lib/mandala/video-chat-ai.mjs app/api/holistic-support/video-director-chat/route.js app/api/holistic-support/first-video-prompt/route.js components/mandala-first-video-start.tsx lib/mandala/first-video-director.mjs lib/mandala/first-video-free-providers.mjs scripts/import-dareful-verified-batch.mjs scripts/import-free-stock-scene.mjs lib/mandala/free-stock-sources.mjs lib/mandala/film-collection-v2.ts lib/mandala/personal-video-intent.mjs lib/mandala/real-money-film-library.ts lib/mandala/cinematic-money-video.ts lib/mandala/holistic-video-themes.ts lib/mandala/video-affirmations.ts lib/mandala/personal-guided-course.mjs lib/mandala/local-video-music.ts lib/mandala/audio-recommendations.mjs lib/mandala/money-flow-effects.ts components/holistic-support-mobile.tsx components/mandala-free-video-studio.tsx components/mandala-video-affirmations.tsx components/mandala-hypno-compact.tsx components/mandala-guided-course.tsx components/mandala-personal-meditation.tsx lib/mandala/meditation-narration.mjs lib/mandala/meditation-narrative-blocks.mjs lib/mandala/personal-meditation-script.mjs components/mandala-cinematic-director.tsx lib/mandala/cinematic-director.mjs lib/mandala/cinematic-production.mjs lib/mandala/cinematic-creative-brief.mjs lib/mandala/video-studio-question-registry.mjs scripts/cinematic-video-assemble.mjs scripts/video-ai-gpu-readiness.mjs components/mandala-meditation-client.tsx 'app/[locale]/holistic-support/mandala/page.tsx' 'app/[locale]/holistic-support/page.tsx' lib/public-locales.ts components/mandala-cloud-voice-studio.tsx components/mandala-affirmation-voice.tsx lib/mandala/wav-pcm-mixer.mjs lib/mandala/affirmation-voice.mjs lib/mandala/voice-studio.mjs lib/mandala/voice-studio-openrouter-provider.mjs lib/mandala/voice-audio-mix.ts 'app/[locale]/holistic-support/voice-studio/route.ts' app/api/holistic-support/voice/route.js lib/mandala/hypno-wave-engine.mjs lib/mandala/cinematic-kling-handoff.mjs lib/mandala/free-film-timeline.mjs components/mandala-auto-video-director.tsx lib/mandala/auto-video-director.mjs app/api/holistic-support/hypno-strategy/route.js components/mandala-hypnocorrection-mobile.tsx components/meditation-course-enquiry.tsx
      # Mandatory Core checks exact-head TypeScript on production-bound PRs;
      # retain independent full typing for any other future event/ref.
      - name: Typecheck
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'codex/public-book-library' }}
        run: npx --no-install tsc --noEmit
      - name: Build
        if: steps.impact.outputs.browser == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'codex/voice-studio-') || startsWith(github.head_ref, 'codex/voice-mix-') || startsWith(github.head_ref, 'feat/meditation-writer-') || startsWith(github.head_ref, 'fix/video-') || startsWith(github.head_ref, 'fix/voice-picker-') || startsWith(github.head_ref, 'fix/webkit-') || startsWith(github.head_ref, 'codex/perf-video-studio-') || startsWith(github.head_ref, 'codex/hypno-third-workspace-') || startsWith(github.head_ref, 'feat/video-chat-context-understanding-'))))
        run: npm run build

      - name: Install isolated Chromium and WebKit (no external account)
        if: steps.impact.outputs.browser == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'codex/voice-studio-') || startsWith(github.head_ref, 'codex/voice-mix-') || startsWith(github.head_ref, 'feat/meditation-writer-') || startsWith(github.head_ref, 'fix/video-') || startsWith(github.head_ref, 'fix/voice-picker-') || startsWith(github.head_ref, 'fix/webkit-') || startsWith(github.head_ref, 'codex/perf-video-studio-') || startsWith(github.head_ref, 'codex/hypno-third-workspace-') || startsWith(github.head_ref, 'feat/video-chat-context-understanding-'))))
        run: |
          mkdir -p /tmp/hh-mandala-playwright
          npm install --prefix /tmp/hh-mandala-playwright --no-audit --no-fund @playwright/test@1.63.0
          ln -s /tmp/hh-mandala-playwright/node_modules/@playwright node_modules/@playwright
          /tmp/hh-mandala-playwright/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Ensure ffprobe and ffmpeg for real encoded video/audio verification
        if: steps.impact.outputs.browser == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'codex/voice-studio-') || startsWith(github.head_ref, 'codex/voice-mix-') || startsWith(github.head_ref, 'feat/meditation-writer-') || startsWith(github.head_ref, 'fix/video-') || startsWith(github.head_ref, 'fix/voice-picker-') || startsWith(github.head_ref, 'fix/webkit-') || startsWith(github.head_ref, 'codex/perf-video-studio-') || startsWith(github.head_ref, 'codex/hypno-third-workspace-') || startsWith(github.head_ref, 'feat/video-chat-context-understanding-'))))
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -n 1
          ffmpeg -version | head -n 1
      - name: Verify all 44 first-party MP4 sources, SHA-256, real codec and frame decode
        if: steps.impact.outputs.browser == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'codex/voice-studio-') || startsWith(github.head_ref, 'codex/voice-mix-') || startsWith(github.head_ref, 'feat/meditation-writer-') || startsWith(github.head_ref, 'fix/video-') || startsWith(github.head_ref, 'fix/voice-picker-') || startsWith(github.head_ref, 'fix/webkit-') || startsWith(github.head_ref, 'codex/perf-video-studio-') || startsWith(github.head_ref, 'codex/hypno-third-workspace-') || startsWith(github.head_ref, 'feat/video-chat-context-understanding-'))))
        run: node scripts/video-catalog-probe.mjs --check
      - name: Public mandala photo, PNG and video browser flow · 320/390/430px
        if: steps.impact.outputs.browser == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'codex/voice-studio-') || startsWith(github.head_ref, 'codex/voice-mix-') || startsWith(github.head_ref, 'feat/meditation-writer-') || startsWith(github.head_ref, 'fix/video-') || startsWith(github.head_ref, 'fix/voice-picker-') || startsWith(github.head_ref, 'fix/webkit-') || startsWith(github.head_ref, 'codex/perf-video-studio-') || startsWith(github.head_ref, 'codex/hypno-third-workspace-') || startsWith(github.head_ref, 'feat/video-chat-context-understanding-'))))
        env:
          HH_TEST_PUBLIC_ORIGIN: http://127.0.0.1:3100
          HH_HYPNO_SCREENSHOT_DIR: artifacts/hypno-compact
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3100 >/tmp/hh-mandala-next.log 2>&1 & NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3100/ru/holistic-support/mandala >/dev/null; then ready=1; break; fi
            echo "Waiting for local Mandala server, attempt ${i}/60" >&2
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/hh-mandala-next.log; exit 1; fi
          # Linux Chromium supports the local recorder; WebKit runs in a
          # separate macOS job with real Safari-platform media codecs.
          HH_VOICE_E2E_ENGINE=chromium node scripts/verify-affirmation-voice-browser.mjs
          HH_LIVE_VIDEO_SOURCE=http://127.0.0.1:3100 HH_LIVE_VIDEO_REQUIRE_STOCK=true \
            HH_LIVE_VIDEO_PLAYWRIGHT=/tmp/hh-mandala-playwright/node_modules/playwright/index.mjs \
            node scripts/benchmarking/first-video-live-export.mjs
          # Verify approved five-step guest course in Chromium and WebKit, no provider writes.
          node scripts/verify-practices-mobile-browser.mjs
          # On this owner-approved conversation PR, prove actual category ->
          # scenario -> phrase taps and a real downloaded moving movie.
          # No external provider, payment, photo or client payload is sent.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${GITHUB_HEAD_REF}" == feat/video-chat-context-understanding-* ]]; then
            HH_CHAT_LIVE_ORIGIN=http://127.0.0.1:3100 \
              HH_CHAT_ALLOW_LOCAL=true HH_CHAT_EXPECT_CANONICAL=true \
              HH_LIVE_VIDEO_PLAYWRIGHT=/tmp/hh-mandala-playwright/node_modules/playwright/index.mjs \
              node scripts/benchmarking/video-director-chat-live-acceptance.mjs
          fi
          # The voice release path requires dual-engine real encoded-audio QA.
          # The long all-workspaces Mandala suite remains available manually.
          # The legacy Advanced/Hypno selector and full visual workspace matrix
          # are non-blocking manual diagnostics. On PRs retain the independent
          # real Chromium encoded-media and macOS WebKit export acceptance.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/verify-hypno-wave-browser.mjs
            node scripts/verify-holistic-mandala-browser.mjs
          fi
      - name: Preserve canonical chat real-media browser evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/video-chat-context-understanding-')
        uses: actions/upload-artifact@v4
        with:
          name: hh-canonical-video-chat-${{ github.sha }}
          path: artifacts/benchmarking/video-director-chat-live-acceptance.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload synthetic audio-only iPhone screenshots
        if: always() && steps.impact.outputs.browser == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'codex/voice-studio-') || startsWith(github.head_ref, 'codex/voice-mix-') || startsWith(github.head_ref, 'feat/meditation-writer-') || startsWith(github.head_ref, 'fix/video-') || startsWith(github.head_ref, 'fix/voice-picker-') || startsWith(github.head_ref, 'fix/webkit-') || startsWith(github.head_ref, 'codex/perf-video-studio-') || startsWith(github.head_ref, 'codex/hypno-third-workspace-') || startsWith(github.head_ref, 'feat/video-chat-context-understanding-'))))
        uses: actions/upload-artifact@v4
        with:
          name: mandala-audio-mobile-${{ github.sha }}
          path: artifacts/mandala-audio/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish synthetic mobile Hypno screenshots
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: hypno-compact-mobile-screenshots
          path: |
            artifacts/hypno-compact/*.png
            artifacts/practices-mobile/*.png
          if-no-files-found: ignore
          retention-days: 3

  # Linux Playwright WebKit does not implement Canvas captureStream in this
  # runner image. Prove the *actual encoded* voice/video via WebKit on macOS,
  # the closest supported CI platform to iPhone Safari. Never mock a download.
  # Video source-clock fixes require real macOS Safari encoded-output evidence.
  voice-webkit-macos:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && (startsWith(github.head_ref, 'codex/voice-studio-') || startsWith(github.head_ref, 'codex/voice-mix-') || startsWith(github.head_ref, 'feat/meditation-writer-') || startsWith(github.head_ref, 'fix/video-') || startsWith(github.head_ref, 'fix/voice-picker-') || startsWith(github.head_ref, 'fix/voice-real-samples-') || startsWith(github.head_ref, 'fix/webkit-') || startsWith(github.head_ref, 'feat/video-phrase-catalog-') || startsWith(github.head_ref, 'codex/perf-video-studio-') || startsWith(github.head_ref, 'codex/hypno-third-workspace-') || startsWith(github.head_ref, 'codex/mandala-cancel-stale-head-cache-') || startsWith(github.head_ref, 'feat/video-chat-context-understanding-') || startsWith(github.head_ref, 'feat/hh-goal-tree-') || startsWith(github.head_ref, 'feat/video-') || github.head_ref == 'codex/professional-growth-templates-20261031') }}
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HH_TEST_PUBLIC_ORIGIN: http://127.0.0.1:3100
      HH_VOICE_E2E_ENGINE: webkit
      # Test real WebKit native compositor rather than frozen headless media.
      HH_VOICE_E2E_HEADED: '1'
      HH_EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # This CI-only PR keeps the consent-only WebKit check and encoded media gate.
      HH_VOICE_SKIP_GUIDED_PRACTICES: ${{ startsWith(github.head_ref, 'codex/mandala-cancel-stale-head-cache-') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Reuse Next compiler output across exact-HEAD retries; every run still builds.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: hh-holistic-mandala-next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            hh-holistic-mandala-next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Install and build exact voice release candidate
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # Reuse Playwright's version-pinned WebKit payload; encoded-media tests still execute.
      - name: Restore pinned Playwright WebKit browser
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: hh-holistic-mandala-webkit-${{ runner.os }}-playwright-1.63.0
      - name: Install WebKit and real media decoders
        run: |
          mkdir -p "$RUNNER_TEMP/voice-playwright"
          npm install --prefix "$RUNNER_TEMP/voice-playwright" --no-audit --no-fund @playwright/test@1.63.0
          ln -s "$RUNNER_TEMP/voice-playwright/node_modules/@playwright" node_modules/@playwright
          "$RUNNER_TEMP/voice-playwright/node_modules/.bin/playwright" install webkit
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi
      - name: WebKit recorded movie contains video and audible consented voice
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3100 >/tmp/hh-voice-macos-next.log 2>&1 & NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT
          ready=0
          for ((i=1; i<=60; i++)); do
            if curl --silent --fail http://127.0.0.1:3100/ru/holistic-support/mandala >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/hh-voice-macos-next.log; exit 1; fi
          node scripts/verify-affirmation-voice-browser.mjs
          # Exercise the actual mobile consent label with WebKit only.
          HH_PRACTICES_BROWSER_ENGINE=webkit HH_PRACTICES_CONSENT_ONLY=1 \
            node scripts/verify-practices-mobile-browser.mjs
          # Gate on the *actual* WebKit four-scene H264/AAC movie, not mock TTS.
          # Validate approved source IDs, scene order, motion, black gaps and audio.
          HH_LIVE_VIDEO_SOURCE=http://127.0.0.1:3100 \
            HH_LIVE_VIDEO_REQUIRE_STOCK=true \
            HH_LIVE_VIDEO_PLAYWRIGHT="$RUNNER_TEMP/voice-playwright/node_modules/playwright/index.mjs" \
            HH_LIVE_VIDEO_ENGINE=webkit HH_LIVE_VIDEO_HEADED=1 \
            node scripts/benchmarking/first-video-live-export.mjs
      - name: Preserve anonymous WebKit encoded video evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hh-webkit-four-scene-${{ github.sha }}
          path: artifacts/benchmarking/first-video-live-export.json
          if-no-files-found: warn
          retention-days: 7

  # Explicit owner-scoped live receipt. Unlike browser mocked TTS, this requests
  # only 3 fixed public samples via the production same-origin endpoint.
  # No secret passed to CI, no paid provider, no user text, no persisted audio.
  real-voice-provider-smoke:
    name: Real free TTS WAV for RU EN ES (owner opt-in)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && startsWith(github.head_ref, 'fix/voice-real-samples-') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    concurrency:
      group: hh-real-voice-samples-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate no-PII synthetic receipt contract
        run: |
          node --check scripts/verify-live-voice-provider.mjs
          node --test tests/voice-live-provider-smoke.test.mjs
      - name: Verify actual three-language no-charge WAV response from LIVE
        env:
          HH_VOICE_LIVE_SMOKE_OWNER_APPROVED: 'true'
        run: node scripts/verify-live-voice-provider.mjs
