name: HH PR Control Tower queue dispatcher
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_run:
    workflows:
      - 'HH PR source Repair Worker'
      - 'HH zero-cost PR CI worker'
    types: [completed]
  push:
    branches: ['codex/bootstrap-books']
    paths:
      - '.github/workflows/hh-pr-queue-dispatcher.yml'
      - 'scripts/ci-pr-queue-dispatcher.cjs'
      - 'scripts/ci-pr-ci-legacy-recovery.cjs'
      - 'scripts/ci-pr-task-state.cjs'
      - 'scripts/ci-pr-capacity.cjs'
      - 'scripts/ci-pr-api-quota.cjs'
      - 'tests/ci-pr-control-tower.test.cjs'
      - 'tests/ci-pr-ci-legacy-recovery.test.cjs'
      - 'tests/ci-pr-core-priority.test.cjs'
  pull_request:
    branches: ['codex/bootstrap-books']
    paths:
      - 'scripts/ci-pr-task-state.cjs'
      - 'scripts/ci-pr-capacity.cjs'
      - 'scripts/ci-pr-queue-dispatcher.cjs'
      - 'scripts/ci-pr-ci-legacy-recovery.cjs'
      - 'tests/ci-pr-api-quota.test.cjs'
      - 'tests/ci-pr-control-tower.test.cjs'
      - 'tests/ci-pr-ci-legacy-recovery.test.cjs'
      - 'tests/ci-pr-core-priority.test.cjs'
      - '.github/workflows/hh-pr-queue-dispatcher.yml'
      - 'scripts/ci-pr-ci-worker.cjs'
      - 'scripts/ci-pr-repair-worker.cjs'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Audit queue only; no labels, reservations or worker dispatch'
        type: boolean
        default: true
        required: false
      completion_wake:
        description: 'Delay a worker-completion wake until its slot is released'
        type: boolean
        default: false
        required: false
      worker_run_id:
        description: 'Originating trusted worker run for completion wake'
        type: string
        default: ''
        required: false
permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write
  checks: read
jobs:
  contract:
    if: github.event_name == 'pull_request'
    concurrency:
      group: hh-control-contract-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate queue contracts without secrets
        run: |
          node --check scripts/ci-pr-task-state.cjs
          node --check scripts/ci-pr-api-quota.cjs
          node --check scripts/ci-pr-capacity.cjs
          node --check scripts/ci-pr-queue-dispatcher.cjs
          node --check scripts/ci-pr-ci-legacy-recovery.cjs
          node --check scripts/ci-pr-ci-worker.cjs
          node --check tests/ci-pr-core-priority.test.cjs
          node --test tests/ci-pr-api-quota.test.cjs tests/ci-pr-ci-legacy-recovery.test.cjs tests/ci-pr-control-tower.test.cjs tests/ci-pr-core-priority.test.cjs tests/ci-pr-ci-worker.test.cjs
  completion-wait:
    # Wait outside the writer lease: a later schedule event must not replace
    # a queued completion wake before the worker has actually exited.
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.ref == 'refs/heads/codex/bootstrap-books' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.completion_wake == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: hh-control-wait-${{ github.event.inputs.worker_run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout trusted completion handoff
        uses: actions/checkout@v4
        with:
          ref: codex/bootstrap-books
          persist-credentials: false
      - name: Wait for actual worker completion and relay one wake
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {relayCompletionWake}=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-pr-control-tower-wakeup.cjs');
            const result=await relayCompletionWake({github,context,log:core.warning});
            core.info('HH_WORKER_COMPLETION_RELAY '+result);
            if(result!=='DISPATCH_ACCEPTED')core.warning('Refill deferred: '+result);
  dispatch:
    # Ignore non-actionable upstream completions without reserving a runner.
    # An independent per-PR contract concurrency lane is retained above.
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.ref == 'refs/heads/codex/bootstrap-books' &&
      !(github.event_name == 'workflow_dispatch' && github.event.inputs.completion_wake == 'true') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.status == 'completed' &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.conclusion != 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: hh-control-tower-single-writer
      cancel-in-progress: false
    steps:
      - name: Checkout only trusted default branch
        uses: actions/checkout@v4
        with:
          ref: codex/bootstrap-books
          persist-credentials: false
          fetch-depth: 1
      # The complete contract suite runs in the separate read-only PR job.
      # A stale test assertion must not stop a 10-minute live dispatcher tick.
      - name: Verify trusted dispatcher syntax before live work
        run: |
          node --check scripts/ci-pr-task-state.cjs
          node --check scripts/ci-pr-capacity.cjs
          node --check scripts/ci-pr-queue-dispatcher.cjs
          node --check scripts/ci-pr-ci-legacy-recovery.cjs
          node --check scripts/ci-pr-ci-worker.cjs
      - name: Select one bounded PR worker per free lane and record a task receipt
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {run,wakeDirectionWatcher}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-queue-dispatcher.cjs');
            const input=String(context.payload.inputs?.dry_run ?? 'false')==='true';
            const dryRun=context.eventName==='push'||input;
            // Trust checks inside run() and exact-HEAD check before each mutation.
            // Push is audit-only; cron and completed trusted worker events are live.
            const summary=await run({github,core,context,dryRun});
            // Single-writer event fallback: once per 11+ minute inactivity,
            // never if Direction Watcher is queued/running. Does not create PR
            // checks, edit source or pretend that GitHub cron delivered events.
            await wakeDirectionWatcher({github,core,context,dryRun});
            // GitHub may silently delay schedule. A verified cron gap can
            // dispatch the existing guarded Watchdog, without changing source,
            // production protection or the single-writer queue lease.
            const {wakeStaleWatchdog}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-control-tower-wakeup.cjs');
            await wakeStaleWatchdog({github,context,summary,dryRun,log:core.info});