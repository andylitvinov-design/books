name: HH PR Control Tower queue dispatcher
on:
  schedule:
    - cron: '7 * * * *'
  # Worker results now wake Watchdog directly; Control Tower observes hourly.
  push:
    branches: ['codex/bootstrap-books']
    paths:
      - '.github/workflows/hh-pr-queue-dispatcher.yml'
      - 'scripts/ci-pr-queue-dispatcher.cjs'
      - 'scripts/ci-pr-ci-wake-reconcile.cjs'
      - 'tests/ci-pr-ci-wake-reconcile.test.cjs'
      - 'scripts/ci-pr-ci-legacy-recovery.cjs'
      - 'scripts/ci-pr-task-state.cjs'
      - 'scripts/ci-pr-capacity.cjs'
      - 'scripts/ci-pr-api-quota.cjs'
      - 'tests/ci-pr-control-tower.test.cjs'
      - 'tests/ci-pr-ci-legacy-recovery.test.cjs'
      - 'tests/ci-pr-core-priority.test.cjs'
  pull_request:
    branches: ['codex/bootstrap-books']
    paths:
      - 'scripts/ci-pr-task-state.cjs'
      - 'scripts/ci-pr-capacity.cjs'
      - 'scripts/ci-pr-queue-dispatcher.cjs'
      - 'scripts/ci-pr-ci-wake-reconcile.cjs'
      - 'tests/ci-pr-ci-wake-reconcile.test.cjs'
      - 'scripts/ci-pr-ci-legacy-recovery.cjs'
      - 'tests/ci-pr-api-quota.test.cjs'
      - 'tests/ci-pr-control-tower.test.cjs'
      - 'tests/ci-pr-ci-legacy-recovery.test.cjs'
      - 'tests/ci-pr-core-priority.test.cjs'
      - '.github/workflows/hh-pr-queue-dispatcher.yml'
      - 'scripts/ci-pr-ci-worker.cjs'
      - 'scripts/ci-pr-repair-worker.cjs'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Audit queue only; no labels, reservations or worker dispatch'
        type: boolean
        default: true
        required: false
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  checks: read
jobs:
  contract:
    if: github.event_name == 'pull_request'
    concurrency:
      group: hh-control-contract-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate queue contracts without secrets
        run: |
          node --check scripts/ci-pr-task-state.cjs
          node --check scripts/ci-pr-api-quota.cjs
          node --check scripts/ci-pr-capacity.cjs
          node --check scripts/ci-pr-queue-dispatcher.cjs
          node --check scripts/ci-pr-ci-wake-reconcile.cjs
          node --check tests/ci-pr-ci-wake-reconcile.test.cjs
          node --check scripts/ci-pr-ci-legacy-recovery.cjs
          node --check scripts/ci-pr-ci-worker.cjs
          node --check tests/ci-pr-core-priority.test.cjs
          node --test tests/ci-pr-api-quota.test.cjs tests/ci-pr-ci-legacy-recovery.test.cjs tests/ci-pr-control-tower.test.cjs tests/ci-pr-ci-wake-reconcile.test.cjs tests/ci-pr-core-priority.test.cjs tests/ci-pr-ci-worker.test.cjs
  observe:
    # Legacy workflow name retained for existing monitor references.
    # This job has no write permission and cannot reserve or dispatch tasks.
    if: >-
      github.repository == 'andylitvinov-design/books' &&
      github.ref == 'refs/heads/codex/bootstrap-books' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: hh-control-tower-observer
      cancel-in-progress: false
    steps:
      - name: Checkout trusted observer only
        uses: actions/checkout@v4
        with:
          ref: codex/bootstrap-books
          persist-credentials: false
      - name: Audit the exact-HEAD queue without mutation
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {run}=require(process.env.GITHUB_WORKSPACE+
              '/scripts/ci-pr-queue-dispatcher.cjs');
            const outcome=await run({github,core,context,dryRun:true});
            core.info('HH_CONTROL_OBSERVER_ONLY '+JSON.stringify({
              candidates:outcome.candidates,
              wouldDispatch:outcome.wouldDispatch,
              blocked:outcome.blocked,
              reason:outcome.reason
            }));
