name: R1 prepare reviewed source tree (no ref writes)
on:
  push:
    branches: ['codex/holistic-house-app-r1']
    paths: ['.github/workflows/hh-app-source-review.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'andylitvinov-design/books' && github.ref == 'refs/heads/codex/holistic-house-app-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: npm install --prefix /tmp/hh-format --no-audit --no-fund prettier@3.6.2
      - run: node scripts/r1-source-review.mjs
      - run: npm run test:app && npm run lint
      - name: Create immutable reviewed tree, leaving all refs unchanged
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const files = cp.execFileSync('git',['diff','--name-only','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
            const allowed = /^(components\/app\/|lib\/(app|assessments|profile)\/|data\/assessments\/|app\/(api\/app|admin\/app-requests|\[locale\]\/app)\/|tests\/app-|data\/app-services\.js$|package\.json$|\.github\/workflows\/hh-app-browser\.yml$)/;
            if (files.some(p=>!allowed.test(p))) throw new Error('Unexpected modified path');
            const tree = [];
            for (const path of files) {
              const blob = await github.rest.git.createBlob({...context.repo,content:fs.readFileSync(path,'utf8'),encoding:'utf-8'});
              tree.push({path,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            for (const path of ['.github/workflows/hh-app-source-review.yml','.github/workflows/hh-app-source-audit.yml','scripts/r1-source-review.mjs']) tree.push({path,mode:'100644',type:'blob',sha:null});
            const base_tree = cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
            const result = await github.rest.git.createTree({...context.repo,base_tree,tree});
            core.info('R1_REVIEWED_TREE_SHA='+result.data.sha);
            await core.summary.addHeading('Reviewed source tree; no refs changed').addCodeBlock(result.data.sha).addRaw('Base commit: '+context.sha+'\nFiles: '+files.length).write();
