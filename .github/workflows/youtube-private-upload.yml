name: English video pipeline
on:
  pull_request:
    paths:
      - 'scripts/video-publish/**'
      - 'tests/*video*pipeline*.mjs'
      - 'tests/youtube-private-upload.test.mjs'
      - '.github/workflows/youtube-private-upload.yml'
      - '.video-jobs/README.md'
  push:
    branches: ['codex/bootstrap-books']
    paths:
      - '.video-jobs/*.json'
      - 'scripts/video-publish/**'
      - '.github/workflows/youtube-private-upload.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: youtube-en-private-upload
  cancel-in-progress: false
jobs:
  test:
    name: Validate pipeline safety
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: |
          node --test tests/youtube-private-upload.test.mjs tests/video-pipeline-safety.test.mjs
          for file in scripts/video-publish/*.mjs; do node --check "$file"; done
  pipeline:
    name: Verify connection before approved uploads
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/bootstrap-books'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_YOUTUBE_CLIENT_ID: ${{ secrets.GOOGLE_YOUTUBE_CLIENT_ID }}
      GOOGLE_YOUTUBE_CLIENT_SECRET: ${{ secrets.GOOGLE_YOUTUBE_CLIENT_SECRET }}
      GOOGLE_YOUTUBE_REFRESH_TOKEN: ${{ secrets.GOOGLE_YOUTUBE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_ARCHIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_ARCHIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Read-only OAuth and English-channel preflight
        id: preflight
        continue-on-error: true
        run: node scripts/video-publish/preflight-pipeline.mjs
      - name: Upload only newly added approved jobs
        if: github.event_name == 'push' && steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=A HEAD^ HEAD -- '.video-jobs/*.json' > /tmp/approved-video-jobs
          while IFS= read -r job; do
            test -n "$job" || continue
            node scripts/video-publish/upload-youtube-private.mjs "$job"
          done < /tmp/approved-video-jobs
      - name: Save sanitized readiness and recovery results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: video-pipeline-${{ github.run_id }}
          # This exact path contains sanitized reports only, never credentials/media.
          path: .video-results/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Report an inactive connection truthfully
        if: steps.preflight.outcome != 'success'
        run: |
          echo 'Pipeline is not activated. Read preflight.json; no video was downloaded or uploaded.'
          exit 1
