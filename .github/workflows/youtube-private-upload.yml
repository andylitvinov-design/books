name: English YouTube Private Upload

on:
  pull_request:
    paths:
      - 'scripts/video-publish/**'
      - 'tests/youtube-private-upload.test.mjs'
      - '.github/workflows/youtube-private-upload.yml'
      - '.video-jobs/README.md'
  push:
    branches:
      - 'codex/bootstrap-books'
    paths:
      - '.video-jobs/*.json'

permissions:
  contents: read

concurrency:
  group: youtube-en-private-upload
  cancel-in-progress: false

jobs:
  test:
    name: Validate uploader
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/youtube-private-upload.test.mjs

  upload:
    name: Upload new job to @aatapro as Private
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_YOUTUBE_CLIENT_ID: ${{ secrets.GOOGLE_YOUTUBE_CLIENT_ID }}
      GOOGLE_YOUTUBE_CLIENT_SECRET: ${{ secrets.GOOGLE_YOUTUBE_CLIENT_SECRET }}
      GOOGLE_YOUTUBE_REFRESH_TOKEN: ${{ secrets.GOOGLE_YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_ENGLISH_EXPECTED_HANDLE: '@aatapro'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check OAuth secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_YOUTUBE_CLIENT_ID"
          test -n "$GOOGLE_YOUTUBE_CLIENT_SECRET"
          test -n "$GOOGLE_YOUTUBE_REFRESH_TOKEN"

      - name: Upload newly added video jobs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jobs < <(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$GITHUB_SHA" -- '.video-jobs/*.json')
          if [ "${#jobs[@]}" -eq 0 ]; then
            echo "No newly added video job JSON files in this commit."
            exit 0
          fi
          for job in "${jobs[@]}"; do
            echo "Processing $job"
            node scripts/video-publish/upload-youtube-private.mjs "$job"
          done

      - name: Save upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-private-${{ github.run_id }}
          path: .video-results/*.json
          if-no-files-found: ignore
          retention-days: 7
