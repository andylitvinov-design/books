name: Check Holistic House video public embed
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/check-holistic-video-embed.yml'
permissions:
  contents: read
jobs:
  check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated public-page browser test
        run: |
          mkdir -p /tmp/holistic-video-check
          cd /tmp/holistic-video-check
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Verify playback without login or cookies
        working-directory: /tmp/holistic-video-check
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          await fs.mkdir('report', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1280, height: 800 } });
          const page = await context.newPage();
          const report = { signedIn: false, urls: [] };
          for (const [name, url] of [
            ['embed', 'https://app.heygen.com/embeds/fd5fcead9b067f9a0649862675a38771'],
            ['share', 'https://app.heygen.com/share/fd5fcead9b067f9a0649862675a38771']
          ]) {
            const result = { name, requestedUrl: url };
            try {
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
              result.status = response?.status();
              result.frameHeaders = { xFrameOptions: response?.headers()['x-frame-options'], csp: response?.headers()['content-security-policy'] };
              await page.waitForTimeout(12000);
              result.currentUrl = page.url();
              result.bodyText = (await page.locator('body').innerText()).slice(0, 5000);
              result.videos = [];
              for (const frame of page.frames()) {
                const states = await frame.locator('video').evaluateAll(async videos => {
                  const results = [];
                  for (const video of videos) {
                    video.muted = true;
                    let error;
                    try { await Promise.race([video.play(), new Promise((_, reject) => setTimeout(() => reject(new Error('Play timed out')), 10000))]); }
                    catch (e) { error = String(e.message); }
                    const start = video.currentTime;
                    await new Promise(resolve => setTimeout(resolve, 3000));
                    results.push({ readyState: video.readyState, duration: video.duration, currentTime: video.currentTime, progressed: video.currentTime > start + 0.5, width: video.videoWidth, height: video.videoHeight, error, mediaError: video.error?.code });
                  }
                  return results;
                });
                result.videos.push(...states);
              }
              await page.screenshot({ path: `report/${name}.png`, fullPage: false });
            } catch (error) { result.error = String(error.message); }
            report.urls.push(result);
          }
          await browser.close();
          await fs.writeFile('report/public-playback.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holistic-video-public-playback
          path: /tmp/holistic-video-check/report/
          retention-days: 1
          if-no-files-found: warn
