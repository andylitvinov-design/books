name: Holistic House conversation entry verification
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'components/home-conversation-guide.*'
      - 'components/holistic-house-home.tsx'
      - 'app/es/page.tsx'
      - 'lib/home-conversation.*'
      - 'tests/home-conversation-guide.test.mjs'
      - '.github/workflows/hh-home-conversation.yml'
  push:
    branches: ['codex/public-book-library']
    paths:
      - 'components/home-conversation-guide.*'
      - 'components/holistic-house-home.tsx'
      - 'app/es/page.tsx'
      - 'lib/home-conversation.*'
      - 'tests/home-conversation-guide.test.mjs'
      - '.github/workflows/hh-home-conversation.yml'
permissions:
  contents: read
concurrency:
  group: hh-home-conversation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Localized conversation, topic routing and existing carousel regressions
        run: node --test tests/home-conversation-guide.test.mjs tests/ideas-guidance.test.mjs tests/home-section-carousel.test.mjs tests/home-carousel-first-screen-cta.test.mjs
      - name: Check affected TypeScript and React UI
        run: |
          npx tsc --noEmit
          npx eslint components/home-conversation-guide.tsx components/holistic-house-home.tsx app/es/page.tsx
      - name: Build with the project's production dependencies
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
