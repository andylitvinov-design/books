name: HH loose release-ready ruleset (one-time)
on:
  push:
    branches: ['codex/public-book-library']
    paths:
      - '.github/workflows/hh-loose-release-ready-once.yml'
      - '.github/workflows/hh-pr-core-release.yml'
      - 'scripts/ci-quick-route.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hh-loose-release-ruleset-once
  cancel-in-progress: false
jobs:
  relax-ruleset:
    if: github.repository == 'andylitvinov-design/books' && github.ref == 'refs/heads/codex/public-book-library'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Switch only strict base synchronization off
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HH_AUTOMERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo 'HH_AUTOMERGE_TOKEN is unavailable; no ruleset change was made' >&2; exit 1; }
          current="$(mktemp)"
          patched="$(mktemp)"
          observed="$(mktemp)"
          trap 'rm -f "$current" "$patched" "$observed"' EXIT

          # Use a repo-scoped admin-authorized token; the Actions GITHUB_TOKEN
          # cannot administer branch rulesets. Never expose the secret.
          gh api "repos/$GH_REPO/rulesets/26269892" > "$current"

          # Fail closed if the owner changed the ruleset since the 2026-10-31
          # audit: keep exactly release-ready, protection against deletion and
          # force pushes, zero human approvals and review-thread resolution.
          jq -e '
            .target == "branch" and .enforcement == "active" and
            .conditions.ref_name.include == ["refs/heads/codex/public-book-library"] and
            .conditions.ref_name.exclude == [] and
            .bypass_actors == [] and
            ([.rules[].type] | sort) == ["deletion","non_fast_forward","pull_request","required_status_checks"] and
            ([.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks] ==
              [[{"context":"release-ready","integration_id":15368}]]) and
            ([.rules[] | select(.type == "pull_request") |
              (.parameters.required_approving_review_count == 0 and
               .parameters.required_review_thread_resolution == true and
               .parameters.allowed_merge_methods == ["squash"])] == [true])
          ' "$current" > /dev/null || {
            echo 'Ruleset differs from verified protection contract. No changes made.' >&2
            exit 1
          }

          # Preserve every existing rule and parameter, modifying only one
          # boolean. This avoids rerunning full checks after unrelated base
          # merges; failed/missing required release-ready still blocks merge.
          jq '{
            name, target, enforcement, conditions, bypass_actors,
            rules: (.rules | map(
              if .type == "required_status_checks"
              then .parameters.strict_required_status_checks_policy = false
              else .
              end
            ))
          }' "$current" > "$patched"
          gh api --method PUT "repos/$GH_REPO/rulesets/26269892" --input "$patched" > /dev/null
          gh api "repos/$GH_REPO/rulesets/26269892" > "$observed"
          jq -e '
            .enforcement == "active" and
            (.rules | any(.type == "deletion")) and
            (.rules | any(.type == "non_fast_forward")) and
            (.rules | any(.type == "pull_request" and .parameters.required_review_thread_resolution == true)) and
            (.rules | any(.type == "required_status_checks" and
              .parameters.strict_required_status_checks_policy == false and
              (.parameters.required_status_checks | map(.context) == ["release-ready"])))
          ' "$observed" > /dev/null
          echo "GitHub ruleset 26269892 is LOOSE; release-ready, protected branch and unresolved-review gates remain enforced." >> "$GITHUB_STEP_SUMMARY"
