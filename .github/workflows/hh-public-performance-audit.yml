name: Holistic House public TTFB and media audit
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'scripts/measure-hh-public-ttfb.mjs'
      - 'scripts/hh-public-html-metrics.mjs'
      - 'tests/hh-public-html-metrics.test.mjs'
      - 'components/personal-testimonials.tsx'
      - 'components/home-testimonial-more.tsx'
      - 'components/services-studio-extras.tsx'
      - 'tests/personal-testimonials.test.mjs'
      - 'tests/home-testimonial-lazy-disclosure.test.mjs'
      - 'components/services-solutions.tsx'
      - 'components/services-studio-offers.tsx'
      - 'tests/holistic-house-image-quota.test.mjs'
      - 'components/holistic-house-home.tsx'
      - 'components/home-more-disclosure.tsx'
      - 'tests/home-rsc-on-demand.test.mjs'
      - 'components/home-section-carousel.tsx'
      - 'components/services-conversion-hero.module.css'
      - 'tests/home-carousel-first-screen-cta.test.mjs'
      - 'components/home-intro-video-section.tsx'
      - 'app/holistic-house-home.css'
      - 'app/page.tsx'
      - 'app/[locale]/page.tsx'
      - 'app/es/page.tsx'
      - 'app/es/services/page.tsx'
      - 'tests/holistic-house-speed-and-cta.test.mjs'
      - 'tests/holistic-house-home-streaming.test.mjs'
      - 'tests/public-consultation-cta-design.test.mjs'
      - 'components/public-consultation-cta.tsx'
      - 'app/[locale]/services/page.tsx'
      - 'next.config.ts'
      - 'app/layout.tsx'
      - 'components/home-dialogue-entry.tsx'
      - 'components/sitewide-lead-capture-deferred.tsx'
      - 'components/home-deferred-sections.tsx'
      - 'components/home-deferred-content.tsx'
      - 'tests/home-css-isolation.test.mjs'
      - 'scripts/measure-home-css-network.mjs'
      - 'scripts/report-home-mobile-compare.mjs'
      - 'tests/home-mobile-compare.test.mjs'
      - 'scripts/verify-home-browser-parity.mjs'
      - 'scripts/build-public-home-documents.mjs'
      - 'scripts/home-deferred-css.mjs'
      - 'tests/public-home-document-build.test.mjs'
      - 'tests/public-home-document-delivery.test.mjs'
      - '.github/workflows/hh-public-performance-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Obsolete PR heads may cancel; explicit post-LIVE manual audits remain independent.
  group: hh-public-performance-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.action == 'synchronize' }}

jobs:
  measure-public:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false || startsWith(github.event.pull_request.title, 'perf(home):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check first-screen CSS isolation and hero preloads
        run: node --test tests/home-css-isolation.test.mjs tests/home-mobile-compare.test.mjs
      - name: Validate targeted safety and booking contracts
        run: node --test tests/holistic-house-image-quota.test.mjs tests/hh-public-html-metrics.test.mjs tests/holistic-house-speed-and-cta.test.mjs tests/holistic-house-home-streaming.test.mjs tests/home-carousel-first-screen-cta.test.mjs tests/home-rsc-on-demand.test.mjs tests/public-consultation-cta-design.test.mjs tests/consultation-capture-choice.test.mjs tests/personal-testimonials.test.mjs
      - name: Stage checksum-verified FFmpeg before npm lifecycle
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'perf(home):') }}
        uses: ./.github/actions/ci-ffmpeg-static
      - name: Install exact lockfile dependencies
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'perf(home):') }}
        run: npm ci --no-audit --no-fund
      - name: Materialize checksum-verified FFmpeg after npm install
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'perf(home):') }}
        uses: ./.github/actions/ci-ffmpeg-static
        with:
          stage: materialize
      - name: Validate compiled anonymous home delivery and strict CSP contract
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'perf(home):') }}
        run: node --test tests/public-home-document-build.test.mjs tests/public-home-document-delivery.test.mjs
      - name: Check full production build of Draft performance PR
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'perf(home):') }}
        run: |
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Measure stylesheet requests and document payloads on the exact PR build
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'perf(home):') }}
        shell: bash
        run: |
          set -euo pipefail
          PORT=3399 HOSTNAME=127.0.0.1 npm start >/tmp/hh-home-css.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..35}; do
            if curl -fsS -o /dev/null http://127.0.0.1:3399/; then break; fi
            printf 'Home response readiness attempt %s\n' "$attempt"
            sleep 1
          done
          node scripts/measure-home-css-network.mjs http://127.0.0.1:3399 | tee /tmp/hh-home-css-metrics.json
          HH_PUBLIC_HOME_TEST_ORIGIN=http://127.0.0.1:3399 node --test tests/public-home-document-delivery.test.mjs
          { echo '## Homepage network first paint (uncompressed)'; echo '```json'; cat /tmp/hh-home-css-metrics.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build exact protected PR BASE in isolated local worktree for fair Lighthouse comparison
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'perf(home):') }}
        timeout-minutes: 16
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          # The event payload can retain the old stacked base after a retarget.
          # Use the first parent of the exact checkout merge commit instead.
          mapfile -t parents < <(git cat-file -p HEAD | sed -n 's/^parent //p')
          [[ "${#parents[@]}" -eq 2 ]] || { echo 'Expected checked-out PR merge commit'; exit 1; }
          PR_BASE_SHA="${parents[0]}"
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "$EVENT_BASE_SHA" != "$PR_BASE_SHA" ]]; then
            echo "::warning::Event base $EVENT_BASE_SHA differs from actual checkout parent $PR_BASE_SHA"
          fi
          printf 'Actual baseline %s; candidate merge %s; PR head %s\n' "$PR_BASE_SHA" "$(git rev-parse HEAD)" "${parents[1]}"
          mkdir -p artifacts/home-perf
          printf '{"baseline":"%s","candidateMerge":"%s","candidateHead":"%s","eventBase":"%s"}\n' "$PR_BASE_SHA" "$(git rev-parse HEAD)" "${parents[1]}" "$EVENT_BASE_SHA" > artifacts/home-perf/source-shas.json
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          baseline_dir="$RUNNER_TEMP/hh-home-baseline"
          git worktree add --detach "$baseline_dir" "$PR_BASE_SHA"
          # Share node_modules only for identical lockfiles. Otherwise install
          # BASE's own dependency tree from the existing npm cache offline.
          # The FFmpeg binary remains the exact checksum-verified CI binary.
          if cmp -s package-lock.json "$baseline_dir/package-lock.json"; then
            ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline_dir/node_modules"
          else
            binary="$GITHUB_WORKSPACE/node_modules/ffmpeg-static/ffmpeg"
            echo "e7e7fb30477f717e6f55f9180a70386c62677ef8a4d4d1a5d948f4098aa3eb99  $binary" | sha256sum --check --status
            (cd "$baseline_dir" && FFMPEG_BIN="$binary" npm ci --offline --no-audit --no-fund)
            [[ "$(node -p "require('$baseline_dir/node_modules/ffmpeg-static/package.json').version")" == '5.3.0' ]]
            install -m 755 "$binary" "$baseline_dir/node_modules/ffmpeg-static/ffmpeg"
            echo "e7e7fb30477f717e6f55f9180a70386c62677ef8a4d4d1a5d948f4098aa3eb99  $baseline_dir/node_modules/ffmpeg-static/ffmpeg" | sha256sum --check --status
          fi
          (cd "$baseline_dir" && npm run build)
      - name: Compare protected BASE vs current PR on same local transport (mobile Lighthouse 13.6)
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'perf(home):') }}
        timeout-minutes: 27
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          mkdir -p artifacts/home-perf
          # Both versions are now Next production builds on the SAME runner,
          # same http/1.1, same uncompressed response headers, same Chrome.
          # The previous LIVE-CDN-vs-local comparison mixed HTTP/2 and HTTP/1.1.
          baseline_dir="$RUNNER_TEMP/hh-home-baseline"
          [[ -d "$baseline_dir/.next" ]] || { echo 'Exact BASE build missing'; exit 1; }
          PORT=3398 HOSTNAME=127.0.0.1 npm start --prefix "$baseline_dir" >/tmp/hh-home-base-server.log 2>&1 &
          baseline_pid=$!
          PORT=3399 HOSTNAME=127.0.0.1 npm start >/tmp/hh-home-lh-server.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" "$baseline_pid" 2>/dev/null || true' EXIT
          for target in 3398 3399; do
            ready=false
            for attempt in {1..35}; do
              if curl -fsS -o /dev/null "http://127.0.0.1:$target/"; then ready=true; break; fi
              printf 'Lighthouse port %s readiness attempt %s\n' "$target" "$attempt"
              sleep 1
            done
            if [[ "$ready" != true ]]; then
              tail -60 /tmp/hh-home-base-server.log /tmp/hh-home-lh-server.log
              exit 1
            fi
          done
          # Github's system Chrome can exit before chrome-launcher discovers the
          # dynamic debugging port. Validate CDP up front, before 12 audit runs.
          check_chrome() {
            local binary="$1"
            local profile
            profile="$(mktemp -d)"
            "$binary" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
              --remote-debugging-port=9223 --user-data-dir="$profile" about:blank \
              >/tmp/hh-chrome-smoke.log 2>&1 &
            local chrome_pid=$!
            local ready=false
            for check in {1..15}; do
              if curl -fsS --max-time 1 http://127.0.0.1:9223/json/version >/dev/null 2>&1; then
                ready=true
                break
              fi
              printf 'CDP readiness attempt %s\n' "$check"
              sleep 1
            done
            kill "$chrome_pid" 2>/dev/null || true
            wait "$chrome_pid" 2>/dev/null || true
            rm -rf "$profile"
            if [[ "$ready" == true ]]; then return 0; fi
            tail -50 /tmp/hh-chrome-smoke.log || true
            return 1
          }
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [[ -z "$CHROME_PATH" ]] || ! check_chrome "$CHROME_PATH"; then
            echo 'System Chrome unavailable for CDP; install pinned Playwright Chromium on GitHub runner.'
            npx --yes playwright@1.63.0 install --with-deps chromium
            CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | sort | tail -1)"
            [[ -x "$CHROME_PATH" ]] || { echo 'Pinned Chromium executable missing'; exit 1; }
            check_chrome "$CHROME_PATH" || { echo 'Chromium CDP smoke test failed'; exit 1; }
          fi
          export CHROME_PATH
          "$CHROME_PATH" --version
          for pass in 1 2; do
            for lang in en ru es; do
              path="/"
              if [[ "$lang" != en ]]; then path="/$lang"; fi
              for candidate in before after; do
                origin="http://127.0.0.1:3398"
                if [[ "$candidate" == after ]]; then origin="http://127.0.0.1:3399"; fi
                echo "Lighthouse 13.6: $candidate $lang pass=$pass (mobile simulated slow 4G)"
                timeout 135s npx --yes lighthouse@13.6.0 "$origin$path" \
                  --quiet --port=9222 --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu" \
                  --only-categories=performance --throttling-method=simulate \
                  --output=json --output-path="artifacts/home-perf/$candidate-$lang-$pass.json"
              done
            done
          done
          node scripts/report-home-mobile-compare.mjs artifacts/home-perf
          # Separate applied network/CPU throttling, not a replacement for PSI.
          npm install --prefix "$RUNNER_TEMP/hh-home-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.63.0
          HH_PLAYWRIGHT_MODULE="$RUNNER_TEMP/hh-home-browser/node_modules/playwright/index.mjs" \
            node scripts/verify-home-browser-parity.mjs artifacts/home-perf
      - name: Save matched slow-4G evidence for first-screen release review
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'perf(home):')
        uses: actions/upload-artifact@v4
        with:
          name: hh-home-lighthouse-${{ github.run_id }}
          path: artifacts/home-perf/
          if-no-files-found: ignore
          retention-days: 7
      - name: Measure public TTFB and HTML/RSC size (no login, no private routes)
        # PR runs validate source only; the live production alias is not that PR.
        # Explicit manual audits check actual hourly LIVE rather than the stale alias after merge.
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TTFB_SAMPLES: '7'
          HH_HTML_WARN_KIB: '120'
          HH_INLINE_WARN_KIB: '60'
        run: |
          node scripts/measure-hh-public-ttfb.mjs https://holistichouse.vercel.app | tee hh-public-ttfb.txt
          {
            echo '## Public EN/RU/ES TTFB and HTML/RSC payload audit'
            echo 'TTFB is measured independently of decoded HTML bytes, inline scripts and Next RSC payload, including decoded Flight chunks and safe size bands. Warning budgets are observational, not CI failures; not Lighthouse, LCP, or transferred/compressed bytes.'
            echo '```json'
            cat hh-public-ttfb.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hh-public-ttfb-${{ github.run_id }}
          path: hh-public-ttfb.txt
          if-no-files-found: ignore
          retention-days: 7
