name: Holistic House public TTFB and media audit
on:
  pull_request:
    paths:
      - '.github/workflows/hh-public-performance-audit.yml'
      - 'scripts/measure-hh-public-ttfb.mjs'
      - 'scripts/hh-public-html-metrics.mjs'
      - 'tests/hh-public-html-metrics.test.mjs'
      - 'components/site-video-player.tsx'
      - 'components/personal-testimonials.tsx'
      - 'components/home-testimonial-more.tsx'
      - 'components/services-studio-extras.tsx'
      - 'tests/personal-testimonials.test.mjs'
      - 'tests/home-testimonial-lazy-disclosure.test.mjs'
      - 'components/services-solutions.tsx'
      - 'components/services-studio-offers.tsx'
      - 'tests/holistic-house-image-quota.test.mjs'
      - 'components/holistic-house-home.tsx'
      - 'components/home-section-carousel.tsx'
      - 'components/services-conversion-hero.module.css'
      - 'tests/home-carousel-first-screen-cta.test.mjs'
      - 'components/home-intro-video-section.tsx'
      - 'app/holistic-house-home.css'
      - 'app/page.tsx'
      - 'app/[locale]/page.tsx'
      - 'app/es/page.tsx'
      - 'app/es/services/page.tsx'
      - 'tests/holistic-house-speed-and-cta.test.mjs'
      - 'tests/holistic-house-home-streaming.test.mjs'
      - 'tests/public-consultation-cta-design.test.mjs'
      - 'components/public-consultation-cta.tsx'
      - 'app/[locale]/services/page.tsx'
      - 'next.config.ts'
  push:
    branches: ['codex/public-book-library']
    paths:
      - '.github/workflows/hh-public-performance-audit.yml'
      - 'scripts/measure-hh-public-ttfb.mjs'
      - 'scripts/hh-public-html-metrics.mjs'
      - 'tests/hh-public-html-metrics.test.mjs'
      - 'components/site-video-player.tsx'
      - 'components/personal-testimonials.tsx'
      - 'components/home-testimonial-more.tsx'
      - 'components/services-studio-extras.tsx'
      - 'tests/personal-testimonials.test.mjs'
      - 'tests/home-testimonial-lazy-disclosure.test.mjs'
      - 'components/services-solutions.tsx'
      - 'components/services-studio-offers.tsx'
      - 'tests/holistic-house-image-quota.test.mjs'
      - 'components/holistic-house-home.tsx'
      - 'components/home-section-carousel.tsx'
      - 'components/services-conversion-hero.module.css'
      - 'tests/home-carousel-first-screen-cta.test.mjs'
      - 'components/home-intro-video-section.tsx'
      - 'app/holistic-house-home.css'
      - 'app/page.tsx'
      - 'app/[locale]/page.tsx'
      - 'app/es/page.tsx'
      - 'app/es/services/page.tsx'
      - 'tests/holistic-house-speed-and-cta.test.mjs'
      - 'tests/holistic-house-home-streaming.test.mjs'
      - 'tests/public-consultation-cta-design.test.mjs'
      - 'components/public-consultation-cta.tsx'
      - 'app/[locale]/services/page.tsx'
      - 'next.config.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate targeted safety and booking contracts
        run: node --test tests/holistic-house-image-quota.test.mjs tests/hh-public-html-metrics.test.mjs tests/holistic-house-speed-and-cta.test.mjs tests/holistic-house-home-streaming.test.mjs tests/home-carousel-first-screen-cta.test.mjs tests/public-consultation-cta-design.test.mjs tests/consultation-capture-choice.test.mjs tests/personal-testimonials.test.mjs
      - name: Measure public TTFB and HTML/RSC size (no login, no private routes)
        env:
          TTFB_SAMPLES: '7'
          HH_HTML_WARN_KIB: '120'
          HH_INLINE_WARN_KIB: '60'
        run: |
          node scripts/measure-hh-public-ttfb.mjs https://holistichouse.vercel.app | tee hh-public-ttfb.txt
          echo '## Public EN/RU/ES TTFB and HTML/RSC payload audit' >> "$GITHUB_STEP_SUMMARY"
          echo 'TTFB is measured independently of decoded HTML bytes, inline scripts and Next RSC payload, including decoded Flight chunks and safe size bands. Warning budgets are observational, not CI failures; not Lighthouse, LCP, or transferred/compressed bytes.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat hh-public-ttfb.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hh-public-ttfb-${{ github.run_id }}
          path: hh-public-ttfb.txt
          if-no-files-found: ignore
          retention-days: 7
