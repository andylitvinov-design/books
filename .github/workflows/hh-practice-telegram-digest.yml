name: HH Practice Telegram Digest checks
on:
  pull_request:
    branches: ['codex/public-book-library']
    paths:
      - 'lib/practitioners/daily-digest.mjs'
      - 'lib/analytics/public-page-traffic.mjs'
      - 'lib/analytics/enquiry-attribution.mjs'
      - 'lib/analytics/enquiry-public-catalog.mjs'
      - 'lib/analytics/enquiry-attribution.d.mts'
      - 'lib/practitioners/public-service-enquiry.js'
      - 'lib/app/public-enquiry-telegram.js'
      - 'app/api/service-enquiries/route.js'
      - 'app/api/payments/talismans/checkout/route.js'
      - 'components/enquiry-attribution-choice.tsx'
      - 'components/compact-lead-capture.tsx'
      - 'components/contact-channel-chooser.tsx'
      - 'components/free-express-wizard.tsx'
      - 'components/home-free-diagnosis-banner.tsx'
      - 'components/services-hero-quick-request.tsx'
      - 'components/taoist-talisman-cart.tsx'
      - 'supabase/migrations/*public_enquiry_traffic_attribution*.sql'
      - 'tests/public-enquiry-attribution-rls.integration.mjs'
      - 'lib/app/owner-enquiry-notice.mjs'
      - 'tests/enquiry-attribution.test.mjs'
      - 'tests/owner-enquiry-notice.test.mjs'
      - 'tests/owner-telegram-enquiry-pilot.test.mjs'
      - 'lib/analytics/public-page-traffic-report.mjs'
      - 'lib/analytics/public-page-traffic.d.mts'
      - 'lib/analytics/public-stats-owner.js'
      - 'lib/analytics/public-traffic-retention.js'
      - 'app/api/analytics/public-page/route.js'
      - 'components/public-page-traffic.tsx'
      - 'components/analytics-consent.tsx'
      - 'components/first-party-stats-notice.tsx'
      - 'components/service-funnel-tracking.tsx'
      - 'app/api/marketplace/service-event/route.js'
      - 'supabase/migrations/*public_page_source_daily*.sql'
      - 'tests/public-page-traffic.test.mjs'
      - 'lib/practitioners/analytics-subscription-policy.mjs'
      - 'lib/practitioners/master-analytics-service.js'
      - 'lib/app/client-telegram-transport.js'
      - 'app/api/app/practice-analytics-notifications/route.js'
      - 'components/app/practice-analytics-subscriptions.jsx'
      - 'components/app/practice-service-statistics.jsx'
      - 'components/app/practice-workspace.jsx'
      - 'supabase/migrations/*master_analytics_subscriptions*.sql'
      - 'tests/practitioner-analytics-subscriptions.test.mjs'
      - 'lib/practitioners/daily-telegram-digest.js'
      - 'lib/practitioners/daily-telegram-transport.mjs'
      - 'lib/app/housekeeping-cron.js'
      - 'app/api/internal/practice-telegram-digest/route.js'
      - 'supabase/migrations/*practice_telegram_digest*.sql'
      - 'tests/practitioner-daily-telegram.test.mjs'
      - 'tests/app-housekeeping-cron.test.mjs'
      - 'vercel.json'
      - '.github/workflows/hh-practice-telegram-digest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enquiry-attribution-rls-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hh_app_test
          POSTGRES_PASSWORD: synthetic-ci-admin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hh_app_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      HH_APP_TEST_RUNTIME: isolated
      HH_ENQUIRY_ATTRIBUTION_RLS: synthetic-only
      NODE_OPTIONS: --conditions=react-server
      HH_TEST_ADMIN_DATABASE_URL: postgres://postgres:synthetic-ci-admin@127.0.0.1:5432/hh_app_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Verify guest INSERT, RLS denial and attribution readback
        run: node --test tests/public-enquiry-attribution-rls.integration.mjs
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax and Vercel cron config
        run: |
          node --check lib/practitioners/analytics-subscription-policy.mjs
          node --check lib/practitioners/master-analytics-service.js
          node --check lib/app/client-telegram-transport.js
          node --check app/api/app/practice-analytics-notifications/route.js
          node --check lib/analytics/public-page-traffic.mjs
          node --check lib/analytics/enquiry-attribution.mjs
          node --check lib/app/owner-enquiry-notice.mjs
          node --check lib/analytics/public-page-traffic-report.mjs
          node --check lib/analytics/public-stats-owner.js
          node --check lib/analytics/public-traffic-retention.js
          node --check app/api/analytics/public-page/route.js
          node --check app/api/marketplace/service-event/route.js
          node --check lib/practitioners/daily-digest.mjs
          node --check lib/practitioners/daily-telegram-digest.js
          node --check lib/practitioners/daily-telegram-transport.mjs
          node --check app/api/internal/practice-telegram-digest/route.js
          node -e "JSON.parse(require('node:fs').readFileSync('vercel.json','utf8'))"
      - name: Private digest and cron regressions (retire stale exact-cron-count assertions)
        run: |
          node --test \
            --test-skip-pattern='R1 database and browser workflows verify canonical-base pull requests|existing daily cron is reused with separate feature flag; no extra Vercel cron/billing|bot schedule is daily and independent of the existing housekeeping job' \
            tests/practitioner-analytics-subscriptions.test.mjs \
            tests/practitioner-daily-telegram.test.mjs \
            tests/public-page-traffic.test.mjs \
            tests/enquiry-attribution.test.mjs \
            tests/owner-enquiry-notice.test.mjs \
            tests/owner-telegram-enquiry-pilot.test.mjs \
            tests/app-housekeeping-cron.test.mjs
      - name: Protect existing cron identities without freezing unrelated schedules
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const { crons } = require('./vercel.json')
          assert.ok(Array.isArray(crons))
          for (const expected of [
            { path: '/api/internal/housekeeping', schedule: '0 5 * * *' },
            { path: '/api/internal/revenue-ideas-telegram', schedule: '0 13,14 * * *' },
            { path: '/api/internal/practice-telegram-digest', schedule: '0 13,14,19,20 * * *' },
            { path: '/api/internal/council-archive-telegram', schedule: '0 16,17 * * *' },
          ]) assert.deepEqual(crons.filter(x => x.path === expected.path), [expected])
          NODE

  production-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Targeted ESLint
        run: npx eslint lib/practitioners/analytics-subscription-policy.mjs lib/practitioners/master-analytics-service.js lib/app/client-telegram-transport.js app/api/app/practice-analytics-notifications/route.js components/app/practice-analytics-subscriptions.jsx components/app/practice-service-statistics.jsx components/app/practice-workspace.jsx app/api/internal/practice-telegram-digest/route.js lib/analytics/public-page-traffic.mjs lib/analytics/public-page-traffic-report.mjs lib/analytics/public-stats-owner.js lib/analytics/public-traffic-retention.js app/api/analytics/public-page/route.js app/api/marketplace/service-event/route.js components/public-page-traffic.tsx components/analytics-consent.tsx components/service-funnel-tracking.tsx
      - name: Next.js production build and TypeScript
        # Required Core already builds the exact proposed app once on production PRs.
        if: github.event_name != 'pull_request'
        run: npm run build
