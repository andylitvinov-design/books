name: Holistic About video checks
on:
  pull_request:
    paths:
      - 'components/psychic-alchemy-intro-video*'
      - 'app/**/about/page.tsx'
      - 'tests/psychic-alchemy-intro-video.test.mjs'
      - '.github/workflows/holistic-about-video-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/psychic-alchemy-intro-video.test.mjs
      - run: npm ci --no-audit --no-fund
      - run: npx eslint components/psychic-alchemy-intro-video.tsx 'app/[locale]/about/page.tsx'
      - run: npx tsc --noEmit
